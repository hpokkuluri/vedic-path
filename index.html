<title>Vedasaram</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* ── Design tokens ── */
:root {
  --bg: #fdf8f0;
  --fg: #1c1208;
  --fg2: #5a4020;
  --fg3: #9a7a50;
  --accent: #7b3a10;
  --accent2: #b8720a;
  --accent3: #d4960e;
  --border: #e8d8c0;
  --card-bg: #fff9f0;
  --card-shadow: 0 2px 12px rgba(120,60,0,0.10);
  --nav-bg: #fdf8f0;
  --nav-border: #e8d8c0;
  --recite-bg: #080508;
  --recite-fg: #f0e8d8;
  --recite-hl: #f0c040;
  --tag-bg: #f5e8d0;
  --tag-fg: #7b3a10;
  --done-bg: #eef6ee;
  --done-border: #5aaa5a;
  --home-gradient: linear-gradient(160deg, #2a0e00 0%, #4a1a06 40%, #1a0a22 100%);
  --home-gold: #f0c040;
  --home-gold2: #d4960e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100c08;
    --fg: #f0e4d0;
    --fg2: #c8a870;
    --fg3: #806040;
    --accent: #e08030;
    --accent2: #d4960e;
    --accent3: #f0c040;
    --border: #2e2010;
    --card-bg: #1a1208;
    --card-shadow: 0 2px 12px rgba(0,0,0,0.40);
    --nav-bg: #0e0a06;
    --nav-border: #2e2010;
    --tag-bg: #2e1808;
    --tag-fg: #e0a040;
    --done-bg: #0e1e0e;
    --done-border: #5aaa5a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100c08;
  --fg: #f0e4d0;
  --fg2: #c8a870;
  --fg3: #806040;
  --accent: #e08030;
  --accent2: #d4960e;
  --accent3: #f0c040;
  --border: #2e2010;
  --card-bg: #1a1208;
  --card-shadow: 0 2px 12px rgba(0,0,0,0.40);
  --nav-bg: #0e0a06;
  --nav-border: #2e2010;
  --tag-bg: #2e1808;
  --tag-fg: #e0a040;
  --done-bg: #0e1e0e;
  --done-border: #5aaa5a;
  color-scheme: dark;
}

/* ── Reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ── */
#topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  flex-shrink: 0;
}
#topbar h1 {
  font-size: 1rem;
  font-weight: 600;
  color: var(--accent);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#topbar .section-tabs {
  display: flex;
  gap: 4px;
}
.stab {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  color: var(--fg2);
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
}
.stab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
#btn-recite {
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--accent2);
  color: #fff;
  border: none;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
#btn-recite:hover { opacity: 0.9; }

/* ── Main content ── */
#main {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.view { display: none; padding: 16px; max-width: 680px; margin: 0 auto; }
.view.active { display: block; }

/* ── Practice view — book-style ── */
#view-practice .chapter-header {
  text-align: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--border);
}
#view-practice .chapter-header h2 {
  font-size: 1.3rem;
  color: var(--accent);
  font-weight: 700;
}
#view-practice .chapter-header .subtitle {
  font-size: 0.9rem;
  color: var(--fg2);
  margin-top: 4px;
}
#view-practice .chapter-header .chapter-num {
  font-size: 0.8rem;
  color: var(--fg3);
  margin-top: 2px;
}

/* Book-style verse block */
.verse-block {
  margin-bottom: 20px;
  padding: 0;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.15s;
}
.verse-block:hover { background: var(--card-bg); }
.verse-block.done { 
  opacity: 0.55;
}
.verse-text {
  font-size: var(--practice-font, 1.6rem);
  line-height: 2.1;
  color: var(--fg);
  font-family: 'Georgia', 'Times New Roman', serif;
}
.verse-text .vline {
  display: inline;
}
/* Telugu script line */
.vline-te {
  display: block;
  font-size: 0.78em;
  line-height: 1.6;
  color: var(--fg2);
  font-family: 'Noto Sans Telugu', 'Gautami', serif;
  opacity: 0.82;
  margin-top: 1px;
  margin-bottom: 4px;
}
/* Recite Telugu line */
.recite-line-te {
  font-size: calc(var(--recite-font, 1.9rem) * 0.82);
  line-height: 1.5;
  color: var(--recite-fg);
  opacity: 0.75;
  font-family: 'Noto Sans Telugu', 'Gautami', serif;
  margin-top: 2px;
  margin-bottom: 8px;
}
/* Verse number inline like ॥ 1 ॥ */
.verse-num {
  display: inline;
  color: var(--accent2);
  font-size: 1.05rem;
  font-weight: 600;
  margin-left: 4px;
}
/* Speaker tag */
.spk-tag {
  display: inline-block;
  font-size: 0.85rem;
  color: var(--tag-fg);
  background: var(--tag-bg);
  border-radius: 3px;
  padding: 2px 8px;
  margin-right: 6px;
  font-style: italic;
  vertical-align: middle;
}

/* Expanded meaning */
.verse-meaning {
  display: none;
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--card-bg);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  font-size: 0.9rem;
  color: var(--fg2);
  line-height: 1.6;
}
.verse-block.expanded .verse-meaning { display: block; }
.verse-meaning.empty { display: none !important; }

/* Done checkmark */
.verse-speaker { font-size:0.72rem; font-weight:600; color:var(--accent2); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px; }
.verse-done-mark {
  display: none;
  float: right;
  color: #4caf50;
  font-size: 1.1rem;
}
.verse-block.done .verse-speaker { font-size:0.72rem; font-weight:600; color:var(--accent2); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px; }
.verse-done-mark { display: inline; }

/* ── Rudram lines (not individual verses, just lines) ── */
.rudram-anuvaka {
  margin-bottom: 24px;
}
.rudram-anuvaka .an-header {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.rudram-lines {
  font-family: 'Georgia', 'Times New Roman', serif;
  font-size: 1.0rem;
  line-height: 2.0;
  color: var(--fg);
}
.rudram-lines span { display: block; }

/* ── Bottom nav ── */
#bottomnav {
  position: sticky;
  bottom: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--nav-bg);
  border-top: 1px solid var(--nav-border);
  display: flex;
  z-index: 100;
  flex-shrink: 0;
}
.bnav-btn {
  flex: 1;
  padding: 10px 4px;
  border: none;
  background: none;
  color: var(--fg3);
  font-size: 0.7rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: color 0.15s;
}
.bnav-btn.active { color: var(--accent); }
.bnav-btn svg { width: 22px; height: 22px; }
.bnav-btn span { font-size: 0.65rem; }

/* ── Index view ── */
#view-index { padding-bottom: 24px; }
.idx-section {
  margin-bottom: 28px;
}
.idx-section h2 {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.idx-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 8px;
}
.idx-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.idx-card:hover { border-color: var(--accent); }
.idx-card.current { border-color: var(--accent); background: var(--tag-bg); }
.idx-card .idx-num {
  font-size: 0.7rem;
  color: var(--fg3);
  margin-bottom: 2px;
}
.idx-card .idx-name {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--fg);
  line-height: 1.3;
}
.idx-card .idx-sub {
  font-size: 0.75rem;
  color: var(--fg2);
  margin-top: 2px;
}
.idx-card .idx-prog {
  margin-top: 6px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.idx-card .idx-prog-fill {
  height: 100%;
  background: var(--accent2);
  border-radius: 2px;
  transition: width 0.3s;
}

/* ── Progress view ── */
#view-progress h2 {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 20px;
}
.prog-section { margin-bottom: 24px; }
.prog-section h3 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--fg);
}
.prog-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.prog-label {
  font-size: 0.85rem;
  color: var(--fg2);
  width: 120px;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.prog-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: var(--accent2);
  border-radius: 3px;
  transition: width 0.5s;
}
.prog-pct {
  font-size: 0.8rem;
  color: var(--fg3);
  width: 36px;
  text-align: right;
  flex-shrink: 0;
}
.prog-reset {
  margin-top: 20px;
  padding: 8px 16px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg2);
  cursor: pointer;
  font-size: 0.85rem;
}

/* ── Recite overlay ── */
#recite-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: var(--recite-bg);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 24px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 52px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
}
#recite-overlay.active { display: flex; }
#recite-lines {
  width: 100%;
  max-width: 680px;
  display: flex;
  flex-direction: column;
  gap: clamp(20px, 5vw, 40px);
  text-align: center;
}
.recite-spk {
  font-size: clamp(0.78rem, 2.2vw, 0.95rem);
  color: var(--recite-fg);
  opacity: 0.45;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-family: 'Georgia', 'Times New Roman', serif;
  margin-bottom: 8px;
}
.recite-line {
  font-size: var(--recite-font, 1.9rem);
  line-height: 1.6;
  color: var(--recite-hl);
  font-family: 'Georgia', 'Times New Roman', serif;
  font-weight: 600;
}
#recite-info {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  color: #666;
  font-size: 0.8rem;
  z-index: 1001;
}
#recite-controls {
  position: fixed;
  bottom: env(safe-area-inset-bottom, 0px);
  left: 0; right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 10px 20px 14px;
  background: rgba(0,0,0,0.7);
}
.recite-btn {
  padding: 10px 24px;
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 0.95rem;
  cursor: pointer;
  white-space: nowrap;
}
.recite-btn:hover { background: rgba(255,255,255,0.2); }
.recite-btn.primary {
  background: var(--recite-hl);
  border-color: var(--recite-hl);
  color: #000;
  font-weight: 700;
}
#recite-dots {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 320px;
  padding: 0 8px;
}
.recite-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transition: background 0.2s;
  cursor: pointer;
  padding: 5px;
  box-sizing: content-box;
  margin: -5px;
}
.recite-dot.done { background: var(--recite-hl); }
.recite-dot.cur { background: #fff; }
/* Recite font controls — inside info bar */
#recite-font-ctrl {
  display: flex;
  gap: 6px;
}
.recite-font-btn {
  padding: 5px 10px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.02em;
}
.recite-font-btn:active { background: rgba(255,255,255,0.25); }
/* Settings view */
.settings-view { padding: 16px 0 32px; }
.settings-section { margin-bottom: 28px; }
.settings-section-title { font-size: 0.72rem; font-weight: 700; color: var(--fg3); letter-spacing: 0.1em; text-transform: uppercase; padding: 0 4px 8px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 16px; }
.settings-row:last-child { border-bottom: none; }
.settings-label { font-size: 0.95rem; color: var(--fg); font-weight: 500; }
.settings-desc { font-size: 0.78rem; color: var(--fg3); margin-top: 2px; }
.settings-control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sz-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--card-bg); color: var(--fg); font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.sz-btn:active { background: var(--border); }
.sz-val { font-size: 0.9rem; font-weight: 600; color: var(--accent2); min-width: 36px; text-align: center; }
.toggle-switch { position: relative; width: 44px; height: 26px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 26px; transition: background 0.2s; cursor: pointer; }
.toggle-slider:before { content:''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
.toggle-switch input:checked + .toggle-slider { background: var(--accent2); }
.toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }

/* ── Placeholder for Vishnu Sahasranamam / Chamakam ── */
.placeholder-msg {
  text-align: center;
  padding: 60px 20px;
  color: var(--fg3);
}
.placeholder-msg h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--fg2); }
.placeholder-msg p { font-size: 0.9rem; }

/* ── Home page ── */
#view-home {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100%;
  padding: 0;
  max-width: 100%;
}
#view-home.active { display: flex; }
.home-hero {
  width: 100%;
  background: var(--home-gradient);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 24px 40px;
  position: relative;
  overflow: hidden;
}
.home-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(240,192,64,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.home-mandala {
  width: 160px;
  height: 160px;
  margin-bottom: 24px;
  filter: drop-shadow(0 0 24px rgba(240,192,64,0.5));
}
.home-title {
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 2.2rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.02em;
  text-align: center;
  line-height: 1.2;
  margin-bottom: 8px;
}
.home-title span { color: var(--home-gold); }
.home-title-script {
  font-size: 1.05rem;
  color: rgba(240,210,140,0.85);
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}
.home-subtitle {
  font-size: 0.82rem;
  color: rgba(240,220,180,0.6);
  text-align: center;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  margin-bottom: 0;
}
.home-menu {
  width: 100%;
  max-width: 480px;
  padding: 28px 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.home-card {
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--card-shadow);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.home-card:active { transform: scale(0.98); }
.home-card-header {
  display: flex;
  align-items: center;
  padding: 16px 18px;
  gap: 14px;
}
.home-card-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}
.home-card-icon.gita { background: linear-gradient(135deg, #7b3a10, #b8720a); }
.home-card-icon.rudram { background: linear-gradient(135deg, #1a4a6a, #2a7ab0); }
.home-card-icon.vsn { background: linear-gradient(135deg, #2a5a1a, #4aaa2a); }
.home-card-text { flex: 1; }
.home-card-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.2;
}
.home-card-desc {
  font-size: 0.8rem;
  color: var(--fg3);
  margin-top: 2px;
}
.home-card-arrow {
  color: var(--accent2);
  font-size: 1.2rem;
  flex-shrink: 0;
}
/* Rudram sub-menu */
.home-submenu {
  display: none;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.home-submenu.open { display: block; }
.home-submenu-item {
  display: flex;
  align-items: center;
  padding: 12px 18px 12px 76px;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.12s;
}
.home-submenu-item:last-child { border-bottom: none; }
.home-submenu-item:hover, .home-submenu-item:active { background: var(--card-bg); }
.home-submenu-item .sub-label {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--fg);
}
.home-submenu-item .sub-desc {
  font-size: 0.78rem;
  color: var(--fg3);
  margin-top: 1px;
}
.home-submenu-item .sub-arrow {
  margin-left: auto;
  color: var(--accent2);
  font-size: 1rem;
}
.home-footer {
  text-align: center;
  font-size: 0.75rem;
  color: var(--fg3);
  padding: 0 20px 24px;
  letter-spacing: 0.04em;
}

/* ── Chapter nav bar (prev / chapter title / next) ── */
.chapter-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.chapter-nav-btn {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--card-bg);
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;

    { n:22, tlines:[`అనేకరూప దైత్యాంతం నమామి పురుషోత్తమమ్ ॥ 22 ॥`, `పూర్వన్యాసః`, `అస్య శ్రీ విష్ణోర్దివ్య సహస్రనామ స్తోత్ర మహామంత్రస్య ॥`, `శ్రీ వేదవ్యాసో భగవాన్ ఋషిః ।`, `అనుష్టుప్ ఛందః ।`, `శ్రీమహావిష్ణుః పరమాత్మా శ్రీమన్నారాయణో దేవతా ।`, `అమృతాంశూద్భవో భానురితి బీజమ్ ।`, `దేవకీనందనః స్రష్టేతి శక్తిః ।`, `ఉద్భవః, క్షోభణో దేవ ఇతి పరమోమంత్రః ।`, `శంఖభృన్నందకీ చక్రీతి కీలకమ్ ।`, `శార్​ఙ్గధన్వా గదాధర ఇత్యస్త్రమ్ ।`, `రథాంగపాణి-రక్షోభ్య ఇతి నేత్రమ్ ।`, `త్రిసామాసామగః సామేతి కవచమ్ ।`, `ఆనందం పరబ్రహ్మేతి యోనిః ।`, `ఋతుస్సుదర్శనః కాల ఇతి దిగ్బంధః ॥`, `శ్రీవిశ్వరూప ఇతి ధ్యానమ్ ।`, `శ్రీ మహావిష్ణు ప్రీత్యర్థే సహస్రనామ జపే పారాయణే వినియోగః ।`, `కరన్యాసః`, `విశ్వం విష్ణుర్వషట్కార ఇత్యంగుష్ఠాభ్యాం నమః`, `అమృతాంశూద్భవో భానురితి తర్జనీభ్యాం నమః`, `బ్రహ్మణ్యో బ్రహ్మకృత్ బ్రహ్మేతి మధ్యమాభ్యాం నమః`, `సువర్ణబిందు-రక్షోభ్య ఇతి అనామికాభ్యాం నమః`, `నిమిషోఽనిమిషః స్రగ్వీతి కనిష్ఠికాభ్యాం నమః`, `రథాంగపాణి-రక్షోభ్య ఇతి కరతల కరపృష్ఠాభ్యాం నమః`, `అంగన్యాసః`, `సువ్రతః సుముఖః సూక్ష్మ ఇతి జ్ఞానాయ హృదయాయ నమః`, `సహస్రమూర్తిః విశ్వాత్మా ఇతి ఐశ్వర్యాయ శిరసే స్వాహా`, `సహస్రార్చిః సప్తజిహ్వ ఇతి శక్త్యై శిఖాయై వషట్`, `త్రిసామా సామగస్సామేతి బలాయ కవచాయ హుం`, `రథాంగపాణి-రక్షోభ్య ఇతి నేత్రాభ్యాం వౌషట్`, `శార్​ఙ్గధన్వా గదాధర ఇతి వీర్యాయ అస్త్రాయఫట్`, `ఋతుః సుదర్శనః కాల ఇతి దిగ్భంధః`, `క్షీరోధన్వత్ప్రదేశే శుచిమణి-విలస-త్సైకతే-మౌక్తికానాం`, `మాలా-కౢప్తాసనస్థః స్ఫటిక-మణినిభై-ర్మౌక్తికై-ర్మండితాంగః ।`, `శుభ్రై-రభ్రై-రదభ్రై-రుపరివిరచితై-ర్ముక్త పీయూష వర్షైః`] },
  ],
  dhyanam: [
    { n:1, tlines:[`ఆనందీ నః పునీయా-దరినలినగదా శంఖపాణి-ర్ముకుందః ॥ 1 ॥`, `భూః పాదౌ యస్య నాభిర్వియ-దసుర నిలశ్చంద్ర సూర్యౌ చ నేత్రే`, `కర్ణావాశాః శిరోద్యౌర్ముఖమపి దహనో యస్య వాస్తేయమబ్ధిః ।`, `అంతఃస్థం యస్య విశ్వం సుర నరఖగగోభోగి గంధర్వదైత్యైః`] },
    { n:2, tlines:[`చిత్రం రం రమ్యతే తం త్రిభువన వపుశం విష్ణుమీశం నమామి ॥ 2 ॥`, `ఓం నమో భగవతే వాసుదేవాయ !`, `శాంతాకారం భుజగశయనం పద్మనాభం సురేశం`, `విశ్వాధారం గగనసదృశం మేఘవర్ణం శుభాంగమ్ ।`, `లక్ష్మీకాంతం కమలనయనం యోగిహృద్ధ్యానగమ్యం`] },
    { n:3, tlines:[`వందే విష్ణుం భవభయహరం సర్వలోకైకనాథమ్ ॥ 3 ॥`, `మేఘశ్యామం పీతకౌశేయవాసం`, `శ్రీవత్సాంకం కౌస్తుభోద్భాసితాంగమ్ ।`, `పుణ్యోపేతం పుండరీకాయతాక్షం`] },
    { n:4, tlines:[`విష్ణుం వందే సర్వలోకైకనాథమ్ ॥ 4 ॥`, `నమః సమస్త భూతానాం ఆది భూతాయ భూభృతే ।`] },
    { n:5, tlines:[`అనేకరూప రూపాయ విష్ణవే ప్రభవిష్ణవే ॥ 5॥`, `సశంఖచక్రం సకిరీటకుండలం`, `సపీతవస్త్రం సరసీరుహేక్షణమ్ ।`, `సహార వక్షఃస్థల శోభి కౌస్తుభం`, `నమామి విష్ణుం శిరసా చతుర్భుజమ్ । 6॥`, `ఛాయాయాం పారిజాతస్య హేమసింహాసనోపరి`] },
    { n:7, tlines:[`ఆసీనమంబుదశ్యామమాయతాక్షమలంకృతమ్ ॥ 7 ॥`, `చంద్రాననం చతుర్బాహుం శ్రీవత్సాంకిత వక్షసం`] },
    { n:8, tlines:[`రుక్మిణీ సత్యభామాభ్యాం సహితం కృష్ణమాశ్రయే ॥ 8 ॥`, `లం - పృథివ్యాత్మనే గంధం సమర్పయామి`, `హం - ఆకాశాత్మనే పుష్పైః పూజయామి`, `యం - వాయ్వాత్మనే ధూపమాఘ్రాపయామి`, `రం - అగ్న్యాత్మనే దీపం దర్శయామి`, `వం - అమృతాత్మనే నైవేద్యం నివేదయామి`, `సం - సర్వాత్మనే సర్వోపచార పూజా నమస్కారాన్ సమర్పయామి`, `విశ్వం విష్ణుర్వషట్కారో భూతభవ్యభవత్ప్రభుః ।`] },
  ],
  1: [{ n:1, tlines:[`భూతకృద్భూతభృద్భావో భూతాత్మా భూతభావనః ॥ 1 ॥`, `పూతాత్మా పరమాత్మా చ ముక్తానాం పరమాగతిః ।`] }],
  2: [{ n:2, tlines:[`అవ్యయః పురుషః సాక్షీ క్షేత్రజ్ఞోఽక్షర ఏవ చ ॥ 2 ॥`, `యోగో యోగవిదాం నేతా ప్రధాన పురుషేశ్వరః ।`] }],
  3: [{ n:3, tlines:[`నారసింహవపుః శ్రీమాన్ కేశవః పురుషోత్తమః ॥ 3 ॥`, `సర్వః శర్వః శివః స్థాణుర్భూతాదిర్నిధిరవ్యయః ।`] }],
  4: [{ n:4, tlines:[`సంభవో భావనో భర్తా ప్రభవః ప్రభురీశ్వరః ॥ 4 ॥`, `స్వయంభూః శంభురాదిత్యః పుష్కరాక్షో మహాస్వనః ।`] }],
  5: [{ n:5, tlines:[`అనాదినిధనో ధాతా విధాతా ధాతురుత్తమః ॥ 5 ॥`, `అప్రమేయో హృషీకేశః పద్మనాభోఽమరప్రభుః ।`] }],
  6: [{ n:6, tlines:[`విశ్వకర్మా మనుస్త్వష్టా స్థవిష్ఠః స్థవిరో ధ్రువః ॥ 6 ॥`, `అగ్రాహ్యః శాశ్వతో కృష్ణో లోహితాక్షః ప్రతర్దనః ।`] }],
  7: [{ n:7, tlines:[`ప్రభూతస్త్రికకుబ్ధామ పవిత్రం మంగళం పరమ్ ॥ 7 ॥`, `ఈశానః ప్రాణదః ప్రాణో జ్యేష్ఠః శ్రేష్ఠః ప్రజాపతిః ।`] }],
  8: [{ n:8, tlines:[`హిరణ్యగర్భో భూగర్భో మాధవో మధుసూదనః ॥ 8 ॥`, `ఈశ్వరో విక్రమీధన్వీ మేధావీ విక్రమః క్రమః ।`] }],
  9: [{ n:9, tlines:[`అనుత్తమో దురాధర్షః కృతజ్ఞః కృతిరాత్మవాన్॥ 9 ॥`, `సురేశః శరణం శర్మ విశ్వరేతాః ప్రజాభవః ।`] }],
  10: [{ n:10, tlines:[`అహస్సంవత్సరో వ్యాళః ప్రత్యయః సర్వదర్శనః ॥ 10 ॥`, `అజస్సర్వేశ్వరః సిద్ధః సిద్ధిః సర్వాదిరచ్యుతః ।`] }],
  11: [{ n:11, tlines:[`వృషాకపిరమేయాత్మా సర్వయోగవినిస్సృతః ॥ 11 ॥`, `వసుర్వసుమనాః సత్యః సమాత్మా సమ్మితస్సమః ।`] }],
  12: [{ n:12, tlines:[`అమోఘః పుండరీకాక్షో వృషకర్మా వృషాకృతిః ॥ 12 ॥`, `రుద్రో బహుశిరా బభ్రుర్విశ్వయోనిః శుచిశ్రవాః ।`] }],
  13: [{ n:13, tlines:[`అమృతః శాశ్వతస్థాణుర్వరారోహో మహాతపాః ॥ 13 ॥`, `సర్వగః సర్వ విద్భానుర్విష్వక్సేనో జనార్దనః ।`] }],
  14: [{ n:14, tlines:[`వేదో వేదవిదవ్యంగో వేదాంగో వేదవిత్కవిః ॥ 14 ॥`, `లోకాధ్యక్షః సురాధ్యక్షో ధర్మాధ్యక్షః కృతాకృతః ।`] }],
  15: [{ n:15, tlines:[`చతురాత్మా చతుర్వ్యూహశ్చతుర్దంష్ట్రశ్చతుర్భుజః ॥ 15 ॥`, `భ్రాజిష్ణుర్భోజనం భోక్తా సహిష్ణుర్జగదాదిజః ।`] }],
  16: [{ n:16, tlines:[`అనఘో విజయో జేతా విశ్వయోనిః పునర్వసుః ॥ 16 ॥`, `ఉపేంద్రో వామనః ప్రాంశురమోఘః శుచిరూర్జితః ।`] }],
  17: [{ n:17, tlines:[`అతీంద్రః సంగ్రహః సర్గో ధృతాత్మా నియమో యమః ॥ 17 ॥`, `వేద్యో వైద్యః సదాయోగీ వీరహా మాధవో మధుః ।`] }],
  18: [{ n:18, tlines:[`అతీంద్రియో మహామాయో మహోత్సాహో మహాబలః ॥ 18 ॥`, `మహాబుద్ధిర్మహావీర్యో మహాశక్తిర్మహాద్యుతిః ।`] }],
  19: [{ n:19, tlines:[`అనిర్దేశ్యవపుః శ్రీమానమేయాత్మా మహాద్రిధృక్ ॥ 19 ॥`, `మహేశ్వాసో మహీభర్తా శ్రీనివాసః సతాంగతిః ।`] }],
  20: [{ n:20, tlines:[`అనిరుద్ధః సురానందో గోవిందో గోవిదాం పతిః ॥ 20 ॥`, `మరీచిర్దమనో హంసః సుపర్ణో భుజగోత్తమః ।`] }],
  21: [{ n:21, tlines:[`హిరణ్యనాభః సుతపాః పద్మనాభః ప్రజాపతిః ॥ 21 ॥`, `అమృత్యుః సర్వదృక్ సింహః సంధాతా సంధిమాన్ స్థిరః ।`] }],
  22: [{ n:22, tlines:[`అజో దుర్మర్షణః శాస్తా విశ్రుతాత్మా సురారిహా ॥ 22 ॥`, `గురుర్గురుతమో ధామ సత్యః సత్యపరాక్రమః ।`] }],
  23: [{ n:23, tlines:[`నిమిషోఽనిమిషః స్రగ్వీ వాచస్పతిరుదారధీః ॥ 23 ॥`, `అగ్రణీగ్రామణీః శ్రీమాన్ న్యాయో నేతా సమీరణః`] }],
  24: [{ n:24, tlines:[`సహస్రమూర్ధా విశ్వాత్మా సహస్రాక్షః సహస్రపాత్ ॥ 24 ॥`, `ఆవర్తనో నివృత్తాత్మా సంవృతః సంప్రమర్దనః ।`] }],
  25: [{ n:25, tlines:[`అహః సంవర్తకో వహ్నిరనిలో ధరణీధరః ॥ 25 ॥`, `సుప్రసాదః ప్రసన్నాత్మా విశ్వధృగ్విశ్వభుగ్విభుః ।`] }],
  26: [{ n:26, tlines:[`సత్కర్తా సత్కృతః సాధుర్జహ్నుర్నారాయణో నరః ॥ 26 ॥`, `అసంఖ్యేయోఽప్రమేయాత్మా విశిష్టః శిష్టకృచ్ఛుచిః ।`] }],
  27: [{ n:27, tlines:[`సిద్ధార్థః సిద్ధసంకల్పః సిద్ధిదః సిద్ధి సాధనః ॥ 27 ॥`, `వృషాహీ వృషభో విష్ణుర్వృషపర్వా వృషోదరః ।`] }],
  28: [{ n:28, tlines:[`వర్ధనో వర్ధమానశ్చ వివిక్తః శ్రుతిసాగరః ॥ 28 ॥`, `సుభుజో దుర్ధరో వాగ్మీ మహేంద్రో వసుదో వసుః ।`] }],
  29: [{ n:29, tlines:[`నైకరూపో బృహద్రూపః శిపివిష్టః ప్రకాశనః ॥ 29 ॥`, `ఓజస్తేజోద్యుతిధరః ప్రకాశాత్మా ప్రతాపనః ।`] }],
  30: [{ n:30, tlines:[`ఋద్ధః స్పష్టాక్షరో మంత్రశ్చంద్రాంశుర్భాస్కరద్యుతిః ॥ 30 ॥`, `అమృతాంశూద్భవో భానుః శశబిందుః సురేశ్వరః ।`] }],
  31: [{ n:31, tlines:[`ఔషధం జగతః సేతుః సత్యధర్మపరాక్రమః ॥ 31 ॥`, `భూతభవ్యభవన్నాథః పవనః పావనోఽనలః ।`] }],
  32: [{ n:32, tlines:[`కామహా కామకృత్కాంతః కామః కామప్రదః ప్రభుః ॥ 32 ॥`, `యుగాది కృద్యుగావర్తో నైకమాయో మహాశనః ।`] }],
  33: [{ n:33, tlines:[`అదృశ్యో వ్యక్తరూపశ్చ సహస్రజిదనంతజిత్ ॥ 33 ॥`, `ఇష్టోఽవిశిష్టః శిష్టేష్టః శిఖండీ నహుషో వృషః ।`] }],
  34: [{ n:34, tlines:[`క్రోధహా క్రోధకృత్కర్తా విశ్వబాహుర్మహీధరః ॥ 34 ॥`, `అచ్యుతః ప్రథితః ప్రాణః ప్రాణదో వాసవానుజః ।`] }],
  35: [{ n:35, tlines:[`అపాంనిధిరధిష్ఠానమప్రమత్తః ప్రతిష్ఠితః ॥ 35 ॥`, `స్కందః స్కందధరో ధుర్యో వరదో వాయువాహనః ।`] }],
  36: [{ n:36, tlines:[`వాసుదేవో బృహద్భానురాదిదేవః పురంధరః ॥ 36 ॥`, `అశోకస్తారణస్తారః శూరః శౌరిర్జనేశ్వరః ।`] }],
  37: [{ n:37, tlines:[`అనుకూలః శతావర్తః పద్మీ పద్మనిభేక్షణః ॥ 37 ॥`, `పద్మనాభోఽరవిందాక్షః పద్మగర్భః శరీరభృత్ ।`] }],
  38: [{ n:38, tlines:[`మహర్ధిరృద్ధో వృద్ధాత్మా మహాక్షో గరుడధ్వజః ॥ 38 ॥`, `అతులః శరభో భీమః సమయజ్ఞో హవిర్హరిః ।`] }],
  39: [{ n:39, tlines:[`సర్వలక్షణలక్షణ్యో లక్ష్మీవాన్ సమితింజయః ॥ 39 ॥`, `విక్షరో రోహితో మార్గో హేతుర్దామోదరః సహః ।`] }],
  40: [{ n:40, tlines:[`మహీధరో మహాభాగో వేగవానమితాశనః ॥ 40 ॥`, `ఉద్భవః, క్షోభణో దేవః శ్రీగర్భః పరమేశ్వరః ।`] }],
  41: [{ n:41, tlines:[`కరణం కారణం కర్తా వికర్తా గహనో గుహః ॥ 41 ॥`, `వ్యవసాయో వ్యవస్థానః సంస్థానః స్థానదో ధ్రువః ।`] }],
  42: [{ n:42, tlines:[`పరర్ధిః పరమస్పష్టః తుష్టః పుష్టః శుభేక్షణః ॥ 42 ॥`, `రామో విరామో విరజో మార్గోనేయో నయోఽనయః ।`] }],
  43: [{ n:43, tlines:[`వీరః శక్తిమతాం శ్రేష్ఠో ధర్మోధర్మ విదుత్తమః ॥ 43 ॥`, `వైకుంఠః పురుషః ప్రాణః ప్రాణదః ప్రణవః పృథుః ।`] }],
  44: [{ n:44, tlines:[`హిరణ్యగర్భః శత్రుఘ్నో వ్యాప్తో వాయురధోక్షజః ॥ 44 ॥`, `ఋతుః సుదర్శనః కాలః పరమేష్ఠీ పరిగ్రహః ।`] }],
  45: [{ n:45, tlines:[`ఉగ్రః సంవత్సరో దక్షో విశ్రామో విశ్వదక్షిణః ॥ 45 ॥`, `విస్తారః స్థావర స్థాణుః ప్రమాణం బీజమవ్యయమ్ ।`] }],
  46: [{ n:46, tlines:[`అర్థోఽనర్థో మహాకోశో మహాభోగో మహాధనః ॥ 46 ॥`, `అనిర్విణ్ణః స్థవిష్ఠో భూర్ధర్మయూపో మహామఖః ।`] }],
  47: [{ n:47, tlines:[`నక్షత్రనేమిర్నక్షత్రీ క్షమః, క్షామః సమీహనః ॥ 47 ॥`, `యజ్ఞ ఇజ్యో మహేజ్యశ్చ క్రతుః సత్రం సతాంగతిః ।`] }],
  48: [{ n:48, tlines:[`సర్వదర్శీ విముక్తాత్మా సర్వజ్ఞో జ్ఞానముత్తమమ్ ॥ 48 ॥`, `సువ్రతః సుముఖః సూక్ష్మః సుఘోషః సుఖదః సుహృత్ ।`] }],
  49: [{ n:49, tlines:[`మనోహరో జితక్రోధో వీర బాహుర్విదారణః ॥ 49 ॥`, `స్వాపనః స్వవశో వ్యాపీ నైకాత్మా నైకకర్మకృత్। ।`] }],
  50: [{ n:50, tlines:[`వత్సరో వత్సలో వత్సీ రత్నగర్భో ధనేశ్వరః ॥ 50 ॥`, `ధర్మగుబ్ధర్మకృద్ధర్మీ సదసత్క్షరమక్షరం॥`] }],
  51: [{ n:51, tlines:[`అవిజ్ఞాతా సహస్రాంశుర్విధాతా కృతలక్షణః ॥ 51 ॥`, `గభస్తినేమిః సత్త్వస్థః సింహో భూత మహేశ్వరః ।`] }],
  52: [{ n:52, tlines:[`ఆదిదేవో మహాదేవో దేవేశో దేవభృద్గురుః ॥ 52 ॥`, `ఉత్తరో గోపతిర్గోప్తా జ్ఞానగమ్యః పురాతనః ।`] }],
  53: [{ n:53, tlines:[`శరీర భూతభృద్ భోక్తా కపీంద్రో భూరిదక్షిణః ॥ 53 ॥`, `సోమపోఽమృతపః సోమః పురుజిత్ పురుసత్తమః ।`] }],
  54: [{ n:54, tlines:[`వినయో జయః సత్యసంధో దాశార్హః సాత్వతాం పతిః ॥ 54 ॥`, `జీవో వినయితా సాక్షీ ముకుందోఽమిత విక్రమః ।`] }],
  55: [{ n:55, tlines:[`అంభోనిధిరనంతాత్మా మహోదధి శయోంతకః ॥ 55 ॥`, `అజో మహార్హః స్వాభావ్యో జితామిత్రః ప్రమోదనః ।`] }],
  56: [{ n:56, tlines:[`ఆనందోఽనందనోనందః సత్యధర్మా త్రివిక్రమః ॥ 56 ॥`, `మహర్షిః కపిలాచార్యః కృతజ్ఞో మేదినీపతిః ।`] }],
  57: [{ n:57, tlines:[`త్రిపదస్త్రిదశాధ్యక్షో మహాశృంగః కృతాంతకృత్ ॥ 57 ॥`, `మహావరాహో గోవిందః సుషేణః కనకాంగదీ ।`] }],
  58: [{ n:58, tlines:[`గుహ్యో గభీరో గహనో గుప్తశ్చక్ర గదాధరః ॥ 58 ॥`, `వేధాః స్వాంగోఽజితః కృష్ణో దృఢః సంకర్షణోఽచ్యుతః ।`] }],
  59: [{ n:59, tlines:[`వరుణో వారుణో వృక్షః పుష్కరాక్షో మహామనాః ॥ 59 ॥`, `భగవాన్ భగహాఽఽనందీ వనమాలీ హలాయుధః ।`] }],
  60: [{ n:60, tlines:[`ఆదిత్యో జ్యోతిరాదిత్యః సహిష్ణుర్గతిసత్తమః ॥ 60 ॥`, `సుధన్వా ఖండపరశుర్దారుణో ద్రవిణప్రదః ।`] }],
  61: [{ n:61, tlines:[`దివఃస్పృక్ సర్వదృగ్వ్యాసో వాచస్పతిరయోనిజః ॥ 61 ॥`, `త్రిసామా సామగః సామ నిర్వాణం భేషజం భిషక్ ।`, `సంన్యాసకృచ్ఛమః శాంతో నిష్ఠా శాంతిః పరాయణం। 62 ॥`, `శుభాంగః శాంతిదః స్రష్టా కుముదః కువలేశయః ।`] }],
  62: [{ n:62, tlines:[`॥ 62 ॥`] }],
  63: [{ n:63, tlines:[`గోహితో గోపతిర్గోప్తా వృషభాక్షో వృషప్రియః ॥ 63 ॥`, `అనివర్తీ నివృత్తాత్మా సంక్షేప్తా క్షేమకృచ్ఛివః ।`] }],
  64: [{ n:64, tlines:[`శ్రీవత్సవక్షాః శ్రీవాసః శ్రీపతిః శ్రీమతాంవరః ॥ 64 ॥`, `శ్రీదః శ్రీశః శ్రీనివాసః శ్రీనిధిః శ్రీవిభావనః ।`] }],
  65: [{ n:65, tlines:[`శ్రీధరః శ్రీకరః శ్రేయః శ్రీమాँల్లోకత్రయాశ్రయః ॥ 65 ॥`, `స్వక్షః స్వంగః శతానందో నందిర్జ్యోతిర్గణేశ్వరః ।`] }],
  66: [{ n:66, tlines:[`విజితాత్మాఽవిధేయాత్మా సత్కీర్తిశ్చిన్నసంశయః ॥ 66 ॥`, `ఉదీర్ణః సర్వతశ్చక్షురనీశః శాశ్వతస్థిరః ।`] }],
  67: [{ n:67, tlines:[`భూశయో భూషణో భూతిర్విశోకః శోకనాశనః ॥ 67 ॥`, `అర్చిష్మానర్చితః కుంభో విశుద్ధాత్మా విశోధనః ।`] }],
  68: [{ n:68, tlines:[`అనిరుద్ధోఽప్రతిరథః ప్రద్యుమ్నోఽమితవిక్రమః ॥ 68 ॥`, `కాలనేమినిహా వీరః శౌరిః శూరజనేశ్వరః ।`] }],
  69: [{ n:69, tlines:[`త్రిలోకాత్మా త్రిలోకేశః కేశవః కేశిహా హరిః ॥ 69 ॥`, `కామదేవః కామపాలః కామీ కాంతః కృతాగమః ।`] }],
  70: [{ n:70, tlines:[`అనిర్దేశ్యవపుర్విష్ణుర్వీరోఽనంతో ధనంజయః ॥ 70 ॥`, `బ్రహ్మణ్యో బ్రహ్మకృద్ బ్రహ్మా బ్రహ్మ బ్రహ్మవివర్ధనః ।`] }],
  71: [{ n:71, tlines:[`బ్రహ్మవిద్ బ్రాహ్మణో బ్రహ్మీ బ్రహ్మజ్ఞో బ్రాహ్మణప్రియః ॥ 71 ॥`, `మహాక్రమో మహాకర్మా మహాతేజా మహోరగః ।`] }],
  72: [{ n:72, tlines:[`మహాక్రతుర్మహాయజ్వా మహాయజ్ఞో మహాహవిః ॥ 72 ॥`, `స్తవ్యః స్తవప్రియః స్తోత్రం స్తుతిః స్తోతా రణప్రియః ।`] }],
  73: [{ n:73, tlines:[`పూర్ణః పూరయితా పుణ్యః పుణ్యకీర్తిరనామయః ॥ 73 ॥`, `మనోజవస్తీర్థకరో వసురేతా వసుప్రదః ।`] }],
  74: [{ n:74, tlines:[`వసుప్రదో వాసుదేవో వసుర్వసుమనా హవిః ॥ 74 ॥`, `సద్గతిః సత్కృతిః సత్తా సద్భూతిః సత్పరాయణః ।`] }],
  75: [{ n:75, tlines:[`శూరసేనో యదుశ్రేష్ఠః సన్నివాసః సుయామునః ॥ 75 ॥`, `భూతావాసో వాసుదేవః సర్వాసునిలయోఽనలః ।`] }],
  76: [{ n:76, tlines:[`దర్పహా దర్పదో దృప్తో దుర్ధరోఽథాపరాజితః ॥ 76 ॥`, `విశ్వమూర్తిర్మహామూర్తిర్దీప్తమూర్తిరమూర్తిమాన్ ।`] }],
  77: [{ n:77, tlines:[`అనేకమూర్తిరవ్యక్తః శతమూర్తిః శతాననః ॥ 77 ॥`, `ఏకో నైకః సవః కః కిం యత్తత్ పదమనుత్తమమ్ ।`] }],
  78: [{ n:78, tlines:[`లోకబంధుర్లోకనాథో మాధవో భక్తవత్సలః ॥ 78 ॥`, `సువర్ణవర్ణో హేమాంగో వరాంగశ్చందనాంగదీ ।`] }],
  79: [{ n:79, tlines:[`వీరహా విషమః శూన్యో ఘృతాశీరచలశ్చలః ॥ 79 ॥`, `అమానీ మానదో మాన్యో లోకస్వామీ త్రిలోకధృత్ । [త్రిలోకధృక్]`] }],
  80: [{ n:80, tlines:[`సుమేధా మేధజో ధన్యః సత్యమేధా ధరాధరః ॥ 80 ॥`, `తేజోఽవృషో ద్యుతిధరః సర్వశస్త్రభృతాంవరః ।`] }],
  81: [{ n:81, tlines:[`ప్రగ్రహో నిగ్రహో వ్యగ్రో నైకశృంగో గదాగ్రజః ॥ 81 ॥`, `చతుర్మూర్తి శ్చతుర్బాహు శ్చతుర్వ్యూహ శ్చతుర్గతిః ।`] }],
  82: [{ n:82, tlines:[`చతురాత్మా చతుర్భావశ్చతుర్వేదవిదేకపాత్ ॥ 82 ॥`, `సమావర్తోఽనివృత్తాత్మా దుర్జయో దురతిక్రమః ।`] }],
  83: [{ n:83, tlines:[`దుర్లభో దుర్గమో దుర్గో దురావాసో దురారిహా ॥ 83 ॥`, `శుభాంగో లోకసారంగః సుతంతుస్తంతువర్ధనః ।`] }],
  84: [{ n:84, tlines:[`ఇంద్రకర్మా మహాకర్మా కృతకర్మా కృతాగమః ॥ 84 ॥`, `ఉద్భవః సుందరః సుందో రత్ననాభః సులోచనః ।`] }],
  85: [{ n:85, tlines:[`అర్కో వాజసనః శృంగీ జయంతః సర్వవిజ్జయీ ॥ 85 ॥`, `సువర్ణబిందు-రక్షోభ్యః సర్వవాగీశ్వరేశ్వరః ।`] }],
  86: [{ n:86, tlines:[`మహాహ్రదో మహాగర్తో మహాభూతో మహానిధిః ॥ 86 ॥`, `కుముదః కుందరః కుందః పర్జన్యః పావనోఽనిలః ।`] }],
  87: [{ n:87, tlines:[`అమృతాశోఽమృతవపుః సర్వజ్ఞః సర్వతోముఖః ॥ 87 ॥`, `సులభః సువ్రతః సిద్ధః శత్రుజిచ్ఛత్రుతాపనః ।`] }],
  88: [{ n:88, tlines:[`న్యగ్రోధోఽదుంబరోఽశ్వత్థశ్చాణూరాంధ్ర నిషూదనః ॥ 88 ॥`, `సహస్రార్చిః సప్తజిహ్వః సప్తైధాః సప్తవాహనః ।`] }],
  89: [{ n:89, tlines:[`అమూర్తిరనఘోఽచింత్యో భయకృద్భయనాశనః ॥ 89 ॥`, `అణుర్బృహత్కృశః స్థూలో గుణభృన్నిర్గుణో మహాన్ ।`] }],
  90: [{ n:90, tlines:[`అధృతః స్వధృతః స్వాస్యః ప్రాగ్వంశో వంశవర్ధనః ॥ 90 ॥`, `భారభృత్ కథితో యోగీ యోగీశః సర్వకామదః ।`] }],
  91: [{ n:91, tlines:[`ఆశ్రమః శ్రమణః, క్షామః సుపర్ణో వాయువాహనః ॥ 91 ॥`, `ధనుర్ధరో ధనుర్వేదో దండో దమయితా దమః ।`] }],
  92: [{ n:92, tlines:[`అపరాజితః సర్వసహో నియంతాఽనియమోఽయమః ॥ 92 ॥`, `సత్త్వవాన్ సాత్త్వికః సత్యః సత్యధర్మపరాయణః ।`] }],
  93: [{ n:93, tlines:[`అభిప్రాయః ప్రియార్హోఽర్హః ప్రియకృత్ ప్రీతివర్ధనః ॥ 93 ॥`, `విహాయసగతిర్జ్యోతిః సురుచిర్హుతభుగ్విభుః ।`] }],
  94: [{ n:94, tlines:[`రవిర్విరోచనః సూర్యః సవితా రవిలోచనః ॥ 94 ॥`, `అనంతో హుతభుగ్భోక్తా సుఖదో నైకజోఽగ్రజః ।`] }],
  95: [{ n:95, tlines:[`అనిర్విణ్ణః సదామర్షీ లోకధిష్ఠానమద్భుతః ॥ 95 ॥`, `సనాత్సనాతనతమః కపిలః కపిరవ్యయః ।`] }],
  96: [{ n:96, tlines:[`స్వస్తిదః స్వస్తికృత్స్వస్తిః స్వస్తిభుక్ స్వస్తిదక్షిణః ॥ 96 ॥`, `అరౌద్రః కుండలీ చక్రీ విక్రమ్యూర్జితశాసనః ।`] }],
  97: [{ n:97, tlines:[`శబ్దాతిగః శబ్దసహః శిశిరః శర్వరీకరః ॥ 97 ॥`, `అక్రూరః పేశలో దక్షో దక్షిణః, క్షమిణాంవరః ।`] }],
  98: [{ n:98, tlines:[`విద్వత్తమో వీతభయః పుణ్యశ్రవణకీర్తనః ॥ 98 ॥`, `ఉత్తారణో దుష్కృతిహా పుణ్యో దుఃస్వప్ననాశనః ।`] }],
  99: [{ n:99, tlines:[`వీరహా రక్షణః సంతో జీవనః పర్యవస్థితః ॥ 99 ॥`, `అనంతరూపోఽనంత శ్రీర్జితమన్యుర్భయాపహః ।`] }],
  100: [{ n:100, tlines:[`చతురశ్రో గభీరాత్మా విదిశో వ్యాదిశో దిశః ॥ 100 ॥`, `అనాదిర్భూర్భువో లక్ష్మీః సువీరో రుచిరాంగదః ।`] }],
  101: [{ n:101, tlines:[`జననో జనజన్మాదిర్భీమో భీమపరాక్రమః ॥ 101 ॥`, `ఆధారనిలయోఽధాతా పుష్పహాసః ప్రజాగరః ।`] }],
  102: [{ n:102, tlines:[`ఊర్ధ్వగః సత్పథాచారః ప్రాణదః ప్రణవః పణః ॥ 102 ॥`, `ప్రమాణం ప్రాణనిలయః ప్రాణభృత్ ప్రాణజీవనః ।`] }],
  103: [{ n:103, tlines:[`తత్త్వం తత్త్వవిదేకాత్మా జన్మమృత్యుజరాతిగః ॥ 103 ॥`, `భూర్భువః స్వస్తరుస్తారః సవితా ప్రపితామహః ।`] }],
  104: [{ n:104, tlines:[`యజ్ఞో యజ్ఞపతిర్యజ్వా యజ్ఞాంగో యజ్ఞవాహనః ॥ 104 ॥`, `యజ్ఞభృద్ యజ్ఞకృద్ యజ్ఞీ యజ్ఞభుక్ యజ్ఞసాధనః ।`] }],
  105: [{ n:105, tlines:[`యజ్ఞాంతకృద్ యజ్ఞగుహ్యమన్నమన్నాద ఏవ చ ॥ 105 ॥`, `ఆత్మయోనిః స్వయంజాతో వైఖానః సామగాయనః ।`] }],
  106: [{ n:106, tlines:[`దేవకీనందనః స్రష్టా క్షితీశః పాపనాశనః ॥ 106 ॥`, `శంఖభృన్నందకీ చక్రీ శార్​ఙ్గధన్వా గదాధరః ।`] }],
  107: [{ n:107, tlines:[`రథాంగపాణి-రక్షోభ్యః సర్వప్రహరణాయుధః ॥ 107 ॥`, `శ్రీ సర్వప్రహరణాయుధ ఓం నమ ఇతి ।`, `వనమాలీ గదీ శార్​ఙ్గీ శంఖీ చక్రీ చ నందకీ ।`] }],
  108: [{ n:108, tlines:[`శ్రీమాన్నారాయణో విష్ణుర్వాసుదేవోఽభిరక్షతు ॥ 108 ॥`, `శ్రీ వాసుదేవోఽభిరక్షతు ఓం నమ ఇతి ।`, `ఉత్తర పీఠికా`, `ఇతీదం కీర్తనీయస్య కేశవస్య మహాత్మనః ।`] }],
  phala: [
    { n:1, tlines:[`నామ్నాం సహస్రం దివ్యానామశేషేణ ప్రకీర్తితం। ॥ 1 ॥`, `య ఇదం శృణుయాన్నిత్యం యశ్చాపి పరికీర్తయేత్॥`] },
    { n:2, tlines:[`నాశుభం ప్రాప్నుయాత్ కించిత్సోఽముత్రేహ చ మానవః ॥ 2 ॥`, `వేదాంతగో బ్రాహ్మణః స్యాత్ క్షత్రియో విజయీ భవేత్ ।`] },
    { n:3, tlines:[`వైశ్యో ధనసమృద్ధః స్యాత్ శూద్రః సుఖమవాప్నుయాత్ ॥ 3 ॥`, `ధర్మార్థీ ప్రాప్నుయాద్ధర్మమర్థార్థీ చార్థమాప్నుయాత్ ।`] },
    { n:4, tlines:[`కామానవాప్నుయాత్ కామీ ప్రజార్థీ చాప్నుయాత్ప్రజామ్ ॥ 4 ॥ [ప్రాప్నుయాత్ప్రజాం]`, `భక్తిమాన్ యః సదోత్థాయ శుచిస్తద్గతమానసః ।`] },
    { n:5, tlines:[`సహస్రం వాసుదేవస్య నామ్నామేతత్ ప్రకీర్తయేత్ ॥ 5 ॥`, `యశః ప్రాప్నోతి విపులం యాతిప్రాధాన్యమేవ చ । [జ్ఞాతి]`] },
    { n:6, tlines:[`అచలాం శ్రియమాప్నోతి శ్రేయః ప్రాప్నోత్యనుత్తమం। ॥ 6 ॥`, `న భయం క్వచిదాప్నోతి వీర్యం తేజశ్చ విందతి ।`] },
    { n:7, tlines:[`భవత్యరోగో ద్యుతిమాన్ బలరూప గుణాన్వితః ॥ 7 ॥`, `రోగార్తో ముచ్యతే రోగాద్బద్ధో ముచ్యేత బంధనాత్ ।`] },
    { n:8, tlines:[`భయాన్ముచ్యేత భీతస్తు ముచ్యేతాపన్న ఆపదః ॥ 8 ॥`, `దుర్గాణ్యతితరత్యాశు పురుషః పురుషోత్తమమ్ ।`] },
    { n:9, tlines:[`స్తువన్నామసహస్రేణ నిత్యం భక్తిసమన్వితః ॥ 9 ॥`, `వాసుదేవాశ్రయో మర్త్యో వాసుదేవపరాయణః ।`] },
    { n:10, tlines:[`సర్వపాపవిశుద్ధాత్మా యాతి బ్రహ్మ సనాతనం। ॥ 10 ॥`, `న వాసుదేవ భక్తానామశుభం విద్యతే క్వచిత్ ।`] },
    { n:11, tlines:[`జన్మమృత్యుజరావ్యాధిభయం నైవోపజాయతే ॥ 11 ॥`, `ఇమం స్తవమధీయానః శ్రద్ధాభక్తిసమన్వితః ।`] },

  autoAdvance: false,
  language: 'en',        // 'en' = IAST only, 'te' = Telugu only, 'both' = IAST + Telugu
};
const PRACTICE_FONT_SIZES = ['1.1rem','1.35rem','1.6rem','1.9rem'];
const RECITE_FONT_SIZES   = ['1.5rem','1.9rem','2.4rem','3rem'];
const FONT_LABELS = ['S','M','L','XL'];

let settings = {...SETTINGS_DEFAULTS};
try {
  const saved = JSON.parse(localStorage.getItem('vedic_settings') || '{}');
  Object.assign(settings, saved);
} catch(e) {}

function saveSettings() {
  try { localStorage.setItem('vedic_settings', JSON.stringify(settings)); } catch(e) {}
}

function applyFontSizes() {
  document.documentElement.style.setProperty('--practice-font', PRACTICE_FONT_SIZES[settings.practiceFontSize]);
  document.documentElement.style.setProperty('--recite-font', RECITE_FONT_SIZES[settings.reciteFontSize]);
}

// done tracking: key = "gita_ch12_v3" or "rudram_an1_l5"
let done = new Set();
try {
  const saved = localStorage.getItem('vedic_done');
  if (saved) done = new Set(JSON.parse(saved));
} catch(e) {}

function saveDone() {
  try { localStorage.setItem('vedic_done', JSON.stringify([...done])); } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('vedic_state', JSON.stringify({
      section: state.section, chapter: state.chapter
    }));
  } catch(e) {}
}

// Restore state (but always start at home view)
try {
  const s = JSON.parse(localStorage.getItem('vedic_state') || '{}');
  if (s.section) state.section = s.section;
  if (s.chapter) state.chapter = s.chapter;
} catch(e) {}
state.view = 'home';

// ─────────────── SECTIONS ───────────────
function switchSection(sec) {
  state.section = sec;
  state.expandedVerse = null;
  if (sec === 'gita') state.chapter = state.chapter || '12';
  else if (sec === 'rudram') state.chapter = state.chapter && parseInt(state.chapter) <= 11 ? state.chapter : '1';
  else if (sec === 'vsn') state.chapter = state.chapter && VSN_SECTIONS_ORDER.includes(state.chapter) ? state.chapter : 'preamble';
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  saveState();
  showView('index');
}

// ─────────────── VIEW SWITCHING ───────────────
function showView(v) {
  state.view = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  const bn = document.getElementById('bnav-' + v);
  if (bn) bn.classList.add('active');
  // Show/hide chrome based on view
  const isHome = (v === 'home');
  document.getElementById('topbar').style.display = isHome ? 'none' : '';
  document.getElementById('bottomnav').style.display = isHome ? 'none' : '';
  // Scroll main to top
  document.getElementById('main').scrollTop = 0;
  renderCurrentView();
}

function renderCurrentView() {
  if (state.view === 'home') renderHome();
  else if (state.view === 'practice') renderPractice();
  else if (state.view === 'index') renderIndex();
  else if (state.view === 'progress') renderProgress();
  else if (state.view === 'settings') renderSettings();
  if (state.view !== 'home') updateTopbar();
}

function updateTopbar() {
  const t = document.getElementById('topbar-title');
  const recBtn = document.getElementById('btn-recite');
  if (state.section === 'gita') {
    const m = GITA_META[state.chapter];
    t.textContent = m ? 'Ch.' + state.chapter + ' — ' + m.yoga : 'Bhagavad Gītā';
  } else if (state.section === 'rudram') {
    t.textContent = RUDRAM_META[state.chapter] || 'Śrī Rudram';
  } else {
    t.textContent = 'Viṣṇu Sahasranāmam';
  }
  // Show recite button only in practice view and when content available
  const hasContent = (state.section === 'gita' && GITA_DATA[state.chapter]?.length > 0) ||
                     (state.section === 'rudram' && RUDRAM_DATA[state.chapter]?.length > 0) ||
                     (state.section === 'vsn' && VSN_DATA[state.chapter]?.length > 0);
  recBtn.style.display = (state.view === 'practice' && hasContent) ? '' : 'none';
}

function toggleRudramMenu(e) {
  e.stopPropagation();
  const sub = document.getElementById('rudram-submenu');
  const arrow = document.getElementById('rudram-arrow');
  const open = sub.classList.toggle('open');
  arrow.style.transform = open ? 'rotate(90deg)' : '';
  arrow.style.transition = 'transform 0.2s';
}

function openSection(sec, sub) {
  if (sec === 'gita') {
    state.section = 'gita';
    state.chapter = state.chapter && parseInt(state.chapter) <= 18 ? state.chapter : '1';
  } else if (sec === 'rudram') {
    state.section = 'rudram';
    state.chapter = state.chapter && parseInt(state.chapter) <= 11 ? state.chapter : '1';
  }
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  saveState();
  showView('index');
}

function navChapter(dir) {
  // For Gita: dhyana=0, chapters 1-18
  if (state.section === 'gita') {
    const cur = state.chapter === 'dhyana' ? 0 : parseInt(state.chapter);
    const next = cur + dir;
    if (next < 0 || next > 18) return;
    state.chapter = next === 0 ? 'dhyana' : String(next);
  } else if (state.section === 'rudram') {
    const ch = parseInt(state.chapter);
    const max = 11;
    const next = ch + dir;
    if (next < 1 || next > max) return;
    state.chapter = String(next);
  } else if (state.section === 'vsn') {
    const idx = VSN_SECTIONS_ORDER.indexOf(state.chapter);
    const next = idx + dir;
    if (next < 0 || next >= VSN_SECTIONS_ORDER.length) return;
    state.chapter = VSN_SECTIONS_ORDER[next];
  }
  state.expandedVerse = null;
  saveState();
  showView('practice');
}

function nextChapterFromBanner() {
  navChapter(1);
}

// ─────────────── PRACTICE VIEW ───────────────
function renderPractice() {
  const el = document.getElementById('view-practice');
  if (state.section === 'gita' && state.chapter === 'dhyana') renderDhyanaPractice(el);
  else if (state.section === 'gita') renderGitaPractice(el);
  else if (state.section === 'rudram') renderRudramPractice(el);
  else if (state.section === 'vsn') renderVSNPractice(el);
}

function renderDhyanaPractice(el) {
  let html = `
  <div class="chapter-nav">
    <button class="chapter-nav-btn" disabled>← Prev</button>
    <div class="chapter-nav-title">Dhyāna Śloka</div>
    <button class="chapter-nav-btn" onclick="goToChapter('gita','1')">Next →</button>
  </div>
  <div class="chapter-header">
    <div class="chapter-num">Bhagavad Gītā · Dhyāna Śloka</div>
    <h2>Gītā Dhyānam</h2>
    <div class="subtitle">14 Invocation Verses before the Gītā</div>
  </div>`;
  for (const s of DHYANA_DATA) {
    const key = `gita_dhyana_${s.n}`;
    const isDone = done.has(key);
    const isExpanded = state.expandedVerse === key;
    const teSlokas = VSN_TE_DATA[ch] || [];
    const teSloka = teSlokas.find(x => x.n === s.n);
    const linesHtml = s.tlines.map((ln,i) => {
      const enLine = settings.language !== 'te' ? `<span class="vline">${esc(ln)}</span>` : '';
      // Use provided Telugu text if available, otherwise auto-convert
      const teLn = (teSloka && teSloka.tlines[i]) ? teSloka.tlines[i] : iastToTelugu(ln);
      const teLine = settings.language !== 'en' ? `<span class="vline-te">${esc(teLn)}</span>` : '';
      const br = (i < s.tlines.length-1 && settings.language !== 'te') ? '<br>' : '';
      return enLine + teLine + br;
    }).join('');
    html += `<div class="verse-block${isDone?' done':''}${isExpanded?' expanded':''}" data-key="${key}" onclick="toggleVerse('${key}')">

    </div>`;
  }
  html += `<div class="lesson-end-banner">
    <div class="leb-title">Dhyāna Śloka Complete 🙏</div>
    <div class="leb-sub">Continue to Chapter 1 · Arjuna Viṣāda Yoga</div>
    <button class="leb-next-btn" onclick="goToChapter('gita','1')">Chapter 1 →</button>
    <div class="leb-done">The Yoga of Arjuna's Grief · 47 verses</div>
  </div>`;
  el.innerHTML = html;
}


function renderVSNPractice(el) {
  const ch = state.chapter;
  const slokas = VSN_DATA[ch] || [];
  const secIdx = VSN_SECTIONS_ORDER.indexOf(ch);
  const hasPrev = secIdx > 0;
  const hasNext = secIdx < VSN_SECTIONS_ORDER.length - 1;
  const isMainSloka = !['preamble','purva','dhyanam','phala'].includes(ch);
  const slokaNum = isMainSloka ? parseInt(ch) : 0;

  let navLabel;
  if (ch === 'preamble') navLabel = 'Invocation';
  else if (ch === 'purva') navLabel = 'Pūrva Pīṭhikā';
  else if (ch === 'dhyanam') navLabel = 'Dhyānam';
  else if (ch === 'phala') navLabel = 'Phalaśruti';
  else navLabel = `Śloka ${ch} of 108`;

  let html = `
  <div class="chapter-nav">
    <button class="chapter-nav-btn" onclick="navChapter(-1)" ${hasPrev?'':'disabled'}>← Prev</button>
    <div class="chapter-nav-title">${navLabel}</div>
    <button class="chapter-nav-btn" onclick="navChapter(1)" ${hasNext?'':'disabled'}>Next →</button>
  </div>
  <div class="chapter-header">
    <div class="chapter-num">Viṣṇu Sahasranāmam</div>
    <h2>${VSN_META[ch] || 'Śloka ' + ch}</h2>
    <div class="subtitle">${isMainSloka ? '1000 Names of Viṣṇu · Śloka ' + ch : ''}</div>
  </div>`;

  for (const s of slokas) {
    const key = `vsn_${ch}_${s.n}`;
    const isDone = done.has(key);
    const isExpanded = state.expandedVerse === key;
    const speakerLabel = s.speaker ? `<div class="verse-speaker">${esc(s.speaker)}</div>` : '';
    const teSlokas = VSN_TE_DATA[ch] || [];
    const teSloka = teSlokas.find(x => x.n === s.n);
    const linesHtml = s.tlines.map((ln,i) => {
      const enLine = settings.language !== 'te' ? `<span class="vline">${esc(ln)}</span>` : '';
      // Use provided Telugu text if available, otherwise auto-convert
      const teLn = (teSloka && teSloka.tlines[i]) ? teSloka.tlines[i] : iastToTelugu(ln);
      const teLine = settings.language !== 'en' ? `<span class="vline-te">${esc(teLn)}</span>` : '';
      const br = (i < s.tlines.length-1 && settings.language !== 'te') ? '<br>' : '';
      return enLine + teLine + br;
    }).join('');
    html += `<div class="verse-block${isDone?' done':''}${isExpanded?' expanded':''}" data-key="${key}" onclick="toggleVerse('${key}')">
      <span class="verse-done-mark">✓</span>
      ${speakerLabel}
      <div class="verse-text">${linesHtml}</div>
    </div>`;
  }

  if (hasNext) {
    const nextSec = VSN_SECTIONS_ORDER[secIdx + 1];
    const nextLabel = VSN_META[nextSec] || 'Śloka ' + nextSec;
    html += `<div class="lesson-end-banner">
      <div class="leb-title">Section Complete 🙏</div>
      <div class="leb-sub">Continue to ${nextLabel}</div>
      <button class="leb-next-btn" onclick="navChapter(1)">Next →</button>
    </div>`;
  } else {
    html += `<div class="lesson-end-banner">
      <div class="leb-title">🙏 Viṣṇu Sahasranāmam Complete</div>
      <div class="leb-sub">1000 names of the Lord have been recited</div>
      <button class="leb-next-btn" onclick="showView('home')">Return Home</button>
    </div>`;
  }

  el.innerHTML = html;
}

function renderGitaPractice(el) {
  const ch = state.chapter;
  const chNum = parseInt(ch);
  const meta = GITA_META[ch];
  const verses = GITA_DATA[ch] || [];
  const hasPrev = true; // ch1 goes back to dhyana
  const hasNext = chNum < 18;
  const nextMeta = hasNext ? GITA_META[String(chNum+1)] : null;

  let html = `
  <div class="chapter-nav">
    <button class="chapter-nav-btn" onclick="navChapter(-1)" ${hasPrev ? '' : 'disabled'}>← Prev</button>
    <div class="chapter-nav-title">Ch.${chNum} of 18</div>
    <button class="chapter-nav-btn" onclick="navChapter(1)" ${hasNext ? '' : 'disabled'}>Next →</button>
  </div>
  <div class="chapter-header">
    <div class="chapter-num">Bhagavad Gītā · Chapter ${ch}</div>
    <h2>${meta?.yoga || 'Chapter ' + ch}</h2>
    <div class="subtitle">${meta?.subtitle || ''}</div>
  </div>`;

  let prevSpk = null;
  for (const v of verses) {
    const key = `gita_ch${ch}_v${v.n}`;
    const isDone = done.has(key);
    const isExpanded = state.expandedVerse === key;
    let spkHtml = '';
    if (v.spk && v.spk !== prevSpk) {
      const spkNames = { 'arjuna':'Arjuna','bhagavān':'Śrī Bhagavān','sañjaya':'Sañjaya','dhṛtarāṣṭra':'Dhṛtarāṣṭra' };
      spkHtml = `<span class="spk-tag">${spkNames[v.spk] || v.spk} uvāca</span>`;
      prevSpk = v.spk;
    }
    const linesHtml = v.tlines.map((ln,i) => {
      const enLine = settings.language !== 'te' ? `<span class="vline">${esc(ln)}</span>` : '';
      const teLine = settings.language !== 'en' ? `<span class="vline-te">${esc(iastToTelugu(ln))}</span>` : '';
      const br = (i < v.tlines.length-1 && settings.language !== 'te') ? '<br>' : '';
      return enLine + teLine + br;
    }).join('');
    const meaningHtml = v.meaning_en ? `<div class="verse-meaning">${esc(v.meaning_en)}</div>` : `<div class="verse-meaning empty"></div>`;
    html += `<div class="verse-block${isDone?' done':''}${isExpanded?' expanded':''}" data-key="${key}" onclick="toggleVerse('${key}')">
      <span class="verse-done-mark">✓</span>
      <div class="verse-text">${spkHtml}${linesHtml}<span class="verse-num">॥ ${v.n} ॥</span></div>
      ${meaningHtml}
    </div>`;
  }

  // Continuation banner
  if (hasNext && nextMeta) {
    html += `<div class="lesson-end-banner">
      <div class="leb-title">Chapter ${ch} Complete 🙏</div>
      <div class="leb-sub">Continue to Chapter ${chNum+1} · ${nextMeta.yoga}</div>
      <button class="leb-next-btn" onclick="nextChapterFromBanner()">Next Chapter →</button>
      <div class="leb-done">${nextMeta.subtitle} · ${nextMeta.count} verses</div>
    </div>`;
  } else if (!hasNext) {
    html += `<div class="lesson-end-banner">
      <div class="leb-title">🙏 Bhagavad Gītā Complete</div>
      <div class="leb-sub">You have completed all 18 chapters</div>
      <button class="leb-next-btn" onclick="showView('home')">Return Home</button>
    </div>`;
  }

  el.innerHTML = html;
}

function renderRudramPractice(el) {
  const an = state.chapter;
  const anNum = parseInt(an) || 0;
  const isClosing = (an === 'closing');
  // Use NAMAKAM_DATA (authoritative IAST) if available, fall back to legacy RUDRAM_DATA
  const nmBlock = NAMAKAM_DATA[an];
  const lines = nmBlock ? nmBlock[0].tlines : (RUDRAM_DATA[an] || []);
  // Telugu lines from NAMAKAM_TE_DATA
  const teBlock = NAMAKAM_TE_DATA[an];
  const teLines = teBlock ? teBlock[0].tlines : null;
  const anLabel = RUDRAM_META[an] || (isClosing ? 'Kṣamāpaṇa' : 'Anuvaka ' + an);
  const hasPrev = !isClosing && anNum > 1;
  const hasNext = !isClosing && anNum < 11;
  const nextLabel = hasNext ? (RUDRAM_META[String(anNum+1)] || 'Anuvaka '+(anNum+1)) : null;

  let html = `
  <div class="chapter-nav">
    <button class="chapter-nav-btn" onclick="navChapter(-1)" ${hasPrev ? '' : 'disabled'}>← Prev</button>
    <div class="chapter-nav-title">${isClosing ? 'Closing' : 'Anuvaka ' + anNum + ' of 11'}</div>
    <button class="chapter-nav-btn" onclick="navChapter(1)" ${hasNext ? '' : 'disabled'}>Next →</button>
  </div>
  <div class="chapter-header">
    <div class="chapter-num">Śrī Rudram (Namakam)</div>
    <h2>${anLabel}</h2>
  </div>
  <div class="rudram-anuvaka"><div class="rudram-lines">`;

  lines.forEach((ln, i) => {
    const enPart = settings.language !== 'te' ? `<span>${esc(ln)}</span>` : '';
    const teLn = (teLines && teLines[i]) ? teLines[i] : iastToTelugu(ln);
    const tePart = settings.language !== 'en' ? `<span class="vline-te" style="display:block;font-size:1.1rem">${esc(teLn)}</span>` : '';
    html += enPart + tePart;
  });
  html += `</div></div>`;

  // Continuation banner
  if (hasNext) {
    html += `<div class="lesson-end-banner">
      <div class="leb-title">Anuvaka ${anNum} Complete 🙏</div>
      <div class="leb-sub">Continue to ${nextLabel}</div>
      <button class="leb-next-btn" onclick="nextChapterFromBanner()">Next Anuvaka →</button>
    </div>`;
  } else {
    html += `<div class="lesson-end-banner">
      <div class="leb-title">🙏 Namakam Complete</div>
      <div class="leb-sub">You have completed all 11 Anuvakas of Namakam</div>
      <button class="leb-next-btn" onclick="showView('home')">Return Home</button>
    </div>`;
  }

  el.innerHTML = html;
}

function renderPlaceholder(el, title, msg) {
  el.innerHTML = `<div class="placeholder-msg">
    <h3>${title}</h3><p>${msg}</p>
  </div>`;
}

function toggleVerse(key) {
  if (state.expandedVerse === key) {
    // Second click = mark done
    if (done.has(key)) done.delete(key);
    else done.add(key);
    saveDone();
    state.expandedVerse = null;
    renderPractice();
    if (state.view === 'progress') renderProgress();
  } else {
    state.expandedVerse = key;
    renderPractice();
  }
}

// ─────────────── RECITE MODE ───────────────
function buildReciteItems() {
  // Build flat list of items for recite mode
  // Each item is an object with lines[] to show
  const items = [];
  
  if (state.section === 'gita' && state.chapter === 'dhyana') {
    for (const s of DHYANA_DATA) {
      items.push({
        id: `gita_dhyana_${s.n}`,
        label: `Dhyānam · ${s.n}`,
        lines: s.tlines.slice(0, 4),
        n: s.n,
      });
    }
  } else if (state.section === 'gita') {
    const spkNames = { 'dhṛtarāṣṭra':'Dhṛtarāṣṭra','arjuna':'Arjuna','bhagavān':'Śrī Bhagavān','sañjaya':'Sañjaya' };
    let prevSpk = null;
    const verses = GITA_DATA[state.chapter] || [];
    for (const v of verses) {
      const allLines = [...v.tlines];
      // Attach speaker label only when it changes
      const spkLabel = (v.spk && v.spk !== prevSpk) ? (spkNames[v.spk] || v.spk) + ' uvāca' : null;
      if (v.spk) prevSpk = v.spk;
      items.push({
        id: `gita_ch${state.chapter}_v${v.n}`,
        label: `Ch.${state.chapter} · ${v.n}`,
        lines: allLines.slice(0, 4),
        spk: spkLabel,
        n: v.n,
      });
    };
  } else if (state.section === 'rudram') {
    const an = state.chapter;
    const nmBlock = NAMAKAM_DATA[an];
    const lines = nmBlock ? nmBlock[0].tlines : (RUDRAM_DATA[an] || []);
    const teBlock = NAMAKAM_TE_DATA[an];
    const teLines = teBlock ? teBlock[0].tlines : null;
    // Group every 4 lines into a card
    for (let i = 0; i < lines.length; i += 4) {
      const cardLines = lines.slice(i, i+4);
      const cardTeLines = teLines ? teLines.slice(i, i+4) : cardLines.map(l => iastToTelugu(l));
      items.push({
        id: `rudram_an${an}_g${Math.floor(i/4)}`,
        label: RUDRAM_META[an] || 'Anuvaka ' + an,
        lines: cardLines,
        teLines: cardTeLines,
      });
    }
  
  } else if (state.section === 'vsn') {
    const slokas = VSN_DATA[state.chapter] || [];
    const secLabel = VSN_META[state.chapter] || ('Śloka ' + state.chapter);
    for (const s of slokas) {
      items.push({
        id: `vsn_${state.chapter}_${s.n}`,
        label: secLabel + ' · ' + s.n,
        lines: s.tlines,
        n: s.n,
      });
    }
  }
  return items;
}

function startRecite() {
  const items = buildReciteItems();
  if (!items.length) return;
  
  state.reciting = true;
  state.reciteItems = items;
  state.reciteIdx = 0;
  
  // Start from first undone item if possible
  for (let i = 0; i < items.length; i++) {
    if (!done.has(items[i].id)) { state.reciteIdx = i; break; }
  }
  
  document.getElementById('recite-overlay').classList.add('active');
  renderRecite();
  
  // Keyboard support
  document.addEventListener('keydown', reciteKeyHandler);
}

function stopRecite() {
  state.reciting = false;
  document.getElementById('recite-overlay').classList.remove('active');
  // Reset end panel
  document.getElementById('recite-controls').style.display = '';
  document.getElementById('recite-end').style.display = 'none';
  document.removeEventListener('keydown', reciteKeyHandler);
  renderPractice();
  updateTopbar();
}

function reciteKeyHandler(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); reciteNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); recitePrev(); }
  else if (e.key === 'Escape') stopRecite();
}

function reciteNext() {
  if (state.reciteIdx < state.reciteItems.length - 1) {
    const item = state.reciteItems[state.reciteIdx];
    done.add(item.id);
    saveDone();
    state.reciteIdx++;
    renderRecite();
  } else {
    // Last item — show end panel
    const item = state.reciteItems[state.reciteIdx];
    done.add(item.id);
    saveDone();
    // Show end panel
    document.getElementById('recite-controls').style.display = 'none';
    const endEl = document.getElementById('recite-end');
    endEl.style.display = '';
    const chNum = parseInt(state.chapter);
    const max = (state.section === 'gita') ? 18 :
               (state.section === 'rudram') ? 11 : VSN_SECTIONS_ORDER.length - 1;
    const hasNext = (state.section === 'vsn')
      ? VSN_SECTIONS_ORDER.indexOf(state.chapter) < max
      : chNum < max;
    const btn = document.getElementById('recite-next-ch-btn');
    if (hasNext) {
      const vsnNextIdx = VSN_SECTIONS_ORDER.indexOf(state.chapter) + 1;
      const nextLabel = state.section === 'gita'
        ? `Chapter ${chNum+1} · ${GITA_META[String(chNum+1)]?.yoga || ''}`
        : state.section === 'rudram'
        ? `${RUDRAM_META[String(chNum+1)] || 'Anuvaka '+(chNum+1)}`
        : `${VSN_META[VSN_SECTIONS_ORDER[vsnNextIdx]] || 'Śloka '+VSN_SECTIONS_ORDER[vsnNextIdx]}`;
      document.getElementById('recite-end-label').textContent = 'Up next: ' + nextLabel;
      btn.textContent = state.section === 'gita' ? 'Next Chapter →' : state.section === 'rudram' ? 'Next Anuvaka →' : 'Next Section →';
      btn.style.display = '';
    } else {
      document.getElementById('recite-end-label').textContent =
        state.section === 'gita' ? 'All 18 Chapters complete 🙏' :
        state.section === 'rudram' ? 'All 11 Anuvakas complete 🙏' :
        'Viṣṇu Sahasranāmam complete 🙏';
      btn.style.display = 'none';
    }
  }
}

function reciteNextChapter() {
  stopRecite();
  navChapter(1);
  // Auto-start recite for next chapter
  setTimeout(() => startRecite(), 100);
}

function reciteGoTo(idx) {
  if (idx >= 0 && idx < state.reciteItems.length) {
    state.reciteIdx = idx;
    renderRecite();
  }
}

function recitePrev() {
  if (state.reciteIdx > 0) {
    state.reciteIdx--;
    renderRecite();
  }
}

function renderRecite() {
  const items = state.reciteItems;
  const idx = state.reciteIdx;
  const item = items[idx];
  if (!item) return;
  
  document.getElementById('recite-section-label').textContent =
    state.section === 'gita' ? 'Bhagavad Gītā' :
    state.section === 'rudram' ? 'Śrī Rudram' : 'Viṣṇu Sahasranāmam';
  document.getElementById('recite-verse-label').textContent = item.label || '';
  
  // Speaker tag (shown above lines when speaker changes)
  const linesEl = document.getElementById('recite-lines');
  const spkHtml = item.spk ? `<div class="recite-spk">${esc(item.spk)}</div>` : '';
  linesEl.innerHTML = spkHtml + item.lines.map(ln => {
    const enLine = settings.language !== 'te' ? `<div class="recite-line">${esc(ln)}</div>` : '';
    const teLine = settings.language !== 'en' ? `<div class="recite-line-te">${esc(iastToTelugu(ln))}</div>` : '';
    return enLine + teLine;
  }).join('');
  
  // Dots
  const dotsEl = document.getElementById('recite-dots');
  dotsEl.innerHTML = items.map((it, i) => {
    const cls = i === idx ? 'cur' : (done.has(it.id) ? 'done' : '');
    return `<div class="recite-dot ${cls}" onclick="reciteGoTo(${i})" title="${esc(it.label||String(i+1))}"></div>`;
  }).join('');
}

// ─────────────── UTILITIES ───────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

    ṛ:'ఋ',ṝ:'ఌ',e:'ఎ',ē:'ఏ',ai:'ఐ',o:'ఒ',ō:'ఓ',au:'ఔ'};
  const VM = {a:'',ā:'ా',i:'ి',ī:'ీ',u:'ు',ū:'ూ',
    ṛ:'ృ',ṝ:'ౄ',e:'ె',ē:'ే',ai:'ై',o:'ొ',ō:'ో',au:'ౌ'};
  const CONS2 = {kh:'ఖ',gh:'ఘ',ch:'ఛ',jh:'ఝ',
    ṭh:'ఠ',ḍh:'ఢ',th:'థ',dh:'ధ',ph:'ఫ',bh:'భ'};
  const CONS1 = {k:'క',g:'గ',ṅ:'ఙ',c:'చ',j:'జ',ñ:'ఞ',
    ṭ:'ట',ḍ:'డ',ṇ:'ణ',t:'త',d:'ద',n:'న',
    p:'ప',b:'బ',m:'మ',y:'య',r:'ర',l:'ల',
    ḷ:'ళ',ḻ:'ళ',v:'వ',ś:'శ',ṣ:'ష',s:'స',h:'హ'};
  const SPECIAL = {ṃ:ANUSVARA,ṁ:ANUSVARA,ḥ:VISARGA};
  const PASSTHRU = new Set(' \t\n\r|।॥-\'"()[]{}0123456789,.!?;:/\\~`@#%^&*_+=<>\'');

  function stripAccents(t) {
    const r = [];
    for (const c of t) { if (!ACCENT_STRIPS.has(c)) r.push(c); }
    return r.join('');
  }
  function getCons(text, i) {
    const two = text.slice(i, i+2);
    if (CONS2[two]) return [CONS2[two], 2];
    const c = text[i] || '';
    if (CONS1[c]) return [CONS1[c], 1];
    return [null, 0];
  }
  function getVowel(text, i) {
    const two = text.slice(i, i+2);
    if (two === 'ai' || two === 'au') return [two, 2];
    const c = text[i] || '';
    if (c in VM) return [c, 1];
    return [null, 0];
  }

  window.iastToTelugu = function(text) {
    text = stripAccents(text);
    // NFC normalize (browser)
    if (text.normalize) text = text.normalize('NFC');
    const result = [];
    let i = 0;
    const n = text.length;
    while (i < n) {
      const ch = text[i];
      if (PASSTHRU.has(ch)) { result.push(ch); i++; continue; }
      if (SPECIAL[ch]) { result.push(SPECIAL[ch]); i++; continue; }
      const [cons_ch, clen] = getCons(text, i);
      if (cons_ch) {
        i += clen;
        const [vowel, vlen] = getVowel(text, i);
        if (vowel !== null) {
          result.push(cons_ch, VM[vowel]);
          i += vlen;
        } else {
          result.push(cons_ch, VIRAMA);
        }
        continue;
      }
      // Standalone vowel
      const two = text.slice(i, i+2);
      if (two === 'ai' || two === 'au') { result.push(SV[two]); i += 2; continue; }
      if (SV[ch]) { result.push(SV[ch]); i++; continue; }
      result.push(ch); i++;
    }
    return result.join('');
  };
})();

        <div class="settings-control">
          <button class="sz-btn" onclick="changeSetting('practiceFontSize',-1)">−</button>
          <span class="sz-val">${FONT_LABELS[pf]}</span>
          <button class="sz-btn" onclick="changeSetting('practiceFontSize',1)">+</button>
        </div>
      </div>
    </div>
    <div class="settings-section">

        </div>
      </div>
    </div>
    <div class="settings-section">

        </div>
        <div class="settings-control" style="gap:6px">
          ${['en','both','te'].map(v => {
            const labels = {en:'English',both:'Both',te:'తెలుగు'};
            const sel = settings.language === v;
            return `<button class="sz-btn" style="width:auto;padding:0 12px;font-size:0.82rem;border-radius:8px;${sel?'background:var(--accent);color:#fff;border-color:var(--accent)':''}" onclick="setLanguage('${v}')">${labels[v]}</button>`;
          }).join('')}

        </div>
        <div class="settings-control">
          <button class="sz-btn" style="width:auto;padding:0 14px;border-radius:8px;font-size:0.8rem;color:var(--accent)" onclick="resetProgress()">Reset</button>

      </div>
    </div>
  </div>`;
}

function changeSetting(key, dir) {
  const max = 3;
  settings[key] = Math.max(0, Math.min(max, settings[key] + dir));
  saveSettings();
  applyFontSizes();
  renderSettings();
  // Re-render practice if open so change is visible immediately
  if (state.view === 'practice') renderPractice();
}

function adjustReciteFont(dir) {
  changeSetting('reciteFontSize', dir);
}

function setLanguage(lang) {
  settings.language = lang;
  saveSettings();
  renderSettings();
  if (state.view === 'practice') renderPractice();
  if (state.view === 'recite') renderRecite();
}

// ─────────────── INIT ───────────────
function init() {
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === state.section));
  applyFontSizes();
  showView('home');
}

init();
</script>
