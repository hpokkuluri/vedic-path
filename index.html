<title>Vedasaram</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* ── Design tokens ── */
:root {
  --bg: #fdf8f0;
  --fg: #1c1208;
  --fg2: #5a4020;
  --fg3: #9a7a50;
  --accent: #7b3a10;
  --accent2: #b8720a;
  --accent3: #d4960e;
  --border: #e8d8c0;
  --card-bg: #fff9f0;
  --card-shadow: 0 2px 12px rgba(120,60,0,0.10);
  --nav-bg: #fdf8f0;
  --nav-border: #e8d8c0;
  --recite-bg: #080508;
  --recite-fg: #f0e8d8;
  --recite-hl: #f0c040;
  --tag-bg: #f5e8d0;
  --tag-fg: #7b3a10;
  --done-bg: #eef6ee;
  --done-border: #5aaa5a;
  --home-gradient: linear-gradient(160deg, #2a0e00 0%, #4a1a06 40%, #1a0a22 100%);
  --home-gold: #f0c040;
  --home-gold2: #d4960e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100c08;
    --fg: #f0e4d0;
    --fg2: #c8a870;
    --fg3: #806040;
    --accent: #e08030;
    --accent2: #d4960e;
    --accent3: #f0c040;
    --border: #2e2010;
    --card-bg: #1a1208;
    --card-shadow: 0 2px 12px rgba(0,0,0,0.40);
    --nav-bg: #0e0a06;
    --nav-border: #2e2010;
    --tag-bg: #2e1808;
    --tag-fg: #e0a040;
    --done-bg: #0e1e0e;
    --done-border: #5aaa5a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100c08;
  --fg: #f0e4d0;
  --fg2: #c8a870;
  --fg3: #806040;
  --accent: #e08030;
  --accent2: #d4960e;
  --accent3: #f0c040;
  --border: #2e2010;
  --card-bg: #1a1208;
  --card-shadow: 0 2px 12px rgba(0,0,0,0.40);
  --nav-bg: #0e0a06;
  --nav-border: #2e2010;
  --tag-bg: #2e1808;
  --tag-fg: #e0a040;
  --done-bg: #0e1e0e;
  --done-border: #5aaa5a;
  color-scheme: dark;
}

/* ── Reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ── */
#topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  flex-shrink: 0;
}
#topbar h1 {
  font-size: 1rem;
  font-weight: 600;
  color: var(--accent);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#topbar .section-tabs {
  display: flex;
  gap: 4px;
}
.stab {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  color: var(--fg2);
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
}
.stab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
#btn-recite {
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--accent2);
  color: #fff;
  border: none;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
#btn-recite:hover { opacity: 0.9; }

/* ── Main content ── */
#main {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.view { display: none; padding: 16px; max-width: 680px; margin: 0 auto; }
.view.active { display: block; }

/* ── Practice view — book-style ── */
#view-practice .chapter-header {
  text-align: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--border);
}
#view-practice .chapter-header h2 {
  font-size: 1.3rem;
  color: var(--accent);
  font-weight: 700;
}
#view-practice .chapter-header .subtitle {
  font-size: 0.9rem;
  color: var(--fg2);
  margin-top: 4px;
}
#view-practice .chapter-header .chapter-num {
  font-size: 0.8rem;
  color: var(--fg3);
  margin-top: 2px;
}

/* Book-style verse block */
.verse-block {
  margin-bottom: 20px;
  padding: 0;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.15s;
}
.verse-block:hover { background: var(--card-bg); }
.verse-block.done { 
  opacity: 0.55;
}
.verse-text {
  font-size: 1.05rem;
  line-height: 1.9;
  color: var(--fg);
  font-family: 'Georgia', 'Times New Roman', serif;
}
.verse-text .vline {
  display: inline;
}
/* Verse number inline like ॥ 1 ॥ */
.verse-num {
  display: inline;
  color: var(--accent2);
  font-size: 0.9rem;
  font-weight: 600;
  margin-left: 4px;
}
/* Speaker tag */
.spk-tag {
  display: inline-block;
  font-size: 0.75rem;
  color: var(--tag-fg);
  background: var(--tag-bg);
  border-radius: 3px;
  padding: 1px 6px;
  margin-right: 4px;
  font-style: italic;
  vertical-align: middle;
}

/* Expanded meaning */
.verse-meaning {
  display: none;
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--card-bg);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  font-size: 0.9rem;
  color: var(--fg2);
  line-height: 1.6;
}
.verse-block.expanded .verse-meaning { display: block; }
.verse-meaning.empty { display: none !important; }

/* Done checkmark */
.verse-done-mark {
  display: none;
  float: right;
  color: #4caf50;
  font-size: 1.1rem;
}
.verse-block.done .verse-done-mark { display: inline; }

/* ── Rudram lines (not individual verses, just lines) ── */
.rudram-anuvaka {
  margin-bottom: 24px;
}
.rudram-anuvaka .an-header {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.rudram-lines {
  font-family: 'Georgia', 'Times New Roman', serif;
  font-size: 1.0rem;
  line-height: 2.0;
  color: var(--fg);
}
.rudram-lines span { display: block; }

/* ── Bottom nav ── */
#bottomnav {
  position: sticky;
  bottom: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--nav-bg);
  border-top: 1px solid var(--nav-border);
  display: flex;
  z-index: 100;
  flex-shrink: 0;
}
.bnav-btn {
  flex: 1;
  padding: 10px 4px;
  border: none;
  background: none;
  color: var(--fg3);
  font-size: 0.7rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: color 0.15s;
}
.bnav-btn.active { color: var(--accent); }
.bnav-btn svg { width: 22px; height: 22px; }
.bnav-btn span { font-size: 0.65rem; }

/* ── Index view ── */
#view-index { padding-bottom: 24px; }
.idx-section {
  margin-bottom: 28px;
}
.idx-section h2 {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.idx-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 8px;
}
.idx-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.idx-card:hover { border-color: var(--accent); }
.idx-card.current { border-color: var(--accent); background: var(--tag-bg); }
.idx-card .idx-num {
  font-size: 0.7rem;
  color: var(--fg3);
  margin-bottom: 2px;
}
.idx-card .idx-name {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--fg);
  line-height: 1.3;
}
.idx-card .idx-sub {
  font-size: 0.75rem;
  color: var(--fg2);
  margin-top: 2px;
}
.idx-card .idx-prog {
  margin-top: 6px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.idx-card .idx-prog-fill {
  height: 100%;
  background: var(--accent2);
  border-radius: 2px;
  transition: width 0.3s;
}

/* ── Progress view ── */
#view-progress h2 {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 20px;
}
.prog-section { margin-bottom: 24px; }
.prog-section h3 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--fg);
}
.prog-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.prog-label {
  font-size: 0.85rem;
  color: var(--fg2);
  width: 120px;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.prog-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: var(--accent2);
  border-radius: 3px;
  transition: width 0.5s;
}
.prog-pct {
  font-size: 0.8rem;
  color: var(--fg3);
  width: 36px;
  text-align: right;
  flex-shrink: 0;
}
.prog-reset {
  margin-top: 20px;
  padding: 8px 16px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg2);
  cursor: pointer;
  font-size: 0.85rem;
}

/* ── Recite overlay ── */
#recite-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: var(--recite-bg);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 24px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 52px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
}
#recite-overlay.active { display: flex; }
#recite-lines {
  width: 100%;
  max-width: 680px;
  display: flex;
  flex-direction: column;
  gap: clamp(20px, 5vw, 40px);
  text-align: center;
}
.recite-spk {
  font-size: clamp(0.78rem, 2.2vw, 0.95rem);
  color: var(--recite-fg);
  opacity: 0.45;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-family: 'Georgia', 'Times New Roman', serif;
  margin-bottom: 8px;
}
.recite-line {
  font-size: clamp(2rem, 7.5vw, 3.2rem);
  line-height: 1.6;
  color: var(--recite-hl);
  font-family: 'Georgia', 'Times New Roman', serif;
  font-weight: 600;
}
#recite-info {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  color: #666;
  font-size: 0.8rem;
}
#recite-controls {
  position: fixed;
  bottom: env(safe-area-inset-bottom, 0px);
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: rgba(0,0,0,0.6);
}
.recite-btn {
  padding: 10px 24px;
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 0.95rem;
  cursor: pointer;
  white-space: nowrap;
}
.recite-btn:hover { background: rgba(255,255,255,0.2); }
.recite-btn.primary {
  background: var(--recite-hl);
  border-color: var(--recite-hl);
  color: #000;
  font-weight: 700;
}
#recite-dots {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 300px;
}
.recite-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transition: background 0.2s;
}
.recite-dot.done { background: var(--recite-hl); }
.recite-dot.cur { background: #fff; }

/* ── Placeholder for Vishnu Sahasranamam / Chamakam ── */
.placeholder-msg {
  text-align: center;
  padding: 60px 20px;
  color: var(--fg3);
}
.placeholder-msg h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--fg2); }
.placeholder-msg p { font-size: 0.9rem; }

/* ── Home page ── */
#view-home {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100%;
  padding: 0;
  max-width: 100%;
}
#view-home.active { display: flex; }
.home-hero {
  width: 100%;
  background: var(--home-gradient);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 24px 40px;
  position: relative;
  overflow: hidden;
}
.home-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(240,192,64,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.home-mandala {
  width: 160px;
  height: 160px;
  margin-bottom: 24px;
  filter: drop-shadow(0 0 24px rgba(240,192,64,0.5));
}
.home-title {
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 2.2rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.02em;
  text-align: center;
  line-height: 1.2;
  margin-bottom: 8px;
}
.home-title span { color: var(--home-gold); }
.home-title-script {
  font-size: 1.05rem;
  color: rgba(240,210,140,0.85);
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}
.home-subtitle {
  font-size: 0.82rem;
  color: rgba(240,220,180,0.6);
  text-align: center;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  margin-bottom: 0;
}
.home-menu {
  width: 100%;
  max-width: 480px;
  padding: 28px 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.home-card {
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--card-shadow);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.home-card:active { transform: scale(0.98); }
.home-card-header {
  display: flex;
  align-items: center;
  padding: 16px 18px;
  gap: 14px;
}
.home-card-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}
.home-card-icon.gita { background: linear-gradient(135deg, #7b3a10, #b8720a); }
.home-card-icon.rudram { background: linear-gradient(135deg, #1a4a6a, #2a7ab0); }
.home-card-icon.vsn { background: linear-gradient(135deg, #2a5a1a, #4aaa2a); }
.home-card-text { flex: 1; }
.home-card-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.2;
}
.home-card-desc {
  font-size: 0.8rem;
  color: var(--fg3);
  margin-top: 2px;
}
.home-card-arrow {
  color: var(--accent2);
  font-size: 1.2rem;
  flex-shrink: 0;
}
/* Rudram sub-menu */
.home-submenu {
  display: none;
  border-top: 1px solid var(--border);
  background: var(--bg);
}
.home-submenu.open { display: block; }
.home-submenu-item {
  display: flex;
  align-items: center;
  padding: 12px 18px 12px 76px;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.12s;
}
.home-submenu-item:last-child { border-bottom: none; }
.home-submenu-item:hover, .home-submenu-item:active { background: var(--card-bg); }
.home-submenu-item .sub-label {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--fg);
}
.home-submenu-item .sub-desc {
  font-size: 0.78rem;
  color: var(--fg3);
  margin-top: 1px;
}
.home-submenu-item .sub-arrow {
  margin-left: auto;
  color: var(--accent2);
  font-size: 1rem;
}
.home-footer {
  text-align: center;
  font-size: 0.75rem;
  color: var(--fg3);
  padding: 0 20px 24px;
  letter-spacing: 0.04em;
}

/* ── Chapter nav bar (prev / chapter title / next) ── */
.chapter-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.chapter-nav-btn {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--card-bg);
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.chapter-nav-btn:hover { background: var(--border); }
.chapter-nav-btn:disabled { opacity: 0.3; cursor: default; }
.chapter-nav-title {
  flex: 1;
  text-align: center;
  font-size: 0.82rem;
  color: var(--fg3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Lesson continuation banner ── */
.lesson-end-banner {
  margin: 32px 0 8px;
  padding: 20px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff;
  text-align: center;
}
.lesson-end-banner .leb-title {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.lesson-end-banner .leb-sub {
  font-size: 0.8rem;
  opacity: 0.85;
  margin-bottom: 14px;
}
.lesson-end-banner .leb-next-btn {
  display: inline-block;
  padding: 9px 24px;
  border-radius: 20px;
  background: #fff;
  color: var(--accent);
  font-size: 0.9rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: opacity 0.12s;
}
.lesson-end-banner .leb-next-btn:hover { opacity: 0.88; }
.lesson-end-banner .leb-done {
  font-size: 0.8rem;
  margin-top: 10px;
  opacity: 0.75;
}

/* ── Responsive ── */
@media (max-width: 480px) {
  .verse-text { font-size: 0.95rem; }
  .idx-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .home-title { font-size: 1.9rem; }
  .home-mandala { width: 130px; height: 130px; }
  .chapter-nav-btn { padding: 6px 10px; font-size: 0.78rem; }
}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap">

<!-- Top bar (hidden on home) -->
<div id="topbar" style="display:none">
  <button id="btn-home" onclick="showView('home')" style="background:none;border:none;cursor:pointer;padding:4px 6px;color:var(--accent);font-size:1.1rem;" title="Home">🏠</button>
  <h1 id="topbar-title">Vedasaram</h1>
  <div class="section-tabs" id="section-tabs">
    <button class="stab active" data-sec="gita" onclick="switchSection('gita')">Gītā</button>
    <button class="stab" data-sec="rudram" onclick="switchSection('rudram')">Rudram</button>
    <button class="stab" data-sec="vsn" onclick="switchSection('vsn')">VSN</button>
  </div>
  <button id="btn-recite" onclick="startRecite()">▶ Recite</button>
</div>

<!-- Main content area -->
<div id="main">
  <!-- Home view -->
  <div class="view active" id="view-home"></div>
  <!-- Practice view -->
  <div class="view" id="view-practice"></div>
  <!-- Index view -->
  <div class="view" id="view-index"></div>
  <!-- Progress view -->
  <div class="view" id="view-progress"></div>
</div>

<!-- Bottom nav (hidden on home) -->
<nav id="bottomnav" style="display:none">

// ─────────────── SECTIONS ───────────────
function switchSection(sec) {
  state.section = sec;
  state.expandedVerse = null;
  if (sec === 'gita') state.chapter = state.chapter || '12';
  else if (sec === 'rudram') state.chapter = state.chapter && parseInt(state.chapter) <= 11 ? state.chapter : '1';
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  saveState();
  renderCurrentView();
}

// ─────────────── VIEW SWITCHING ───────────────
function showView(v) {
  state.view = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  const bn = document.getElementById('bnav-' + v);
  if (bn) bn.classList.add('active');
  // Show/hide chrome based on view
  const isHome = (v === 'home');
  document.getElementById('topbar').style.display = isHome ? 'none' : '';
  document.getElementById('bottomnav').style.display = isHome ? 'none' : '';
  // Scroll main to top
  document.getElementById('main').scrollTop = 0;
  renderCurrentView();
}

function renderCurrentView() {
  if (state.view === 'home') renderHome();
  else if (state.view === 'practice') renderPractice();
  else if (state.view === 'index') renderIndex();
  else if (state.view === 'progress') renderProgress();
  if (state.view !== 'home') updateTopbar();
}

function updateTopbar() {
  const t = document.getElementById('topbar-title');
  const recBtn = document.getElementById('btn-recite');
  if (state.section === 'gita') {
    const m = GITA_META[state.chapter];
    t.textContent = m ? 'Ch.' + state.chapter + ' — ' + m.yoga : 'Bhagavad Gītā';
  } else if (state.section === 'rudram') {
    t.textContent = RUDRAM_META[state.chapter] || 'Śrī Rudram';
  } else {
    t.textContent = 'Viṣṇu Sahasranāmam';
  }
  // Show recite button only in practice view and when content available
  const hasContent = (state.section === 'gita' && GITA_DATA[state.chapter]?.length > 0) ||

function toggleRudramMenu(e) {
  e.stopPropagation();
  const sub = document.getElementById('rudram-submenu');
  const arrow = document.getElementById('rudram-arrow');
  const open = sub.classList.toggle('open');
  arrow.style.transform = open ? 'rotate(90deg)' : '';
  arrow.style.transition = 'transform 0.2s';
}

function openSection(sec, sub) {
  if (sec === 'gita') {
    state.section = 'gita';
    state.chapter = state.chapter && parseInt(state.chapter) <= 18 ? state.chapter : '1';
  } else if (sec === 'rudram') {
    state.section = 'rudram';
    state.chapter = state.chapter && parseInt(state.chapter) <= 11 ? state.chapter : '1';
  }
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  saveState();
  showView('index');
}

function navChapter(dir) {
  // For Gita: dhyana=0, chapters 1-18
  if (state.section === 'gita') {
    const cur = state.chapter === 'dhyana' ? 0 : parseInt(state.chapter);
    const next = cur + dir;
    if (next < 0 || next > 18) return;
    state.chapter = next === 0 ? 'dhyana' : String(next);
  } else {
    const ch = parseInt(state.chapter);
    const max = 11;
    const next = ch + dir;
    if (next < 1 || next > max) return;
    state.chapter = String(next);
  }
  state.expandedVerse = null;
  saveState();
  showView('practice');
}

function nextChapterFromBanner() {
  navChapter(1);
}

// ─────────────── PRACTICE VIEW ───────────────
function renderPractice() {
  const el = document.getElementById('view-practice');
  if (state.section === 'gita' && state.chapter === 'dhyana') renderDhyanaPractice(el);
  else if (state.section === 'gita') renderGitaPractice(el);
  else if (state.section === 'rudram') renderRudramPractice(el);
  else renderPlaceholder(el, 'Viṣṇu Sahasranāmam', 'Coming soon — 1000 names of Viṣṇu');
}

function renderDhyanaPractice(el) {
  let html = `
  <div class="chapter-nav">
    <button class="chapter-nav-btn" disabled>← Prev</button>
    <div class="chapter-nav-title">Dhyāna Śloka</div>

    <div class="chapter-num">Bhagavad Gītā · Dhyāna Śloka</div>

  </div>`;
  for (const s of DHYANA_DATA) {

    const isDone = done.has(key);

    const linesHtml = s.tlines.map((ln,i) => `<span class="vline">${esc(ln)}</span>${i < s.tlines.length-1 ? '<br>' : ''}`).join('');
    html += `<div class="verse-block${isDone?' done':''}${isExpanded?' expanded':''}" data-key="${key}" onclick="toggleVerse('${key}')">

    <div class="leb-sub">Continue to Chapter 1 · Arjuna Viṣāda Yoga</div>

function renderGitaPractice(el) {
  const ch = state.chapter;
  const chNum = parseInt(ch);
  const meta = GITA_META[ch];
  const verses = GITA_DATA[ch] || [];
  const hasPrev = true; // ch1 goes back to dhyana
  const hasNext = chNum < 18;
  const nextMeta = hasNext ? GITA_META[String(chNum+1)] : null;

  let html = `
  <div class="chapter-nav">
    <button class="chapter-nav-btn" onclick="navChapter(-1)" ${hasPrev ? '' : 'disabled'}>← Prev</button>
    <div class="chapter-nav-title">Ch.${chNum} of 18</div>
    <button class="chapter-nav-btn" onclick="navChapter(1)" ${hasNext ? '' : 'disabled'}>Next →</button>
  </div>
  <div class="chapter-header">
    <div class="chapter-num">Bhagavad Gītā · Chapter ${ch}</div>
    <h2>${meta?.yoga || 'Chapter ' + ch}</h2>
    <div class="subtitle">${meta?.subtitle || ''}</div>
  </div>`;

  let prevSpk = null;
  for (const v of verses) {
    const key = `gita_ch${ch}_v${v.n}`;
    const isDone = done.has(key);
    const isExpanded = state.expandedVerse === key;
    let spkHtml = '';
    if (v.spk && v.spk !== prevSpk) {
      const spkNames = { 'arjuna':'Arjuna','bhagavān':'Śrī Bhagavān','sañjaya':'Sañjaya','dhṛtarāṣṭra':'Dhṛtarāṣṭra' };
      spkHtml = `<span class="spk-tag">${spkNames[v.spk] || v.spk} uvāca</span>`;
      prevSpk = v.spk;
    }
    const linesHtml = v.tlines.map((ln,i) => `<span class="vline">${esc(ln)}</span>${i < v.tlines.length-1 ? '<br>' : ''}`).join('');
    const meaningHtml = v.meaning_en ? `<div class="verse-meaning">${esc(v.meaning_en)}</div>` : `<div class="verse-meaning empty"></div>`;
    html += `<div class="verse-block${isDone?' done':''}${isExpanded?' expanded':''}" data-key="${key}" onclick="toggleVerse('${key}')">
      <span class="verse-done-mark">✓</span>
      <div class="verse-text">${spkHtml}${linesHtml}<span class="verse-num">॥ ${v.n} ॥</span></div>
      ${meaningHtml}
    </div>`;
  }

  // Continuation banner
  if (hasNext && nextMeta) {
    html += `<div class="lesson-end-banner">
      <div class="leb-title">Chapter ${ch} Complete 🙏</div>
      <div class="leb-sub">Continue to Chapter ${chNum+1} · ${nextMeta.yoga}</div>

      <div class="leb-done">${nextMeta.subtitle} · ${nextMeta.count} verses</div>

  } else if (!hasNext) {
    html += `<div class="lesson-end-banner">
      <div class="leb-title">🙏 Bhagavad Gītā Complete</div>
      <div class="leb-sub">You have completed all 18 chapters</div>
      <button class="leb-next-btn" onclick="showView('home')">Return Home</button>
    </div>`;
  }

  el.innerHTML = html;
}

function toggleVerse(key) {

}

// ─────────────── RECITE MODE ───────────────
function buildReciteItems() {
  // Build flat list of items for recite mode
  // Each item is an object with lines[] to show
  const items = [];
  
  if (state.section === 'gita' && state.chapter === 'dhyana') {
    for (const s of DHYANA_DATA) {
      items.push({
        id: `gita_dhyana_${s.n}`,
        label: `Dhyānam · ${s.n}`,
        lines: s.tlines.slice(0, 4),
        n: s.n,
      });
    }
  } else if (state.section === 'gita') {
    const spkNames = { 'dhṛtarāṣṭra':'Dhṛtarāṣṭra','arjuna':'Arjuna','bhagavān':'Śrī Bhagavān','sañjaya':'Sañjaya' };
    let prevSpk = null;
    const verses = GITA_DATA[state.chapter] || [];
    for (const v of verses) {
      const allLines = [...v.tlines];
      // Attach speaker label only when it changes
      const spkLabel = (v.spk && v.spk !== prevSpk) ? (spkNames[v.spk] || v.spk) + ' uvāca' : null;
      if (v.spk) prevSpk = v.spk;
      items.push({
        id: `gita_ch${state.chapter}_v${v.n}`,
        label: `Ch.${state.chapter} · ${v.n}`,
        lines: allLines.slice(0, 4),
        spk: spkLabel,
        n: v.n,
      });
    };
  } else if (state.section === 'rudram') {
    const lines = RUDRAM_DATA[state.chapter] || [];
    // Group every 4 lines into a card
    for (let i = 0; i < lines.length; i += 4) {
      items.push({
        id: `rudram_an${state.chapter}_g${Math.floor(i/4)}`,
        label: RUDRAM_META[state.chapter],
        lines: lines.slice(i, i+4),
      });
    }
  }
  return items;
}

function startRecite() {
  const items = buildReciteItems();
  if (!items.length) return;
  
  state.reciting = true;
  state.reciteItems = items;
  state.reciteIdx = 0;
  
  // Start from first undone item if possible
  for (let i = 0; i < items.length; i++) {
    if (!done.has(items[i].id)) { state.reciteIdx = i; break; }
  }
  
  document.getElementById('recite-overlay').classList.add('active');
  renderRecite();
  
  // Keyboard support
  document.addEventListener('keydown', reciteKeyHandler);
}

function stopRecite() {
  state.reciting = false;
  document.getElementById('recite-overlay').classList.remove('active');
  // Reset end panel
  document.getElementById('recite-controls').style.display = '';
  document.getElementById('recite-end').style.display = 'none';
  document.removeEventListener('keydown', reciteKeyHandler);
  renderPractice();
  updateTopbar();
}

function reciteKeyHandler(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); reciteNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); recitePrev(); }
  else if (e.key === 'Escape') stopRecite();
}

function reciteNext() {
  if (state.reciteIdx < state.reciteItems.length - 1) {
    const item = state.reciteItems[state.reciteIdx];
    done.add(item.id);
    saveDone();
    state.reciteIdx++;
    renderRecite();
  } else {
    // Last item — show end panel
    const item = state.reciteItems[state.reciteIdx];
    done.add(item.id);
    saveDone();
    // Show end panel
    document.getElementById('recite-controls').style.display = 'none';
    const endEl = document.getElementById('recite-end');
    endEl.style.display = '';
    const chNum = parseInt(state.chapter);
    const max = (state.section === 'gita') ? 18 : 11;
    const hasNext = chNum < max;
    const btn = document.getElementById('recite-next-ch-btn');
    if (hasNext) {
      const nextLabel = state.section === 'gita'
        ? `Chapter ${chNum+1} · ${GITA_META[String(chNum+1)]?.yoga || ''}`
        : `${RUDRAM_META[String(chNum+1)] || 'Anuvaka '+(chNum+1)}`;
      document.getElementById('recite-end-label').textContent = 'Up next: ' + nextLabel;
      btn.textContent = state.section === 'gita' ? 'Next Chapter →' : 'Next Anuvaka →';
      btn.style.display = '';
    } else {
      document.getElementById('recite-end-label').textContent =
        state.section === 'gita' ? 'All 18 Chapters complete 🙏' : 'All 11 Anuvakas complete 🙏';
      btn.style.display = 'none';
    }
  }
}

function reciteNextChapter() {
  stopRecite();
  navChapter(1);
  // Auto-start recite for next chapter
  setTimeout(() => startRecite(), 100);
}

function recitePrev() {
  if (state.reciteIdx > 0) {
    state.reciteIdx--;
    renderRecite();
  }
}

function renderRecite() {
  const items = state.reciteItems;
  const idx = state.reciteIdx;
  const item = items[idx];
  if (!item) return;
  
  document.getElementById('recite-section-label').textContent = 
    state.section === 'gita' ? 'Bhagavad Gītā' : 'Śrī Rudram';
  document.getElementById('recite-verse-label').textContent = item.label || '';
  
  // Speaker tag (shown above lines when speaker changes)
  const linesEl = document.getElementById('recite-lines');
  const spkHtml = item.spk ? `<div class="recite-spk">${esc(item.spk)}</div>` : '';
  linesEl.innerHTML = spkHtml + item.lines.map(ln =>
    `<div class="recite-line">${esc(ln)}</div>`
  ).join('');
  
  // Dots
  const dotsEl = document.getElementById('recite-dots');
  dotsEl.innerHTML = items.map((it, i) => {
    const cls = i === idx ? 'cur' : (done.has(it.id) ? 'done' : '');
    return `<div class="recite-dot ${cls}"></div>`;
  }).join('');
}

// ─────────────── UTILITIES ───────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────── INIT ───────────────
function init() {
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === state.section));
  showView('home');
}

init();
</script>
