ణహరిరుద్రేశ్వరభృతః", "శివః స్వచ్ఛచ్ఛాయాఘటితకపటప్రచ్ఛదపటః ।", "త్వదీయానాం భాసాం ప్రతిఫలనరాగారుణతయా", "శరీరీ శృంగారో రస ఇవ దృశాం దోగ్ధి కుతుకమ్ ॥ 92 ॥"]}, {"n": 94, "tlines": ["అరాలా కేశేషు ప్రకృతిసరలా మందహసితే", "శిరీషాభా చిత్తే దృషదుపలశోభా కుచతటే ।", "భృశం తన్వీ మధ్యే పృథురురసిజారోహవిషయే", "జగత్త్రాతుం శంభోర్జయతి కరుణా కాచిదరుణా ॥ 93 ॥"]}, {"n": 95, "tlines": ["కలంకః కస్తూరీ రజనికరబింబం జలమయం", "కలాభిః కర్పూరైర్మరకతకరండం నిబిడితమ్ ।", "అతస్త్వద్భోగేన ప్రతిదినమిదం రిక్తకుహరం", "విధిర్భూయో భూయో నిబిడయతి నూనం తవ కృతే ॥ 94 ॥"]}, {"n": 96, "tlines": ["పురారాతేరంతఃపురమసి తతస్త్వచ్చరణయోః", "సపర్యామర్యాదా తరలకరణానామసులభా ।", "తథా హ్యేతే నీతాః శతమఖముఖాః సిద్ధిమతులాం", "తవ ద్వారోపాంతస్థితిభిరణిమాద్యాభిరమరాః ॥ 95 ॥"]}, {"n": 97, "tlines": ["కలత్రం వైధాత్రం కతికతి భజంతే న కవయః", "శ్రియో దేవ్యాః కో వా న భవతి పతిః కైరపి ధనైః ।", "మహాదేవం హిత్వా తవ సతి సతీనామచరమే", "కుచాభ్యామాసంగః కురవకతరోరప్యసులభః ॥ 96 ॥"]}, {"n": 98, "tlines": ["గిరామాహుర్దేవీం ద్రుహిణగృహిణీమాగమవిదో", "హరేః పత్నీం పద్మాం హరసహచరీమద్రితనయామ్ ।", "తురీయా కాపి త్వం దురధిగమనిఃసీమమహిమా", "మహామాయా విశ్వం భ్రమయసి పరబ్రహ్మమహిషి ॥ 97 ॥"]}, {"n": 99, "tlines": ["కదా కాలే మాతః కథయ కలితాలక్తకరసం", "పిబేయం విద్యార్థీ తవ చరణనిర్ణేజనజలమ్ ।", "ప్రకృత్యా మూకానామపి చ కవితాకారణతయా", "కదా ధత్తే వాణీముఖకమలతాంబూలరసతామ్ ॥ 98 ॥"]}, {"n": 100, "tlines": ["సరస్వత్యా లక్ష్మ్యా విధిహరిసపత్నో విహరతే", "రతేః పాతివ్రత్యం శిథిలయతి రమ్యేణ వపుషా ।", "చిరం జీవన్నేవ క్షపితపశుపాశవ్యతికరః", "పరానందాభిఖ్యం రసయతి రసం త్వద్భజనవాన్ ॥ 99 ॥"]}, {"n": 101, "tlines": ["ప్రదీపజ్వాలాభిర్దివసకరనీరాజనవిధిః", "సుధాసూతేశ్చంద్రోపలజలలవైరర్ఘ్యరచనా ।", "స్వకీయైరంభోభిః సలిలనిధిసౌహిత్యకరణం", "త్వదీయాభిర్వాగ్భిస్తవ జనని వాచాం స్తుతిరియమ్ ॥ 100 ॥"]}, {"n": 102, "tlines": ["సౌందర్యలహరీ ముఖ్యస్తోత్రం సంవార్తదాయకమ్ ।", "భగవత్పాద సంక్లృప్తం పఠే-న్ముక్తౌ భవే-న్నరః ॥"]}, {"n": 103, "tlines": ["॥ ఇతి శ్రీమత్పరమహంసపరివ్రాజకాచార్యస్య", "శ్రీగోవిందభగవత్పూజ్యపాదశిష్యస్య", "శ్రీమచ్ఛంకరభగవతః కృతౌ సౌందర్యలహరీ సంపూర్ణా ॥", "॥ ఓం తత్సత్ ॥"]}, {"n": 104, "tlines": ["(అనుబంధః)", "సమానీతః పద్భ్యాం మణిముకురతామంబరమణి-", "ర్భయాదాస్యాదంతఃస్తిమితకిరణశ్రేణిమసృణః ।", "(పాఠభేదః - భయాదాస్య స్నిగ్ధస్తిమిత, భయాదాస్యస్యాంతఃస్తిమిత)", "దధాతి త్వద్వక్త్రంప్రతిఫలనమశ్రాంతవికచం", "నిరాతంకం చంద్రాన్నిజహృదయపంకేరుహమివ ॥ 101 ॥"]}, {"n": 105, "tlines": ["సముద్భూతస్థూలస్తనభరమురశ్చారు హసితం", "కటాక్షే కందర్పః కతిచన కదంబద్యుతి వపుః ।", "హరస్య త్వద్భ్రాంతిం మనసి జనయంతి స్మ విమలాః", "పాఠభేదః - జనయామాస మదనో, జనయంతః సమతులాం, జనయంతా సువదనే", "భవత్యా యే భక్తాః పరిణతిరమీషామియముమే ॥ 102 ॥"]}, {"n": 106, "tlines": ["నిధే నిత్యస్మేరే నిరవధిగుణే నీతినిపుణే", "నిరాఘాతజ్ఞానే నియమపరచిత్తైకనిలయే ।", "నియత్యా నిర్ముక్తే నిఖిలనిగమాంతస్తుతిపదే", "నిరాతంకే నిత్యే నిగమయ మమాపి స్తుతిమిమామ్ ॥ 103 ॥"]}]},
 "durga-sapta-shloki": {"title": "Śrī Durgā Sapta Ślōkī", "titleTe": "శ్రీ దుర్గా సప్త శ్లోకీ", "sub": "Devī Māhātmyam · 7 ślokas", "unit": "verses", "verses": [{"n": 1, "tlines": ["śiva uvācha ।", "dēvī tvaṃ bhaktasulabhē sarvakāryavidhāyini ।", "kalau hi kāryasiddhyarthamupāyaṃ brūhi yatnataḥ ॥"], "label": "Śiva uvāca", "h": "Pūrvāṅgam", "hTe": "పూర్వాంగం"}, {"n": 2, "tlines": ["dēvyuvācha ।", "śṛṇu dēva pravakṣyāmi kalau sarvēṣṭasādhanam ।", "mayā tavaiva snēhēnāpyambāstutiḥ prakāśyatē ॥"], "label": "Devī uvāca"}, {"n": 3, "tlines": ["asya śrī durgā saptaślōkī stōtramantrasya nārāyaṇa ṛṣiḥ, anuṣṭup Chandaḥ, śrī mahākāḻī mahālakṣmī mahāsarasvatyō dēvatāḥ, śrī durgā prītyarthaṃ saptaślōkī durgāpāṭhē viniyōgaḥ ।"], "label": "Viniyōgaḥ"}, {"n": 4, "tlines": ["jñānināmapi chētāṃsi dēvī bhagavatī hi sā ।", "balādākṛṣya mōhāya mahāmāyā prayachChati ॥ 1 ॥"], "label": "Śloka 1", "h": "Sapta Ślōkī", "hTe": "సప్త శ్లోకీ"}, {"n": 5, "tlines": ["durgē smṛtā harasi bhītimaśēṣajantōḥ", "svasthaiḥ smṛtā matimatīva śubhāṃ dadāsi ।", "dāridryaduḥkha bhayahāriṇi kā tvadanyā", "sarvōpakārakaraṇāya sadārdra chittā ॥ 2 ॥"], "label": "Śloka 2"}, {"n": 6, "tlines": ["sarvamaṅgaḻamāṅgaḻyē śivē sarvārthasādhikē ।", "śaraṇyē tryambakē gaurī nārāyaṇi namō'stu tē ॥ 3 ॥"], "label": "Śloka 3"}, {"n": 7, "tlines": ["śaraṇāgatadīnārtaparitrāṇaparāyaṇē ।", "sarvasyārtiharē dēvi nārāyaṇi namō'stu tē ॥ 4 ॥"], "label": "Śloka 4"}, {"n": 8, "tlines": ["sarvasvarūpē sarvēśē sarvaśaktisamanvitē ।", "bhayēbhyastrāhi nō dēvi durgē dēvi namō'stu tē ॥ 5 ॥"], "label": "Śloka 5"}, {"n": 9, "tlines": ["rōgānaśēṣānapahaṃsi tuṣṭā-", "ruṣṭā tu kāmān sakalānabhīṣṭān ।", "tvāmāśritānāṃ na vipannarāṇāṃ", "tvāmāśritā hyāśrayatāṃ prayānti ॥ 6 ॥"], "label": "Śloka 6"}, {"n": 10, "tlines": ["sarvabādhāpraśamanaṃ trailōkyasyākhilēśvari ।", "ēvamēva tvayā kāryamasmadvairi vināśanam ॥ 7 ॥"], "label": "Śloka 7"}, {"n": 11, "tlines": ["iti śrī durgā saptaślōkī ।"], "label": "Samāpti"}], "te": [{"n": 1, "tlines": ["శివ ఉవాచ ।", "దేవీ త్వం భక్తసులభే సర్వకార్యవిధాయిని ।", "కలౌ హి కార్యసిద్ధ్యర్థముపాయం బ్రూహి యత్నతః ॥"]}, {"n": 2, "tlines": ["దేవ్యువాచ ।", "శృణు దేవ ప్రవక్ష్యామి కలౌ సర్వేష్టసాధనమ్ ।", "మయా తవైవ స్నేహేనాప్యంబాస్తుతిః ప్రకాశ్యతే ॥"]}, {"n": 3, "tlines": ["అస్య శ్రీ దుర్గా సప్తశ్లోకీ స్తోత్రమంత్రస్య నారాయణ ఋషిః, అనుష్టుప్ ఛందః, శ్రీ మహాకాళీ మహాలక్ష్మీ మహాసరస్వత్యో దేవతాః, శ్రీ దుర్గా ప్రీత్యర్థం సప్తశ్లోకీ దుర్గాపాఠే వినియోగః ।"]}, {"n": 4, "tlines": ["జ్ఞానినామపి చేతాంసి దేవీ భగవతీ హి సా ।", "బలాదాకృష్య మోహాయ మహామాయా ప్రయచ్ఛతి ॥ 1 ॥"]}, {"n": 5, "tlines": ["దుర్గే స్మృతా హరసి భీతిమశేషజంతోః", "స్వస్థైః స్మృతా మతిమతీవ శుభాం దదాసి ।", "దారిద్ర్యదుఃఖ భయహారిణి కా త్వదన్యా", "సర్వోపకారకరణాయ సదార్ద్ర చిత్తా ॥ 2 ॥"]}, {"n": 6, "tlines": ["సర్వమంగళమాంగళ్యే శివే సర్వార్థసాధికే ।", "శరణ్యే త్ర్యంబకే గౌరీ నారాయణి నమోఽస్తు తే ॥ 3 ॥"]}, {"n": 7, "tlines": ["శరణాగతదీనార్తపరిత్రాణపరాయణే ।", "సర్వస్యార్తిహరే దేవి నారాయణి నమోఽస్తు తే ॥ 4 ॥"]}, {"n": 8, "tlines": ["సర్వస్వరూపే సర్వేశే సర్వశక్తిసమన్వితే ।", "భయేభ్యస్త్రాహి నో దేవి దుర్గే దేవి నమోఽస్తు తే ॥ 5 ॥"]}, {"n": 9, "tlines": ["రోగానశేషానపహంసి తుష్టా-", "రుష్టా తు కామాన్ సకలానభీష్టాన్ ।", "త్వామాశ్రితానాం న విపన్నరాణాం", "త్వామాశ్రితా హ్యాశ్రయతాం ప్రయాంతి ॥ 6 ॥"]}, {"n": 10, "tlines": ["సర్వబాధాప్రశమనం త్రైలోక్యస్యాఖిలేశ్వరి ।", "ఏవమేవ త్వయా కార్యమస్మద్వైరి వినాశనమ్ ॥ 7 ॥"]}, {"n": 11, "tlines": ["ఇతి శ్రీ దుర్గా సప్తశ్లోకీ ।"]}]}
};

 15, "tlines": ["అంధస్య మే హృతవివేకమహాధనస్య చోరైర్మహాబలిభిరింద్రియనామధేయైః ।", "మోహాంధకారకుహరే వినిపాతితస్య లక్ష్మీనృసింహ మమ దేహి కరావలంబమ్ ॥ 15 ॥"]}, {"n": 16, "tlines": ["ప్రహ్లాదనారదపరాశరపుండరీక-వ్యాసాదిభాగవతపుంగవహృన్నివాస ।", "భక్తానురక్తపరిపాలనపారిజాత లక్ష్మీనృసింహ మమ దేహి కరావలంబమ్ ॥ 16 ॥"]}, {"n": 17, "tlines": ["లక్ష్మీనృసింహచరణాబ్జమధువ్రతేన స్తోత్రం కృతం శుభకరం భువి శంకరేణ ।", "యే తత్పఠంతి మనుజా హరిభక్తియుక్తా-స్తే యాంతి తత్పదసరోజమఖండరూపమ్ ॥ 17 ॥"]}]} };

ka 8"}, {"n": 11, "tlines": ["jānunī sētukṛt-pātu jaṅghē daśamukhāntakaḥ ।", "pādau vibhīṣaṇaśrīdaḥ pātu rāmō'khilaṃ vapuḥ ॥ 9 ॥"], "label": "Śloka 9"}, {"n": 12, "tlines": ["ētāṃ rāmabalōpētāṃ rakṣāṃ yaḥ sukṛtī paṭhēt ।", "sa chirāyuḥ sukhī putrī vijayī vinayī bhavēt ॥ 10 ॥"], "label": "Śloka 10"}, {"n": 13, "tlines": ["pātāḻa-bhūtala-vyōma-chāriṇa-śChadma-chāriṇaḥ ।", "na draṣṭumapi śaktāstē rakṣitaṃ rāmanāmabhiḥ ॥ 11 ॥"], "label": "Śloka 11"}, {"n": 14, "tlines": ["rāmēti rāmabhadrēti rāmachandrēti vā smaran ।", "narō na lipyatē pāpairbhuktiṃ muktiṃ cha vindati ॥ 12 ॥"], "label": "Śloka 12"}, {"n": 15, "tlines": ["jagajjaitraika mantrēṇa rāmanām-nābhirakṣitam ।", "yaḥ kaṇṭhē dhārayēttasya karasthāḥ sarvasiddhayaḥ ॥ 13 ॥"], "label": "Śloka 13"}, {"n": 16, "tlines": ["vajrapañjara nāmēdaṃ yō rāmakavachaṃ smarēt ।", "avyāhatājñaḥ sarvatra labhatē jayamaṅgaḻam ॥ 14 ॥"], "label": "Śloka 14"}, {"n": 17, "tlines": ["ādiṣṭavān-yathā svapnē rāmarakṣāmimāṃ haraḥ ।", "tathā likhitavān-prātaḥ prabuddhō budhakauśikaḥ ॥ 15 ॥"], "label": "Śloka 15"}, {"n": 18, "tlines": ["ārāmaḥ kalpavṛkṣāṇāṃ virāmaḥ sakalāpadām ।", "abhirāma-strilōkānāṃ rāmaḥ śrīmān sa naḥ prabhuḥ ॥ 16 ॥"], "label": "Śloka 16"}, {"n": 19, "tlines": ["taruṇau rūpasampannau sukumārau mahābalau ।", "puṇḍarīka viśālākṣau chīrakṛṣṇājināmbarau ॥ 17 ॥"], "label": "Śloka 17"}, {"n": 20, "tlines": ["phalamūlāśinau dāntau tāpasau brahmachāriṇau ।", "putrau daśarathasyaitau bhrātarau rāmalakṣmaṇau ॥ 18 ॥"], "label": "Śloka 18"}, {"n": 21, "tlines": ["śaraṇyau sarvasattvānāṃ śrēṣṭhau sarvadhanuṣmatām ।", "rakṣaḥkula nihantārau trāyētāṃ nō raghūttamau ॥ 19 ॥"], "label": "Śloka 19"}, {"n": 22, "tlines": ["ātta sajya dhanuṣā-viṣuspṛṣā-vakṣayāśuga niṣaṅga saṅginau ।", "rakṣaṇāya mama rāmalakṣmaṇāvagrataḥ pathi sadaiva gachChatām ॥ 20 ॥"], "label": "Śloka 20"}, {"n": 23, "tlines": ["sannaddhaḥ kavachī khaḍgī chāpabāṇadharō yuvā ।", "gachChan manōrathānnaścha (manōrathō'smākaṃ) rāmaḥ pātu sa lakṣmaṇaḥ ॥ 21 ॥"], "label": "Śloka 21"}, {"n": 24, "tlines": ["rāmō dāśarathi śśūrō lakṣmaṇānucharō balī ।", "kākutsthaḥ puruṣaḥ pūrṇaḥ kausalyēyō raghūttamaḥ ॥ 22 ॥"], "label": "Śloka 22"}, {"n": 25, "tlines": ["vēdāntavēdyō yajñēśaḥ purāṇapuruṣōttamaḥ ।", "jānakīvallabhaḥ śrīmā-napramēyaparākramaḥ ॥ 23 ॥"], "label": "Śloka 23"}, {"n": 26, "tlines": ["ityētāni japēnnityaṃ madbhaktaḥ śraddhayānvitaḥ ।", "aśvamēdhādhikaṃ puṇyaṃ samprāpnōti na saṃśayaḥ ॥ 24 ॥"], "label": "Śloka 24"}, {"n": 27, "tlines": ["rāmaṃ dūrvādaḻa śyāmaṃ padmākṣaṃ pītavāsasam ।", "stuvanti nāmabhi-rdivyairna tē saṃsāriṇō narāḥ ॥ 25 ॥"], "label": "Śloka 25"}, {"n": 28, "tlines": ["rāmaṃ lakṣmaṇa pūrvajaṃ raghuvaraṃ sītāpatiṃ sundaram", "kākutsthaṃ karuṇārṇavaṃ guṇanidhiṃ viprapriyaṃ dhārmikam ।", "rājēndraṃ satyasandhaṃ daśarathatanayaṃ śyāmalaṃ śāntamūrtim", "vandē lōkābhirāmaṃ raghukula tilakaṃ rāghavaṃ rāvaṇārim ॥ 26 ॥"], "label": "Śloka 26"}, {"n": 29, "tlines": ["rāmāya rāmabhadrāya rāmachandrāya vēdhasē ।", "raghunāthāya nāthāya sītāyāḥ patayē namaḥ ॥ 27 ॥"], "label": "Śloka 27"}, {"n": 30, "tlines": ["śrīrāma rāma raghunandana rāma rāma", "śrīrāma rāma bharatāgraja rāma rāma ।", "śrīrāma rāma raṇakarkaśa rāma rāma", "śrīrāma rāma śaraṇaṃ bhava rāma rāma ॥ 28 ॥"], "label": "Śloka 28"}, {"n": 31, "tlines": ["śrīrāma chandra charaṇau manasā smarāmi", "śrīrāma chandra charaṇau vachasā gṛhṇāmi । [gṛṇāmi]", "śrīrāma chandra charaṇau śirasā namāmi", "śrīrāma chandra charaṇau śaraṇaṃ prapadyē ॥ 29 ॥"], "label": "Śloka 29"}, {"n": 32, "tlines": ["mātā rāmō mat-pitā rāmachandraḥ", "svāmī rāmō mat-sakhā rāmachandraḥ ।", "sarvasvaṃ mē rāmachandrō dayāḻuḥ", "nānyaṃ jānē naiva jānē na jānē ॥ 30 ॥"], "label": "Śloka 30"}, {"n": 33, "tlines": ["dakṣiṇē lakṣmaṇō yasya vāmē cha (tu) janakātmajā ।", "puratō mārutiryasya taṃ vandē raghunandanam ॥ 31 ॥"], "label": "Śloka 31"}, {"n": 34, "tlines": ["lōkābhirāmaṃ raṇaraṅgadhīraṃ", "rājīvanētraṃ raghuvaṃśanātham ।", "kāruṇyarūpaṃ karuṇākaraṃ taṃ", "śrīrāmachandraṃ śaraṇaṃ prapadyē ॥ 32 ॥"], "label": "Śloka 32"}, {"n": 35, "tlines": ["manōjavaṃ māruta tulya vēgaṃ", "jitēndriyaṃ buddhimatāṃ variṣṭham ।", "vātātmajaṃ vānarayūtha mukhyaṃ", "śrīrāmadūtaṃ śaraṇaṃ prapadyē ॥ 33 ॥"], "label": "Śloka 33"}, {"n": 36, "tlines": ["kūjantaṃ rāmarāmēti madhuraṃ madhurākṣaram ।", "āruhya kavitāśākhāṃ vandē vālmīki kōkilam ॥ 34 ॥"], "label": "Śloka 34"}, {"n": 37, "tlines": ["āpadāmapahartāraṃ dātāraṃ sarvasampadām ।", "lōkābhirāmaṃ śrīrāmaṃ bhūyōbhūyō namāmyaham ॥ 35 ॥"], "label": "Śloka 35"}, {"n": 38, "tlines": ["bharjanaṃ bhavabījānāmarjanaṃ sukhasampadām ।", "tarjanaṃ yamadūtānāṃ rāma rāmēti garjanam ॥ 36 ॥"], "label": "Śloka 36"}, {"n": 39, "tlines": ["rāmō rājamaṇiḥ sadā vijayatē rāmaṃ ramēśaṃ bhajē", "rāmēṇābhihatā niśācharachamū rāmāya tasmai namaḥ ।", "rāmānnāsti parāyaṇaṃ parataraṃ rāmasya dāsō'smyahaṃ", "rāmē chittalayaḥ sadā bhavatu mē bhō rāma māmuddhara ॥ 37 ॥"], "label": "Śloka 37"}, {"n": 40, "tlines": ["śrīrāma rāma rāmēti ramē rāmē manōramē ।", "sahasranāma tattulyaṃ rāma nāma varānanē ॥ 38 ॥"], "label": "Śloka 38"}, {"n": 41, "tlines": ["iti śrībudhakauśikamuni virachitaṃ śrīrāma rakṣāstōtraṃ sampūrṇam ।", "śrīrāma jayarāma jayajayarāma ।"], "label": "Samāpti"}], "te": [{"n": 1, "tlines": ["ఓం అస్య శ్రీ రామరక్షా స్తోత్రమంత్రస్య", "బుధకౌశిక ఋషిః", "శ్రీ సీతారామ చంద్రోదేవతా", "అనుష్టుప్ ఛందః", "సీతా శక్తిః", "శ్రీమద్ హనుమాన్ కీలకం", "శ్రీరామచంద్ర ప్రీత్యర్థే రామరక్షా స్తోత్రజపే వినియోగః ॥"]}, {"n": 2, "tlines": ["ధ్యాయేదాజానుబాహుం ధృతశర ధనుషం బద్ధ పద్మాసనస్థం", "పీతం వాసోవసానం నవకమల దళస్పర్ధి నేత్రం ప్రసన్నమ్ ।", "వామాంకారూఢ సీతాముఖ కమలమిలల్లోచనం నీరదాభం", "నానాలంకార దీప్తం దధతమురు జటామండలం రామచంద్రమ్ ॥"]}, {"n": 3, "tlines": ["చరితం రఘునాథస్య శతకోటి ప్రవిస్తరమ్ ।", "ఏకైకమక్షరం పుంసాం మహాపాతక నాశనమ్ ॥ 1 ॥"]}, {"n": 4, "tlines": ["ధ్యాత్వా నీలోత్పల శ్యామం రామం రాజీవలోచనమ్ ।", "జానకీ లక్ష్మణోపేతం జటాముకుట మండితమ్ ॥ 2 ॥"]}, {"n": 5, "tlines": ["సాసితూణ ధనుర్బాణ పాణిం నక్తం చరాంతకమ్ ।", "స్వలీలయా జగత్త్రాతు-మావిర్భూత-మజం విభుమ్ ॥ 3 ॥"]}, {"n": 6, "tlines": ["రామరక్షాం పఠేత్ప్రాజ్ఞః పాపఘ్నీం సర్వకామదామ్ ।", "శిరో మే రాఘవః పాతు ఫాలం (భాలం) దశరథాత్మజః ॥ 4 ॥"]}, {"n": 7, "tlines": ["కౌసల్యేయో దృశౌపాతు విశ్వామిత్రప్రియః శ్రుతీ ।", "ఘ్రాణం పాతు మఖత్రాతా ముఖం సౌమిత్రివత్సలః ॥ 5 ॥"]}, {"n": 8, "tlines": ["జిహ్వాం విద్యానిధిః పాతు కంఠం భరతవందితః ।", "స్కంధౌ దివ్యాయుధః పాతు భుజౌ భగ్నేశకార్ముకః ॥ 6 ॥"]}, {"n": 9, "tlines": ["కరౌ సీతాపతిః పాతు హృదయం జామదగ్న్యజిత్ ।", "మధ్యం పాతు ఖరధ్వంసీ నాభిం జాంబవదాశ్రయః ॥ 7 ॥"]}, {"n": 10, "tlines": ["సుగ్రీవేశః కటిం పాతు సక్థినీ హనుమత్-ప్రభుః ।", "ఊరూ రఘూత్తమః పాతు రక్షఃకుల వినాశకృత్ ॥ 8 ॥"]}, {"n": 11, "tlines": ["జానునీ సేతుకృత్-పాతు జంఘే దశముఖాంతకః ।", "పాదౌ విభీషణశ్రీదః పాతు రామోఽఖిలం వపుః ॥ 9 ॥"]}, {"n": 12, "tlines": ["ఏతాం రామబలోపేతాం రక్షాం యః సుకృతీ పఠేత్ ।", "స చిరాయుః సుఖీ పుత్రీ విజయీ వినయీ భవేత్ ॥ 10 ॥"]}, {"n": 13, "tlines": ["పాతాళ-భూతల-వ్యోమ-చారిణ-శ్ఛద్మ-చారిణః ।", "న ద్రష్టుమపి శక్తాస్తే రక్షితం రామనామభిః ॥ 11 ॥"]}, {"n": 14, "tlines": ["రామేతి రామభద్రేతి రామచంద్రేతి వా స్మరన్ ।", "నరో న లిప్యతే పాపైర్భుక్తిం ముక్తిం చ విందతి ॥ 12 ॥"]}, {"n": 15, "tlines": ["జగజ్జైత్రైక మంత్రేణ రామనాం-నాభిరక్షితమ్ ।", "యః కంఠే ధారయేత్తస్య కరస్థాః సర్వసిద్ధయః ॥ 13 ॥"]}, {"n": 16, "tlines": ["వజ్రపంజర నామేదం యో రామకవచం స్మరేత్ ।", "అవ్యాహతాజ్ఞః సర్వత్ర లభతే జయమంగళమ్ ॥ 14 ॥"]}, {"n": 17, "tlines": ["ఆదిష్టవాన్-యథా స్వప్నే రామరక్షామిమాం హరః ।", "తథా లిఖితవాన్-ప్రాతః ప్రబుద్ధో బుధకౌశికః ॥ 15 ॥"]}, {"n": 18, "tlines": ["ఆరామః కల్పవృక్షాణాం విరామః సకలాపదామ్ ।", "అభిరామ-స్త్రిలోకానాం రామః శ్రీమాన్ స నః ప్రభుః ॥ 16 ॥"]}, {"n": 19, "tlines": ["తరుణౌ రూపసంపన్నౌ సుకుమారౌ మహాబలౌ ।", "పుండరీక విశాలాక్షౌ చీరకృష్ణాజినాంబరౌ ॥ 17 ॥"]}, {"n": 20, "tlines": ["ఫలమూలాశినౌ దాంతౌ తాపసౌ బ్రహ్మచారిణౌ ।", "పుత్రౌ దశరథస్యైతౌ భ్రాతరౌ రామలక్ష్మణౌ ॥ 18 ॥"]}, {"n": 21, "tlines": ["శరణ్యౌ సర్వసత్త్వానాం శ్రేష్ఠౌ సర్వధనుష్మతామ్ ।", "రక్షఃకుల నిహంతారౌ త్రాయేతాం నో రఘూత్తమౌ ॥ 19 ॥"]}, {"n": 22, "tlines": ["ఆత్త సజ్య ధనుషా-విషుస్పృషా-వక్షయాశుగ నిషంగ సంగినౌ ।", "రక్షణాయ మమ రామలక్ష్మణావగ్రతః పథి సదైవ గచ్ఛతామ్ ॥ 20 ॥"]}, {"n": 23, "tlines": ["సన్నద్ధః కవచీ ఖడ్గీ చాపబాణధరో యువా ।", "గచ్ఛన్ మనోరథాన్నశ్చ (మనోరథోఽస్మాకం) రామః పాతు స లక్ష్మణః ॥ 21 ॥"]}, {"n": 24, "tlines": ["రామో దాశరథి శ్శూరో లక్ష్మణానుచరో బలీ ।", "కాకుత్స్థః పురుషః పూర్ణః కౌసల్యేయో రఘూత్తమః ॥ 22 ॥"]}, {"n": 25, "tlines": ["వేదాంతవేద్యో యజ్ఞేశః పురాణపురుషోత్తమః ।", "జానకీవల్లభః శ్రీమా-నప్రమేయపరాక్రమః ॥ 23 ॥"]}, {"n": 26, "tlines": ["ఇత్యేతాని జపేన్నిత్యం మద్భక్తః శ్రద్ధయాన్వితః ।", "అశ్వమేధాధికం పుణ్యం సంప్రాప్నోతి న సంశయః ॥ 24 ॥"]}, {"n": 27, "tlines": ["రామం దూర్వాదళ శ్యామం పద్మాక్షం పీతవాససమ్ ।", "స్తువంతి నామభి-ర్దివ్యైర్న తే సంసారిణో నరాః ॥ 25 ॥"]}, {"n": 28, "tlines": ["రామం లక్ష్మణ పూర్వజం రఘువరం సీతాపతిం సుందరం", "కాకుత్స్థం కరుణార్ణవం గుణనిధిం విప్రప్రియం ధార్మికమ్ ।", "రాజేంద్రం సత్యసంధం దశరథతనయం శ్యామలం శాంతమూర్తిం", "వందే లోకాభిరామం రఘుకుల తిలకం రాఘవం రావణారిమ్ ॥ 26 ॥"]}, {"n": 29, "tlines": ["రామాయ రామభద్రాయ రామచంద్రాయ వేధసే ।", "రఘునాథాయ నాథాయ సీతాయాః పతయే నమః ॥ 27 ॥"]}, {"n": 30, "tlines": ["శ్రీరామ రామ రఘునందన రామ రామ", "శ్రీరామ రామ భరతాగ్రజ రామ రామ ।", "శ్రీరామ రామ రణకర్కశ రామ రామ", "శ్రీరామ రామ శరణం భవ రామ రామ ॥ 28 ॥"]}, {"n": 31, "tlines": ["శ్రీరామ చంద్ర చరణౌ మనసా స్మరామి", "శ్రీరామ చంద్ర చరణౌ వచసా గృహ్ణామి । [గృణామి]", "శ్రీరామ చంద్ర చరణౌ శిరసా నమామి", "శ్రీరామ చంద్ర చరణౌ శరణం ప్రపద్యే ॥ 29 ॥"]}, {"n": 32, "tlines": ["మాతా రామో మత్-పితా రామచంద్రః", "స్వామీ రామో మత్-సఖా రామచంద్రః ।", "సర్వస్వం మే రామచంద్రో దయాళుః", "నాన్యం జానే నైవ జానే న జానే ॥ 30 ॥"]}, {"n": 33, "tlines": ["దక్షిణే లక్ష్మణో యస్య వామే చ (తు) జనకాత్మజా ।", "పురతో మారుతిర్యస్య తం వందే రఘునందనమ్ ॥ 31 ॥"]}, {"n": 34, "tlines": ["లోకాభిరామం రణరంగధీరం", "రాజీవనేత్రం రఘువంశనాథమ్ ।", "కారుణ్యరూపం కరుణాకరం తం", "శ్రీరామచంద్రం శరణం ప్రపద్యే ॥ 32 ॥"]}, {"n": 35, "tlines": ["మనోజవం మారుత తుల్య వేగం", "జితేంద్రియం బుద్ధిమతాం వరిష్ఠమ్ ।", "వాతాత్మజం వానరయూథ ముఖ్యం", "శ్రీరామదూతం శరణం ప్రపద్యే ॥ 33 ॥"]}, {"n": 36, "tlines": ["కూజంతం రామరామేతి మధురం మధురాక్షరమ్ ।", "ఆరుహ్య కవితాశాఖాం వందే వాల్మీకి కోకిలమ్ ॥ 34 ॥"]}, {"n": 37, "tlines": ["ఆపదామపహర్తారం దాతారం స // ─────────────── SECTIONS ───────────────
function switchSection(sec) {
  state.section = sec;
  state.expandedVerse = null;
  if (sec === 'gita') state.chapter = state.chapter || '12';
  else if (sec === 'rudram') {
    state.chapter = '1';
    state.rudramPart = null;   // always ask: Namakam or Chamakam
    document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
    saveState();
    showView('practice');
    return;
  }
  else if (sec === 'vsn') {
    state.chapter = 'preamble';
    document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
    saveState();
    showView('practice');
    return;
  }
  else if (COLLS[sec]) {
    state.chapter = null;      // no song picked yet — show the song index
    document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
    saveState();
    showView('index');
    return;
  }
  else if (sec === 'hc') {
    state.chapter = 'doha1';
    document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
    saveState();
    showView('practice');
    return;
  }
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  saveState();
  showView('index');
}

// ─────────────── VIEW SWITCHING ───────────────
function showView(v) {
  state.view = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  const bn = document.getElementById('bnav-' + v);
  if (bn) bn.classList.add('active');
  // Show/hide chrome based on view
  const isHome = (v === 'home');
  const isLibrary = (v === 'library');
  document.getElementById('topbar').style.display = (isHome || isLibrary) ? 'none' : '';
  document.getElementById('bottomnav').style.display = (isHome || isLibrary) ? 'none' : '';
  // Lock scroll on the home screen only; the library of texts scrolls as it grows
  const mainEl = document.getElementById('main');
  if (isHome) {
    mainEl.classList.add('no-scroll');
  } else {
    mainEl.classList.remove('no-scroll');
    mainEl.scrollTop = 0;
  }
  navDepth++;
  try { renderCurrentView(); } finally { navDepth--; }
  navRecord();
}

// ─────────────── BACK NAVIGATION (history + swipe right) ───────────────
// Every page change is recorded in the browser history, so Safari's own back
// gesture and a left-to-right swipe anywhere on the page both go back a page.
let navDepth = 0, navRestoring = false;
function navSnapshot(idx) {
  return { app: 'vedasaram', idx, view: state.view, section: state.section,
           chapter: state.chapter, rudramPart: state.rudramPart || null, kids: state.kids || '' };
}
function navSame(a, b) {
  return a && b && a.view === b.view && a.section === b.section && a.chapter === b.chapter && a.rudramPart === b.rudramPart
    && (a.kids || '') === (b.kids || '');
}
function navRecord() {
  if (navDepth > 0) return;                       // inner redirects: record only the final page
  const cur = history.state && history.state.app === 'vedasaram' ? history.state : null;
  try {
    if (!cur || navRestoring) history.replaceState(navSnapshot(cur ? cur.idx : 0), '');
    else if (!navSame(cur, navSnapshot(cur.idx))) history.pushState(navSnapshot(cur.idx + 1), '');
  } catch (e) {}
}
window.addEventListener('popstate', e => {
  const s = e.state;
  if (!s || s.app !== 'vedasaram') return;
  if (state.reciting) stopRecite();
  state.section = s.section; state.chapter = s.chapter; state.rudramPart = s.rudramPart; state.expandedVerse = null;
  state.kids = s.kids || '';
  saveState();
  navRestoring = true;
  try {
    const plain = (s.view === 'home' || s.view === 'library');
    showViewWithTransition(s.view, plain ? null : -1);
  } finally { navRestoring = false; }
});
function goBack() {
  if (state.view === 'home') return;
  const cur = history.state;
  if (cur && cur.app === 'vedasaram' && cur.idx > 0) history.back();
  else showView('home');                          // nothing earlier in the app: go home instead of leaving it
}
(function swipeBack() {
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  let x0 = null, y0 = 0, t0 = 0, blocked = false;
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { x0 = null; return; }
    const t = e.touches[0];
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    blocked = state.reciting
      || (!standalone && x0 < 24)                 // in Safari the screen edge belongs to Safari's own back swipe
      || !!(e.target.closest && e.target.closest('.section-tabs, input, select, textarea, [data-noswipe]'));
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (x0 === null || blocked) { x0 = null; return; }
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    x0 = null;
    if (dx > 80 && Math.abs(dy) < dx * 0.5 && dt < 800) goBack();
  }, { passive: true });
})();

function renderCurrentView() {
  if (state.view === 'home') renderHome();
  else if (state.view === 'library') renderLibrary();
  else if (state.view === 'practice') renderPractice();
  else if (state.view === 'index') renderIndex();
  else if (state.view === 'progress') renderProgress();
  else if (state.view === 'settings') renderSettings();
  else if (state.view === 'panch') renderPanch();
  else if (state.view === 'kids') renderKids();
  else if (state.view === 'telugu') renderTelugu();
  else if (state.view === 'stories') renderStories();
  else if (state.view === 'ramayana') { if (window.renderRamayana) renderRamayana(); }
  else if (state.view === 'rmyread') { if (window.renderRmyRead) renderRmyRead(); }
  if (state.view !== 'home' && state.view !== 'library') updateTopbar();
}

function updateTopbar() {
  const t = document.getElementById('topbar-title');
  const recBtn = document.getElementById('btn-recite');
  const VIEW_TAB = { panch: 'panch', kids: 'kids', telugu: 'kids', stories: 'kids', ramayana: 'ramayana', rmyread: 'ramayana' };
  const activeSec = VIEW_TAB[state.view] || state.section;
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === activeSec));
  if (VIEW_TAB[state.view]) {
    t.textContent = state.view === 'panch' ? 'Panchāṅgam' : VIEW_TAB[state.view] === 'ramayana' ? 'Śrī Rāmāyaṇa' : 'Kids Corner';
    recBtn.style.display = 'none';
    const tabs = document.getElementById('section-tabs'), act = tabs.querySelector('.stab.active');
    if (act) tabs.scrollLeft = Math.max(0, act.offsetLeft - tabs.offsetLeft - (tabs.clientWidth - act.offsetWidth) / 2);
    return;
  }
  if (state.section === 'gita') {
    const m = GITA_META[state.chapter];
    t.textContent = m ? 'Ch.' + state.chapter + ' — ' + m.yoga : 'Bhagavad Gītā';
  } else if (state.section === 'rudram') {
    t.textContent = state.rudramPart === 'namakam' ? 'Namakam' : state.rudramPart === 'chamakam' ? 'Chamakam' : 'Śrī Rudram';
  } else if (coll()) {
    t.textContent = coll().data[state.chapter]?.title || coll().name;
  } else if (state.section === 'hc') {
    t.textContent = 'Hanumān Chālīsā';
  } else {
    t.textContent = 'Viṣṇu Sahasranāmam';
  }
  // Show recite button only in practice view and when content available
  const hasContent = (state.section === 'gita' && GITA_DATA[state.chapter]?.length > 0) ||
                     (state.section === 'rudram' && !!state.rudramPart && RUDRAM_DATA[state.chapter]?.length > 0) ||
                     (state.section === 'vsn' && VSN_DATA[state.chapter]?.length > 0) ||
                     (state.section === 'hc' && HC_DATA[state.chapter]?.length > 0) ||
                     (!!coll() && coll().data[state.chapter]?.verses.length > 0);
  recBtn.style.display = (state.view === 'practice' && hasContent) ? '' : 'none';
  // Keep the active section tab visible when the tab row scrolls
  const tabs = document.getElementById('section-tabs');
  const act = tabs && tabs.querySelector('.stab.active');
  if (act) tabs.scrollLeft = Math.max(0, act.offsetLeft - tabs.offsetLeft - (tabs.clientWidth - act.offsetWidth) / 2);
}

// ─────────────── ARRANGE LIBRARY TILES ───────────────
// Order and hidden tiles are kept in settings (this phone only).
let libArrange = false, LIB_TILES = [];
function libOrdered(texts) {
  const order = settings.tileOrder || [];
  const pos = k => { const i = order.indexOf(k); return i < 0 ? 1000 + texts.findIndex(t => t.key === k) : i; };
  return texts.slice().sort((a, b) => pos(a.key) - pos(b.key));
}
function setArrange(on) {
  libArrange = on;
  renderLibrary();
}
function renderArrange(el, ordered) {
  const hidden = settings.tileHidden || [];
  const rows = ordered.map((t, i) => {
    const off = hidden.includes(t.key);
    return `<div class="arr-row${off ? ' off' : ''}" data-key="${t.key}">
      <span class="arr-handle" title="Drag">☰</span>
      <span class="arr-dot" style="background:${t.gradient}">${t.icon}</span>
      <div class="arr-name">${t.name}${off ? '<small>Hidden</small>' : ''}</div>
      <button class="arr-btn" ${i === 0 ? 'disabled' : ''} onclick="arrMove('${t.key}',-1)" title="Move up">▲</button>
      <button class="arr-btn" ${i === ordered.length - 1 ? 'disabled' : ''} onclick="arrMove('${t.key}',1)" title="Move down">▼</button>
      <button class="arr-btn arr-eye" onclick="arrHide('${t.key}')" title="${off ? 'Show' : 'Hide'}">${off ? '🙈' : '👁'}</button>
    </div>`;
  }).join('');
  el.innerHTML = `
  <div class="lib-header">
    <button class="lib-back-btn" onclick="setArrange(false)" title="Done">‹</button>
    <div class="lib-header-title">Arrange Tiles</div>
    <button class="arr-done" onclick="setArrange(false)">Done</button>
  </div>
  <div class="lib-content">
    <div class="arr-help">Drag ☰ or use ▲ ▼ to reorder. 👁 hides a tile. Saved on this phone.</div>
    <div class="arr-list" id="arr-list" data-noswipe>${rows}</div>
    <button class="arr-reset" onclick="arrReset()">Reset to default</button>
  </div>`;
  arrDragInit(document.getElementById('arr-list'));
}
function arrKeys() { return libOrdered(LIB_TILES).map(t => t.key); }
function arrMove(key, dir) {
  const k = arrKeys(), i = k.indexOf(key), j = i + dir;
  if (i < 0 || j < 0 || j >= k.length) return;
  [k[i], k[j]] = [k[j], k[i]];
  settings.tileOrder = k; saveSettings(); renderLibrary();
}
function arrHide(key) {
  const h = new Set(settings.tileHidden || []);
  h.has(key) ? h.delete(key) : h.add(key);
  settings.tileHidden = [...h]; saveSettings(); renderLibrary();
}
function arrReset() {
  if (!confirm('Put all tiles back in the original order and show them all?')) return;
  settings.tileOrder = []; settings.tileHidden = []; saveSettings(); renderLibrary();
}
function arrDragInit(list) {
  let row = null, grab = 0, ptr = null;
  list.querySelectorAll('.arr-handle').forEach(h => h.addEventListener('pointerdown', e => {
    row = h.closest('.arr-row'); ptr = e.pointerId;
    grab = e.clientY - row.getBoundingClientRect().top;
    h.setPointerCapture(ptr); row.classList.add('drag'); e.preventDefault();
  }));
  list.addEventListener('pointermove', e => {
    if (!row || e.pointerId !== ptr) return;
    row.style.transform = '';
    let before = null;
    for (const r of list.querySelectorAll('.arr-row')) {
      if (r === row) continue;
      const b = r.getBoundingClientRect();
      if (e.clientY < b.top + b.height / 2) { before = r; break; }
    }
    if (before !== row.nextElementSibling) list.insertBefore(row, before);
    row.style.transform = `translateY(${e.clientY - grab - row.getBoundingClientRect().top}px)`;
  });
  const end = e => {
    if (!row || e.pointerId !== ptr) return;
    row.classList.remove('drag'); row.style.transform = ''; row = null;
    settings.tileOrder = [...list.querySelectorAll('.arr-row')].map(r => r.dataset.key);
    saveSettings(); renderLibrary();
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
}

function navChapter(dir) {
  // For Gita: dhyana=0, chapters 1-18
  if (state.section === 'gita') {
    const cur = state.chapter === 'dhyana' ? 0 : parseInt(state.chapter);
    const next = cur + dir;
    if (next < 0 || next > 18) return;
    state.chapter = next === 0 ? 'dhyana' : String(next);
  } else if (state.section === 'rudram') {
    const ch = parseInt(state.chapter);
    const max = 11;
    const next = ch + dir;
    if (next < 1 || next > max) return;
    state.chapter = String(next);
  } else if (state.section === 'vsn') {
    const idx = VSN_SECTIONS_ORDER.indexOf(state.chapter);
    const next = idx + dir;
    if (next < 0 || next >= VSN_SECTIONS_ORDER.length) return;
    state.chapter = VSN_SECTIONS_ORDER[next];
  } else if (coll()) {
    const order = coll().order;
    const next = order.indexOf(state.chapter) + dir;
    if (next < 0 || next >= order.length) return;
    state.chapter = order[next];
  }
  state.expandedVerse = null;
  saveState();
  showViewWithTransition('practice', dir > 0 ? 'next' : 'prev');
}

function nextChapterFromBanner() {
  navChapter(1);
}

function goVSNSection(sec) {
  const curIdx = VSN_SECTIONS_ORDER.indexOf(state.chapter);
  const newIdx = VSN_SECTIONS_ORDER.indexOf(sec);
  const dir = newIdx >= curIdx ? 1 : -1;
  state.chapter = sec;
  state.expandedVerse = null;
  saveState();
  showViewWithTransition('practice', dir);
}

function showViewWithTransition(v, dir) {
  // dir: 'next'/1 (→), 'prev'/-1 (←), or falsy = no animation
  const el = document.getElementById('view-' + v);
  if (!dir || !el) { showView(v); return; }
  const isForward = (dir === 'next' || dir > 0);
  // Perform state change + render
  state.view = v;
  document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  const bn = document.getElementById('bnav-' + v);
  if (bn) bn.classList.add('active');
  const isHome = (v === 'home');
  const isLibrary2 = (v === 'library');
  document.getElementById('topbar').style.display = (isHome || isLibrary2) ? 'none' : '';
  document.getElementById('bottomnav').style.display = (isHome || isLibrary2) ? 'none' : '';
  navDepth++;
  try { renderCurrentView(); } finally { navDepth--; }
  navRecord();
  // Scroll to top, then animate
  const main = document.getElementById('main');
  main.scrollTop = 0;
  const cls = isForward ? 'chapter-enter-next' : 'chapter-enter-prev';
  el.classList.remove('chapter-enter-next', 'chapter-enter-prev');
  // Force reflow so animation restarts cleanly
  void el.offsetWidth;
  el.classList.add(cls);
  el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
}

// Telugu lines for a song verse, or null if the song has no Telugu text
function songTeLines(song, n) {
  const t = (song.te || []).find(x => x.n === n);
  return (t && t.tlines.length) ? t.tlines : null;
}

function renderSongPractice(el) {
  const C = coll();
  const song = C.data[state.chapter];
  if (!song) { showView('index'); return; }   // nothing picked — go to the index
  const idx = C.order.indexOf(state.chapter);
  const hasPrev = idx > 0, hasNext = idx < C.order.length - 1;
  let html = `
  <div class="chapter-nav">
    <button class="chapter-nav-btn" ${hasPrev ? `onclick="navChapter(-1)"` : 'disabled'}>← Prev</button>
    <div class="chapter-nav-title" style="cursor:pointer" onclick="showView('index')">${C.all}</div>
    <button class="chapter-nav-btn" ${hasNext ? `onclick="navChapter(1)"` : 'disabled'}>Next →</button>
  </div>
  <div class="chapter-header">
    <div class="chapter-num">${C.name}</div>
    <h2>${esc(settings.language === 'te' && song.titleTe ? song.titleTe : song.title)}</h2>
    ${song.sub ? `<div class="subtitle">${esc(song.sub)}</div>` : ''}
  </div>`;
  for (const v of song.verses) {
    const key = `${state.section}_${state.chapter}_${v.n}`;
    if (v.h) html += `<div class="coll-head">${esc(settings.language === 'te' && v.hTe ? v.hTe : v.h)}</div>`;
    const isDone = done.has(key);
    const isExpanded = state.expandedVerse === key;
    const te = songTeLines(song, v.n);
    // If the song has no Telugu text, always show the English lines
    const showEn = settings.language !== 'te' || !te;
    const showTe = settings.language !== 'en' && te;
    let linesHtml = '';
    if (showEn) {
      linesHtml = v.tlines.map((ln, i) => {
        const teLn = (showTe && te[i]) ? `<span class="vline-te">${esc(te[i].replace(/[॥|]\s*\d+\s*[॥|]\s*$/, '').trimEnd())}</span>` : '';
        const br = (i < v.tlines.length - 1 && !teLn) ? '<br>' : '';
        return `<span class="vline">${esc(ln)}</span>` + teLn + br;
      }).join('');
      if (showTe) linesHtml += te.slice(v.tlines.length).map(t => `<span class="vline-te">${esc(t)}</span>`).join('');
    } else {
      linesHtml = te.map(t => `<span class="vline-te">${esc(t)}</span>`).join('');
    }
    html += `<div class="verse-block${isDone?' done':''}${isExpanded?' expanded':''}" data-key="${key}" onclick="toggleVerse('${key}')">
      <span class="verse-done-mark">✓</span>
      <div class="verse-text">${linesHtml}</div>
    </div>`;
  }
  el.innerHTML = html;
}

function renderGitaPractice(el) {
  const ch = state.chapter;
  const chNum = parseInt(ch);
  const meta = GITA_META[ch];
  const verses = GITA_DATA[ch] || [];
  const hasPrev = true; // ch1 goes back to dhyana
  const hasNext = chNum < 18;
  const nextMeta = hasNext ? GITA_META[String(chNum+1)] : null;

  // Sanskrit ordinals and yoga names for chapter invocation header
  const ORDINALS = ['','prathamo','dvitīyo','tṛtīyo','caturtho','pañcamo',
    'ṣaṣṭho','saptamo','aṣṭamo','navamo','daśamo','ekādaśo','dvādaśo',
    'trayodaśo','caturdaśo','pañcadaśo','ṣoḍaśo','saptadaśo','aṣṭādaśo'];
  const ordinal = ORDINALS[chNum] || chNum;
  // Proper Sanskrit yoga compound name for each chapter
  const YOGA_NAMES = ['',
    'arjunaviṣādayōgaḥ','sāṅkhyayōgaḥ','karmayōgaḥ','jñānayōgaḥ',
    'karmasannyāsayōgaḥ','ātmasaṃyamayōgaḥ','jñānavijñānayōgaḥ','akṣaraparabrahmayōgaḥ',
    'rājavidyārājaguhyayōgaḥ','vibhūtiyōgaḥ','viśvarūpasandarśanayōgaḥ','bhaktiyōgaḥ',
    'kṣētrakṣētrajñavibhāgayōgaḥ','guṇatrayavibhāgayōgaḥ','puruṣōttamaprāptiyōgaḥ',
    'daivāsurasampadvibhāgayōgaḥ','śraddhātrayavibhāgayōgaḥ','mokṣasannyāsayōgaḥ'];
  const yogaName = YOGA_NAMES[chNum] || '';

  let html = `
  <div class="chapter-nav">
    <button class="chapter-nav-btn" onclick="navChapter(-1)" ${hasPrev ? '' : 'disabled'}>← Prev</button>
    <div class="chapter-nav-title">Ch.${chNum} of 18</div>
    <button class="chapter-nav-btn" onclick="navChapter(1)" ${hasNext ? '' : 'disabled'}>Next →</button>
  </div>
  <div class="chapter-header">
    <div class="chapter-num">Bhagavad Gītā · Chapter ${ch}</div>
    <h2>${meta?.yoga || 'Chapter ' + ch}</h2>
    <div class="subtitle">${meta?.subtitle || ''}</div>
  </div>
  <div class="chapter-invocation">
    <span class="vline">ōṃ śrī paramātmanē namaḥ</span><br>
    <span class="vline">atha ${ordinal}'dhyāyaḥ</span><br>
    <span class="vline">${yogaName}</span>
  </div>`;

  let prevSpk = null;
  for (const v of verses) {
    const key = `gita_ch${ch}_v${v.n}`;
    const isDone = done.has(key);
    const isExpanded = state.expandedVerse === key;
    // Look up provided Telugu verse text first (need speaker from it)
    const teVerseLines = (GITA_TE_DATA[chNum] && GITA_TE_DATA[chNum][v.n]) ? GITA_TE_DATA[chNum][v.n] : [];
    const teSpeakers = ["సంజయ ఉవాచ","శ్రీ భగవానువాచ","అర్జున ఉవాచ","ధృతరాష్ట్ర ఉవాచ","భగవానువాచ"];
    const teSpkLine = (teVerseLines.length > 0 && teSpeakers.includes(teVerseLines[0])) ? teVerseLines[0] : null;
    const teVLines = teSpkLine ? teVerseLines.slice(1) : teVerseLines;
    let spkHtml = '';
    if (v.spk && v.spk !== prevSpk) {
      const spkNames = { 'arjuna':'Arjuna','bhagavān':'Śrī Bhagavān','sañjaya':'Sañjaya','dhṛtarāṣṭra':'Dhṛtarāṣṭra' };
      if (settings.language === 'te') {
        // Telugu mode — show Telugu speaker label if available, else hide
        spkHtml = teSpkLine ? `<span class="spk-tag">${esc(teSpkLine)}</span>` : '';
      } else {
        // IAST or both mode — show IAST speaker
        spkHtml = `<span class="spk-tag">${spkNames[v.spk] || v.spk} uvāca</span>`;
      }
      prevSpk = v.spk;
    }
    // Render IAST lines and Telugu lines independently (they have different line counts)
    // IAST: 4 half-lines; Telugu: 2 full lines — never pair them 1:1
    let linesHtml = '';
    if (settings.language !== 'te') {
      // Show IAST lines
      linesHtml += v.tlines.map((ln, i) => {
        const br = (i < v.tlines.length - 1) ? '<br>' : '';
        return `<span class="vline">${esc(ln)}</span>${br}`;
      }).join('');
    }
    if (settings.language !== 'en' && teVLines.length > 0) {
      // Show Telugu lines as an independent block (not paired with IAST count)
      // Strip embedded ॥N॥ verse markers — render code adds its own verse-num span
      if (settings.language !== 'te' && v.tlines.length > 0) linesHtml += '<br>';
      linesHtml += teVLines.map((teLn, i) => {
        const cleanLn = teLn.replace(/[॥|]\s*\d+\s*[॥|]\s*$/, '').trimEnd();
        const br = (i < teVLines.length - 1) ? '<br>' : '';
        return `<span class="vline-te">${esc(cleanLn)}</span>${br}`;
      }).join('');
    }
    // No Telugu data → show nothing (never auto-convert)
    const meaningHtml = v.meaning_en ? `<div class="verse-meaning">${esc(v.meaning_en)}</div>` : `<div class="verse-meaning empty"></div>`;
    html += `<div class="verse-block${isDone?' done':''}${isExpanded?' expanded':''}" data-key="${key}" onclick="toggleVerse('${key}')">
      <span class="verse-done-mark">✓</span>
      <div class="verse-text">${spkHtml}${linesHtml}<span class="verse-num">॥ ${v.n} ॥</span></div>
      ${meaningHtml}
    </div>`;
  }

  // Continuation banner
  if (hasNext && nextMeta) {
  } else if (!hasNext) {
  }

  el.innerHTML = html;
}

// ─────────────── RECITE MODE ───────────────
function buildReciteItems() {
  // Build flat list of items for recite mode
  // Each item is an object with lines[] to show
  const items = [];
  
  if (state.section === 'gita' && state.chapter === 'dhyana') {
    for (const s of DHYANA_DATA) {
      const teLines = DHYANA_TE_DATA[s.n - 1] || [];
      items.push({
        id: `gita_dhyana_${s.n}`,
        label: `Dhyānam · ${s.n}`,
        lines: s.tlines.slice(0, 4),
        teLines,
        n: s.n,
      });
    }
  } else if (state.section === 'gita') {
    const spkNames = { 'dhṛtarāṣṭra':'Dhṛtarāṣṭra','arjuna':'Arjuna','bhagavān':'Śrī Bhagavān','sañjaya':'Sañjaya' };
    const teSpeakers = ["సంజయ ఉవాచ","శ్రీ భగవానువాచ","అర్జున ఉవాచ","ధృతరాష్ట్ర ఉవాచ","భగవానువాచ"];
    let prevSpk = null;
    const chNum = parseInt(state.chapter);
    const verses = GITA_DATA[state.chapter] || [];
    for (const v of verses) {
      const allLines = [...v.tlines];
      // Attach speaker label only when it changes
      const spkLabel = (v.spk && v.spk !== prevSpk) ? (spkNames[v.spk] || v.spk) + ' uvāca' : null;
      if (v.spk) prevSpk = v.spk;
      // Look up Telugu lines; strip speaker line if present
      const rawTeLines = (GITA_TE_DATA[chNum] && GITA_TE_DATA[chNum][v.n]) ? GITA_TE_DATA[chNum][v.n] : [];
      const teLines = (rawTeLines.length > 0 && teSpeakers.includes(rawTeLines[0])) ? rawTeLines.slice(1) : rawTeLines;
      items.push({
        id: `gita_ch${state.chapter}_v${v.n}`,
        label: `Ch.${state.chapter} · ${v.n}`,
        lines: allLines.slice(0, 4),
        teLines,
        spk: spkLabel,
        n: v.n,
      });
    };
  } else if (state.section === 'rudram') {
    const an = state.chapter;
    const isCham = (state.rudramPart === 'chamakam');
    let lines, teLines;
    if (isCham) {
      // Chamakam: the closing prayer rides along with the last anuvaka
      const ks = (an === '11') ? ['11', 'closing'] : [an];
      lines = []; teLines = [];
      for (const k of ks) {
        const b = CHAMAKAM_DATA[k], tb = CHAMAKAM_TE_DATA[k];
        const l = b ? b[0].tlines : [];
        const tl = tb ? tb[0].tlines : [];
        l.forEach((x, i) => { lines.push(x); teLines.push(tl[i] || ''); });
      }
    } else {
      const nmBlock = NAMAKAM_DATA[an];
      lines = nmBlock ? nmBlock[0].tlines : (RUDRAM_DATA[an] || []);
      const teBlock = NAMAKAM_TE_DATA[an];
      teLines = teBlock ? teBlock[0].tlines : null;
    }
    // Group every 4 lines into a card
    for (let i = 0; i < lines.length; i += 4) {
      const cardLines = lines.slice(i, i+4);
      const cardTeLines = teLines ? teLines.slice(i, i+4) : [];
      items.push({
        id: `${isCham ? 'chamakam' : 'rudram'}_an${an}_g${Math.floor(i/4)}`,
        label: isCham ? ('Chamakam · Anuvaka ' + an) : (RUDRAM_META[an] || 'Anuvaka ' + an),
        lines: cardLines,
        teLines: cardTeLines,
      });
    }
  
  } else if (state.section === 'vsn') {
    // Load ALL VSN sections in order as one continuous recite list
    for (const sec of VSN_SECTIONS_ORDER) {
      const slokas = VSN_DATA[sec] || [];
      const secLabel = VSN_META[sec] || ('Śloka ' + sec);
      const teSlokas = VSN_TE_DATA[sec] || [];
      const secNumbered = !isNaN(parseInt(sec));
      for (const s of slokas) {
        const teSloka = teSlokas.find(x => x.n === s.n) || (secNumbered ? teSlokas[slokas.indexOf(s)] : null);
        items.push({
          id: `vsn_${sec}_${s.n}`,
          label: secLabel + ' · ' + s.n,
          lines: s.tlines,
          teLines: teSloka ? teSloka.tlines : [],
          sec,
          n: s.n,
        });
      }
    }
  } else if (coll()) {
    const song = coll().data[state.chapter];
    for (const v of (song ? song.verses : [])) {
      const te = songTeLines(song, v.n);
      items.push({
        id: `${state.section}_${state.chapter}_${v.n}`,
        label: v.label ? `${song.title} · ${v.label}` : `${song.title} · ${v.n}`,
        lines: v.tlines,
        teLines: te || [],
        forceEn: !te,      // no Telugu for this song — show English even in Telugu-only mode
        n: v.n,
      });
    }
  } else if (state.section === 'hc') {
    // Hanuman Chalisa — all sections in order
    for (const sec of HC_SECTIONS_ORDER) {
      const slokas = HC_DATA[sec] || [];
      const secLabel = HC_META[sec] || sec;
      const teSlokas = HC_TE_DATA[sec] || [];
      for (const s of slokas) {
        const teSloka = teSlokas.find(x => x.n === s.n);
        items.push({
          id: `hc_${sec}_${s.n}`,
          label: secLabel,
          lines: s.tlines,
          teLines: teSloka ? teSloka.tlines : [],
          sec,
          n: s.n,
        });
      }
    }
  }
  return items;
}

function startRecite() {
  const items = buildReciteItems();
  if (!items.length) return;
  
  state.reciting = true;
  state.reciteItems = items;
  state.reciteIdx = 0;
  
  // Start from first undone item if possible
  for (let i = 0; i < items.length; i++) {
    if (!done.has(items[i].id)) { state.reciteIdx = i; break; }
  }
  
  document.getElementById('recite-overlay').classList.add('active');
  renderRecite();
  
  // Keyboard support
  document.addEventListener('keydown', reciteKeyHandler);
}

// ── Recite auto-advance timer ──
let reciteTimerId = null;
function clearReciteTimer() {
  if (reciteTimerId) { clearTimeout(reciteTimerId); reciteTimerId = null; }
  const bar = document.getElementById('recite-timer-bar');
  if (bar) { bar.classList.remove('running'); bar.style.animationDuration = ''; }
}
function scheduleReciteTimer() {
  clearReciteTimer();
  const secs = [5, 15, 30].includes(settings.reciteTimer) ? settings.reciteTimer : 0;
  document.querySelectorAll('.recite-timer-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.sec) === secs));
  if (!secs || !state.reciting) return;
  const bar = document.getElementById('recite-timer-bar');
  void bar.offsetWidth;                      // restart the fill animation
  bar.style.animationDuration = secs + 's';
  bar.classList.add('running');
  reciteTimerId = setTimeout(() => { reciteTimerId = null; if (state.reciting) reciteNext(); }, secs * 1000);
}
function setReciteTimer(secs) {
  settings.reciteTimer = secs;
  saveSettings();
  scheduleReciteTimer();
}

function stopRecite() {
  clearReciteTimer();
  state.reciting = false;
  document.getElementById('recite-overlay').classList.remove('active');
  // Reset end panel
  document.getElementById('recite-controls').style.display = '';
  document.getElementById('recite-end').style.display = 'none';
  document.removeEventListener('keydown', reciteKeyHandler);
  renderPractice();
  updateTopbar();
}

function reciteKeyHandler(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); reciteNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); recitePrev(); }
  else if (e.key === 'Escape') stopRecite();
}

function reciteNext() {
  if (state.reciteIdx < state.reciteItems.length - 1) {
    const item = state.reciteItems[state.reciteIdx];
    done.add(item.id);
    saveDone();
    state.reciteIdx++;
    renderRecite();
  } else {
    // Last item — show end panel
    clearReciteTimer();
    const item = state.reciteItems[state.reciteIdx];
    done.add(item.id);
    saveDone();
    // Show end panel
    document.getElementById('recite-controls').style.display = 'none';
    const endEl = document.getElementById('recite-end');
    endEl.style.display = '';
    const chNum = parseInt(state.chapter);
    const max = (state.section === 'gita') ? 18 :
               (state.section === 'rudram') ? 11 : VSN_SECTIONS_ORDER.length - 1;
    const C = coll();
    const songIdx = C ? C.order.indexOf(state.chapter) : -1;
    const hasNext = C ? songIdx < C.order.length - 1
      : (state.section === 'vsn')
      ? VSN_SECTIONS_ORDER.indexOf(state.chapter) < max
      : chNum < max;
    const btn = document.getElementById('recite-next-ch-btn');
    if (hasNext) {
      const vsnNextIdx = VSN_SECTIONS_ORDER.indexOf(state.chapter) + 1;
 const nextLabel = C
        ? C.data[C.order[songIdx + 1]].title
        : state.section === 'gita'
        ? `Chapter ${chNum+1} · ${GITA_META[String(chNum+1)]?.yoga || ''}`
        : state.section === 'rudram'
        ? (state.rudramPart === 'chamakam' ? `Chamakam · Anuvaka ${chNum+1}` : `${RUDRAM_META[String(chNum+1)] || 'Anuvaka '+(chNum+1)}`)
        : `${VSN_META[VSN_SECTIONS_ORDER[vsnNextIdx]] || 'Śloka '+VSN_SECTIONS_ORDER[vsnNextIdx]}`;
      document.getElementById('recite-end-label').textContent = 'Up next: ' + nextLabel;
      btn.textContent = C ? C.next : state.section === 'gita' ? 'Next Chapter →' : state.section === 'rudram' ? 'Next Anuvaka →' : 'Next Section →';
      btn.style.display = '';
    } else {
      document.getElementById('recite-end-label').textContent =
        C ? C.done :
        state.section === 'gita' ? 'All 18 Chapters complete 🙏' :
        state.section === 'rudram' ? (state.rudramPart === 'chamakam' ? 'Chamakam complete 🙏' : 'Namakam complete 🙏') :
        'Viṣṇu Sahasranāmam complete 🙏';
      btn.style.display = 'none';
    }
  }
}

function reciteNextChapter() {
  stopRecite();
  navChapter(1);
  // Auto-start recite for next chapter
  setTimeout(() => startRecite(), 100);
}

function reciteGoTo(idx) {
  if (idx >= 0 && idx < state.reciteItems.length) {
    state.reciteIdx = idx;
    renderRecite();
  }
}

function recitePrev() {
  if (state.reciteIdx > 0) {
    state.reciteIdx--;
    renderRecite();
  }
}

function renderRecite() {
  const items = state.reciteItems;
  const idx = state.reciteIdx;
  const item = items[idx];
  if (!item) return;
  
  document.getElementById('recite-section-label').textContent =
    state.section === 'gita' ? 'Bhagavad Gītā' :
    coll() ? coll().name :
    state.section === 'hc' ? 'Hanumān Chālīsā' :
    state.section === 'rudram' ? 'Śrī Rudram' : 'Viṣṇu Sahasranāmam';
  document.getElementById('recite-verse-label').textContent = item.label || '';
  
  // Speaker tag (shown above lines when speaker changes)
  const linesEl = document.getElementById('recite-lines');
  const spkHtml = item.spk ? `<div class="recite-spk">${esc(item.spk)}</div>` : '';
  linesEl.innerHTML = spkHtml + item.lines.map((ln, i) => {
    const enLine = (settings.language !== 'te' || item.forceEn) ? `<div class="recite-line">${esc(ln)}</div>` : '';
    const rawTeLn = item.teLines && item.teLines[i] ? item.teLines[i] : null;
    const teLn = rawTeLn ? rawTeLn.replace(/[॥|]\s*\d+\s*[॥|]\s*$/, '').trimEnd() : null;
    const teLine = (settings.language !== 'en' && teLn) ? `<div class="recite-line-te">${esc(teLn)}</div>` : '';
    return enLine + teLine;
  }).join('');
  
  // Dots
  const dotsEl = document.getElementById('recite-dots');
  dotsEl.innerHTML = items.map((it, i) => {
    const cls = i === idx ? 'cur' : (done.has(it.id) ? 'done' : '');
    return `<div class="recite-dot ${cls}" onclick="reciteGoTo(${i})" title="${esc(it.label||String(i+1))}"></div>`;
  }).join('');

  // (Re)start the auto-next countdown for this verse
  scheduleReciteTimer();
}

// ─────────────── UTILITIES ───────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────── IAST → TELUGU CONVERTER ───────────────
(function() {
  const ACCENT_STRIPS = new Set(['̠','̍','̎','̑','̱','̌','̤','̥']);
  const VIRAMA = '్';
  const ANUSVARA = 'ం';
  const VISARGA  = 'ః';
  const SV = {a:'అ',ā:'ఆ',i:'ఇ',ī:'ఈ',u:'ఉ',ū:'ఊ',
    ṛ:'ఋ',ṝ:'ఌ',e:'ఎ',ē:'ఏ',ai:'ఐ',o:'ఒ',ō:'ఓ',au:'ఔ'};
  const VM = {a:'',ā:'ా',i:'ి',ī:'ీ',u:'ు',ū:'ూ',
    ṛ:'ృ',ṝ:'ౄ',e:'ె',ē:'ే',ai:'ై',o:'ొ',ō:'ో',au:'ౌ'};
  const CONS2 = {kh:'ఖ',gh:'ఘ',ch:'ఛ',jh:'ఝ',
    ṭh:'ఠ',ḍh:'ఢ',th:'థ',dh:'ధ',ph:'ఫ',bh:'భ'};
  const CONS1 = {k:'క',g:'గ',ṅ:'ఙ',c:'చ',j:'జ',ñ:'ఞ',
    ṭ:'ట',ḍ:'డ',ṇ:'ణ',t:'త',d:'ద',n:'న',
    p:'ప',b:'బ',m:'మ',y:'య',r:'ర',l:'ల',
    ḷ:'ళ',ḻ:'ళ',v:'వ',ś:'శ',ṣ:'ష',s:'స',h:'హ'};
  const SPECIAL = {ṃ:ANUSVARA,ṁ:ANUSVARA,ḥ:VISARGA};
  const PASSTHRU = new Set(' \t\n\r|।॥-\'"()[]{}0123456789,.!?;:/\\~`@#%^&*_+=<>\'');

  function stripAccents(t) {
    const r = [];
    for (const c of t) { if (!ACCENT_STRIPS.has(c)) r.push(c); }
    return r.join('');
  }
  function getCons(text, i) {
    const two = text.slice(i, i+2);
    if (CONS2[two]) return [CONS2[two], 2];
    const c = text[i] || '';
    if (CONS1[c]) return [CONS1[c], 1];
    return [null, 0];
  }
  function getVowel(text, i) {
    const two = text.slice(i, i+2);
    if (two === 'ai' || two === 'au') return [two, 2];
    const c = text[i] || '';
    if (c in VM) return [c, 1];
    return [null, 0];
  }

  window.iastToTelugu = function(text) {
    text = stripAccents(text);
    // NFC normalize (browser)
    if (text.normalize) text = text.normalize('NFC');
    const result = [];
    let i = 0;
    const n = text.length;
    while (i < n) {
      const ch = text[i];
      if (PASSTHRU.has(ch)) { result.push(ch); i++; continue; }
      if (SPECIAL[ch]) { result.push(SPECIAL[ch]); i++; continue; }
      const [cons_ch, clen] = getCons(text, i);
      if (cons_ch) {
        i += clen;
        const [vowel, vlen] = getVowel(text, i);
        if (vowel !== null) {
          result.push(cons_ch, VM[vowel]);
          i += vlen;
        } else {
          result.push(cons_ch, VIRAMA);
        }
        continue;
      }
      // Standalone vowel
      const two = text.slice(i, i+2);
      if (two === 'ai' || two === 'au') { result.push(SV[two]); i += 2; continue; }
      if (SV[ch]) { result.push(SV[ch]); i++; continue; }
      result.push(ch); i++;
    }
    return result.join('');
  };
})();

  const max = 3;

  // Re-render practice if open so change is visible immediately
  if (state.view === 'practice') renderPractice();
}

// ─────────────── AUTO-UPDATE ───────────────
function forceRefresh() {
  const btn = document.getElementById('home-refresh-btn');
  if (btn) { btn.textContent = '↻ Checking…'; btn.disabled = true; }
  // Bust the cache by appending a timestamp, then reload
  const url = location.href.split('?')[0] + '?v=' + Date.now();
  fetch(url, { cache: 'reload' })
    .then(() => { location.reload(true); })
    .catch(() => { location.reload(true); });
}

// Offline support: the service worker keeps a copy of the app on the device
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// On load: silently check if a newer version exists and reload if so
(function autoUpdate() {
  try {
    const CACHE_KEY = 'vedic_etag';
    const url = location.href.split('?')[0];
    fetch(url, { method: 'HEAD', cache: 'no-store' })
      .then(r => {
        const etag = r.headers.get('etag') || r.headers.get('last-modified') || '';
        const saved = localStorage.getItem(CACHE_KEY) || '';
        if (saved && etag && saved !== etag) {
          // New version available — reload silently
          localStorage.setItem(CACHE_KEY, etag);
          location.reload(true);
        } else if (etag) {
          localStorage.setItem(CACHE_KEY, etag);
        }
      }).catch(() => {});
  } catch(e) {}
})();

function setLanguage(lang) {
  settings.language = lang;
  saveSettings();
  renderSettings();
  if (state.view === 'practice') renderPractice();
  if (state.view === 'recite') renderRecite();
}

function checkForUpdates(btn) {
  const statusEl = document.getElementById('update-status');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
  if (statusEl) statusEl.textContent = 'Checking for updates…';
  // Fetch the page bypassing cache to detect a new version
  fetch(location.href, {cache: 'no-store'})
    .then(r => r.text())
    .then(html => {
      // Extract build date comment or just reload if fetch succeeded
      const remoteMatch = html.match(/BUILD_DATE\s*=\s*["']([^"']+)["']/);
      const localMatch = document.documentElement.innerHTML.match(/BUILD_DATE\s*=\s*["']([^"']+)["']/);
      const remoteDate = remoteMatch ? remoteMatch[1] : null;
      const localDate = localMatch ? localMatch[1] : null;
      if (remoteDate && localDate && remoteDate === localDate) {
        if (statusEl) statusEl.textContent = 'You\'re on the latest version ✓';
        if (btn) { btn.disabled = false; btn.textContent = 'Refresh'; }
      } else {
        // New version available or no version markers — reload
        if (statusEl) statusEl.textContent = 'Update found — reloading…';
        setTimeout(() => location.reload(true), 600);
      }
    })
    .catch(() => {
      // Offline or error — just do a hard reload
      if (statusEl) statusEl.textContent = 'Reloading…';
      setTimeout(() => location.reload(true), 400);
    });
}

// ─────────────── INIT ───────────────
function init() {
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === state.section));
  applyFontSizes();
  applyTheme(settings.theme || 'auto');
  showView('home');
}

init();

(function () {

const N = PANCH.N, hms = PANCH.hms;
const MONTHS_TE = ['జనవరి','ఫిబ్రవరి','మార్చి','ఏప్రిల్','మే','జూన్','జూలై','ఆగస్టు','సెప్టెంబర్','అక్టోబర్','నవంబర్','డిసెంబర్'];
const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const L = {
  sunrise:['Sunrise','సూర్యోదయం'], sunset:['Sunset','సూర్యాస్తమయం'], moonrise:['Moonrise','చంద్రోదయం'],
  tithi:['Tithi','తిథి'], nak:['Nakṣatram','నక్షత్రం'], yoga:['Yōgam','యోగం'], karana:['Karaṇam','కరణం'],
  sunRasi:['Sūrya rāśi','సూర్యరాశి'], moonRasi:['Candra rāśi','చంద్రరాశి'],
  rahu:['Rāhu kālam','రాహుకాలం'], yama:['Yamagaṇḍam','యమగండం'], gulika:['Gulika','గుళిక'], abhijit:['Abhijit','అభిజిత్'],
  durm:['Durmuhūrtam','దుర్ముహూర్తం'], varjyam:['Varjyam','వర్జ్యం'], amrita:['Amṛta kālam','అమృతకాలం'],
  limbs:['Pañcāṅgam','పంచాంగం'], times:['Timings','సమయాలు'], sank:['Saṅkalpam','సంకల్పం'],
  until:['until','వరకు'], now:['now','ఇప్పుడు'], share:['Share this panchāṅgam','ఈ పంచాంగం పంపండి'],
  today:['Back to today','ఈ రోజుకు వెళ్ళండి'], useLoc:['📍 Use my location','📍 నా ప్రదేశం వాడండి'],
};
const PRESETS = [
  {name:'East Windsor, NJ',   lat:40.2626, lon:-74.5254,  tz:'America/New_York'},
  {name:'Old Bridge, NJ',     lat:40.4140, lon:-74.3654,  tz:'America/New_York'},
  {name:'Edison, NJ',         lat:40.5187, lon:-74.4121,  tz:'America/New_York'},
  {name:'Monroe, NJ',         lat:40.3292, lon:-74.4279,  tz:'America/New_York'},
  {name:'Cranbury, NJ',       lat:40.3162, lon:-74.5138,  tz:'America/New_York'},
  {name:'Lake Hopatcong, NJ', lat:40.9573, lon:-74.6157,  tz:'America/New_York'},
  {name:'Bothell, WA',        lat:47.7623, lon:-122.2054, tz:'America/Los_Angeles'},
  {name:'Hyderabad',          lat:17.3850, lon:78.4867,   tz:'Asia/Kolkata'},
  {name:'Visakhapatnam',      lat:17.6868, lon:83.2185,   tz:'Asia/Kolkata'},
];
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};
let loc = store.get('vedic_panch_loc', null);
const firstVisit = !loc;    // nothing saved yet: ask for the phone's location on first open
if (!loc || typeof loc.lat !== 'number' || !loc.tz) loc = PRESETS[0];
let lang = 'both';   // follows the app's language setting
let cur;   // the selected civil date, kept as a UTC Date holding y-m-d
function goToday(){ const [y,m,d] = PANCH.todayIn(loc.tz); cur = new Date(Date.UTC(y, m-1, d)); }
goToday();
let shareText = '';

const $ = id => document.getElementById('pn-' + id);
const pick = pair => lang === 'en' ? pair[0] : pair[1];
const dual = pair => lang === 'both' ? `${pair[1]}<small>${pair[0]}</small>` : pick(pair);
const nameOf = (table, i) => lang === 'en' ? table[i][0] : lang === 'te' ? table[i][1] : `${table[i][1]}<i>${table[i][0]}</i>`;

// ── Location picker ──
function fillLocations(){
  const sel = $('loc');
  const opts = PRESETS.slice();
  if (!opts.some(p => p.name === loc.name)) opts.unshift(loc);
  sel.innerHTML = `<option value="gps">${pick(L.useLoc)}</option>` +
    opts.map((p,i) => `<option value="${i}" ${p.name===loc.name?'selected':''}>${p.name}</option>`).join('');
  sel.onchange = () => {
    if (sel.value === 'gps') { useMyLocation(); return; }
    loc = opts[+sel.value]; store.set('vedic_panch_loc', loc); goToday(); render();
  };
  $('placeName').textContent = loc.name;
}
function useMyLocation(){
  if (!navigator.geolocation) { alert('This device cannot share its location. Pick a place from the list.'); fillLocations(); return; }
  navigator.geolocation.getCurrentPosition(p => {
    loc = { name:'My location', lat:p.coords.latitude, lon:p.coords.longitude, tz: Intl.DateTimeFormat().resolvedOptions().timeZone };
    store.set('vedic_panch_loc', loc); goToday(); render();
  }, () => { alert('Location permission was not given. Pick a place from the list instead.'); fillLocations(); }, { timeout:15000 });
}

// Elements current at sunrise, plus any that also end before the next sunrise
function visible(spans, nextSunrise){ const e = spans.filter(s => s.end < nextSunrise); return e.length ? e : [spans[0]]; }

// Moon phase glyph from Sun–Moon elongation in degrees (waxing lit on the right)
function moonSVG(elong){
  const r = 14, c = 20, k = Math.cos(elong * Math.PI / 180), rx = Math.abs(k) * r;
  const waxing = elong < 180, gibbous = k < 0;
  const sweepHalf = waxing ? 1 : 0;
  const sweepEll = waxing ? (gibbous ? 1 : 0) : (gibbous ? 0 : 1);
  const d = `M${c},${c-r} A${r},${r} 0 0 ${sweepHalf} ${c},${c+r} A${rx.toFixed(2)},${r} 0 0 ${sweepEll} ${c},${c-r} Z`;
  return `<svg width="40" height="40" viewBox="0 0 40 40"><circle cx="${c}" cy="${c}" r="${r}" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-opacity=".45"/><path d="${d}" fill="currentColor"/></svg>`;
}
const ICONS = {
  nak:'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.9H22l-6 4.5 2.3 7.1L12 16.2 5.7 20.5 8 13.4 2 8.9h7.6z"/></svg>',
  yoga:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg>',
  karana:'<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
};

function render(){
  lang = settings.language || 'both';
  const y = cur.getUTCFullYear(), mo = cur.getUTCMonth(), dd = cur.getUTCDate();
  const r = PANCH.compute(y, mo+1, dd, loc.lat, loc.lon, loc.tz);
  const M = r.date, T = t => hms(t, M);
  const [ty,tm,td] = PANCH.todayIn(loc.tz);
  const isToday = (ty === y && tm === mo+1 && td === dd);
  const now = new Date();

  // Header
  fillLocations();
  const en = `${N.weekday[r.weekday][0]}, ${MONTHS_EN[mo]} ${dd}`, te = `${N.weekday[r.weekday][1]}, ${MONTHS_TE[mo]} ${dd}`;
  $('dMain').textContent = (lang === 'en' ? en : te) + (y !== ty ? `, ${y}` : '');
  const ti = r.tithis[0].name;
  const lunarEn = `${N.samvatsara[r.samvatsara][0]} year, ${r.adhika?'Adhika ':''}${N.masa[r.masa][0]} ${r.paksha?'Kṛṣṇa':'Śukla'} ${N.tithi[ti][0]}`;
  const lunarTe = `${N.samvatsara[r.samvatsara][1]} నామ సంవత్సరం, ${r.adhika?'అధిక ':''}${N.masa[r.masa][1]} ${r.paksha?'బహుళ':'శుద్ధ'} ${N.tithi[ti][1]}`;
  $('dSub').innerHTML = lang === 'en' ? lunarEn : lang === 'te' ? lunarTe : `${lunarTe}<br>${en}`;
  $('date').value = `${y}-${String(mo+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  $('today').textContent = pick(L.today); $('today').classList.toggle('show', !isToday);
  document.querySelectorAll('#view-panch .langs button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));

  // Sun arc from sunrise (left) to sunset (right), with Rāhu, Yamagaṇḍam, Gulika and Abhijit marked on it
  const W = 320, cx = 160, base = 104, R = 146, Hh = 92;
  const ang = t => Math.PI * (1 - Math.min(1, Math.max(0, (t - r.sunrise) / (r.sunset - r.sunrise))));
  const pt = t => [cx + R * Math.cos(ang(t)), base - Hh * Math.sin(ang(t))];
  const arcPath = (a, b) => { let d = ''; for (let i = 0; i <= 30; i++) { const [x, yy] = pt(new Date(+a + (b - a) * i / 30)); d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + yy.toFixed(1); } return d; };
  let svg = `<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="rgba(240,192,64,.22)"/>`;
  svg += `<path d="${arcPath(r.sunrise, r.sunset)}" fill="none" stroke="rgba(240,192,64,.4)" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round"/>`;
  [[r.rahu,'#e8836a'],[r.yama,'#e8836a'],[r.gulika,'#e8836a'],[r.abhijit,'#f0c040']].forEach(([s,col]) =>
    svg += `<path d="${arcPath(s.start, s.end)}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`);
  const sunUp = isToday && now > r.sunrise && now < r.sunset;
  const [sx, sy] = sunUp ? pt(now) : pt(new Date((+r.sunrise + +r.sunset) / 2));
  svg += sunUp
    ? `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="12" fill="#f0c040" opacity=".22"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="6.5" fill="#f0c040"/>`
    : `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="6" fill="none" stroke="#f0c040" stroke-opacity=".55" stroke-width="1.5"/>`;
  $('arc').innerHTML = svg;
  $('lSunrise').textContent = pick(L.sunrise);   $('vSunrise').textContent = T(r.sunrise);
  $('lSunset').textContent = pick(L.sunset);     $('vSunset').textContent = T(r.sunset);
  $('lMoonrise').textContent = pick(L.moonrise); $('vMoonrise').textContent = T(r.moonrise);

  // Five limbs
  $('tLimbs').innerHTML = dual(L.limbs);
  const progress = s => isToday && now >= s.start ? Math.min(100, (now - s.start) / (s.end - s.start) * 100) : null;
  const limbRow = (key, icon, table, s, nameIdx) => {
    const p = progress(s);
    return `<div class="limb"><div class="ico">${icon}</div>
      <div><div class="what">${pick(L[key])}</div><div class="name">${nameOf(table, nameIdx)}</div></div>
      <div class="until">${pick(L.until)}<b>${T(s.end)}</b></div>
      ${p !== null ? `<div class="bar"><span style="width:${p.toFixed(1)}%"></span></div>` : ''}</div>`;
  };
  let lh = '';
  visible(r.tithis, r.nextSunrise).forEach((s,i) => lh += limbRow('tithi', moonSVG((r.elongation + 12 * i) % 360), N.tithi, s, s.name));
  visible(r.naks,   r.nextSunrise).forEach(s => lh += limbRow('nak',    ICONS.nak,    N.nak,    s, s.idx));
  visible(r.yogas,  r.nextSunrise).forEach(s => lh += limbRow('yoga',   ICONS.yoga,   N.yoga,   s, s.idx));
  visible(r.karanas,r.nextSunrise).forEach(s => lh += limbRow('karana', ICONS.karana, N.karana, s, s.idx));
  $('limbs').innerHTML = lh;
  $('rasi').innerHTML = [['sunRasi', r.sunRasi], ['moonRasi', r.moonRasi]].map(([k, i]) =>
    `<div><div class="what">${pick(L[k])}</div><div class="name">${lang==='en'?N.rasi[i][0]:N.rasi[i][1]}</div>${lang==='both'?`<div class="what">${N.rasi[i][0]}</div>`:''}</div>`).join('');

  // Timings, sunrise to next sunrise
  $('tTimes').innerHTML = dual(L.times);
  const span = r.nextSunrise - r.sunrise, pc = t => Math.min(100, Math.max(0, (t - r.sunrise) / span * 100));
  const timings = [
    ['rahu', r.rahu, 'bad'], ['yama', r.yama, 'bad'], ['gulika', r.gulika, 'bad'], ['abhijit', r.abhijit, 'good'],
    ...r.durmuhurtam.map(x => ['durm', x, 'bad']), ...r.varjyam.map(x => ['varjyam', x, 'bad']), ...r.amrita.map(x => ['amrita', x, 'good']),
  ];
  let st = `<div class="night" style="left:${pc(r.sunset)}%;right:0"></div>`;
  timings.forEach(([k, s, kind]) => st += `<div class="seg" style="left:${pc(s.start)}%;width:${Math.max(0.8, pc(s.end) - pc(s.start))}%;background:var(--${kind})"></div>`);
  if (isToday && now >= r.sunrise && now < r.nextSunrise) st += `<div class="now" style="left:${pc(now)}%"></div>`;
  $('strip').innerHTML = st;
  $('scale').innerHTML = `<span>${T(r.sunrise)}</span><span>${T(r.sunset)}</span><span>${T(r.nextSunrise)}</span>`;
  $('times').innerHTML = timings.slice().sort((a,b) => a[1].start - b[1].start).map(([k, s, kind]) => {
    const live = isToday && now >= s.start && now < s.end;
    return `<div class="t-row ${kind}${live?' live':''}"><span class="dot"></span><span class="tn">${dual(L[k])}${live?`<span class="tag">${pick(L.now)}</span>`:''}</span><span class="tt">${T(s.start)} – ${T(s.end)}</span></div>`;
  }).join('');

  // Saṅkalpam
  const sank = [
    [`śrī ${N.samvatsara[r.samvatsara][0].toLowerCase()} nāma saṃvatsarē`, `శ్రీ ${N.samvatsara[r.samvatsara][1]} నామ సంవత్సరే`],
    r.ayana ? ['dakṣiṇāyanē','దక్షిణాయనే'] : ['uttarāyaṇē','ఉత్తరాయణే'],
    N.rituLoc[r.ritu],
    [`${r.adhika?'adhika ':''}${N.masa[r.masa][0].toLowerCase()} māsē`, `${r.adhika?'అధిక ':''}${N.masa[r.masa][1]} మాసే`],
    r.paksha ? ['kṛṣṇa pakṣē','కృష్ణ పక్షే'] : ['śukla pakṣē','శుక్ల పక్షే'],
    N.tithiLoc[r.tithiNameIdx],
    N.vasaraLoc[r.weekday],
  ];
  $('tSank').innerHTML = dual(L.sank);
  $('sank').innerHTML = sank.map(p => `<p>${lang==='en'?p[0]:p[1]}${lang==='both'?`<span class="en">${p[0]}</span>`:''}</p>`).join('');

  $('share').textContent = pick(L.share);
  $('foot').textContent = `${loc.name}, local time. Times after midnight continue past 24:00, so 25:16 means 1:16 AM.`;

  // Plain text in the priest's message format, for sharing
  const li = lang === 'en' ? 0 : 1, lab = k => L[k][li];
  const lines = [li ? te : en, `${lab('sunrise')}:${T(r.sunrise)}`, `${lab('sunset')}:${T(r.sunset)}`, `${lab('moonrise')}:${T(r.moonrise)}`];
  const add = (k, spans, table, key) => visible(spans, r.nextSunrise).forEach(s => lines.push(`${lab(k)}:${table[key ? s[key] : s.idx][li]} ${T(s.end)}`));
  add('tithi', r.tithis, N.tithi, 'name'); add('nak', r.naks, N.nak); add('yoga', r.yogas, N.yoga); add('karana', r.karanas, N.karana);
  lines.push(`${lab('sunRasi')}:${N.rasi[r.sunRasi][li]}`, `${lab('moonRasi')}:${N.rasi[r.moonRasi][li]}`);
  timings.forEach(([k, s]) => lines.push(`${lab(k)}:${T(s.start)}-${T(s.end)}`));
  lines.push('', ...sank.map(p => p[li]));
  shareText = lines.join('\n');
}

$('prev').onclick = () => { cur.setUTCDate(cur.getUTCDate() - 1); render(); };
$('next').onclick = () => { cur.setUTCDate(cur.getUTCDate() + 1); render(); };
$('today').onclick = () => { goToday(); render(); };
$('date').onchange = e => { const [y,m,d] = e.target.value.split('-').map(Number); if (y) { cur = new Date(Date.UTC(y, m-1, d)); render(); } };
document.querySelectorAll('#view-panch .langs button').forEach(b => b.onclick = () => { setLanguage(b.dataset.l); render(); });
$('share').onclick = async () => {
  try { if (navigator.share) { await navigator.share({ text: shareText }); return; } } catch(e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(shareText); alert('Copied. Paste it into WhatsApp.'); }
  catch(e) { prompt('Copy this text:', shareText); }
};

  let asked = false;
  window.renderPanch = function () {
    if (!cur) goToday();
    render();
    if (firstVisit && !asked) { asked = true; useMyLocation(); }
  };
})();

function openPanch() {
  showView('panch');
}
</script>
