vasthā vivarjitā ।", "sṛṣṭikartrī, brahmarūpā, gōptrī, gōvindarūpiṇī ॥ 63 ॥"], "label": "Śloka 63"}, {"n": 73, "tlines": ["saṃhāriṇī, rudrarūpā, tirōdhānakarīśvarī ।", "sadāśivānugrahadā, pañchakṛtya parāyaṇā ॥ 64 ॥"], "label": "Śloka 64"}, {"n": 74, "tlines": ["bhānumaṇḍala madhyasthā, bhairavī, bhagamālinī ।", "padmāsanā, bhagavatī, padmanābha sahōdarī ॥ 65 ॥"], "label": "Śloka 65"}, {"n": 75, "tlines": ["unmēṣa nimiṣōtpanna vipanna bhuvanāvaḻiḥ ।", "sahasraśīrṣavadanā, sahasrākṣī, sahasrapāt ॥ 66 ॥"], "label": "Śloka 66"}, {"n": 76, "tlines": ["ābrahma kīṭajananī, varṇāśrama vidhāyinī ।", "nijājñārūpanigamā, puṇyāpuṇya phalapradā ॥ 67 ॥"], "label": "Śloka 67"}, {"n": 77, "tlines": ["śruti sīmanta sindhūrīkṛta pādābjadhūḻikā ।", "sakalāgama sandōha śuktisampuṭa mauktikā ॥ 68 ॥"], "label": "Śloka 68"}, {"n": 78, "tlines": ["puruṣārthapradā, pūrṇā, bhōginī, bhuvanēśvarī ।", "ambikā,'nādi nidhanā, haribrahmēndra sēvitā ॥ 69 ॥"], "label": "Śloka 69"}, {"n": 79, "tlines": ["nārāyaṇī, nādarūpā, nāmarūpa vivarjitā ।", "hrīṅkārī, hrīmatī, hṛdyā, hēyōpādēya varjitā ॥ 70 ॥"], "label": "Śloka 70"}, {"n": 80, "tlines": ["rājarājārchitā, rājñī, ramyā, rājīvalōchanā ।", "rañjanī, ramaṇī, rasyā, raṇatkiṅkiṇi mēkhalā ॥ 71 ॥"], "label": "Śloka 71"}, {"n": 81, "tlines": ["ramā, rākēnduvadanā, ratirūpā, ratipriyā ।", "rakṣākarī, rākṣasaghnī, rāmā, ramaṇalampaṭā ॥ 72 ॥"], "label": "Śloka 72"}, {"n": 82, "tlines": ["kāmyā, kāmakaḻārūpā, kadamba kusumapriyā ।", "kaḻyāṇī, jagatīkandā, karuṇārasa sāgarā ॥ 73 ॥"], "label": "Śloka 73"}, {"n": 83, "tlines": ["kaḻāvatī, kaḻālāpā, kāntā, kādambarīpriyā ।", "varadā, vāmanayanā, vāruṇīmadavihvalā ॥ 74 ॥"], "label": "Śloka 74"}, {"n": 84, "tlines": ["viśvādhikā, vēdavēdyā, vindhyāchala nivāsinī ।", "vidhātrī, vēdajananī, viṣṇumāyā, vilāsinī ॥ 75 ॥"], "label": "Śloka 75"}, {"n": 85, "tlines": ["kṣētrasvarūpā, kṣētrēśī, kṣētra kṣētrajña pālinī ।", "kṣayavṛddhi vinirmuktā, kṣētrapāla samarchitā ॥ 76 ॥"], "label": "Śloka 76"}, {"n": 86, "tlines": ["vijayā, vimalā, vandyā, vandāru janavatsalā ।", "vāgvādinī, vāmakēśī, vahnimaṇḍala vāsinī ॥ 77 ॥"], "label": "Śloka 77"}, {"n": 87, "tlines": ["bhaktimat-kalpalatikā, paśupāśa vimōchanī ।", "saṃhṛtāśēṣa pāṣaṇḍā, sadāchāra pravartikā ॥ 78 ॥"], "label": "Śloka 78"}, {"n": 88, "tlines": ["tāpatrayāgni santapta samāhlādana chandrikā ।", "taruṇī, tāpasārādhyā, tanumadhyā, tamō'pahā ॥ 79 ॥"], "label": "Śloka 79"}, {"n": 89, "tlines": ["chiti, statpadalakṣyārthā, chidēka rasarūpiṇī ।", "svātmānandalavībhūta brahmādyānanda santatiḥ ॥ 80 ॥"], "label": "Śloka 80"}, {"n": 90, "tlines": ["parā, pratyakchitī rūpā, paśyantī, paradēvatā ।", "madhyamā, vaikharīrūpā, bhaktamānasa haṃsikā ॥ 81 ॥"], "label": "Śloka 81"}, {"n": 91, "tlines": ["kāmēśvara prāṇanāḍī, kṛtajñā, kāmapūjitā ।", "śṛṅgāra rasasampūrṇā, jayā, jālandharasthitā ॥ 82 ॥"], "label": "Śloka 82"}, {"n": 92, "tlines": ["ōḍyāṇa pīṭhanilayā, bindumaṇḍala vāsinī ।", "rahōyāga kramārādhyā, rahastarpaṇa tarpitā ॥ 83 ॥"], "label": "Śloka 83"}, {"n": 93, "tlines": ["sadyaḥ prasādinī, viśvasākṣiṇī, sākṣivarjitā ।", "ṣaḍaṅgadēvatā yuktā, ṣāḍguṇya paripūritā ॥ 84 ॥"], "label": "Śloka 84"}, {"n": 94, "tlines": ["nityaklinnā, nirupamā, nirvāṇa sukhadāyinī ।", "nityā, ṣōḍaśikārūpā, śrīkaṇṭhārdha śarīriṇī ॥ 85 ॥"], "label": "Śloka 85"}, {"n": 95, "tlines": ["prabhāvatī, prabhārūpā, prasiddhā, paramēśvarī ।", "mūlaprakṛti ravyaktā, vyaktā'vyakta svarūpiṇī ॥ 86 ॥"], "label": "Śloka 86"}, {"n": 96, "tlines": ["vyāpinī, vividhākārā, vidyā'vidyā svarūpiṇī ।", "mahākāmēśa nayanā kumudāhlāda kaumudī ॥ 87 ॥"], "label": "Śloka 87"}, {"n": 97, "tlines": ["bhaktahārda tamōbhēda bhānumad-bhānusantatiḥ ।", "śivadūtī, śivārādhyā, śivamūrti, śśivaṅkarī ॥ 88 ॥"], "label": "Śloka 88"}, {"n": 98, "tlines": ["śivapriyā, śivaparā, śiṣṭēṣṭā, śiṣṭapūjitā ।", "apramēyā, svaprakāśā, manōvāchāma gōcharā ॥ 89 ॥"], "label": "Śloka 89"}, {"n": 99, "tlines": ["chichChakti, śchētanārūpā, jaḍaśakti, rjaḍātmikā ।", "gāyatrī, vyāhṛti, ssandhyā, dvijabṛnda niṣēvitā ॥ 90 ॥ [dvijavṛnda]"], "label": "Śloka 90"}, {"n": 100, "tlines": ["tattvāsanā, tattvamayī, pañchakōśāntarasthitā ।", "nissīmamahimā, nityayauvanā, madaśālinī ॥ 91 ॥"], "label": "Śloka 91"}, {"n": 101, "tlines": ["madaghūrṇita raktākṣī, madapāṭala gaṇḍabhūḥ ।", "chandana dravadigdhāṅgī, chāmpēya kusuma priyā ॥ 92 ॥"], "label": "Śloka 92"}, {"n": 102, "tlines": ["kuśalā, kōmalākārā, kurukuḻḻā, kulēśvarī ।", "kuḻakuṇḍālayā, kauḻa mārgatatpara sēvitā ॥ 93 ॥"], "label": "Śloka 93"}, {"n": 103, "tlines": ["kumāra gaṇanāthāmbā, tuṣṭiḥ, puṣṭi, rmati, rdhṛtiḥ ।", "śāntiḥ, svastimatī, kānti, rnandinī, vighnanāśinī ॥ 94 ॥"], "label": "Śloka 94"}, {"n": 104, "tlines": ["tējōvatī, trinayanā, lōlākṣī kāmarūpiṇī ।", "mālinī, haṃsinī, mātā, malayāchala vāsinī ॥ 95 ॥"], "label": "Śloka 95"}, {"n": 105, "tlines": ["sumukhī, naḻinī, subhrūḥ, śōbhanā, suranāyikā ।", "kālakaṇṭhī, kāntimatī, kṣōbhiṇī, sūkṣmarūpiṇī ॥ 96 ॥"], "label": "Śloka 96"}, {"n": 106, "tlines": ["vajrēśvarī, vāmadēvī, vayō'vasthā vivarjitā ।", "siddhēśvarī, siddhavidyā, siddhamātā, yaśasvinī ॥ 97 ॥"], "label": "Śloka 97"}, {"n": 107, "tlines": ["viśuddhi chakranilayā,''raktavarṇā, trilōchanā ।", "khaṭvāṅgādi praharaṇā, vadanaika samanvitā ॥ 98 ॥"], "label": "Śloka 98"}, {"n": 108, "tlines": ["pāyasānnapriyā, tvaksthā, paśulōka bhayaṅkarī ।", "amṛtādi mahāśakti saṃvṛtā, ḍākinīśvarī ॥ 99 ॥"], "label": "Śloka 99"}, {"n": 109, "tlines": ["anāhatābja nilayā, śyāmābhā, vadanadvayā ।", "daṃṣṭrōjjvalā,'kṣamālādidharā, rudhira saṃsthitā ॥ 100 ॥"], "label": "Śloka 100"}, {"n": 110, "tlines": ["kāḻarātryādi śaktyaughavṛtā, snigdhaudanapriyā ।", "mahāvīrēndra varadā, rākiṇyambā svarūpiṇī ॥ 101 ॥"], "label": "Śloka 101"}, {"n": 111, "tlines": ["maṇipūrābja nilayā, vadanatraya saṃyutā ।", "vajrādikāyudhōpētā, ḍāmaryādibhi rāvṛtā ॥ 102 ॥"], "label": "Śloka 102"}, {"n": 112, "tlines": ["raktavarṇā, māṃsaniṣṭhā, guḍānna prītamānasā ।", "samasta bhaktasukhadā, lākinyambā svarūpiṇī ॥ 103 ॥"], "label": "Śloka 103"}, {"n": 113, "tlines": ["svādhiṣṭhānāmbujagatā, chaturvaktra manōharā ।", "śūlādyāyudha sampannā, pītavarṇā,'tigarvitā ॥ 104 ॥"], "label": "Śloka 104"}, {"n": 114, "tlines": ["mēdōniṣṭhā, madhuprītā, bandinyādi samanvitā । [bandhinyādi]", "dadhyannāsakta hṛdayā, kākinī-rūpadhāriṇī ॥ 105 ॥"], "label": "Śloka 105"}, {"n": 115, "tlines": ["mūlādhārāmbujārūḍhā, pañchavaktrā,'sthisaṃsthitā ।", "aṅkuśādi praharaṇā, varadādi niṣēvitā ॥ 106 ॥"], "label": "Śloka 106"}, {"n": 116, "tlines": ["mudgaudanāsakta chittā, sākinyambāsvarūpiṇī ।", "ājñā chakrābjanilayā, śuklavarṇā, ṣaḍānanā ॥ 107 ॥"], "label": "Śloka 107"}, {"n": 117, "tlines": ["majjāsaṃsthā, haṃsavatī-mukhyaśakti-samanvitā ।", "haridrānnaika rasikā, hākinī-rūpadhāriṇī ॥ 108 ॥"], "label": "Śloka 108"}, {"n": 118, "tlines": ["sahasradaḻa padmasthā, sarvavarṇōpa śōbhitā ।", "sarvāyudhadharā, śukla saṃsthitā, sarvatōmukhī ॥ 109 ॥"], "label": "Śloka 109"}, {"n": 119, "tlines": ["sarvaudana prītachittā, yākinyambā svarūpiṇī ।", "svāhā, svadhā,'mati, rmēdhā, śrutiḥ, smṛti, ranuttamā ॥ 110 ॥"], "label": "Śloka 110"}, {"n": 120, "tlines": ["puṇyakīrtiḥ, puṇyalabhyā, puṇyaśravaṇa kīrtanā ।", "pulōmajārchitā, bandhamōchanī, bandhurālakā ॥ 111 ॥"], "label": "Śloka 111"}, {"n": 121, "tlines": ["vimarśarūpiṇī, vidyā, viyadādi jagatprasūḥ ।", "sarvavyādhi praśamanī, sarvamṛtyu nivāriṇī ॥ 112 ॥"], "label": "Śloka 112"}, {"n": 122, "tlines": ["agragaṇyā,'chintyarūpā, kalikalmaṣa nāśinī ।", "kātyāyanī, kālahantrī, kamalākṣa niṣēvitā ॥ 113 ॥"], "label": "Śloka 113"}, {"n": 123, "tlines": ["tāmbūla pūrita mukhī, dāḍimī kusumaprabhā ।", "mṛgākṣī, mōhinī, mukhyā, mṛḍānī, mitrarūpiṇī ॥ 114 ॥"], "label": "Śloka 114"}, {"n": 124, "tlines": ["nityatṛptā, bhaktanidhi, rniyantrī, nikhilēśvarī ।", "maitryādi vāsanālabhyā, mahāpraḻaya sākṣiṇī ॥ 115 ॥"], "label": "Śloka 115"}, {"n": 125, "tlines": ["parāśaktiḥ, parāniṣṭhā, prajñāna ghanarūpiṇī ।", "mādhvīpānālasā, mattā, mātṛkā varṇa rūpiṇī ॥ 116 ॥"], "label": "Śloka 116"}, {"n": 126, "tlines": ["mahākailāsa nilayā, mṛṇāla mṛdudōrlatā ।", "mahanīyā, dayāmūrti, rmahāsāmrājyaśālinī ॥ 117 ॥"], "label": "Śloka 117"}, {"n": 127, "tlines": ["ātmavidyā, mahāvidyā, śrīvidyā, kāmasēvitā ।", "śrīṣōḍaśākṣarī vidyā, trikūṭā, kāmakōṭikā ॥ 118 ॥"], "label": "Śloka 118"}, {"n": 128, "tlines": ["kaṭākṣakiṅkarī bhūta kamalā kōṭisēvitā ।", "śiraḥsthitā, chandranibhā, phālasthēndra dhanuḥprabhā ॥ 119 ॥ [bhālasthēndra]"], "label": "Śloka 119"}, {"n": 129, "tlines": ["hṛdayasthā, raviprakhyā, trikōṇāntara dīpikā ।", "dākṣāyaṇī, daityahantrī, dakṣayajña vināśinī ॥ 120 ॥"], "label": "Śloka 120"}, {"n": 130, "tlines": ["darāndōḻita dīrghākṣī, darahāsōjjvalanmukhī ।", "gurumūrti, rguṇanidhi, rgōmātā, guhajanmabhūḥ ॥ 121 ॥"], "label": "Śloka 121"}, {"n": 131, "tlines": ["dēvēśī, daṇḍanītisthā, daharākāśa rūpiṇī ।", "pratipanmukhya rākānta tithimaṇḍala pūjitā ॥ 122 ॥"], "label": "Śloka 122"}, {"n": 132, "tlines": ["kaḻātmikā, kaḻānāthā, kāvyālāpa vinōdinī ।", "sachāmara ramāvāṇī savyadakṣiṇa sēvitā ॥ 123 ॥"], "label": "Śloka 123"}, {"n": 133, "tlines": ["ādiśakti, ramēyā,''tmā, paramā, pāvanākṛtiḥ ।", "anēkakōṭi brahmāṇḍa jananī, divyavigrahā ॥ 124 ॥"], "label": "Śloka 124"}, {"n": 134, "tlines": ["klīṅkārī, kēvalā, guhyā, kaivalya padadāyinī ।", "tripurā, trijagadvandyā, trimūrti, stridaśēśvarī ॥ 125 ॥"], "label": "Śloka 125"}, {"n": 135, "tlines": ["tryakṣarī, divyagandhāḍhyā, sindhūra tilakāñchitā ।", "umā, śailēndratanayā, gaurī, gandharva sēvitā ॥ 126 ॥"], "label": "Śloka 126"}, {"n": 136, "tlines": ["viśvagarbhā, svarṇagarbhā,'varadā vāgadhīśvarī ।", "dhyānagamyā,'parichChēdyā, jñānadā, jñānavigrahā ॥ 127 ॥"], "label": "Śloka 127"}, {"n": 137, "tlines": ["sarvavēdānta saṃvēdyā, satyānanda svarūpiṇī ।", "lōpāmudrārchitā, līlākḷpta brahmāṇḍamaṇḍalā ॥ 128 ॥"], "label": "Śloka 128"}, {"n": 138, "tlines": ["adṛśyā, dṛśyarahitā, vijñātrī, vēdyavarjitā ।", "yōginī, yōgadā, yōgyā, yōgānandā, yugandharā ॥ 129 ॥"], "label": "Śloka 129"}, {"n": 139, "tlines": ["ichChāśakti jñānaśakti kriyāśakti svarūpiṇī ।", "sarvādhārā, supratiṣṭhā, sadasad-rūpadhāriṇī ॥ 130 ॥"], "label": "Śloka 130"}, {"n": 140, "tlines": ["aṣṭamūrti, rajājaitrī, lōkayātrā vidhāyinī ।", "ēkākinī, bhūmarūpā, nirdvaitā, dvaitavarjitā ॥ 131 ॥"], "label": "Śloka 131"}, {"n": 141, "tlines": ["annadā, vasudā, vṛddhā, brahmātmaikya svarūpiṇī ।", "bṛhatī, brāhmaṇī, brāhmī, brahmānandā, balipriyā ॥ 132 ॥"], "label": "Śloka 132"}, {"n": 142, "tlines": ["bhāṣārūpā, bṛhatsēnā, bhāvābhāva vivarjitā ।", "sukhārādhyā, śubhakarī, śōbhanā sulabhāgatiḥ ॥ 133 ॥"], "label": "Śloka 133"}, {"n": 143, "tlines": ["rājarājēśvarī, rājyadāyinī, rājyavallabhā ।", "rājat-kṛpā, rājapīṭha nivēśita nijāśritā ॥ 134 ॥"], "label": "Śloka 134"}, {"n": 144, "tlines": ["rājyalakṣmīḥ, kōśanāthā, chaturaṅga balēśvarī ।", "sāmrājyadāyinī, satyasandhā, sāgaramēkhalā ॥ 135 ॥"], "label": "Śloka 135"}, {"n": 145, "tlines": ["dīkṣitā, daityaśamanī, sarvalōka vaśaṅkarī ।", "sarvārthadātrī, sāvitrī, sachchidānanda rūpiṇī ॥ 136 ॥"], "label": "Śloka 136"}, {"n": 146, "tlines": ["dēśakālā'parichChinnā, sarvagā, sarvamōhinī ।", "sarasvatī, śāstramayī, guhāmbā, guhyarūpiṇī ॥ 137 ॥"], "label": "Śloka 137"}, {"n": 147, "tlines": ["sarvōpādhi vinirmuktā, sadāśiva pativratā ।", "sampradāyēśvarī, sādhvī, gurumaṇḍala rūpiṇī ॥ 138 ॥"], "label": "Śloka 138"}, {"n": 148, "tlines": ["kulōttīrṇā, bhagārādhyā, māyā, madhumatī, mahī ।", "gaṇāmbā, guhyakārādhyā, kōmalāṅgī, gurupriyā ॥ 139 ॥"], "label": "Śloka 139"}, {"n": 149, "tlines": ["svatantrā, sarvatantrēśī, dakṣiṇāmūrti rūpiṇī ।", "sanakādi samārādhyā, śivajñāna pradāyinī ॥ 140 ॥"], "label": "Śloka 140"}, {"n": 150, "tlines": ["chitkaḻā,''nandakalikā, prēmarūpā, priyaṅkarī ।", "nāmapārāyaṇa prītā, nandividyā, naṭēśvarī ॥ 141 ॥"], "label": "Śloka 141"}, {"n": 151, "tlines": ["mithyā jagadadhiṣṭhānā muktidā, muktirūpiṇī ।", "lāsyapriyā, layakarī, lajjā, rambhādi vanditā ॥ 142 ॥"], "label": "Śloka 142"}, {"n": 152, "tlines": ["bhavadāva sudhāvṛṣṭiḥ, pāpāraṇya davānalā ।", "daurbhāgyatūla vātūlā, jarādhvānta raviprabhā ॥ 143 ॥"], "label": "Śloka 143"}, {"n": 153, "tlines": ["bhāgyābdhichandrikā, bhaktachittakēki ghanāghanā ।", "rōgaparvata dambhōḻi, rmṛtyudāru kuṭhārikā ॥ 144 ॥"], "label": "Śloka 144"}, {"n": 154, "tlines": ["mahēśvarī, mahākāḻī, mahāgrāsā, mahā'śanā ।", "aparṇā, chaṇḍikā, chaṇḍamuṇḍā'sura niṣūdinī ॥ 145 ॥"], "label": "Śloka 145"}, {"n": 155, "tlines": ["kṣarākṣarātmikā, sarvalōkēśī, viśvadhāriṇī ।", "trivargadātrī, subhagā, tryambakā, triguṇātmikā ॥ 146 ॥"], "label": "Śloka 146"}, {"n": 156, "tlines": ["svargāpavargadā, śuddhā, japāpuṣpa nibhākṛtiḥ ।", "ōjōvatī, dyutidharā, yajñarūpā, priyavratā ॥ 147 ॥"], "label": "Śloka 147"}, {"n": 157, "tlines": ["durārādhyā, durādharṣā, pāṭalī kusumapriyā ।", "mahatī, mērunilayā, mandāra kusumapriyā ॥ 148 ॥"], "label": "Śloka 148"}, {"n": 158, "tlines": ["vīrārādhyā, virāḍrūpā, virajā, viśvatōmukhī ।", "pratyagrūpā, parākāśā, prāṇadā, prāṇarūpiṇī ॥ 149 ॥"], "label": "Śloka 149"}, {"n": 159, "tlines": ["mārtāṇḍa bhairavārādhyā, mantriṇī nyastarājyadhūḥ ।", "tripurēśī, jayatsēnā, nistraiguṇyā, parāparā ॥ 150 ॥"], "label": "Śloka 150"}, {"n": 160, "tlines": ["satyajñānā'nandarūpā, sāmarasya parāyaṇā ।", "kapardinī, kalāmālā, kāmadhuk,kāmarūpiṇī ॥ 151 ॥"], "label": "Śloka 151"}, {"n": 161, "tlines": ["kaḻānidhiḥ, kāvyakaḻā, rasajñā, rasaśēvadhiḥ ।", "puṣṭā, purātanā, pūjyā, puṣkarā, puṣkarēkṣaṇā ॥ 152 ॥"], "label": "Śloka 152"}, {"n": 162, "tlines": ["parañjyōtiḥ, parandhāma, paramāṇuḥ, parātparā ।", "pāśahastā, pāśahantrī, paramantra vibhēdinī ॥ 153 ॥"], "label": "Śloka 153"}, {"n": 163, "tlines": ["mūrtā,'mūrtā,'nityatṛptā, muni mānasa haṃsikā ।", "satyavratā, satyarūpā, sarvāntaryāminī, satī ॥ 154 ॥"], "label": "Śloka 154"}, {"n": 164, "tlines": ["brahmāṇī, brahmajananī, bahurūpā, budhārchitā ।", "prasavitrī, prachaṇḍā''jñā, pratiṣṭhā, prakaṭākṛtiḥ ॥ 155 ॥"], "label": "Śloka 155"}, {"n": 165, "tlines": ["prāṇēśvarī, prāṇadātrī, pañchāśat-pīṭharūpiṇī ।", "viśṛṅkhalā, viviktasthā, vīramātā, viyatprasūḥ ॥ 156 ॥"], "label": "Śloka 156"}, {"n": 166, "tlines": ["mukundā, mukti nilayā, mūlavigraha rūpiṇī ।", "bhāvajñā, bhavarōgaghnī bhavachakra pravartinī ॥ 157 ॥"], "label": "Śloka 157"}, {"n": 167, "tlines": ["Chandassārā, śāstrasārā, mantrasārā, talōdarī ।", "udārakīrti, ruddāmavaibhavā, varṇarūpiṇī ॥ 158 ॥"], "label": "Śloka 158"}, {"n": 168, "tlines": ["janmamṛtyu jarātapta jana viśrānti dāyinī ।", "sarvōpaniṣa-dudghuṣṭā, śāntyatīta kaḻātmikā ॥ 159 ॥"], "label": "Śloka 159"}, {"n": 169, "tlines": ["gambhīrā, gaganāntaḥsthā, garvitā, gānalōlupā ।", "kalpanārahitā, kāṣṭhā,'kāntā, kāntārdha vigrahā ॥ 160 ॥"], "label": "Śloka 160"}, {"n": 170, "tlines": ["kāryakāraṇa nirmuktā, kāmakēḻi taraṅgitā ।", "kanat-kanakatāṭaṅkā, līlāvigraha dhāriṇī ॥ 161 ॥"], "label": "Śloka 161"}, {"n": 171, "tlines": ["ajākṣaya vinirmuktā, mugdhā kṣipraprasādinī ।", "antarmukha samārādhyā, bahirmukha sudurlabhā ॥ 162 ॥"], "label": "Śloka 162"}, {"n": 172, "tlines": ["trayī, trivarga nilayā, tristhā, tripuramālinī ।", "nirāmayā, nirālambā, svātmārāmā, sudhāsṛtiḥ ॥ 163 ॥"], "label": "Śloka 163"}, {"n": 173, "tlines": ["saṃsārapaṅka nirmagna samuddharaṇa paṇḍitā ।", "yajñapriyā, yajñakartrī, yajamāna svarūpiṇī ॥ 164 ॥"], "label": "Śloka 164"}, {"n": 174, "tlines": ["dharmādhārā, dhanādhyakṣā, dhanadhānya vivardhinī ।", "viprapriyā, viprarūpā, viśvabhramaṇa kāriṇī ॥ 165 ॥"], "label": "Śloka 165"}, {"n": 175, "tlines": ["viśvagrāsā, vidrumābhā, vaiṣṇavī, viṣṇurūpiṇī ।", "ayōni, ryōninilayā, kūṭasthā, kularūpiṇī ॥ 166 ॥"], "label": "Śloka 166"}, {"n": 176, "tlines": ["vīragōṣṭhīpriyā, vīrā, naiṣkarmyā, nādarūpiṇī ।", "vijñāna kalanā, kalyā vidagdhā, baindavāsanā ॥ 167 ॥"], "label": "Śloka 167"}, {"n": 177, "tlines": ["tattvādhikā, tattvamayī, tattvamartha svarūpiṇī ।", "sāmagānapriyā, saumyā, sadāśiva kuṭumbinī ॥ 168 ॥"], "label": "Śloka 168"}, {"n": 178, "tlines": ["savyāpasavya mārgasthā, sarvāpadvi nivāriṇī ।", "svasthā, svabhāvamadhurā, dhīrā, dhīra samarchitā ॥ 169 ॥"], "label": "Śloka 169"}, {"n": 179, "tlines": ["chaitanyārghya samārādhyā, chaitanya kusumapriyā ।", "sadōditā, sadātuṣṭā, taruṇāditya pāṭalā ॥ 170 ॥"], "label": "Śloka 170"}, {"n": 180, "tlines": ["dakṣiṇā, dakṣiṇārādhyā, darasmēra mukhāmbujā ।", "kauḻinī kēvalā,'narghyā kaivalya padadāyinī ॥ 171 ॥"], "label": "Śloka 171"}, {"n": 181, "tlines": ["stōtrapriyā, stutimatī, śrutisaṃstuta vaibhavā ।", "manasvinī, mānavatī, mahēśī, maṅgaḻākṛtiḥ ॥ 172 ॥"], "label": "Śloka 172"}, {"n": 182, "tlines": ["viśvamātā, jagaddhātrī, viśālākṣī, virāgiṇī।", "pragalbhā, paramōdārā, parāmōdā, manōmayī ॥ 173 ॥"], "label": "Śloka 173"}, {"n": 183, "tlines": ["vyōmakēśī, vimānasthā, vajriṇī, vāmakēśvarī ।", "pañchayajñapriyā, pañchaprēta mañchādhiśāyinī ॥ 174 ॥"], "label": "Śloka 174"}, {"n": 184, "tlines": ["pañchamī, pañchabhūtēśī, pañcha saṅkhyōpachāriṇī ।", "śāśvatī, śāśvataiśvaryā, śarmadā, śambhumōhinī ॥ 175 ॥"], "label": "Śloka 175"}, {"n": 185, "tlines": ["dharā, dharasutā, dhanyā, dharmiṇī, dharmavardhinī ।", "lōkātītā, guṇātītā, sarvātītā, śamātmikā ॥ 176 ॥"], "label": "Śloka 176"}, {"n": 186, "tlines": ["bandhūka kusuma prakhyā, bālā, līlāvinōdinī ।", "sumaṅgaḻī, sukhakarī, suvēṣāḍhyā, suvāsinī ॥ 177 ॥"], "label": "Śloka 177"}, {"n": 187, "tlines": ["suvāsinyarchanaprītā,''śōbhanā, śuddha mānasā ।", "bindu tarpaṇa santuṣṭā, pūrvajā, tripurāmbikā ॥ 178 ॥"], "label": "Śloka 178"}, {"n": 188, "tlines": ["daśamudrā samārādhyā, tripurā śrīvaśaṅkarī ।", "jñānamudrā, jñānagamyā, jñānajñēya svarūpiṇī ॥ 179 ॥"], "label": "Śloka 179"}, {"n": 189, "tlines": ["yōnimudrā, trikhaṇḍēśī, triguṇāmbā, trikōṇagā ।", "anaghādbhuta chāritrā, vāñChitārtha pradāyinī ॥ 180 ॥"], "label": "Śloka 180"}, {"n": 190, "tlines": ["abhyāsāti śayajñātā, ṣaḍadhvātīta rūpiṇī ।", "avyāja karuṇāmūrti, rajñānadhvānta dīpikā ॥ 181 ॥"], "label": "Śloka 181"}, {"n": 191, "tlines": ["ābālagōpa viditā, sarvānullaṅghya śāsanā ।", "śrī chakrarājanilayā, śrīmattripura sundarī ॥ 182 ॥"], "label": "Śloka 182"}, {"n": 192, "tlines": ["śrī śivā, śivaśaktyaikya rūpiṇī, lalitāmbikā ।", "ēvaṃ śrīlalitādēvyā nāmnāṃ sāhasrakaṃ jaguḥ ॥ 183 ॥"], "label": "Śloka 183"}, {"n": 193, "tlines": ["॥ iti śrī brahmāṇḍapurāṇē, uttarakhaṇḍē, śrī hayagrīvāgastya saṃvādē, śrī lalitā rahasyanāma sāhasrastōtra kathanaṃ nāma dvitīyō'dhyāyaḥ ॥"], "label": "Phalaśruti"}], "te": [{"n": 1, "tlines": ["ఓమ్ ॥", "అస్య శ్రీ లలితా దివ్య సహస్రనామ స్తోత్ర మహామంత్రస్య, వశిన్యాది వాగ్దేవతా ఋషయః, అనుష్టుప్ ఛందః, శ్రీ లలితా పరాభట్టారికా మహా త్రిపుర సుందరీ దేవతా, ఐం బీజం, క్లీం శక్తిః, సౌః కీలకం, మమ ధర్మార్థ కామ మోక్ష చతుర్విధ ఫలపురుషార్థ సిద్ధ్యర్థే లలితా త్రిపురసుందరీ పరాభట్టారికా సహస్ర నామ జపే వినియోగః"]}, {"n": 2, "tlines": ["ఐం అంగుష్ఠాభ్యాం నమః, క్లీం తర్జనీభ్యాం నమః, సౌః మధ్యమాభ్యాం నమః, సౌః అనామికాభ్యాం నమః, క్లీం కనిష్ఠికాభ్యాం నమః, ఐం కరతల కరపృష్ఠాభ్యాం నమః"]}, {"n": 3, "tlines": ["ఐం హృదయాయ నమః, క్లీం శిరసే స్వాహా, సౌః శిఖాయై వషట్, సౌః కవచాయ హుం, క్లీం నేత్రత్రయాయ వౌషట్, ఐం అస్త్రాయఫట్, భూర్భువస్సువరోమితి దిగ్బంధః"]}, {"n": 4, "tlines": ["అరుణాం కరుణా తరంగితాక్షీం ధృతపాశాంకుశ పుష్పబాణచాపామ్ ।", "అణిమాదిభి రావృతాం మయూఖైః అహమిత్యేవ విభావయే భవానీమ్ ॥ 1 ॥"]}, {"n": 5, "tlines": ["ధ్యాయేత్ పద్మాసనస్థాం వికసితవదనాం పద్మ పత్రాయతాక్షీం", "హేమాభాం పీతవస్త్రాం కరకలిత లసద్ధేమపద్మాం వరాంగీమ్ ।", "సర్వాలంకారయుక్తాం సకలమభయదాం భక్తనమ్రాం భవానీం", "శ్రీ విద్యాం శాంతమూర్తిం సకల సురనుతాం సర్వసంపత్-ప్రదాత్రీమ్ ॥ 2 ॥"]}, {"n": 6, "tlines": ["సకుంకుమ విలేపనా మళికచుంబి కస్తూరికాం", "సమంద హసితేక్షణాం సశరచాప పాశాంకుశామ్ ।", "అశేష జనమోహినీ మరుణమాల్య భూషోజ్జ్వలాం", "జపాకుసుమ భాసురాం జపవిధౌ స్మరే దంబికామ్ ॥ 3 ॥"]}, {"n": 7, "tlines": ["సింధూరారుణ విగ్రహాం త్రిణయనాం మాణిక్య మౌళిస్ఫుర-", "త్తారానాయక శేఖరాం స్మితముఖీ మాపీన వక్షోరుహామ్ ।", "పాణిభ్యా మలిపూర్ణ రత్న చషకం రక్తోత్పలం బిభ్రతీం", "సౌమ్యాం రత్నఘటస్థ రక్త చరణాం ధ్యాయేత్పరామంబికామ్ ॥ 4 ॥"]}, {"n": 8, "tlines": ["లం పృథివీ తత్త్వాత్మికాయై శ్రీ లలితాదేవ్యై గంధం పరికల్పయామి", "హం ఆకాశ తత్త్వాత్మికాయై శ్రీ లలితాదేవ్యై పుష్పం పరికల్పయామి", "యం వాయు తత్త్వాత్మికాయై శ్రీ లలితాదేవ్యై ధూపం పరికల్పయామి", "రం వహ్ని తత్త్వాత్మికాయై శ్రీ లలితాదేవ్యై దీపం పరికల్పయామి", "వం అమృత తత్త్వాత్మికాయై శ్రీ లలితాదేవ్యై అమృత నైవేద్యం పరికల్పయామి", "సం సర్వ తత్త్వాత్మికాయై శ్రీ లలితాదేవ్యై తాంబూలాది సర్వోపచారాన్ పరికల్పయామి"]}, {"n": 9, "tlines": ["గురుర్బ్రహ్మా గురుర్విష్ణుః గురుర్దేవో మహేశ్వరః ।", "గురుస్సాక్షాత్ పరబ్రహ్మ తస్మై శ్రీ గురవే నమః ॥", "హరిః ఓం"]}, {"n": 10, "tlines": ["శ్రీమాతా, శ్రీమహారాజ్ఞీ, శ్రీమత్-సింహాసనేశ్వరీ ।", "చిదగ్ని-కుండ-సంభూతా, దేవకార్య-సముద్యతా ॥ 1 ॥"]}, {"n": 11, "tlines": ["ఉద్యద్భాను-సహస్రాభా, చతుర్బాహు-సమన్వితా ।", "రాగస్వరూప-పాశాఢ్యా, క్రోధాకారాంకుశోజ్జ్వలా ॥ 2 ॥"]}, {"n": 12, "tlines": ["మనోరూపేక్షు-కోదండా, పంచతన్మాత్ర-సాయకా ।", "నిజారుణ ప్రభాపూర మజ్జద్-బ్రహ్మాండమండలా ॥ 3 ॥"]}, {"n": 13, "tlines": ["చంపకాశోక పున్నాగ సౌగంధిక లసత్కచా", "కురువింద మణిశ్రేణీ కనత్కోటీర మండితా ॥ 4 ॥"]}, {"n": 14, "tlines": ["అష్టమీ చంద్ర విభ్రాజ దళికస్థల శోభితా ।", "ముఖచంద్ర కళంకాభ మృగనాభి విశేషకా ॥ 5 ॥"]}, {"n": 15, "tlines": ["వదనస్మర మాంగల్య గృహతోరణ చిల్లికా ।", "వక్త్రలక్ష్మీ పరీవాహ చలన్మీనాభ లోచనా ॥ 6 ॥"]}, {"n": 16, "tlines": ["నవచంపక పుష్పాభ నాసాదండ విరాజితా ।", "తారాకాంతి తిరస్కారి నాసాభరణ భాసురా ॥ 7 ॥"]}, {"n": 17, "tlines": ["కదంబ మంజరీకౢప్త కర్ణపూర మనోహరా ।", "తాటంక యుగళీభూత తపనోడుప మండలా ॥ 8 ॥"]}, {"n": 18, "tlines": ["పద్మరాగ శిలాదర్శ పరిభావి కపోలభూః ।", "నవవిద్రుమ బింబశ్రీ న్యక్కారి రదనచ్ఛదా ॥ 9 ॥"]}, {"n": 19, "tlines": ["శుద్ధ విద్యాంకురాకార ద్విజపంక్తి ద్వయోజ్జ్వలా ।", "కర్పూరవీటి కామోద సమాకర్షద్దిగంతరా ॥ 10 ॥"]}, {"n": 20, "tlines": ["నిజసల్లాప మాధుర్య వినిర్భర్త్సిత కచ్ఛపీ ।", "మందస్మిత ప్రభాపూర మజ్జత్-కామేశ మానసా ॥ 11 ॥"]}, {"n": 21, "tlines": ["అనాకలిత సాదృశ్య చుబుక శ్రీ విరాజితా । [చిబుక]", "కామేశబద్ధ మాంగల్య సూత్రశోభిత కంధరా ॥ 12 ॥"]}, {"n": 22, "tlines": ["కనకాంగద కేయూర కమనీయ భుజాన్వితా ।", "రత్నగ్రైవేయ చింతాక లోలముక్తా ఫలాన్వితా ॥ 13 ॥"]}, {"n": 23, "tlines": ["కామేశ్వర ప్రేమరత్న మణి ప్రతిపణస్తనీ।", "నాభ్యాలవాల రోమాళి లతాఫల కుచద్వయీ ॥ 14 ॥"]}, {"n": 24, "tlines": ["లక్ష్యరోమలతా ధారతా సమున్నేయ మధ్యమా ।", "స్తనభార దళన్-మధ్య పట్టబంధ వళిత్రయా ॥ 15 ॥"]}, {"n": 25, "tlines": ["అరుణారుణ కౌసుంభ వస్త్ర భాస్వత్-కటీతటీ ।", "రత్నకింకిణి కారమ్య రశనాదామ భూషితా ॥ 16 ॥"]}, {"n": 26, "tlines": ["కామేశ జ్ఞాత సౌభాగ్య మార్దవోరు ద్వయాన్వితా ।", "మాణిక్య మకుటాకార జానుద్వయ విరాజితా ॥ 17 ॥"]}, {"n": 27, "tlines": ["ఇంద్రగోప పరిక్షిప్త స్మర తూణాభ జంఘికా ।", "గూఢగుల్ఫా కూర్మపృష్ఠ జయిష్ణు ప్రపదాన్వితా ॥ 18 ॥"]}, {"n": 28, "tlines": ["నఖదీధితి సంఛన్న నమజ్జన తమోగుణా ।", "పదద్వయ ప్రభాజాల పరాకృత సరోరుహా ॥ 19 ॥"]}, {"n": 29, "tlines": ["శింజాన మణిమంజీర మండిత శ్రీ పదాంబుజా ।", "మరాళీ మందగమనా, మహాలావణ్య శేవధిః ॥ 20 ॥"]}, {"n": 30, "tlines": ["సర్వారుణాఽనవద్యాంగీ సర్వాభరణ భూషితా ।", "శివకామేశ్వరాంకస్థా, శివా, స్వాధీన వల్లభా ॥ 21 ॥"]}, {"n": 31, "tlines": ["సుమేరు మధ్యశృంగస్థా, శ్రీమన్నగర నాయికా ।", "చింతామణి గృహాంతస్థా, పంచబ్రహ్మాసనస్థితా ॥ 22 ॥"]}, {"n": 32, "tlines": ["మహాపద్మాటవీ సంస్థా, కదంబ వనవాసినీ ।", "సుధాసాగర మధ్యస్థా, కామాక్షీ కామదాయినీ ॥ 23 ॥"]}, {"n": 33, "tlines": ["దేవర్షి గణసంఘాత స్తూయమానాత్మ వైభవా ।", "భండాసుర వధోద్యుక్త శక్తిసేనా సమన్వితా ॥ 24 ॥"]}, {"n": 34, "tlines": ["సంపత్కరీ సమారూఢ సింధుర వ్రజసేవితా ।", "అశ్వారూఢాధిష్ఠితాశ్వ కోటికోటి భిరావృతా ॥ 25 ॥"]}, {"n": 35, "tlines": ["చక్రరాజ రథారూఢ సర్వాయుధ పరిష్కృతా ।", "గేయచక్ర రథారూఢ మంత్రిణీ పరిసేవితా ॥ 26 ॥"]}, {"n": 36, "tlines": ["కిరిచక్ర రథారూఢ దండనాథా పురస్కృతా ।", "జ్వాలామాలిని కాక్షిప్త వహ్నిప్రాకార మధ్యగా ॥ 27 ॥"]}, {"n": 37, "tlines": ["భండసైన్య వధోద్యుక్త శక్తి విక్రమహర్షితా ।", "నిత్యా పరాక్రమాటోప నిరీక్షణ సముత్సుకా ॥ 28 ॥"]}, {"n": 38, "tlines": ["భండపుత్ర వధోద్యుక్త బాలావిక్రమ నందితా ।", "మంత్రిణ్యంబా విరచిత విషంగ వధతోషితా ॥ 29 ॥ [విశుక్ర]"]}, {"n": 39, "tlines": ["విశుక్ర ప్రాణహరణ వారాహీ వీర్యనందితా । [విషంగ]", "కామేశ్వర ముఖాలోక కల్పిత శ్రీ గణేశ్వరా ॥ 30 ॥"]}, {"n": 40, "tlines": ["మహాగణేశ నిర్భిన్న విఘ్నయంత్ర ప్రహర్షితా ।", "భండాసురేంద్ర నిర్ముక్త శస్త్ర ప్రత్యస్త్ర వర్షిణీ ॥ 31 ॥"]}, {"n": 41, "tlines": ["కరాంగుళి నఖోత్పన్న నారాయణ దశాకృతిః ।", "మహాపాశుపతాస్త్రాగ్ని నిర్దగ్ధాసుర సైనికా ॥ 32 ॥"]}, {"n": 42, "tlines": ["కామేశ్వరాస్త్ర నిర్దగ్ధ సభండాసుర శూన్యకా ।", "బ్రహ్మోపేంద్ర మహేంద్రాది దేవసంస్తుత వైభవా ॥ 33 ॥"]}, {"n": 43, "tlines": ["హరనేత్రాగ్ని సందగ్ధ కామ సంజీవనౌషధిః ।", "శ్రీమద్వాగ్భవ కూటైక స్వరూప ముఖపంకజా ॥ 34 ॥"]}, {"n": 44, "tlines": ["కంఠాధః కటిపర్యంత మధ్యకూట స్వరూపిణీ ।", "శక్తికూటైక తాపన్న కట్యధోభాగ ధారిణీ ॥ 35 ॥"]}, {"n": 45, "tlines": ["మూలమంత్రాత్మికా, మూలకూట త్రయ కళేవరా ।", "కుళామృతైక రసికా, కుళసంకేత పాలినీ ॥ 36 ॥"]}, {"n": 46, "tlines": ["కుళాంగనా, కుళాంతఃస్థా, కౌళినీ, కుళయోగినీ ।", "అకుళా, సమయాంతఃస్థా, సమయాచార తత్పరా ॥ 37 ॥"]}, {"n": 47, "tlines": ["మూలాధారైక నిలయా, బ్రహ్మగ్రంథి విభేదినీ ।", "మణిపూరాంత రుదితా, విష్ణుగ్రంథి విభేదినీ ॥ 38 ॥"]}, {"n": 48, "tlines": ["ఆజ్ఞా చక్రాంతరాళస్థా, రుద్రగ్రంథి విభేదినీ ।", "సహస్రారాంబుజా రూఢా, సుధాసారాభి వర్షిణీ ॥ 39 ॥"]}, {"n": 49, "tlines": ["తటిల్లతా సమరుచిః, షట్-చక్రోపరి సంస్థితా । [తడిల్లతా]", "మహాశక్తిః, కుండలినీ, బిసతంతు తనీయసీ ॥ 40 ॥"]}, {"n": 50, "tlines": ["భవానీ, భావనాగమ్యా, భవారణ్య కుఠారికా ।", "భద్రప్రియా, భద్రమూర్తి, ర్భక్తసౌభాగ్య దాయినీ ॥ 41 ॥"]}, {"n": 51, "tlines": ["భక్తిప్రియా, భక్తిగమ్యా, భక్తివశ్యా, భయాపహా ।", "శాంభవీ, శారదారాధ్యా, శర్వాణీ, శర్మదాయినీ ॥ 42 ॥"]}, {"n": 52, "tlines": ["శాంకరీ, శ్రీకరీ, సాధ్వీ, శరచ్చంద్రనిభాననా ।", "శాతోదరీ, శాంతిమతీ, నిరాధారా, నిరంజనా ॥ 43 ॥"]}, {"n": 53, "tlines": ["నిర్లేపా, నిర్మలా, నిత్యా, నిరాకారా, నిరాకులా ।", "నిర్గుణా, నిష్కళా, శాంతా, నిష్కామా, నిరుపప్లవా ॥ 44 ॥"]}, {"n": 54, "tlines": ["నిత్యముక్తా, నిర్వికారా, నిష్ప్రపంచా, నిరాశ్రయా ।", "నిత్యశుద్ధా, నిత్యబుద్ధా, నిరవద్యా, నిరంతరా ॥ 45 ॥"]}, {"n": 55, "tlines": ["నిష్కారణా, నిష్కళంకా, నిరుపాధి, ర్నిరీశ్వరా ।", "నీరాగా, రాగమథనీ, నిర్మదా, మదనాశినీ ॥ 46 ॥"]}, {"n": 56, "tlines": ["నిశ్చింతా, నిరహంకారా, నిర్మోహా, మోహనాశినీ ।", "నిర్మమా, మమతాహంత్రీ, నిష్పాపా, పాపనాశినీ ॥ 47 ॥"]}, {"n": 57, "tlines": ["నిష్క్రోధా, క్రోధశమనీ, నిర్లోభా, లోభనాశినీ ।", "నిఃసంశయా, సంశయఘ్నీ, నిర్భవా, భవనాశినీ ॥ 48 ॥"]}, {"n": 58, "tlines": ["నిర్వికల్పా, నిరాబాధా, నిర్భేదా, భేదనాశినీ ।", "నిర్నాశా, మృత్యుమథనీ, నిష్క్రియా, నిష్పరిగ్రహా ॥ 49 ॥"]}, {"n": 59, "tlines": ["నిస్తులా, నీలచికురా, నిరపాయా, నిరత్యయా ।", "దుర్లభా, దుర్గమా, దుర్గా, దుఃఖహంత్రీ, సుఖప్రదా ॥ 50 ॥"]}, {"n": 60, "tlines": ["దుష్టదూరా, దురాచార శమనీ, దోషవర్జితా ।", "సర్వజ్ఞా, సాంద్రకరుణా, సమానాధికవర్జితా ॥ 51 ॥"]}, {"n": 61, "tlines": ["సర్వశక్తిమయీ, సర్వమంగళా, సద్గతిప్రదా ।", "సర్వేశ్వరీ, సర్వమయీ, సర్వమంత్ర స్వరూపిణీ ॥ 52 ॥"]}, {"n": 62, "tlines": ["సర్వయంత్రాత్మికా, సర్వతంత్రరూపా, మనోన్మనీ ।", "మాహేశ్వరీ, మహాదేవీ, మహాలక్ష్మీ, ర్మృడప్రియా ॥ 53 ॥"]}, {"n": 63, "tlines": ["మహారూపా, మహాపూజ్యా, మహాపాతక నాశినీ ।", "మహామాయా, మహాసత్త్వా, మహాశక్తి ర్మహారతిః ॥ 54 ॥"]}, {"n": 64, "tlines": ["మహాభోగా, మహైశ్వర్యా, మహావీర్యా, మహాబలా ।", "మహాబుద్ధి, ర్మహాసిద్ధి, ర్మహాయోగేశ్వరేశ్వరీ ॥ 55 ॥"]}, {"n": 65, "tlines": ["మహాతంత్రా, మహామంత్రా, మహాయంత్రా, మహాసనా ।", "మహాయాగ క్రమారాధ్యా, మహాభైరవ పూజితా ॥ 56 ॥"]}, {"n": 66, "tlines": ["మహేశ్వర మహాకల్ప మహాతాండవ సాక్షిణీ ।", "మహాకామేశ మహిషీ, మహాత్రిపుర సుందరీ ॥ 57 ॥"]}, {"n": 67, "tlines": ["చతుఃషష్ట్యుపచారాఢ్యా, చతుష్షష్టి కళామయీ ।", "మహా చతుష్షష్టి కోటి యోగినీ గణసేవితా ॥ 58 ॥"]}, {"n": 68, "tlines": ["మనువిద్యా, చంద్రవిద్యా, చంద్రమండలమధ్యగా ।", "చారురూపా, చారుహాసా, చారుచంద్ర కళాధరా ॥ 59 ॥"]}, {"n": 69, "tlines": ["చరాచర జగన్నాథా, చక్రరాజ నికేతనా ।", "పార్వతీ, పద్మనయనా, పద్మరాగ సమప్రభా ॥ 60 ॥"]}, {"n": 70, "tlines": ["పంచప్రేతాసనాసీనా, పంచబ్రహ్మ స్వరూపిణీ ।", "చిన్మయీ, పరమానందా, విజ్ఞాన ఘనరూపిణీ ॥ 61 ॥"]}, {"n": 71, "tlines": ["ధ్యానధ్యాతృ ధ్యేయరూపా, ధర్మాధర్మ వివర్జితా ।", "విశ్వరూపా, జాగరిణీ, స్వపంతీ, తైజసాత్మికా ॥ 62 ॥"]}, {"n": 72, "tlines": ["సుప్తా, ప్రాజ్ఞాత్మికా, తుర్యా, సర్వావస్థా వివర్జితా ।", "సృష్టికర్త్రీ, బ్రహ్మరూపా, గోప్త్రీ, గోవిందరూపిణీ ॥ 63 ॥"]}, {"n": 73, "tlines": ["సంహారిణీ, రుద్రరూపా, తిరోధానకరీశ్వరీ ।", "సదాశివానుగ్రహదా, పంచకృత్య పరాయణా ॥ 64 ॥"]}, {"n": 74, "tlines": ["భానుమండల మధ్యస్థా, భైరవీ, భగమాలినీ ।", "పద్మాసనా, భగవతీ, పద్మనాభ సహోదరీ ॥ 65 ॥"]}, {"n": 75, "tlines": ["ఉన్మేష నిమిషోత్పన్న విపన్న భువనావళిః ।", "సహస్రశీర్షవదనా, సహస్రాక్షీ, సహస్రపాత్ ॥ 66 ॥"]}, {"n": 76, "tlines": ["ఆబ్రహ్మ కీటజననీ, వర్ణాశ్రమ విధాయినీ ।", "నిజాజ్ఞారూపనిగమా, పుణ్యాపుణ్య ఫలప్రదా ॥ 67 ॥"]}, {"n": 77, "tlines": ["శ్రుతి సీమంత సింధూరీకృత పాదాబ్జధూళికా ।", "సకలాగమ సందోహ శుక్తిసంపుట మౌక్తికా ॥ 68 ॥"]}, {"n": 78, "tlines": ["పురుషార్థప్రదా, పూర్ణా, భోగినీ, భువనేశ్వరీ ।", "అంబికా,ఽనాది నిధనా, హరిబ్రహ్మేంద్ర సేవితా ॥ 69 ॥"]}, {"n": 79, "tlines": ["నారాయణీ, నాదరూపా, నామరూప వివర్జితా ।", "హ్రీంకారీ, హ్రీమతీ, హృద్యా, హేయోపాదేయ వర్జితా ॥ 70 ॥"]}, {"n": 80, "tlines": ["రాజరాజార్చితా, రాజ్ఞీ, రమ్యా, రాజీవలోచనా ।", "రంజనీ, రమణీ, రస్యా, రణత్కింకిణి మేఖలా ॥ 71 ॥"]}, {"n": 81, "tlines": ["రమా, రాకేందువదనా, రతిరూపా, రతిప్రియా ।", "రక్షాకరీ, రాక్షసఘ్నీ, రామా, రమణలంపటా ॥ 72 ॥"]}, {"n": 82, "tlines": ["కామ్యా, కామకళారూపా, కదంబ కుసుమప్రియా ।", "కళ్యాణీ, జగతీకందా, కరుణారస సాగరా ॥ 73 ॥"]}, {"n": 83, "tlines": ["కళావతీ, కళాలాపా, కాంతా, కాదంబరీప్రియా ।", "వరదా, వామనయనా, వారుణీమదవిహ్వలా ॥ 74 ॥"]}, {"n": 84, "tlines": ["విశ్వాధికా, వేదవేద్యా, వింధ్యాచల నివాసినీ ।", "విధాత్రీ, వేదజననీ, విష్ణుమాయా, విలాసినీ ॥ 75 ॥"]}, {"n": 85, "tlines": ["క్షేత్రస్వరూపా, క్షేత్రేశీ, క్షేత్ర క్షేత్రజ్ఞ పాలినీ ।", "క్షయవృద్ధి వినిర్ముక్తా, క్షేత్రపాల సమర్చితా ॥ 76 ॥"]}, {"n": 86, "tlines": ["విజయా, విమలా, వంద్యా, వందారు జనవత్సలా ।", "వాగ్వాదినీ, వామకేశీ, వహ్నిమండల వాసినీ ॥ 77 ॥"]}, {"n": 87, "tlines": ["భక్తిమత్-కల్పలతికా, పశుపాశ విమోచనీ ।", "సంహృతాశేష పాషండా, సదాచార ప్రవర్తికా ॥ 78 ॥"]}, {"n": 88, "tlines": ["తాపత్రయాగ్ని సంతప్త సమాహ్లాదన చంద్రికా ।", "తరుణీ, తాపసారాధ్యా, తనుమధ్యా, తమోఽపహా ॥ 79 ॥"]}, {"n": 89, "tlines": ["చితి, స్తత్పదలక్ష్యార్థా, చిదేక రసరూపిణీ ।", "స్వాత్మానందలవీభూత బ్రహ్మాద్యానంద సంతతిః ॥ 80 ॥"]}, {"n": 90, "tlines": ["పరా, ప్రత్యక్చితీ రూపా, పశ్యంతీ, పరదేవతా ।", "మధ్యమా, వైఖరీరూపా, భక్తమానస హంసికా ॥ 81 ॥"]}, {"n": 91, "tlines": ["కామేశ్వర ప్రాణనాడీ, కృతజ్ఞా, కామపూజితా ।", "శృంగార రససంపూర్ణా, జయా, జాలంధరస్థితా ॥ 82 ॥"]}, {"n": 92, "tlines": ["ఓడ్యాణ పీఠనిలయా, బిందుమండల వాసినీ ।", "రహోయాగ క్రమారాధ్యా, రహస్తర్పణ తర్పితా ॥ 83 ॥"]}, {"n": 93, "tlines": ["సద్యః ప్రసాదినీ, విశ్వసాక్షిణీ, సాక్షివర్జితా ।", "షడంగదేవతా యుక్తా, షాడ్గుణ్య పరిపూరితా ॥ 84 ॥"]}, {"n": 94, "tlines": ["నిత్యక్లిన్నా, నిరుపమా, నిర్వాణ సుఖదాయినీ ।", "నిత్యా, షోడశికారూపా, శ్రీకంఠార్ధ శరీరిణీ ॥ 85 ॥"]}, {"n": 95, "tlines": ["ప్రభావతీ, ప్రభారూపా, ప్రసిద్ధా, పరమేశ్వరీ ।", "మూలప్రకృతి రవ్యక్తా, వ్యక్తాఽవ్యక్త స్వరూపిణీ ॥ 86 ॥"]}, {"n": 96, "tlines": ["వ్యాపినీ, వివిధాకారా, విద్యాఽవిద్యా స్వరూపిణీ ।", "మహాకామేశ నయనా కుముదాహ్లాద కౌముదీ ॥ 87 ॥"]}, {"n": 97, "tlines": ["భక్తహార్ద తమోభేద భానుమద్-భానుసంతతిః ।", "శివదూతీ, శివారాధ్యా, శివమూర్తి, శ్శివంకరీ ॥ 88 ॥"]}, {"n": 98, "tlines": ["శివప్రియా, శివపరా, శిష్టేష్టా, శిష్టపూజితా ।", "అప్రమేయా, స్వప్రకాశా, మనోవాచామ గోచరా ॥ 89 ॥"]}, {"n": 99, "tlines": ["చిచ్ఛక్తి, శ్చేతనారూపా, జడశక్తి, ర్జడాత్మికా ।", "గాయత్రీ, వ్యాహృతి, స్సంధ్యా, ద్విజబృంద నిషేవితా ॥ 90 ॥ [ద్విజవృంద]"]}, {"n": 100, "tlines": ["తత్త్వాసనా, తత్త్వమయీ, పంచకోశాంతరస్థితా ।", "నిస్సీమమహిమా, నిత్యయౌవనా, మదశాలినీ ॥ 91 ॥"]}, {"n": 101, "tlines": ["మదఘూర్ణిత రక్తాక్షీ, మదపాటల గండభూః ।", "చందన ద్రవదిగ్ధాంగీ, చాంపేయ కుసుమ ప్రియా ॥ 92 ॥"]}, {"n": 102, "tlines": ["కుశలా, కోమలాకారా, కురుకుళ్ళా, కులేశ్వరీ ।", "కుళకుండాలయా, కౌళ మార్గతత్పర సేవితా ॥ 93 ॥"]}, {"n": 103, "tlines": ["కుమార గణనాథాంబా, తుష్టిః, పుష్టి, ర్మతి, ర్ధృతిః ।", "శాంతిః, స్వస్తిమతీ, కాంతి, ర్నందినీ, విఘ్ననాశినీ ॥ 94 ॥"]}, {"n": 104, "tlines": ["తేజోవతీ, త్రినయనా, లోలాక్షీ కామరూపిణీ ।", "మాలినీ, హంసినీ, మాతా, మలయాచల వాసినీ ॥ 95 ॥"]}, {"n": 105, "tlines": ["సుముఖీ, నళినీ, సుభ్రూః, శోభనా, సురనాయికా ।", "కాలకంఠీ, కాంతిమతీ, క్షోభిణీ, సూక్ష్మరూపిణీ ॥ 96 ॥"]}, {"n": 106, "tlines": ["వజ్రేశ్వరీ, వామదేవీ, వయోఽవస్థా వివర్జితా ।", "సిద్ధేశ్వరీ, సిద్ధవిద్యా, సిద్ధమాతా, యశస్వినీ ॥ 97 ॥"]}, {"n": 107, "tlines": ["విశుద్ధి చక్రనిలయా,ఽఽరక్తవర్ణా, త్రిలోచనా ।", "ఖట్వాంగాది ప్రహరణా, వదనైక సమన్వితా ॥ 98 ॥"]}, {"n": 108, "tlines": ["పాయసాన్నప్రియా, త్వక్​స్థా, పశులోక భయంకరీ ।", "అమృతాది మహాశక్తి సంవృతా, డాకినీశ్వరీ ॥ 99 ॥"]}, {"n": 109, "tlines": ["అనాహతాబ్జ నిలయా, శ్యామాభా, వదనద్వయా ।", "దంష్ట్రోజ్జ్వలా,ఽక్షమాలాదిధరా, రుధిర సంస్థితా ॥ 100 ॥"]}, {"n": 110, "tlines": ["కాళరాత్ర్యాది శక్త్యౌఘవృతా, స్నిగ్ధౌదనప్రియా ।", "మహావీరేంద్ర వరదా, రాకిణ్యంబా స్వరూపిణీ ॥ 101 ॥"]}, {"n": 111, "tlines": ["మణిపూరాబ్జ నిలయా, వదనత్రయ సంయుతా ।", "వజ్రాదికాయుధోపేతా, డామర్యాదిభి రావృతా ॥ 102 ॥"]}, {"n": 112, "tlines": ["రక్తవర్ణా, మాంసనిష్ఠా, గుడాన్న ప్రీతమానసా ।", "సమస్త భక్తసుఖదా, లాకిన్యంబా స్వరూపిణీ ॥ 103 ॥"]}, {"n": 113, "tlines": ["స్వాధిష్ఠానాంబుజగతా, చతుర్వక్త్ర మనోహరా ।", "శూలాద్యాయుధ సంపన్నా, పీతవర్ణా,ఽతిగర్వితా ॥ 104 ॥"]}, {"n": 114, "tlines": ["మేదోనిష్ఠా, మధుప్రీతా, బందిన్యాది సమన్వితా । [బంధిన్యాది]", "దధ్యన్నాసక్త హృదయా, కాకినీ-రూపధారిణీ ॥ 105 ॥"]}, {"n": 115, "tlines": ["మూలాధారాంబుజారూఢా, పంచవక్త్రా,ఽస్థిసంస్థితా ।", "అంకుశాది ప్రహరణా, వరదాది నిషేవితా ॥ 106 ॥"]}, {"n": 116, "tlines": ["ముద్గౌదనాసక్త చిత్తా, సాకిన్యంబాస్వరూపిణీ ।", "ఆజ్ఞా చక్రాబ్జనిలయా, శుక్లవర్ణా, షడాననా ॥ 107 ॥"]}, {"n": 117, "tlines": ["మజ్జాసంస్థా, హంసవతీ-ముఖ్యశక్తి-సమన్వితా ।", "హరిద్రాన్నైక రసికా, హాకినీ-రూపధారిణీ ॥ 108 ॥"]}, {"n": 118, "tlines": ["సహస్రదళ పద్మస్థా, సర్వవర్ణోప శోభితా ।", "సర్వాయుధధరా, శుక్ల సంస్థితా, సర్వతోముఖీ ॥ 109 ॥"]}, {"n": 119, "tlines": ["సర్వౌదన ప్రీతచిత్తా, యాకిన్యంబా స్వరూపిణీ ।", "స్వాహా, స్వధా,ఽమతి, ర్మేధా, శ్రుతిః, స్మృతి, రనుత్తమా ॥ 110 ॥"]}, {"n": 120, "tlines": ["పుణ్యకీర్తిః, పుణ్యలభ్యా, పుణ్యశ్రవణ కీర్తనా ।", "పులోమజార్చితా, బంధమోచనీ, బంధురాలకా ॥ 111 ॥"]}, {"n": 121, "tlines": ["విమర్శరూపిణీ, విద్యా, వియదాది జగత్ప్రసూః ।", "సర్వవ్యాధి ప్రశమనీ, సర్వమృత్యు నివారిణీ ॥ 112 ॥"]}, {"n": 122, "tlines": ["అగ్రగణ్యా,ఽచింత్యరూపా, కలికల్మష నాశినీ ।", "కాత్యాయనీ, కాలహంత్రీ, కమలాక్ష నిషేవితా ॥ 113 ॥"]}, {"n": 123, "tlines": ["తాంబూల పూరిత ముఖీ, దాడిమీ కుసుమప్రభా ।", "మృగాక్షీ, మోహినీ, ముఖ్యా, మృడానీ, మిత్రరూపిణీ ॥ 114 ॥"]}, {"n": 124, "tlines": ["నిత్యతృప్తా, భక్తనిధి, ర్నియంత్రీ, నిఖిలేశ్వరీ ।", "మైత్ర్యాది వాసనాలభ్యా, మహాప్రళయ సాక్షిణీ ॥ 115 ॥"]}, {"n": 125, "tlines": ["పరాశక్తిః, పరానిష్ఠా, ప్రజ్ఞాన ఘనరూపిణీ ।", "మాధ్వీపానాలసా, మత్తా, మాతృకా వర్ణ రూపిణీ ॥ 116 ॥"]}, {"n": 126, "tlines": ["మహాకైలాస నిలయా, మృణాల మృదుదోర్లతా ।", "మహనీయా, దయామూర్తి, ర్మహాసామ్రాజ్యశాలినీ ॥ 117 ॥"]}, {"n": 127, "tlines": ["ఆత్మవిద్యా, మహావిద్యా, శ్రీవిద్యా, కామసేవితా ।", "శ్రీషోడశాక్షరీ విద్యా, త్రికూటా, కామకోటికా ॥ 118 ॥"]}, {"n": 128, "tlines": ["కటాక్షకింకరీ భూత కమలా కోటిసేవితా ।", "శిరఃస్థితా, చంద్రనిభా, ఫాలస్థేంద్ర ధనుఃప్రభా ॥ 119 ॥ [భాలస్థేంద్ర]"]}, {"n": 129, "tlines": ["హృదయస్థా, రవిప్రఖ్యా, త్రికోణాంతర దీపికా ।", "దాక్షాయణీ, దైత్యహంత్రీ, దక్షయజ్ఞ వినాశినీ ॥ 120 ॥"]}, {"n": 130, "tlines": ["దరాందోళిత దీర్ఘాక్షీ, దరహాసోజ్జ్వలన్ముఖీ ।", "గురుమూర్తి, ర్గుణనిధి, ర్గోమాతా, గుహజన్మభూః ॥ 121 ॥"]}, {"n": 131, "tlines": ["దేవేశీ, దండనీతిస్థా, దహరాకాశ రూపిణీ ।", "ప్రతిపన్ముఖ్య రాకాంత తిథిమండల పూజితా ॥ 122 ॥"]}, {"n": 132, "tlines": ["కళాత్మికా, కళానాథా, కావ్యాలాప వినోదినీ ।", "సచామర రమావాణీ సవ్యదక్షిణ సేవితా ॥ 123 ॥"]}, {"n": 133, "tlines": ["ఆదిశక్తి, రమేయా,ఽఽత్మా, పరమా, పావనాకృతిః ।", "అనేకకోటి బ్రహ్మాండ జననీ, దివ్యవిగ్రహా ॥ 124 ॥"]}, {"n": 134, "tlines": ["క్లీంకారీ, కేవలా, గుహ్యా, కైవల్య పదదాయినీ ।", "త్రిపురా, త్రిజగద్వంద్యా, త్రిమూర్తి, స్త్రిదశేశ్వరీ ॥ 125 ॥"]}, {"n": 135, "tlines": ["త్ర్యక్షరీ, దివ్యగంధాఢ్యా, సింధూర తిలకాంచితా ।", "ఉమా, శైలేంద్రతనయా, గౌరీ, గంధర్వ సేవితా ॥ 126 ॥"]}, {"n": 136, "tlines": ["విశ్వగర్భా, స్వర్ణగర్భా,ఽవరదా వాగధీశ్వరీ ।", "ధ్యానగమ్యా,ఽపరిచ్ఛేద్యా, జ్ఞానదా, జ్ఞానవిగ్రహా ॥ 127 ॥"]}, {"n": 137, "tlines": ["సర్వవేదాంత సంవేద్యా, సత్యానంద స్వరూపిణీ ।", "లోపాముద్రార్చితా, లీలాకౢప్త బ్రహ్మాండమండలా ॥ 128 ॥"]}, {"n": 138, "tlines": ["అదృశ్యా, దృశ్యరహితా, విజ్ఞాత్రీ, వేద్యవర్జితా ।", "యోగినీ, యోగదా, యోగ్యా, యోగానందా, యుగంధరా ॥ 129 ॥"]}, {"n": 139, "tlines": ["ఇచ్ఛాశక్తి జ్ఞానశక్తి క్రియాశక్తి స్వరూపిణీ ।", "సర్వాధారా, సుప్రతిష్ఠా, సదసద్-రూపధారిణీ ॥ 130 ॥"]}, {"n": 140, "tlines": ["అష్టమూర్తి, రజాజైత్రీ, లోకయాత్రా విధాయినీ ।", "ఏకాకినీ, భూమరూపా, నిర్ద్వైతా, ద్వైతవర్జితా ॥ 131 ॥"]}, {"n": 141, "tlines": ["అన్నదా, వసుదా, వృద్ధా, బ్రహ్మాత్మైక్య స్వరూపిణీ ।", "బృహతీ, బ్రాహ్మణీ, బ్రాహ్మీ, బ్రహ్మానందా, బలిప్రియా ॥ 132 ॥"]}, {"n": 142, "tlines": ["భాషారూపా, బృహత్సేనా, భావాభావ వివర్జితా ।", "సుఖారాధ్యా, శుభకరీ, శోభనా సులభాగతిః ॥ 133 ॥"]}, {"n": 143, "tlines": ["రాజరాజేశ్వరీ, రాజ్యదాయినీ, రాజ్యవల్లభా ।", "రాజత్-కృపా, రాజపీఠ నివేశిత నిజాశ్రితా ॥ 134 ॥"]}, {"n": 144, "tlines": ["రాజ్యలక్ష్మీః, కోశనాథా, చతురంగ బలేశ్వరీ ।", "సామ్రాజ్యదాయినీ, సత్యసంధా, సాగరమేఖలా ॥ 135 ॥"]}, {"n": 145, "tlines": ["దీక్షితా, దైత్యశమనీ, సర్వలోక వశంకరీ ।", "సర్వార్థదాత్రీ, సావిత్రీ, సచ్చిదానంద రూపిణీ ॥ 136 ॥"]}, {"n": 146, "tlines": ["దేశకాలాఽపరిచ్ఛిన్నా, సర్వగా, సర్వమోహినీ ।", "సరస్వతీ, శాస్త్రమయీ, గుహాంబా, గుహ్యరూపిణీ ॥ 137 ॥"]}, {"n": 147, "tlines": ["సర్వోపాధి వినిర్ముక్తా, సదాశివ పతివ్రతా ।", "సంప్రదాయేశ్వరీ, సాధ్వీ, గురుమండల రూపిణీ ॥ 138 ॥"]}, {"n": 148, "tlines": ["కులోత్తీర్ణా, భగారాధ్యా, మాయా, మధుమతీ, మహీ ।", "గణాంబా, గుహ్యకారాధ్యా, కోమలాంగీ, గురుప్రియా ॥ 139 ॥"]}, {"n": 149, "tlines": ["స్వతంత్రా, సర్వతంత్రేశీ, దక్షిణామూర్తి రూపిణీ ।", "సనకాది సమారాధ్యా, శివజ్ఞాన ప్రదాయినీ ॥ 140 ॥"]}, {"n": 150, "tlines": ["చిత్కళా,ఽఽనందకలికా, ప్రేమరూపా, ప్రియంకరీ ।", "నామపారాయణ ప్రీతా, నందివిద్యా, నటేశ్వరీ ॥ 141 ॥"]}, {"n": 151, "tlines": ["మిథ్యా జగదధిష్ఠానా ముక్తిదా, ముక్తిరూపిణీ ।", "లాస్యప్రియా, లయకరీ, లజ్జా, రంభాది వందితా ॥ 142 ॥"]}, {"n": 152, "tlines": ["భవదావ సుధావృష్టిః, పాపారణ్య దవానలా ।", "దౌర్భాగ్యతూల వాతూలా, జరాధ్వాంత రవిప్రభా ॥ 143 ॥"]}, {"n": 153, "tlines": ["భాగ్యాబ్ధిచంద్రికా, భక్తచిత్తకేకి ఘనాఘనా ।", "రోగపర్వత దంభోళి, ర్మృత్యుదారు కుఠారికా ॥ 144 ॥"]}, {"n": 154, "tlines": ["మహేశ్వరీ, మహాకాళీ, మహాగ్రాసా, మహాఽశనా ।", "అపర్ణా, చండికా, చండముండాఽసుర నిషూదినీ ॥ 145 ॥"]}, {"n": 155, "tlines": ["క్షరాక్షరాత్మికా, సర్వలోకేశీ, విశ్వధారిణీ ।", "త్రివర్గదాత్రీ, సుభగా, త్ర్యంబకా, త్రిగుణాత్మికా ॥ 146 ॥"]}, {"n": 156, "tlines": ["స్వర్గాపవర్గదా, శుద్ధా, జపాపుష్ప నిభాకృతిః ।", "ఓజోవతీ, ద్యుతిధరా, యజ్ఞరూపా, ప్రియవ్రతా ॥ 147 ॥"]}, {"n": 157, "tlines": ["దురారాధ్యా, దురాధర్షా, పాటలీ కుసుమప్రియా ।", "మహతీ, మేరునిలయా, మందార కుసుమప్రియా ॥ 148 ॥"]}, {"n": 158, "tlines": ["వీరారాధ్యా, విరాడ్రూపా, విరజా, విశ్వతోముఖీ ।", "ప్రత్యగ్రూపా, పరాకాశా, ప్రాణదా, ప్రాణరూపిణీ ॥ 149 ॥"]}, {"n": 159, "tlines": ["మార్తాండ భైరవారాధ్యా, మంత్రిణీ న్యస్తరాజ్యధూః ।", "త్రిపురేశీ, జయత్సేనా, నిస్త్రైగుణ్యా, పరాపరా ॥ 150 ॥"]}, {"n": 160, "tlines": ["సత్యజ్ఞానాఽనందరూపా, సామరస్య పరాయణా ।", "కపర్దినీ, కలామాలా, కామధుక్,కామరూపిణీ ॥ 151 ॥"]}, {"n": 161, "tlines": ["కళానిధిః, కావ్యకళా, రసజ్ఞా, రసశేవధిః ।", "పుష్టా, పురాతనా, పూజ్యా, పుష్కరా, పుష్కరేక్షణా ॥ 152 ॥"]}, {"n": 162, "tlines": ["పరంజ్యోతిః, పరంధామ, పరమాణుః, పరాత్పరా ।", "పాశహస్తా, పాశహంత్రీ, పరమంత్ర విభేదినీ ॥ 153 ॥"]}, {"n": 163, "tlines": ["మూర్తా,ఽమూర్తా,ఽనిత్యతృప్తా, ముని మానస హంసికా ।", "సత్యవ్రతా, సత్యరూపా, సర్వాంతర్యామినీ, సతీ ॥ 154 ॥"]}, {"n": 164, "tlines": ["బ్రహ్మాణీ, బ్రహ్మజననీ, బహురూపా, బుధార్చితా ।", "ప్రసవిత్రీ, ప్రచండాఽఽజ్ఞా, ప్రతిష్ఠా, ప్రకటాకృతిః ॥ 155 ॥"]}, {"n": 165, "tlines": ["ప్రాణేశ్వరీ, ప్రాణదాత్రీ, పంచాశత్-పీఠరూపిణీ ।", "విశృంఖలా, వివిక్తస్థా, వీరమాతా, వియత్ప్రసూః ॥ 156 ॥"]}, {"n": 166, "tlines": ["ముకుందా, ముక్తి నిలయా, మూలవిగ్రహ రూపిణీ ।", "భావజ్ఞా, భవరోగఘ్నీ భవచక్ర ప్రవర్తినీ ॥ 157 ॥"]}, {"n": 167, "tlines": ["ఛందస్సారా, శాస్త్రసారా, మంత్రసారా, తలోదరీ ।", "ఉదారకీర్తి, రుద్దామవైభవా, వర్ణరూపిణీ ॥ 158 ॥"]}, {"n": 168, "tlines": ["జన్మమృత్యు జరాతప్త జన విశ్రాంతి దాయినీ ।", "సర్వోపనిష-దుద్ఘుష్టా, శాంత్యతీత కళాత్మికా ॥ 159 ॥"]}, {"n": 169, "tlines": ["గంభీరా, గగనాంతఃస్థా, గర్వితా, గానలోలుపా ।", "కల్పనారహితా, కాష్ఠా,ఽకాంతా, కాంతార్ధ విగ్రహా ॥ 160 ॥"]}, {"n": 170, "tlines": ["కార్యకారణ నిర్ముక్తా, కామకేళి తరంగితా ।", "కనత్-కనకతాటంకా, లీలావిగ్రహ ధారిణీ ॥ 161 ॥"]}, {"n": 171, "tlines": ["అజాక్షయ వినిర్ముక్తా, ముగ్ధా క్షిప్రప్రసాదినీ ।", "అంతర్ముఖ సమారాధ్యా, బహిర్ముఖ సుదుర్లభా ॥ 162 ॥"]}, {"n": 172, "tlines": ["త్రయీ, త్రివర్గ నిలయా, త్రిస్థా, త్రిపురమాలినీ ।", "నిరామయా, నిరాలంబా, స్వాత్మారామా, సుధాసృతిః ॥ 163 ॥"]}, {"n": 173, "tlines": ["సంసారపంక నిర్మగ్న సముద్ధరణ పండితా ।", "యజ్ఞప్రియా, యజ్ఞకర్త్రీ, యజమాన స్వరూపిణీ ॥ 164 ॥"]}, {"n": 174, "tlines": ["ధర్మాధారా, ధనాధ్యక్షా, ధనధాన్య వివర్ధినీ ।", "విప్రప్రియా, విప్రరూపా, విశ్వభ్రమణ కారిణీ ॥ 165 ॥"]}, {"n": 175, "tlines": ["విశ్వగ్రాసా, విద్రుమాభా, వైష్ణవీ, విష్ణురూపిణీ ।", "అయోని, ర్యోనినిలయా, కూటస్థా, కులరూపిణీ ॥ 166 ॥"]}, {"n": 176, "tlines": ["వీరగోష్ఠీప్రియా, వీరా, నైష్కర్మ్యా, నాదరూపిణీ ।", "విజ్ఞాన కలనా, కల్యా విదగ్ధా, బైందవాసనా ॥ 167 ॥"]}, {"n": 177, "tlines": ["తత్త్వాధికా, తత్త్వమయీ, తత్త్వమర్థ స్వరూపిణీ ।", "సామగానప్రియా, సౌమ్యా, సదాశివ కుటుంబినీ ॥ 168 ॥"]}, {"n": 178, "tlines": ["సవ్యాపసవ్య మార్గస్థా, సర్వాపద్వి నివారిణీ ।", "స్వస్థా, స్వభావమధురా, ధీరా, ధీర సమర్చితా ॥ 169 ॥"]}, {"n": 179, "tlines": ["చైతన్యార్ఘ్య సమారాధ్యా, చైతన్య కుసుమప్రియా ।", "సదోదితా, సదాతుష్టా, తరుణాదిత్య పాటలా ॥ 170 ॥"]}, {"n": 180, "tlines": ["దక్షిణా, దక్షిణారాధ్యా, దరస్మేర ముఖాంబుజా ।", "కౌళినీ కేవలా,ఽనర్ఘ్యా కైవల్య పదదాయినీ ॥ 171 ॥"]}, {"n": 181, "tlines": ["స్తోత్రప్రియా, స్తుతిమతీ, శ్రుతిసంస్తుత వైభవా ।", "మనస్వినీ, మానవతీ, మహేశీ, మంగళాకృతిః ॥ 172 ॥"]}, {"n": 182, "tlines": ["విశ్వమాతా, జగద్ధాత్రీ, విశాలాక్షీ, విరాగిణీ।", "ప్రగల్భా, పరమోదారా, పరామోదా, మనోమయీ ॥ 173 ॥"]}, {"n": 183, "tlines": ["వ్యోమకేశీ, విమానస్థా, వజ్రిణీ, వామకేశ్వరీ ।", "పంచయజ్ఞప్రియా, పంచప్రేత మంచాధిశాయినీ ॥ 174 ॥"]}, {"n": 184, "tlines": ["పంచమీ, పంచభూతేశీ, పంచ సంఖ్యోపచారిణీ ।", "శాశ్వతీ, శాశ్వతైశ్వర్యా, శర్మదా, శంభుమోహినీ ॥ 175 ॥"]}, {"n": 185, "tlines": ["ధరా, ధరసుతా, ధన్యా, ధర్మిణీ, ధర్మవర్ధినీ ।", "లోకాతీతా, గుణాతీతా, సర్వాతీతా, శమాత్మికా ॥ 176 ॥"]}, {"n": 186, "tlines": ["బంధూక కుసుమ ప్రఖ్యా, బాలా, లీలావినోదినీ ।", "సుమంగళీ, సుఖకరీ, సువేషాఢ్యా, సువాసినీ ॥ 177 ॥"]}, {"n": 187, "tlines": ["సువాసిన్యర్చనప్రీతా,ఽఽశోభనా, శుద్ధ మానసా ।", "బిందు తర్పణ సంతుష్టా, పూర్వజా, త్రిపురాంబికా ॥ 178 ॥"]}, {"n": 188, "tlines": ["దశముద్రా సమారాధ్యా, త్రిపురా శ్రీవశంకరీ ।", "జ్ఞానముద్రా, జ్ఞానగమ్యా, జ్ఞానజ్ఞేయ స్వరూపిణీ ॥ 179 ॥"]}, {"n": 189, "tlines": ["యోనిముద్రా, త్రిఖండేశీ, త్రిగుణాంబా, త్రికోణగా ।", "అనఘాద్భుత చారిత్రా, వాంఛితార్థ ప్రదాయినీ ॥ 180 ॥"]}, {"n": 190, "tlines": ["అభ్యాసాతి శయజ్ఞాతా, షడధ్వాతీత రూపిణీ ।", "అవ్యాజ కరుణామూర్తి, రజ్ఞానధ్వాంత దీపికా ॥ 181 ॥"]}, {"n": 191, "tlines": ["ఆబాలగోప విదితా, సర్వానుల్లంఘ్య శాసనా ।", "శ్రీ చక్రరాజనిలయా, శ్రీమత్త్రిపుర సుందరీ ॥ 182 ॥"]}, {"n": 192, "tlines": ["శ్రీ శివా, శివశక్త్యైక్య రూపిణీ, లలితాంబికా ।", "ఏవం శ్రీలలితాదేవ్యా నామ్నాం సాహస్రకం జగుః ॥ 183 ॥"]}, {"n": 193, "tlines": ["॥ ఇతి శ్రీ బ్రహ్మాండపురాణే, ఉత్తరఖండే, శ్రీ హయగ్రీవాగస్త్య సంవాదే, శ్రీ లలితా రహస్యనామ సాహస్రస్తోత్ర కథనం నామ ద్వితీయోఽధ్యాయః ॥"]}]},
 "saundarya-lahari": {"title": "Saundarya Laharī", "titleTe": "సౌందర్య లహరీ", "sub": "Ādi Śaṅkarācārya", "unit": "verses", "verses": [{"n": 1, "tlines": ["bhūmau skhalita pādānāṃ bhūmi-rē-vāvalambanam ।", "tvayi jātāparādhānāṃ tvamēva śaraṇaṃ śivē ॥"], "label": "Prārthanā", "h": "Prathama bhāgaḥ · Ānanda Laharī", "hTe": "ప్రథమ భాగః · ఆనంద లహరీ"}, {"n": 2, "tlines": ["śivaḥ śaktyā yuktō yadi bhavati śaktaḥ prabhavituṃ", "na chēdēvaṃ dēvō na khalu kuśalaḥ spanditumapi ।", "atastvāmārādhyāṃ hariharaviriñchādibhirapi", "praṇantuṃ stōtuṃ vā kathamakṛtapuṇyaḥ prabhavati ॥ 1 ॥"], "label": "Śloka 1"}, {"n": 3, "tlines": ["tanīyāṃsaṃ pāṃsuṃ tava charaṇapaṅkēruhabhavaṃ", "viriñchissañchinvan virachayati lōkānavikalam ।", "vahatyēnaṃ śauriḥ kathamapi sahasrēṇa śirasāṃ", "harassaṅkṣudyainaṃ bhajati bhasitōddhūlanavidhim ॥ 2 ॥"], "label": "Śloka 2"}, {"n": 4, "tlines": ["avidyānāmanta-stimira-mihiradvīpanagarī", "jaḍānāṃ chaitanya-stabaka-makaranda-srutijharī ।", "daridrāṇāṃ chintāmaṇiguṇanikā janmajaladhau", "nimagnānāṃ daṃṣṭrā muraripu-varāhasya bhavati ॥ 3 ॥"], "label": "Śloka 3"}, {"n": 5, "tlines": ["tvadanyaḥ pāṇibhyāmabhayavaradō daivatagaṇaḥ", "tvamēkā naivāsi prakaṭitavarābhītyabhinayā ।", "bhayāt trātuṃ dātuṃ phalamapi cha vāñChāsamadhikaṃ", "śaraṇyē lōkānāṃ tava hi charaṇāvēva nipuṇau ॥ 4 ॥"], "label": "Śloka 4"}, {"n": 6, "tlines": ["haristvāmārādhya praṇatajanasaubhāgyajananīṃ", "purā nārī bhūtvā puraripumapi kṣōbhamanayat ।", "smarō'pi tvāṃ natvā ratinayanalēhyēna vapuṣā", "munīnāmapyantaḥ prabhavati hi mōhāya mahatām ॥ 5 ॥"], "label": "Śloka 5"}, {"n": 7, "tlines": ["dhanuḥ pauṣpaṃ maurvī madhukaramayī pañcha viśikhāḥ", "vasantaḥ sāmantō malayamarudāyōdhanarathaḥ ।", "tathāpyēkaḥ sarvaṃ himagirisutē kāmapi kṛpām", "apāṅgāttē labdhvā jagadida-manaṅgō vijayatē ॥ 6 ॥"], "label": "Śloka 6"}, {"n": 8, "tlines": ["kvaṇatkāñchīdāmā karikalabhakumbhastananatā", "parikṣīṇā madhyē pariṇataśarachchandravadanā ।", "dhanurbāṇān pāśaṃ sṛṇimapi dadhānā karatalaiḥ", "purastādāstāṃ naḥ puramathiturāhōpuruṣikā ॥ 7 ॥"], "label": "Śloka 7"}, {"n": 9, "tlines": ["sudhāsindhōrmadhyē suraviṭapivāṭīparivṛtē", "maṇidvīpē nīpōpavanavati chintāmaṇigṛhē ।", "śivākārē mañchē paramaśivaparyaṅkanilayāṃ", "bhajanti tvāṃ dhanyāḥ katichana chidānandalaharīm ॥ 8 ॥"], "label": "Śloka 8"}, {"n": 10, "tlines": ["mahīṃ mūlādhārē kamapi maṇipūrē hutavahaṃ", "sthitaṃ svādhiṣṭhānē hṛdi marutamākāśamupari ।", "manō'pi bhrūmadhyē sakalamapi bhitvā kulapathaṃ", "sahasrārē padmē saha rahasi patyā viharasē ॥ 9 ॥"], "label": "Śloka 9"}, {"n": 11, "tlines": ["sudhādhārāsāraiścharaṇayugalāntarvigalitaiḥ", "prapañchaṃ siñchantī punarapi rasāmnāyamahasaḥ ।", "avāpya svāṃ bhūmiṃ bhujaganibhamadhyuṣṭavalayaṃ", "svamātmānaṃ kṛtvā svapiṣi kulakuṇḍē kuhariṇi ॥ 10 ॥"], "label": "Śloka 10"}, {"n": 12, "tlines": ["chaturbhiḥ śrīkaṇṭhaiḥ śivayuvatibhiḥ pañchabhirapi", "prabhinnābhiḥ śambhōrnavabhirapi mūlaprakṛtibhiḥ ।", "chatuśchatvāriṃśadvasudalakalāśratrivalaya- [trayaśchatvāri]", "trirēkhābhiḥ sārdhaṃ tava śaraṇakōṇāḥ pariṇatāḥ ॥ 11 ॥ [charaṇakōṇāḥ, bhavanakiṇāḥ]"], "label": "Śloka 11"}, {"n": 13, "tlines": ["tvadīyaṃ saundaryaṃ tuhinagirikanyē tulayituṃ", "kavīndrāḥ kalpantē kathamapi viriñchiprabhṛtayaḥ ।", "yadālōkautsukyādamaralalanā yānti manasā", "tapōbhirduṣprāpāmapi giriśasāyujyapadavīm ॥ 12 ॥"], "label": "Śloka 12"}, {"n": 14, "tlines": ["naraṃ varṣīyāṃsaṃ nayanavirasaṃ narmasu jaḍaṃ", "tavāpāṅgālōkē patitamanudhāvanti śataśaḥ ।", "galadvēṇībandhāḥ kuchakalaśavisrastasichayā", "haṭhāt truṭyatkāñchyō vigalitadukūlā yuvatayaḥ ॥ 13 ॥"], "label": "Śloka 13"}, {"n": 15, "tlines": ["kṣitau ṣaṭpañchāśad dvisamadhikapañchāśadudakē", "hutāśē dvāṣaṣṭiśchaturadhikapañchāśadanilē ।", "divi dviṣṣaṭtriṃśanmanasi cha chatuṣṣaṣṭiriti yē", "mayūkhāstēṣāmapyupari tava pādāmbujayugam ॥ 14 ॥"], "label": "Śloka 14"}, {"n": 16, "tlines": ["śarajjyōtsnāśuddhāṃ śaśiyutajaṭājūṭamakuṭāṃ", "varatrāsatrāṇasphaṭikaghaṭikāpustakakarām ।", "sakṛnna tvā natvā kathamiva satāṃ sannnidadhatē", "madhukṣīradrākṣāmadhurimadhurīṇāḥ bhaṇitayaḥ ॥ 15॥ [phaṇitayaḥ]"], "label": "Śloka 15"}, {"n": 17, "tlines": ["kavīndrāṇāṃ chētaḥkamalavanabālātaparuchiṃ", "bhajantē yē santaḥ katichidaruṇāmēva bhavatīm ।", "viriñchiprēyasyāstaruṇataraśṛṅgāralaharī-", "gabhīrābhirvāgbhirvidadhati satāṃ rañjanamamī ॥ 16 ॥"], "label": "Śloka 16"}, {"n": 18, "tlines": ["savitrībhirvāchāṃ śaśimaṇiśilābhaṅgaruchibhiḥ", "vaśinyādyābhistvāṃ saha janani sañchintayati yaḥ ।", "sa kartā kāvyānāṃ bhavati mahatāṃ bhaṅgiruchibhiḥ", "vachōbhirvāgdēvīvadanakamalāmōdamadhuraiḥ ॥ 17 ॥"], "label": "Śloka 17"}, {"n": 19, "tlines": ["tanuchChāyābhistē taruṇataraṇiśrīsaraṇibhiḥ", "divaṃ sarvāmurvīmaruṇimani magnāṃ smarati yaḥ ।", "bhavantyasya trasyadvanahariṇaśālīnanayanāḥ", "sahōrvaśyā vaśyāḥ kati kati na gīrvāṇagaṇikāḥ ॥ 18 ॥"], "label": "Śloka 18"}, {"n": 20, "tlines": ["mukhaṃ binduṃ kṛtvā kuchayugamadhastasya tadadhō", "harārdhaṃ dhyāyēdyō haramahiṣi tē manmathakalām ।", "sa sadyaḥ saṅkṣōbhaṃ nayati vanitā ityatilaghu", "trilōkīmapyāśu bhramayati ravīndustanayugām ॥ 19 ॥"], "label": "Śloka 19"}, {"n": 21, "tlines": ["kirantīmaṅgēbhyaḥ kiraṇanikurambāmṛtarasaṃ", "hṛdi tvāmādhattē himakaraśilāmūrtimiva yaḥ ।", "sa sarpāṇāṃ darpaṃ śamayati śakuntādhipa iva", "jvarapluṣṭān dṛṣṭyā sukhayati sudhādhārasirayā ॥ 20 ॥"], "label": "Śloka 20"}, {"n": 22, "tlines": ["taṭillēkhātanvīṃ tapanaśaśivaiśvānaramayīṃ", "niṣaṇṇāṃ ṣaṇṇāmapyupari kamalānāṃ tava kalām ।", "mahāpadmāṭavyāṃ mṛditamalamāyēna manasā", "mahāntaḥ paśyantō dadhati paramāhlādalaharīm ॥ 21 ॥"], "label": "Śloka 21"}, {"n": 23, "tlines": ["bhavāni tvaṃ dāsē mayi vitara dṛṣṭiṃ sakaruṇā-", "miti stōtuṃ vāñChan kathayati bhavāni tvamiti yaḥ ।", "tadaiva tvaṃ tasmai diśasi nijasāyujyapadavīṃ", "mukundabrahmēndrasphuṭamakuṭanīrājitapadām ॥ 22 ॥"], "label": "Śloka 22"}, {"n": 24, "tlines": ["tvayā hṛtvā vāmaṃ vapurapari-tṛptēna manasā", "śarīrārdhaṃ śambhōraparamapi śaṅkē hṛtamabhūt ।", "yadētattvadrūpaṃ sakalamaruṇābhaṃ trinayanaṃ", "kuchābhyāmānamraṃ kuṭilaśaśichūḍālamakuṭam ॥ 23 ॥"], "label": "Śloka 23"}, {"n": 25, "tlines": ["jagatsūtē dhātā hariravati rudraḥ kṣapayatē", "tiraskurvannētatsvamapi vapurīśastirayati ।", "sadāpūrvaḥ sarvaṃ tadidamanugṛhṇāti cha śiva-", "stavājñāmālambya kṣaṇachalitayōrbhrūlatikayōḥ ॥ 24 ॥"], "label": "Śloka 24"}, {"n": 26, "tlines": ["trayāṇāṃ dēvānāṃ triguṇajanitānāṃ tava śivē", "bhavēt pūjā pūjā tava charaṇayōryā virachitā ।", "tathā hi tvatpādōdvahanamaṇipīṭhasya nikaṭē", "sthitā hyētē śaśvanmukulitakarōttaṃsamakuṭāḥ ॥ 25 ॥"], "label": "Śloka 25"}, {"n": 27, "tlines": ["viriñchiḥ pañchatvaṃ vrajati harirāpnōti viratiṃ", "vināśaṃ kīnāśō bhajati dhanadō yāti nidhanam ।", "vitandrī māhēndrī vitatirapi sammīlitadṛśā", "mahāsaṃhārē'smin viharati sati tvatpatirasau ॥ 26 ॥"], "label": "Śloka 26"}, {"n": 28, "tlines": ["japō jalpaḥ śilpaṃ sakalamapi mudrāvirachanā", "gatiḥ prādakṣiṇyakramaṇamaśanādyāhutividhiḥ ।", "praṇāmassaṃvēśassukhamakhilamātmārpaṇadṛśā", "saparyāparyāyastava bhavatu yanmē vilasitam ॥ 27 ॥"], "label": "Śloka 27"}, {"n": 29, "tlines": ["sudhāmapyāsvādya pratibhayajarāmṛtyuhariṇīṃ", "vipadyantē viśvē vidhiśatamakhādyā diviṣadaḥ ।", "karālaṃ yatkṣvēlaṃ kabalitavataḥ kālakalanā", "na śambhōstanmūlaṃ tava janani tāṭaṅkamahimā ॥ 28 ॥"], "label": "Śloka 28"}, {"n": 30, "tlines": ["kirīṭaṃ vairiñchaṃ parihara puraḥ kaiṭabhabhidaḥ", "kaṭhōrē kōṭīrē skhalasi jahi jambhārimukuṭam ।", "praṇamrēṣvētēṣu prasabhamupayātasya bhavanaṃ", "bhavasyābhyutthānē tava parijanōktirvijayatē ॥ 29 ॥"], "label": "Śloka 29"}, {"n": 31, "tlines": ["svadēhōdbhūtābhirghṛṇibhiraṇimādyābhirabhitō", "niṣēvyē nityē tvāmahamiti sadā bhāvayati yaḥ ।", "kimāścharyaṃ tasya trinayanasamṛddhiṃ tṛṇayatō", "mahāsaṃvartāgnirvirachayati nirājanavidhim ॥ 30 ॥ [nīrājanavidhim]"], "label": "Śloka 30"}, {"n": 32, "tlines": ["chatuṣṣaṣṭyā tantraiḥ sakalamatisandhāya bhuvanaṃ", "sthitastattatsiddhiprasavaparatantraiḥ paśupatiḥ ।", "punastvannirbandhādakhilapuruṣārthaikaghaṭanā-", "svatantraṃ tē tantraṃ kṣititalamavātītaradidam ॥ 31 ॥"], "label": "Śloka 31"}, {"n": 33, "tlines": ["śivaḥ śaktiḥ kāmaḥ kṣitiratha raviḥ śītakiraṇaḥ", "smarō haṃsaḥ śakrastadanu cha parāmāraharayaḥ ।", "amī hṛllēkhābhistisṛbhiravasānēṣu ghaṭitā", "bhajantē varṇāstē tava janani nāmāvayavatām ॥ 32 ॥"], "label": "Śloka 32"}, {"n": 34, "tlines": ["smaraṃ yōniṃ lakṣmīṃ tritayamidamādau tava manō-", "rnidhāyaikē nityē niravadhimahābhōgarasikāḥ ।", "bhajanti tvāṃ chintāmaṇigunanibaddhākṣavalayāḥ", "śivāgnau juhvantaḥ surabhighṛtadhārāhutiśataiḥ ॥ 33 ॥"], "label": "Śloka 33"}, {"n": 35, "tlines": ["śarīraṃ tvaṃ śambhōḥ śaśimihiravakṣōruhayugaṃ", "tavātmānaṃ manyē bhagavati navātmānamanagham ।", "ataśśēṣaśśēṣītyayamubhayasādhāraṇatayā", "sthitaḥ sambandhō vāṃ samarasaparānandaparayōḥ ॥ 34 ॥"], "label": "Śloka 34"}, {"n": 36, "tlines": ["manastvaṃ vyōma tvaṃ marudasi marutsārathirasi", "tvamāpastvaṃ bhūmistvayi pariṇatāyāṃ na hi param ।", "tvamēva svātmānaṃ pariṇamayituṃ viśvavapuṣā", "chidānandākāraṃ śivayuvati bhāvēna bibhṛṣē ॥ 35 ॥"], "label": "Śloka 35"}, {"n": 37, "tlines": ["tavājñāchakrasthaṃ tapanaśaśikōṭidyutidharaṃ", "paraṃ śambhuṃ vandē parimilitapārśvaṃ parachitā ।", "yamārādhyan bhaktyā raviśaśiśuchīnāmaviṣayē", "nirālōkē'lōkē nivasati hi bhālōkabhuvanē ॥ 36 ॥"], "label": "Śloka 36"}, {"n": 38, "tlines": ["viśuddhau tē śuddhasphaṭikaviśadaṃ vyōmajanakaṃ", "śivaṃ sēvē dēvīmapi śivasamānavyavasitām ।", "yayōḥ kāntyā yāntyāḥ śaśikiraṇasārūpyasaraṇē-", "vidhūtāntardhvāntā vilasati chakōrīva jagatī ॥ 37 ॥"], "label": "Śloka 37"}, {"n": 39, "tlines": ["samunmīlat saṃvit kamalamakarandaikarasikaṃ", "bhajē haṃsadvandvaṃ kimapi mahatāṃ mānasacharam ।", "yadālāpādaṣṭādaśaguṇitavidyāpariṇati-", "ryadādattē dōṣād guṇamakhilamadbhyaḥ paya iva ॥ 38 ॥"], "label": "Śloka 38"}, {"n": 40, "tlines": ["tava svādhiṣṭhānē hutavahamadhiṣṭhāya nirataṃ", "tamīḍē saṃvartaṃ janani mahatīṃ tāṃ cha samayām ।", "yadālōkē lōkān dahati mahati krōdhakalitē", "dayārdrā yā dṛṣṭiḥ śiśiramupachāraṃ rachayati ॥ 39 ॥"], "label": "Śloka 39"}, {"n": 41, "tlines": ["taṭittvantaṃ śaktyā timiraparipanthisphuraṇayā", "sphurannānāratnābharaṇapariṇaddhēndradhanuṣam ।", "tava śyāmaṃ mēghaṃ kamapi maṇipūraikaśaraṇaṃ", "niṣēvē varṣantaṃ haramihirataptaṃ tribhuvanam ॥ 40 ॥"], "label": "Śloka 40"}, {"n": 42, "tlines": ["tavādhārē mūlē saha samayayā lāsyaparayā", "navātmānaṃ manyē navarasamahātāṇḍavanaṭam ।", "ubhābhyāmētābhyāmudayavidhimuddiśya dayayā", "sanāthābhyāṃ jajñē janakajananīmajjagadidam ॥ 41 ॥"], "label": "Śloka 41"}, {"n": 43, "tlines": ["gatairmāṇikyatvaṃ gaganamaṇibhiḥ sāndraghaṭitaṃ", "kirīṭaṃ tē haimaṃ himagirisutē kīrtayati yaḥ ।", "sa nīḍēyachChāyāchChuraṇaśabalaṃ chandraśakalaṃ", "dhanuḥ śaunāsīraṃ kimiti na nibadhnāti dhiṣaṇām ॥ 42 ॥"], "label": "Śloka 42", "h": "Dvitīya bhāgaḥ · Saundarya Laharī", "hTe": "ద్వితీయ భాగః · సౌందర్య లహరీ"}, {"n": 44, "tlines": ["dhunōtu dhvāntaṃ nastulitadalitēndīvaravanaṃ", "ghanasnigdhaślakṣṇaṃ chikuranikurumbaṃ tava śivē ।", "yadīyaṃ saurabhyaṃ sahajamupalabdhuṃ sumanasō", "vasantyasmin manyē valamathanavāṭīviṭapinām ॥ 43 ॥"], "label": "Śloka 43"}, {"n": 45, "tlines": ["tanōtu kṣēmaṃ nastava vadanasaundaryalaharī-", "parīvāhasrōtaḥsaraṇiriva sīmantasaraṇiḥ ।", "vahantī sindūraṃ prabalakabarībhāratimira-", "dviṣāṃ bṛndairbandīkṛtamiva navīnārkakiraṇam ॥ 44 ॥ [vṛndairbandīkṛtamiva]"], "label": "Śloka 44"}, {"n": 46, "tlines": ["arālaiḥ svābhāvyādalikalabhasaśrībhiralakaiḥ", "parītaṃ tē vaktraṃ parihasati paṅkēruharuchim ।", "darasmērē yasmin daśanaruchikiñjalkaruchirē", "sugandhau mādyanti smaradahanachakṣurmadhulihaḥ ॥ 45 ॥"], "label": "Śloka 45"}, {"n": 47, "tlines": ["lalāṭaṃ lāvaṇyadyutivimalamābhāti tava ya-", "ddvitīyaṃ tanmanyē makuṭaghaṭitaṃ chandraśakalam ।", "viparyāsanyāsādubhayamapi sambhūya cha mithaḥ", "sudhālēpasyūtiḥ pariṇamati rākāhimakaraḥ ॥ 46 ॥"], "label": "Śloka 46"}, {"n": 48, "tlines": ["bhruvau bhugnē kiñchidbhuvanabhayabhaṅgavyasanini", "tvadīyē nētrābhyāṃ madhukararuchibhyāṃ dhṛtaguṇam ।", "dhanurmanyē savyētarakaragṛhītaṃ ratipatēḥ", "prakōṣṭhē muṣṭau cha sthagayati nigūḍhāntaramumē ॥ 47 ॥"], "label": "Śloka 47"}, {"n": 49, "tlines": ["ahaḥ sūtē savyaṃ tava nayanamarkātmakatayā", "triyāmāṃ vāmaṃ tē sṛjati rajanīnāyakatayā ।", "tṛtīyā tē dṛṣṭirdaradalitahēmāmbujaruchiḥ", "samādhattē sandhyāṃ divasaniśayōrantaracharīm ॥ 48 ॥"], "label": "Śloka 48"}, {"n": 50, "tlines": ["viśālā kalyāṇī sphuṭaruchirayōdhyā kuvalayaiḥ", "kṛpādhārādhārā kimapi madhurābhōgavatikā ।", "avantī dṛṣṭistē bahunagaravistāravijayā", "dhruvaṃ tattannāmavyavaharaṇayōgyā vijayatē ॥ 49 ॥"], "label": "Śloka 49"}, {"n": 51, "tlines": ["kavīnāṃ sandarbhastabakamakarandaikarasikaṃ", "kaṭākṣavyākṣēpabhramarakalabhau karṇayugalam ।", "amuñchantau dṛṣṭvā tava navarasāsvādataralā-", "vasūyāsaṃsargādalikanayanaṃ kiñchidaruṇam ॥ 50 ॥"], "label": "Śloka 50"}, {"n": 52, "tlines": ["śivē śṛṅgārārdrā taditarajanē kutsanaparā", "sarōṣā gaṅgāyāṃ giriśacharitē vismayavatī ।", "harāhibhyō bhītā sarasiruhasaubhāgyajananī (jayinī)", "sakhīṣu smērā tē mayi jananī dṛṣṭiḥ sakaruṇā ॥ 51 ॥"], "label": "Śloka 51"}, {"n": 53, "tlines": ["gatē karṇābhyarṇaṃ garuta iva pakṣmāṇi dadhatī", "purāṃ bhēttuśchittapraśamarasavidrāvaṇaphalē ।", "imē nētrē gōtrādharapatikulōttaṃsakalikē", "tavākarṇākṛṣṭasmaraśaravilāsaṃ kalayataḥ ॥ 52 ॥"], "label": "Śloka 52"}, {"n": 54, "tlines": ["vibhaktatraivarṇyaṃ vyatikaritalīlāñjanatayā", "vibhāti tvannētratritayamidamīśānadayitē ।", "punaḥ sraṣṭuṃ dēvān druhiṇaharirudrānuparatān", "rajaḥ sattvaṃ bibhrattama iti guṇānāṃ trayamiva ॥ 53 ॥"], "label": "Śloka 53"}, {"n": 55, "tlines": ["pavitrīkartuṃ naḥ paśupatiparādhīnahṛdayē", "dayāmitrairnētrairaruṇadhavalaśyāmaruchibhiḥ ।", "nadaḥ śōṇō gaṅgā tapanatanayēti dhruvamamuṃ", "trayāṇāṃ tīrthānāmupanayasi sambhēdamanagham ॥ 54 ॥"], "label": "Śloka 54"}, {"n": 56, "tlines": ["nimēṣōnmēṣābhyāṃ pralayamudayaṃ yāti jagatī", "tavētyāhuḥ santō dharaṇidhararājanyatanayē ।", "tvadunmēṣājjātaṃ jagadidamaśēṣaṃ pralayataḥ", "paritrātuṃ śaṅkē parihṛtanimēṣāstava dṛśaḥ ॥ 55 ॥"], "label": "Śloka 55"}, {"n": 57, "tlines": ["tavāparṇē karṇējapanayanapaiśunyachakitā", "nilīyantē tōyē niyatamanimēṣāḥ śapharikāḥ ।", "iyaṃ cha śrīrbaddhachChadapuṭakavāṭaṃ kuvalayam", "jahāti pratyūṣē niśi cha vighaṭayya praviśati ॥ 56 ॥"], "label": "Śloka 56"}, {"n": 58, "tlines": ["dṛśā drāghīyasyā daradalitanīlōtpalaruchā", "davīyāṃsaṃ dīnaṃ snapaya kṛpayā māmapi śivē ।", "anēnāyaṃ dhanyō bhavati na cha tē hāniriyatā", "vanē vā harmyē vā samakaranipātō himakaraḥ ॥ 57 ॥"], "label": "Śloka 57"}, {"n": 59, "tlines": ["arālaṃ tē pālīyugalamagarājanyatanayē", "na kēṣāmādhattē kusumaśarakōdaṇḍakutukam ।", "tiraśchīnō yatra śravaṇapathamullaṅghya vilasa-", "nnapāṅgavyāsaṅgō diśati śarasandhānadhiṣaṇām ॥ 58 ॥"], "label": "Śloka 58"}, {"n": 60, "tlines": ["sphuradgaṇḍābhōgapratiphalitatāṭaṅkayugalaṃ", "chatuśchakraṃ manyē tava mukhamidaṃ manmatharatham ।", "yamāruhya druhyatyavanirathamarkēnducharaṇaṃ", "mahāvīrō māraḥ pramathapatayē sajjitavatē ॥ 59 ॥"], "label": "Śloka 59"}, {"n": 61, "tlines": ["sarasvatyāḥ sūktīramṛtalaharīkauśalaharīḥ", "pibantyāḥ śarvāṇi śravaṇachulukābhyāmaviralam ।", "chamatkāraślāghāchalitaśirasaḥ kuṇḍalagaṇō", "jhaṇatkāraistāraiḥ prativachanamāchaṣṭa iva tē ॥ 60 ॥"], "label": "Śloka 60"}, {"n": 62, "tlines": ["asau nāsāvaṃśastuhinagirivaṃśadhvajapaṭi", "tvadīyō nēdīyaḥ phalatu phalamasmākamuchitam ।", "vahannantarmuktāḥ śiśirataraniśvāsagalitaṃ", "samṛddhyā yattāsāṃ bahirapi cha muktāmaṇidharaḥ ॥ 61 ॥"], "label": "Śloka 61"}, {"n": 63, "tlines": ["prakṛtyā raktāyāstava sudati dantachChadaruchēḥ", "pravakṣyē sādṛśyaṃ janayatu phalaṃ vidrumalatā ।", "na bimbaṃ tadbimbapratiphalanarāgādaruṇitaṃ", "tulāmadhyārōḍhuṃ kathamiva vilajjēta kalayā ॥ 62 ॥"], "label": "Śloka 62"}, {"n": 64, "tlines": ["smitajyōtsnājālaṃ tava vadanachandrasya pibatāṃ", "chakōrāṇāmāsīdatirasatayā chañchujaḍimā ।", "atastē śītāṃśōramṛtalaharīmamlaruchayaḥ", "pibanti svachChandaṃ niśi niśi bhṛśaṃ kāñjikadhiyā ॥ 63 ॥"], "label": "Śloka 63"}, {"n": 65, "tlines": ["aviśrāntaṃ patyurguṇagaṇakathāmrēḍanajapā", "japāpuṣpachChāyā tava janani jihvā jayati sā ।", "yadagrāsīnāyāḥ sphaṭikadṛṣadachChachChavimayī", "sarasvatyā mūrtiḥ pariṇamati māṇikyavapuṣā ॥ 64 ॥"], "label": "Śloka 64"}, {"n": 66, "tlines": ["raṇē jitvā daityānapahṛtaśirastraiḥ kavachibhir-", "nivṛttaiśchaṇḍāṃśatripuraharanirmālyavimukhaiḥ ।", "viśākhēndrōpēndraiḥ śaśiviśadakarpūraśakalā", "vilīyantē mātastava vadanatāmbūlakabalāḥ ॥ 65 ॥"], "label": "Śloka 65"}, {"n": 67, "tlines": ["vipañchyā gāyantī vividhamapadānaṃ paśupatēḥ", "tvayārabdhē vaktuṃ chalitaśirasā sādhuvachanē ।", "tadīyairmādhuryairapalapitatantrīkalaravāṃ", "nijāṃ vīṇāṃ vāṇī nichulayati chōlēna nibhṛtam ॥ 66 ॥"], "label": "Śloka 66"}, {"n": 68, "tlines": ["karāgrēṇa spṛṣṭaṃ tuhinagiriṇā vatsalatayā", "girīśēnōdastaṃ muhuradharapānākulatayā ।", "karagrāhyaṃ śambhōrmukhamukuravṛntaṃ girisutē", "kathaṅkāraṃ brūmastava chibukamaupamyarahitam ॥ 67 ॥"], "label": "Śloka 67"}, {"n": 69, "tlines": ["bhujāślēṣān nityaṃ puradamayituḥ kaṇṭakavatī", "tava grīvā dhattē mukhakamalanālaśriyamiyam ।", "svataḥ śvētā kālāgurubahulajambālamalinā", "mṛṇālīlālityaṃ vahati yadadhō hāralatikā ॥ 68 ॥"], "label": "Śloka 68"}, {"n": 70, "tlines": ["galē rēkhāstisrō gatigamakagītaikanipuṇē", "vivāhavyānaddhapraguṇaguṇasaṅkhyāpratibhuvaḥ ।", "virājantē nānāvidhamadhurarāgākarabhuvāṃ", "trayāṇāṃ grāmāṇāṃ sthitiniyamasīmāna iva tē ॥ 69 ॥"], "label": "Śloka 69"}, {"n": 71, "tlines": ["mṛṇālīmṛdvīnāṃ tava bhujalatānāṃ chatasṛṇāṃ", "chaturbhiḥ saundaryaṃ sarasijabhavaḥ stauti vadanaiḥ ।", "nakhēbhyaḥ santrasyan prathamamathanādandhakaripō-", "śchaturṇāṃ śīrṣāṇāṃ samamabhayahastārpaṇadhiyā ॥ 70 ॥"], "label": "Śloka 70"}, {"n": 72, "tlines": ["nakhānāmuddyōtairnavanalinarāgaṃ vihasatāṃ", "karāṇāṃ tē kāntiṃ kathaya kathayāmaḥ kathamumē ।", "kayāchidvā sāmyaṃ bhajatu kalayā hanta kamalaṃ", "yadi krīḍallakṣmīcharaṇatalalākṣārasaChaṇam ॥ 71 ॥"], "label": "Śloka 71"}, {"n": 73, "tlines": ["samaṃ dēvi skandadvipavadanapītaṃ stanayugaṃ", "tavēdaṃ naḥ khēdaṃ haratu satataṃ prasnutamukham ।", "yadālōkyāśaṅkākulitahṛdayō hāsajanakaḥ", "svakumbhau hērambaḥ parimṛśati hastēna jhaḍiti ॥ 72 ॥"], "label": "Śloka 72"}, {"n": 74, "tlines": ["amū tē vakṣōjāvamṛtarasamāṇikyakutupau", "na sandēhaspandō nagapatipatākē manasi naḥ ।", "pibantau tau yasmādaviditavadhūsaṅgarasikau", "kumārāvadyāpi dviradavadanakrauñchadalanau ॥ 73 ॥"], "label": "Śloka 73"}, {"n": 75, "tlines": ["vahatyamba stambēramadanujakumbhaprakṛtibhiḥ", "samārabdhāṃ muktāmaṇibhiramalāṃ hāralatikām ।", "kuchābhōgō bimbādhararuchibhirantaḥ śabalitāṃ", "pratāpavyāmiśrāṃ puradamayituḥ kīrtimiva tē ॥ 74 ॥"], "label": "Śloka 74"}, {"n": 76, "tlines": ["tava stanyaṃ manyē dharaṇidharakanyē hṛdayataḥ", "payaḥpārāvāraḥ parivahati sārasvatamiva ।", "dayāvatyā dattaṃ draviḍaśiśurāsvādya tava yat", "kavīnāṃ prauḍhānāmajani kamanīyaḥ kavayitā ॥ 75 ॥"], "label": "Śloka 75"}, {"n": 77, "tlines": ["harakrōdhajvālāvalibhiravalīḍhēna vapuṣā", "gabhīrē tē nābhīsarasi kṛtasaṅgō manasijaḥ ।", "samuttasthau tasmādachalatanayē dhūmalatikā", "janastāṃ jānītē tava janani rōmāvaliriti ॥ 76 ॥"], "label": "Śloka 76"}, {"n": 78, "tlines": ["yadētat kālindītanutarataraṅgākṛti śivē", "kṛśē madhyē kiñchijjanani tava yadbhāti sudhiyām ।", "vimardādanyō'nyaṃ kuchakalaśayōrantaragataṃ", "tanūbhūtaṃ vyōma praviśadiva nābhiṃ kuhariṇīm ॥ 77 ॥"], "label": "Śloka 77"}, {"n": 79, "tlines": ["sthirō gaṅgāvartaḥ stanamukularōmāvalilatā-", "kalāvālaṃ kuṇḍaṃ kusumaśaratējōhutabhujaḥ ।", "ratērlīlāgāraṃ kimapi tava nābhirgirisutē", "biladvāraṃ siddhērgiriśanayanānāṃ vijayatē ॥ 78 ॥"], "label": "Śloka 78"}, {"n": 80, "tlines": ["nisargakṣīṇasya stanataṭabharēṇa klamajuṣō", "namanmūrtērnārītilaka śanakaistruṭyata iva ।", "chiraṃ tē madhyasya truṭitataṭinītīrataruṇā", "samāvasthāsthēmnō bhavatu kuśalaṃ śailatanayē ॥ 79 ॥"], "label": "Śloka 79"}, {"n": 81, "tlines": ["kuchau sadyaḥsvidyattaṭaghaṭitakūrpāsabhidurau", "kaṣantau dōrmūlē kanakakalaśābhau kalayatā ।", "tava trātuṃ bhaṅgādalamiti valagnaṃ tanubhuvā", "tridhā naddhaṃ dēvi trivali lavalīvallibhiriva ॥ 80 ॥"], "label": "Śloka 80"}, {"n": 82, "tlines": ["gurutvaṃ vistāraṃ kṣitidharapatiḥ pārvati nijā-", "nnitambādāchChidya tvayi haraṇarūpēṇa nidadhē ।", "atastē vistīrṇō gururayamaśēṣāṃ vasumatīṃ", "nitambaprāgbhāraḥ sthagayati laghutvaṃ nayati cha ॥ 81 ॥"], "label": "Śloka 81"}, {"n": 83, "tlines": ["karīndrāṇāṃ śuṇḍān kanakakadalīkāṇḍapaṭalī-", "mubhābhyāmūrubhyāmubhayamapi nirjitya bhavatī ।", "suvṛttābhyāṃ patyuḥ praṇatikaṭhinābhyāṃ girisutē", "vidhijñē jānubhyāṃ vibudhakarikumbhadvayamasi ॥ 82 ॥"], "label": "Śloka 82"}, {"n": 84, "tlines": ["parājētuṃ rudraṃ dviguṇaśaragarbhau girisutē", "niṣaṅgau jaṅghē tē viṣamaviśikhō bāḍhamakṛta ।", "yadagrē dṛśyantē daśaśaraphalāḥ pādayugalī-", "nakhāgrachChadmānaḥ suramakuṭaśāṇaikaniśitāḥ ॥ 83 ॥"], "label": "Śloka 83"}, {"n": 85, "tlines": ["śrutīnāṃ mūrdhānō dadhati tava yau śēkharatayā", "mamāpyētau mātaḥ śirasi dayayā dhēhi charaṇau ।", "yayōḥ pādyaṃ pāthaḥ paśupatijaṭājūṭataṭinī", "yayōrlākṣālakṣmīraruṇaharichūḍāmaṇiruchiḥ ॥ 84 ॥"], "label": "Śloka 84"}, {"n": 86, "tlines": ["namōvākaṃ brūmō nayanaramaṇīyāya padayō-", "stavāsmai dvandvāya sphuṭaruchirasālaktakavatē ।", "asūyatyatyantaṃ yadabhihananāya spṛhayatē", "paśūnāmīśānaḥ pramadavanakaṅkēlitaravē ॥ 85 ॥"], "label": "Śloka 85"}, {"n": 87, "tlines": ["mṛṣā kṛtvā gōtraskhalanamatha vailakṣyanamitaṃ", "lalāṭē bhartāraṃ charaṇakamalē tāḍayati tē ।", "chirādantaḥśalyaṃ dahanakṛtamunmūlitavatā", "tulākōṭikvāṇaiḥ kilikilitamīśānaripuṇā ॥ 86 ॥"], "label": "Śloka 86"}, {"n": 88, "tlines": ["himānīhantavyaṃ himagirinivāsaikachaturau", "niśāyāṃ nidrāṇaṃ niśi charamabhāgē cha viśadau ।", "varaṃ lakṣmīpātraṃ śriyamatisṛjantau samayināṃ", "sarōjaṃ tvatpādau janani jayataśchitramiha kim ॥ 87 ॥"], "label": "Śloka 87"}, {"n": 89, "tlines": ["padaṃ tē kīrtīnāṃ prapadamapadaṃ dēvi vipadāṃ", "kathaṃ nītaṃ sadbhiḥ kaṭhinakamaṭhīkarparatulām ।", "kathaṃ vā bāhubhyāmupayamanakālē purabhidā", "yadādāya nyastaṃ dṛṣadi dayamānēna manasā ॥ 88 ॥"], "label": "Śloka 88"}, {"n": 90, "tlines": ["nakhairnākastrīṇāṃ karakamalasaṅkōchaśaśibhi-", "starūṇāṃ divyānāṃ hasata iva tē chaṇḍi charaṇau ।", "phalāni svaḥsthēbhyaḥ kisalayakarāgrēṇa dadatāṃ", "daridrēbhyō bhadrāṃ śriyamaniśamahnāya dadatau ॥ 89 ॥"], "label": "Śloka 89"}, {"n": 91, "tlines": ["dadānē dīnēbhyaḥ śriyamaniśamāśānusadṛśī-", "mamandaṃ saundaryaprakaramakarandaṃ vikirati ।", "tavāsmin mandārastabakasubhagē yātu charaṇē", "nimajjanmajjīvaḥ karaṇacharaṇaḥ ṣaṭcharaṇatām ॥ 90 ॥"], "label": "Śloka 90"}, {"n": 92, "tlines": ["padanyāsakrīḍāparichayamivārabdhumanasaḥ", "skhalantastē khēlaṃ bhavanakalahaṃsā na jahati ।", "atastēṣāṃ śikṣāṃ subhagamaṇimañjīraraṇita-", "chChalādāchakṣāṇaṃ charaṇakamalaṃ chārucharitē ॥ 91 ॥"], "label": "Śloka 91"}, {"n": 93, "tlines": ["gatāstē mañchatvaṃ druhiṇaharirudrēśvarabhṛtaḥ", "śivaḥ svachChachChāyāghaṭitakapaṭaprachChadapaṭaḥ ।", "tvadīyānāṃ bhāsāṃ pratiphalanarāgāruṇatayā", "śarīrī śṛṅgārō rasa iva dṛśāṃ dōgdhi kutukam ॥ 92 ॥"], "label": "Śloka 92"}, {"n": 94, "tlines": ["arālā kēśēṣu prakṛtisaralā mandahasitē", "śirīṣābhā chittē dṛṣadupalaśōbhā kuchataṭē ।", "bhṛśaṃ tanvī madhyē pṛthururasijārōhaviṣayē", "jagattrātuṃ śambhōrjayati karuṇā kāchidaruṇā ॥ 93 ॥"], "label": "Śloka 93"}, {"n": 95, "tlines": ["kalaṅkaḥ kastūrī rajanikarabimbaṃ jalamayaṃ", "kalābhiḥ karpūrairmarakatakaraṇḍaṃ nibiḍitam ।", "atastvadbhōgēna pratidinamidaṃ riktakuharaṃ", "vidhirbhūyō bhūyō nibiḍayati nūnaṃ tava kṛtē ॥ 94 ॥"], "label": "Śloka 94"}, {"n": 96, "tlines": ["purārātērantaḥpuramasi tatastvachcharaṇayōḥ", "saparyāmaryādā taralakaraṇānāmasulabhā ।", "tathā hyētē nītāḥ śatamakhamukhāḥ siddhimatulāṃ", "tava dvārōpāntasthitibhiraṇimādyābhiramarāḥ ॥ 95 ॥"], "label": "Śloka 95"}, {"n": 97, "tlines": ["kalatraṃ vaidhātraṃ katikati bhajantē na kavayaḥ", "śriyō dēvyāḥ kō vā na bhavati patiḥ kairapi dhanaiḥ ।", "mahādēvaṃ hitvā tava sati satīnāmacharamē", "kuchābhyāmāsaṅgaḥ kuravakatarōrapyasulabhaḥ ॥ 96 ॥"], "label": "Śloka 96"}, {"n": 98, "tlines": ["girāmāhurdēvīṃ druhiṇagṛhiṇīmāgamavidō", "harēḥ patnīṃ padmāṃ harasahacharīmadritanayām ।", "turīyā kāpi tvaṃ duradhigamaniḥsīmamahimā", "mahāmāyā viśvaṃ bhramayasi parabrahmamahiṣi ॥ 97 ॥"], "label": "Śloka 97"}, {"n": 99, "tlines": ["kadā kālē mātaḥ kathaya kalitālaktakarasaṃ", "pibēyaṃ vidyārthī tava charaṇanirṇējanajalam ।", "prakṛtyā mūkānāmapi cha kavitākāraṇatayā", "kadā dhattē vāṇīmukhakamalatāmbūlarasatām ॥ 98 ॥"], "label": "Śloka 98"}, {"n": 100, "tlines": ["sarasvatyā lakṣmyā vidhiharisapatnō viharatē", "ratēḥ pātivratyaṃ śithilayati ramyēṇa vapuṣā ।", "chiraṃ jīvannēva kṣapitapaśupāśavyatikaraḥ", "parānandābhikhyaṃ rasayati rasaṃ tvadbhajanavān ॥ 99 ॥"], "label": "Śloka 99"}, {"n": 101, "tlines": ["pradīpajvālābhirdivasakaranīrājanavidhiḥ", "sudhāsūtēśchandrōpalajalalavairarghyarachanā ।", "svakīyairambhōbhiḥ salilanidhisauhityakaraṇaṃ", "tvadīyābhirvāgbhistava janani vāchāṃ stutiriyam ॥ 100 ॥"], "label": "Śloka 100"}, {"n": 102, "tlines": ["saundaryalaharī mukhyastōtraṃ saṃvārtadāyakam ।", "bhagavatpāda saṅklṛptaṃ paṭhē-nmuktau bhavē-nnaraḥ ॥"], "label": "Phalaśruti"}, {"n": 103, "tlines": ["॥ iti śrīmatparamahaṃsaparivrājakāchāryasya", "śrīgōvindabhagavatpūjyapādaśiṣyasya", "śrīmachChaṅkarabhagavataḥ kṛtau saundaryalaharī sampūrṇā ॥", "॥ ōṃ tatsat ॥"], "label": "Samāpti"}, {"n": 104, "tlines": ["(anubandhaḥ)", "samānītaḥ padbhyāṃ maṇimukuratāmambaramaṇi-", "rbhayādāsyādantaḥstimitakiraṇaśrēṇimasṛṇaḥ ।", "(pāṭhabhēdaḥ - bhayādāsya snigdhastimita, bhayādāsyasyāntaḥstimita)", "dadhāti tvadvaktrampratiphalanamaśrāntavikachaṃ", "nirātaṅkaṃ chandrānnijahṛdayapaṅkēruhamiva ॥ 101 ॥"], "label": "Śloka 101", "h": "Anubandham", "hTe": "అనుబంధం"}, {"n": 105, "tlines": ["samudbhūtasthūlastanabharamuraśchāru hasitaṃ", "kaṭākṣē kandarpaḥ katichana kadambadyuti vapuḥ ।", "harasya tvadbhrāntiṃ manasi janayanti sma vimalāḥ", "pāṭhabhēdaḥ - janayāmāsa madanō, janayantaḥ samatulāṃ, janayantā suvadanē", "bhavatyā yē bhaktāḥ pariṇatiramīṣāmiyamumē ॥ 102 ॥"], "label": "Śloka 102"}, {"n": 106, "tlines": ["nidhē nityasmērē niravadhiguṇē nītinipuṇē", "nirāghātajñānē niyamaparachittaikanilayē ।", "niyatyā nirmuktē nikhilanigamāntastutipadē", "nirātaṅkē nityē nigamaya mamāpi stutimimām ॥ 103 ॥"], "label": "Śloka 103"}], "te": [{"n": 1, "tlines": ["భూమౌ స్ఖలిత పాదానాం భూమి-రే-వావలంబనమ్ ।", "త్వయి జాతాపరాధానాం త్వమేవ శరణం శివే ॥"]}, {"n": 2, "tlines": ["శివః శక్త్యా యుక్తో యది భవతి శక్తః ప్రభవితుం", "న చేదేవం దేవో న ఖలు కుశలః స్పందితుమపి ।", "అతస్త్వామారాధ్యాం హరిహరవిరించాదిభిరపి", "ప్రణంతుం స్తోతుం వా కథమకృతపుణ్యః ప్రభవతి ॥ 1 ॥"]}, {"n": 3, "tlines": ["తనీయాంసం పాంసుం తవ చరణపంకేరుహభవం", "విరించిస్సంచిన్వన్ విరచయతి లోకానవికలమ్ ।", "వహత్యేనం శౌరిః కథమపి సహస్రేణ శిరసాం", "హరస్సంక్షుద్యైనం భజతి భసితోద్ధూలనవిధిమ్ ॥ 2 ॥"]}, {"n": 4, "tlines": ["అవిద్యానామంత-స్తిమిర-మిహిరద్వీపనగరీ", "జడానాం చైతన్య-స్తబక-మకరంద-స్రుతిఝరీ ।", "దరిద్రాణాం చింతామణిగుణనికా జన్మజలధౌ", "నిమగ్నానాం దంష్ట్రా మురరిపు-వరాహస్య భవతి ॥ 3 ॥"]}, {"n": 5, "tlines": ["త్వదన్యః పాణిభ్యామభయవరదో దైవతగణః", "త్వమేకా నైవాసి ప్రకటితవరాభీత్యభినయా ।", "భయాత్ త్రాతుం దాతుం ఫలమపి చ వాంఛాసమధికం", "శరణ్యే లోకానాం తవ హి చరణావేవ నిపుణౌ ॥ 4 ॥"]}, {"n": 6, "tlines": ["హరిస్త్వామారాధ్య ప్రణతజనసౌభాగ్యజననీం", "పురా నారీ భూత్వా పురరిపుమపి క్షోభమనయత్ ।", "స్మరోఽపి త్వాం నత్వా రతినయనలేహ్యేన వపుషా", "మునీనామప్యంతః ప్రభవతి హి మోహాయ మహతామ్ ॥ 5 ॥"]}, {"n": 7, "tlines": ["ధనుః పౌష్పం మౌర్వీ మధుకరమయీ పంచ విశిఖాః", "వసంతః సామంతో మలయమరుదాయోధనరథః ।", "తథాప్యేకః సర్వం హిమగిరిసుతే కామపి కృపాం", "అపాంగాత్తే లబ్ధ్వా జగదిద-మనంగో విజయతే ॥ 6 ॥"]}, {"n": 8, "tlines": ["క్వణత్కాంచీదామా కరికలభకుంభస్తననతా", "పరిక్షీణా మధ్యే పరిణతశరచ్చంద్రవదనా ।", "ధనుర్బాణాన్ పాశం సృణిమపి దధానా కరతలైః", "పురస్తాదాస్తాం నః పురమథితురాహోపురుషికా ॥ 7 ॥"]}, {"n": 9, "tlines": ["సుధాసింధోర్మధ్యే సురవిటపివాటీపరివృతే", "మణిద్వీపే నీపోపవనవతి చింతామణిగృహే ।", "శివాకారే మంచే పరమశివపర్యంకనిలయాం", "భజంతి త్వాం ధన్యాః కతిచన చిదానందలహరీమ్ ॥ 8 ॥"]}, {"n": 10, "tlines": ["మహీం మూలాధారే కమపి మణిపూరే హుతవహం", "స్థితం స్వాధిష్ఠానే హృది మరుతమాకాశముపరి ।", "మనోఽపి భ్రూమధ్యే సకలమపి భిత్వా కులపథం", "సహస్రారే పద్మే సహ రహసి పత్యా విహరసే ॥ 9 ॥"]}, {"n": 11, "tlines": ["సుధాధారాసారైశ్చరణయుగలాంతర్విగలితైః", "ప్రపంచం సించంతీ పునరపి రసామ్నాయమహసః ।", "అవాప్య స్వాం భూమిం భుజగనిభమధ్యుష్టవలయం", "స్వమాత్మానం కృత్వా స్వపిషి కులకుండే కుహరిణి ॥ 10 ॥"]}, {"n": 12, "tlines": ["చతుర్భిః శ్రీకంఠైః శివయువతిభిః పంచభిరపి", "ప్రభిన్నాభిః శంభోర్నవభిరపి మూలప్రకృతిభిః ।", "చతుశ్చత్వారింశద్వసుదలకలాశ్రత్రివలయ- [త్రయశ్చత్వారి]", "త్రిరేఖాభిః సార్ధం తవ శరణకోణాః పరిణతాః ॥ 11 ॥ [చరణకోణాః, భవనకిణాః]"]}, {"n": 13, "tlines": ["త్వదీయం సౌందర్యం తుహినగిరికన్యే తులయితుం", "కవీంద్రాః కల్పంతే కథమపి విరించిప్రభృతయః ।", "యదాలోకౌత్సుక్యాదమరలలనా యాంతి మనసా", "తపోభిర్దుష్ప్రాపామపి గిరిశసాయుజ్యపదవీమ్ ॥ 12 ॥"]}, {"n": 14, "tlines": ["నరం వర్షీయాంసం నయనవిరసం నర్మసు జడం", "తవాపాంగాలోకే పతితమనుధావంతి శతశః ।", "గలద్వేణీబంధాః కుచకలశవిస్రస్తసిచయా", "హఠాత్ త్రుట్యత్కాంచ్యో విగలితదుకూలా యువతయః ॥ 13 ॥"]}, {"n": 15, "tlines": ["క్షితౌ షట్పంచాశద్ ద్విసమధికపంచాశదుదకే", "హుతాశే ద్వాషష్టిశ్చతురధికపంచాశదనిలే ।", "దివి ద్విష్షట్త్రింశన్మనసి చ చతుష్షష్టిరితి యే", "మయూఖాస్తేషామప్యుపరి తవ పాదాంబుజయుగమ్ ॥ 14 ॥"]}, {"n": 16, "tlines": ["శరజ్జ్యోత్స్నాశుద్ధాం శశియుతజటాజూటమకుటాం", "వరత్రాసత్రాణస్ఫటికఘటికాపుస్తకకరామ్ ।", "సకృన్న త్వా నత్వా కథమివ సతాం సంన్నిదధతే", "మధుక్షీరద్రాక్షామధురిమధురీణాః భణితయః ॥ 15॥ [ఫణితయః]"]}, {"n": 17, "tlines": ["కవీంద్రాణాం చేతఃకమలవనబాలాతపరుచిం", "భజంతే యే సంతః కతిచిదరుణామేవ భవతీమ్ ।", "విరించిప్రేయస్యాస్తరుణతరశృంగారలహరీ-", "గభీరాభిర్వాగ్భిర్విదధతి సతాం రంజనమమీ ॥ 16 ॥"]}, {"n": 18, "tlines": ["సవిత్రీభిర్వాచాం శశిమణిశిలాభంగరుచిభిః", "వశిన్యాద్యాభిస్త్వాం సహ జనని సంచింతయతి యః ।", "స కర్తా కావ్యానాం భవతి మహతాం భంగిరుచిభిః", "వచోభిర్వాగ్దేవీవదనకమలామోదమధురైః ॥ 17 ॥"]}, {"n": 19, "tlines": ["తనుచ్ఛాయాభిస్తే తరుణతరణిశ్రీసరణిభిః", "దివం సర్వాముర్వీమరుణిమని మగ్నాం స్మరతి యః ।", "భవంత్యస్య త్రస్యద్వనహరిణశాలీననయనాః", "సహోర్వశ్యా వశ్యాః కతి కతి న గీర్వాణగణికాః ॥ 18 ॥"]}, {"n": 20, "tlines": ["ముఖం బిందుం కృత్వా కుచయుగమధస్తస్య తదధో", "హరార్ధం ధ్యాయేద్యో హరమహిషి తే మన్మథకలామ్ ।", "స సద్యః సంక్షోభం నయతి వనితా ఇత్యతిలఘు", "త్రిలోకీమప్యాశు భ్రమయతి రవీందుస్తనయుగామ్ ॥ 19 ॥"]}, {"n": 21, "tlines": ["కిరంతీమంగేభ్యః కిరణనికురంబామృతరసం", "హృది త్వామాధత్తే హిమకరశిలామూర్తిమివ యః ।", "స సర్పాణాం దర్పం శమయతి శకుంతాధిప ఇవ", "జ్వరప్లుష్టాన్ దృష్ట్యా సుఖయతి సుధాధారసిరయా ॥ 20 ॥"]}, {"n": 22, "tlines": ["తటిల్లేఖాతన్వీం తపనశశివైశ్వానరమయీం", "నిషణ్ణాం షణ్ణామప్యుపరి కమలానాం తవ కలామ్ ।", "మహాపద్మాటవ్యాం మృదితమలమాయేన మనసా", "మహాంతః పశ్యంతో దధతి పరమాహ్లాదలహరీమ్ ॥ 21 ॥"]}, {"n": 23, "tlines": ["భవాని త్వం దాసే మయి వితర దృష్టిం సకరుణా-", "మితి స్తోతుం వాంఛన్ కథయతి భవాని త్వమితి యః ।", "తదైవ త్వం తస్మై దిశసి నిజసాయుజ్యపదవీం", "ముకుందబ్రహ్మేంద్రస్ఫుటమకుటనీరాజితపదామ్ ॥ 22 ॥"]}, {"n": 24, "tlines": ["త్వయా హృత్వా వామం వపురపరి-తృప్తేన మనసా", "శరీరార్ధం శంభోరపరమపి శంకే హృతమభూత్ ।", "యదేతత్త్వద్రూపం సకలమరుణాభం త్రినయనం", "కుచాభ్యామానమ్రం కుటిలశశిచూడాలమకుటమ్ ॥ 23 ॥"]}, {"n": 25, "tlines": ["జగత్సూతే ధాతా హరిరవతి రుద్రః క్షపయతే", "తిరస్కుర్వన్నేతత్స్వమపి వపురీశస్తిరయతి ।", "సదాపూర్వః సర్వం తదిదమనుగృహ్ణాతి చ శివ-", "స్తవాజ్ఞామాలంబ్య క్షణచలితయోర్భ్రూలతికయోః ॥ 24 ॥"]}, {"n": 26, "tlines": ["త్రయాణాం దేవానాం త్రిగుణజనితానాం తవ శివే", "భవేత్ పూజా పూజా తవ చరణయోర్యా విరచితా ।", "తథా హి త్వత్పాదోద్వహనమణిపీఠస్య నికటే", "స్థితా హ్యేతే శశ్వన్ముకులితకరోత్తంసమకుటాః ॥ 25 ॥"]}, {"n": 27, "tlines": ["విరించిః పంచత్వం వ్రజతి హరిరాప్నోతి విరతిం", "వినాశం కీనాశో భజతి ధనదో యాతి నిధనమ్ ।", "వితంద్రీ మాహేంద్రీ వితతిరపి సంమీలితదృశా", "మహాసంహారేఽస్మిన్ విహరతి సతి త్వత్పతిరసౌ ॥ 26 ॥"]}, {"n": 28, "tlines": ["జపో జల్పః శిల్పం సకలమపి ముద్రావిరచనా", "గతిః ప్రాదక్షిణ్యక్రమణమశనాద్యాహుతివిధిః ।", "ప్రణామస్సంవేశస్సుఖమఖిలమాత్మార్పణదృశా", "సపర్యాపర్యాయస్తవ భవతు యన్మే విలసితమ్ ॥ 27 ॥"]}, {"n": 29, "tlines": ["సుధామప్యాస్వాద్య ప్రతిభయజరామృత్యుహరిణీం", "విపద్యంతే విశ్వే విధిశతమఖాద్యా దివిషదః ।", "కరాలం యత్క్ష్వేలం కబలితవతః కాలకలనా", "న శంభోస్తన్మూలం తవ జనని తాటంకమహిమా ॥ 28 ॥"]}, {"n": 30, "tlines": ["కిరీటం వైరించం పరిహర పురః కైటభభిదః", "కఠోరే కోటీరే స్ఖలసి జహి జంభారిముకుటమ్ ।", "ప్రణమ్రేష్వేతేషు ప్రసభముపయాతస్య భవనం", "భవస్యాభ్యుత్థానే తవ పరిజనోక్తిర్విజయతే ॥ 29 ॥"]}, {"n": 31, "tlines": ["స్వదేహోద్భూతాభిర్ఘృణిభిరణిమాద్యాభిరభితో", "నిషేవ్యే నిత్యే త్వామహమితి సదా భావయతి యః ।", "కిమాశ్చర్యం తస్య త్రినయనసమృద్ధిం తృణయతో", "మహాసంవర్తాగ్నిర్విరచయతి నిరాజనవిధిమ్ ॥ 30 ॥ [నీరాజనవిధిం]"]}, {"n": 32, "tlines": ["చతుష్షష్ట్యా తంత్రైః సకలమతిసంధాయ భువనం", "స్థితస్తత్తత్సిద్ధిప్రసవపరతంత్రైః పశుపతిః ।", "పునస్త్వన్నిర్బంధాదఖిలపురుషార్థైకఘటనా-", "స్వతంత్రం తే తంత్రం క్షితితలమవాతీతరదిదమ్ ॥ 31 ॥"]}, {"n": 33, "tlines": ["శివః శక్తిః కామః క్షితిరథ రవిః శీతకిరణః", "స్మరో హంసః శక్రస్తదను చ పరామారహరయః ।", "అమీ హృల్లేఖాభిస్తిసృభిరవసానేషు ఘటితా", "భజంతే వర్ణాస్తే తవ జనని నామావయవతామ్ ॥ 32 ॥"]}, {"n": 34, "tlines": ["స్మరం యోనిం లక్ష్మీం త్రితయమిదమాదౌ తవ మనో-", "ర్నిధాయైకే నిత్యే నిరవధిమహాభోగరసికాః ।", "భజంతి త్వాం చింతామణిగుననిబద్ధాక్షవలయాః", "శివాగ్నౌ జుహ్వంతః సురభిఘృతధారాహుతిశతైః ॥ 33 ॥"]}, {"n": 35, "tlines": ["శరీరం త్వం శంభోః శశిమిహిరవక్షోరుహయుగం", "తవాత్మానం మన్యే భగవతి నవాత్మానమనఘమ్ ।", "అతశ్శేషశ్శేషీత్యయముభయసాధారణతయా", "స్థితః సంబంధో వాం సమరసపరానందపరయోః ॥ 34 ॥"]}, {"n": 36, "tlines": ["మనస్త్వం వ్యోమ త్వం మరుదసి మరుత్సారథిరసి", "త్వమాపస్త్వం భూమిస్త్వయి పరిణతాయాం న హి పరమ్ ।", "త్వమేవ స్వాత్మానం పరిణమయితుం విశ్వవపుషా", "చిదానందాకారం శివయువతి భావేన బిభృషే ॥ 35 ॥"]}, {"n": 37, "tlines": ["తవాజ్ఞాచక్రస్థం తపనశశికోటిద్యుతిధరం", "పరం శంభుం వందే పరిమిలితపార్శ్వం పరచితా ।", "యమారాధ్యన్ భక్త్యా రవిశశిశుచీనామవిషయే", "నిరాలోకేఽలోకే నివసతి హి భాలోకభువనే ॥ 36 ॥"]}, {"n": 38, "tlines": ["విశుద్ధౌ తే శుద్ధస్ఫటికవిశదం వ్యోమజనకం", "శివం సేవే దేవీమపి శివసమానవ్యవసితామ్ ।", "యయోః కాంత్యా యాంత్యాః శశికిరణసారూప్యసరణే-", "విధూతాంతర్ధ్వాంతా విలసతి చకోరీవ జగతీ ॥ 37 ॥"]}, {"n": 39, "tlines": ["సమున్మీలత్ సంవిత్ కమలమకరందైకరసికం", "భజే హంసద్వంద్వం కిమపి మహతాం మానసచరమ్ ।", "యదాలాపాదష్టాదశగుణితవిద్యాపరిణతి-", "ర్యదాదత్తే దోషాద్ గుణమఖిలమద్భ్యః పయ ఇవ ॥ 38 ॥"]}, {"n": 40, "tlines": ["తవ స్వాధిష్ఠానే హుతవహమధిష్ఠాయ నిరతం", "తమీడే సంవర్తం జనని మహతీం తాం చ సమయామ్ ।", "యదాలోకే లోకాన్ దహతి మహతి క్రోధకలితే", "దయార్ద్రా యా దృష్టిః శిశిరముపచార
