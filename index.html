<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vedasaram</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vedasaram">
<meta name="theme-color" content="#2a0e00">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* ── Design tokens ── */
:root {
  --bg: #fdf8f0;
  --fg: #1c1208;
  --fg2: #5a4020;
  --fg3: #9a7a50;
  --accent: #7b3a10;
  --accent2: #b8720a;
  --accent3: #d4960e;
  --border: #e8d8c0;
  --card-bg: #fff9f0;
  --card-shadow: 0 2px 12px rgba(120,60,0,0.10);
  --nav-bg: #fdf8f0;
  --nav-border: #e8d8c0;
  --recite-bg: #080508;
  --recite-fg: #f0e8d8;
  --recite-hl: #f0c040;
  --tag-bg: #f5e8d0;
  --tag-fg: #7b3a10;
  --done-bg: #eef6ee;
  --done-border: #5aaa5a;
  --home-gradient: linear-gradient(160deg, #2a0e00 0%, #4a1a06 40%, #1a0a22 100%);
  --home-gold: #f0c040;
  --home-gold2: #d4960e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100c08;
    --fg: #f0e4d0;
    --fg2: #c8a870;
    --fg3: #806040;
    --accent: #e08030;
    --accent2: #d4960e;
    --accent3: #f0c040;
    --border: #2e2010;
    --card-bg: #1a1208;
    --card-shadow: 0 2px 12px rgba(0,0,0,0.40);
    --nav-bg: #0e0a06;
    --nav-border: #2e2010;
    --tag-bg: #2e1808;
    --tag-fg: #e0a040;
    --done-bg: #0e1e0e;
    --done-border: #5aaa5a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100c08;
  --fg: #f0e4d0;
  --fg2: #c8a870;
  --fg3: #806040;
  --accent: #e08030;
  --accent2: #d4960e;
  --accent3: #f0c040;
  --border: #2e2010;
  --card-bg: #1a1208;
  --card-shadow: 0 2px 12px rgba(0,0,0,0.40);
  --nav-bg: #0e0a06;
  --nav-border: #2e2010;
  --tag-bg: #2e1808;
  --tag-fg: #e0a040;
  --done-bg: #0e1e0e;
  --done-border: #5aaa5a;
  color-scheme: dark;
}

/* ── Reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {
  height: 100%;
  height: 100dvh;
  overflow: hidden;
}
body {
  width: 100vw;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ── */
#topbar {
  position: sticky;
  top: 0;
  padding-top: calc(8px + env(safe-area-inset-top, 0px)) !important;   /* clear the iPhone status bar */
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  flex-shrink: 0;
}
#topbar h1 { display: none; }   /* tabs show where you are; the cut-off title is hidden */
#topbar .section-tabs { flex: 1; }
#topbar .section-tabs {
  display: flex;
  gap: 4px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
#topbar .section-tabs::-webkit-scrollbar { display: none; }
.stab { flex-shrink: 0; }
.stab {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  color: var(--fg2);
  font-size: 0.8rem;
  cursor: pointer;
  white-space: nowrap;
}
.stab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
#btn-recite {
  padding: 5px 12px;
  border-radius: 20px;
  background: var(--accent2);
  color: #fff;
  border: none;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
#btn-recite:hover { opacity: 0.9; }

/* ── Main content ── */
#main {
  flex: 1;
  width: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
#main.no-scroll {
  overflow: hidden;
}
.view { display: none; padding: 16px; max-width: 680px; margin: 0 auto; }
.view.active { display: block; }
#view-home.active, #view-library.active {
  display: flex;
  flex-direction: column;
  padding: 0;
  max-width: 100%;
  width: 100%;
  margin: 0;
}
#view-home.active { height: 100%; }
#view-library.active { min-height: 100%; }
/* Chapter transition animations — small translate so nothing clips */
@keyframes slideInRight { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideInLeft  { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
.chapter-enter-next { animation: slideInRight 0.25s ease-out both; }
.chapter-enter-prev { animation: slideInLeft  0.25s ease-out both; }

/* ── Practice view — book-style ── */
#view-practice .chapter-header {
  text-align: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--border);
}
#view-practice .chapter-header h2 {
  font-size: 1.3rem;
  color: var(--accent);
  font-weight: 700;
}
#view-practice .chapter-header .subtitle {
  font-size: 0.9rem;
  color: var(--fg2);
  margin-top: 4px;
}
#view-practice .chapter-header .chapter-num {
  font-size: 0.8rem;
  color: var(--fg3);
  margin-top: 2px;
}

/* Chapter invocation header (ōṃ śrī paramātmanē namaḥ / atha N-o'dhyāyaḥ / yogaName) */
.chapter-invocation {
  text-align: center;
  margin: 0 0 20px 0;
  padding: 12px 16px;
  background: var(--card-bg);
  border-radius: 8px;
  font-size: 0.95rem;
  color: var(--fg2);
  line-height: 1.8;
  font-style: italic;
}

/* Book-style verse block */
.verse-block {
  margin-bottom: 20px;
  padding: 0;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.15s;
}
.verse-block:hover { background: var(--card-bg); }
.verse-block.done { 
  opacity: 0.55;
}
.verse-text {
  font-size: var(--practice-font, 1.6rem);
  line-height: 2.1;
  color: var(--fg);
  font-family: 'Georgia', 'Times New Roman', serif;
}
.verse-text .vline {
  display: inline;
}
/* Telugu script line */
.vline-te {
  display: block;
  font-size: 0.78em;
  line-height: 1.6;
  color: var(--fg2);
  font-family: 'Noto Sans Telugu', 'Gautami', serif;
  opacity: 0.82;
  margin-top: 1px;
  margin-bottom: 4px;
}
/* Recite Telugu line */
.recite-line-te {
  font-size: calc(var(--recite-font, 1.9rem) * 0.82);
  line-height: 1.5;
  color: var(--recite-fg);
  opacity: 0.75;
  font-family: 'Noto Sans Telugu', 'Gautami', serif;
  margin-top: 2px;
  margin-bottom: 8px;
}
/* Verse number inline like ॥ 1 ॥ */
.verse-num {
  display: inline;
  color: var(--accent2);
  font-size: 1.05rem;
  font-weight: 600;
  margin-left: 4px;
}
/* Speaker tag */
.spk-tag {
  display: inline-block;
  font-size: 0.85rem;
  color: var(--tag-fg);
  background: var(--tag-bg);
  border-radius: 3px;
  padding: 2px 8px;
  margin-right: 6px;
  font-style: italic;
  vertical-align: middle;
}

/* Expanded meaning */
.verse-meaning {
  display: none;
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--card-bg);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  font-size: 0.9rem;
  color: var(--fg2);
  line-height: 1.6;
}
.verse-block.expanded .verse-meaning { display: block; }
.verse-meaning.empty { display: none !important; }

/* Done checkmark */
.verse-speaker { font-size:0.72rem; font-weight:600; color:var(--accent2); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px; }
.verse-done-mark {
  display: none;
  float: right;
  color: #4caf50;
  font-size: 1.1rem;
}
.verse-block.done .verse-speaker { font-size:0.72rem; font-weight:600; color:var(--accent2); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px; }
.verse-done-mark { display: inline; }

/* ── Rudram lines (not individual verses, just lines) ── */
.rudram-anuvaka {
  margin-bottom: 24px;
}
.rudram-anuvaka .an-header {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.rudram-lines {
  font-family: 'Georgia', 'Times New Roman', serif;
  font-size: var(--practice-font, 1.6rem);
  line-height: 2.1;
  color: var(--fg);
}
.rudram-lines span { display: block; }
.rudram-lines .vline { margin-bottom: 6px; }

/* ── Rudram part chooser (Namakam / Chamakam) ── */
.rudram-choose { display: grid; gap: 14px; margin-top: 8px; }
.rudram-choice {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 20px 18px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--card-bg); color: var(--fg);
  font-family: inherit;
}
.rudram-choice:active { transform: scale(0.99); }
.rudram-choice .rc-name { font-size: 1.35rem; font-weight: 700; color: var(--accent); }
.rudram-choice .rc-desc { font-size: 0.9rem; color: var(--fg2); margin-top: 4px; }
.rudram-switch { display: flex; gap: 8px; margin: 0 0 14px; }
.rudram-switch button {
  flex: 1; padding: 9px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--fg2);
  font-family: inherit; font-size: 0.9rem; font-weight: 600;
}
.rudram-switch button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── Bottom nav ── */
#bottomnav {
  position: sticky;
  bottom: 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--nav-bg);
  border-top: 1px solid var(--nav-border);
  display: flex;
  z-index: 100;
  flex-shrink: 0;
}
.bnav-btn {
  flex: 1;
  padding: 10px 4px;
  border: none;
  background: none;
  color: var(--fg3);
  font-size: 0.7rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: color 0.15s;
}
.bnav-btn.active { color: var(--accent); }
.bnav-btn svg { width: 22px; height: 22px; }
.bnav-btn span { font-size: 0.65rem; }

/* ── Index view ── */
#view-index { padding-bottom: 24px; }
.idx-section {
  margin-bottom: 28px;
}
.idx-section h2 {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.idx-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 8px;
}
.idx-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.idx-card:hover { border-color: var(--accent); }
.idx-card.current { border-color: var(--accent); background: var(--tag-bg); }
.idx-card .idx-num {
  font-size: 0.7rem;
  color: var(--fg3);
  margin-bottom: 2px;
}
.idx-card .idx-name {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--fg);
  line-height: 1.3;
}
.idx-card .idx-sub {
  font-size: 0.75rem;
  color: var(--fg2);
  margin-top: 2px;
}
.idx-card .idx-prog {
  margin-top: 6px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.idx-card .idx-prog-fill {
  height: 100%;
  background: var(--accent2);
  border-radius: 2px;
  transition: width 0.3s;
}

/* ── Progress view ── */
#view-progress h2 {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 20px;
}
.prog-section { margin-bottom: 24px; }
.prog-section h3 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--fg);
}
.prog-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.prog-label {
  font-size: 0.85rem;
  color: var(--fg2);
  width: 120px;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.prog-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: var(--accent2);
  border-radius: 3px;
  transition: width 0.5s;
}
.prog-pct {
  font-size: 0.8rem;
  color: var(--fg3);
  width: 36px;
  text-align: right;
  flex-shrink: 0;
}
.prog-reset {
  margin-top: 20px;
  padding: 8px 16px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg2);
  cursor: pointer;
  font-size: 0.85rem;
}

/* ── Recite overlay ── */
#recite-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: var(--recite-bg);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 24px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 52px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 100px);
}
#recite-overlay.active { display: flex; }
#recite-lines {
  width: 100%;
  max-width: 680px;
  display: flex;
  flex-direction: column;
  gap: clamp(20px, 5vw, 40px);
  text-align: center;
}
.recite-spk {
  font-size: clamp(0.78rem, 2.2vw, 0.95rem);
  color: var(--recite-fg);
  opacity: 0.45;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-family: 'Georgia', 'Times New Roman', serif;
  margin-bottom: 8px;
}
.recite-line {
  font-size: var(--recite-font, 1.9rem);
  line-height: 1.6;
  color: var(--recite-hl);
  font-family: 'Georgia', 'Times New Roman', serif;
  font-weight: 600;
}
#recite-info {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  color: #666;
  font-size: 0.8rem;
  z-index: 1001;
}
#recite-controls {
  position: fixed;
  bottom: env(safe-area-inset-bottom, 0px);
  left: 0; right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 10px 20px 14px;
  background: rgba(0,0,0,0.7);
}
.recite-btn {
  padding: 10px 24px;
  border-radius: 24px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 0.95rem;
  cursor: pointer;
  white-space: nowrap;
}
.recite-btn:hover { background: rgba(255,255,255,0.2); }
.recite-btn.primary {
  background: var(--recite-hl);
  border-color: var(--recite-hl);
  color: #000;
  font-weight: 700;
}
#recite-dots {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 320px;
  padding: 0 8px;
}
.recite-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transition: background 0.2s;
  cursor: pointer;
  padding: 5px;
  box-sizing: content-box;
  margin: -5px;
}
.recite-dot.done { background: var(--recite-hl); }
.recite-dot.cur { background: #fff; }
/* Recite auto-advance timer */
#recite-timer-bar {
  position: absolute; top: 0; left: 0; height: 3px; width: 0;
  background: var(--recite-hl);
}
#recite-timer-bar.running { animation: reciteTimerFill linear forwards; }
@keyframes reciteTimerFill { from { width: 0; } to { width: 100%; } }
#recite-timer-ctrl {
  display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap;
  color: rgba(255,255,255,0.7); font-size: 0.78rem; font-weight: 600;
}
.recite-timer-btn {
  padding: 5px 12px; border-radius: 16px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.8); font-size: 0.78rem; font-weight: 700;
}
.recite-timer-btn.active { background: var(--recite-hl); border-color: var(--recite-hl); color: #000; }
/* Recite font controls — inside info bar */
#recite-font-ctrl {
  display: flex;
  gap: 6px;
}
.recite-font-btn {
  padding: 5px 10px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.02em;
}
.recite-font-btn:active { background: rgba(255,255,255,0.25); }
/* Settings view */
.settings-view { padding: 16px 0 32px; }
.settings-section { margin-bottom: 28px; }
.settings-section-title { font-size: 0.72rem; font-weight: 700; color: var(--fg3); letter-spacing: 0.1em; text-transform: uppercase; padding: 0 4px 8px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 16px; }
.settings-row:last-child { border-bottom: none; }
.settings-label { font-size: 0.95rem; color: var(--fg); font-weight: 500; }
.settings-desc { font-size: 0.78rem; color: var(--fg3); margin-top: 2px; }
.settings-control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sz-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--card-bg); color: var(--fg); font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.sz-btn:active { background: var(--border); }
.sz-val { font-size: 0.9rem; font-weight: 600; color: var(--accent2); min-width: 36px; text-align: center; }
.toggle-switch { position: relative; width: 44px; height: 26px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 26px; transition: background 0.2s; cursor: pointer; }
.toggle-slider:before { content:''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
.toggle-switch input:checked + .toggle-slider { background: var(--accent2); }
.toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }

/* ── Placeholder for Vishnu Sahasranamam / Chamakam ── */
.placeholder-msg {
  text-align: center;
  padding: 60px 20px;
  color: var(--fg3);
}
.placeholder-msg h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--fg2); }
.placeholder-msg p { font-size: 0.9rem; }

/* ── Additional theme tokens ── */
:root[data-theme="saffron"] {
  --bg: #fff8f0; --fg: #2a1000; --fg2: #7a3800; --fg3: #b87030;
  --accent: #c84800; --accent2: #e86000; --accent3: #f08000;
  --border: #f0d0a0; --card-bg: #fffaf5; --card-shadow: 0 2px 12px rgba(200,80,0,0.12);
  --nav-bg: #fff8f0; --nav-border: #f0d0a0;
  --home-gradient: linear-gradient(160deg, #6a1800 0%, #c84800 40%, #3a0800 100%);
  --home-gold: #ffcc44; --home-gold2: #e08000;
  --tag-bg: #fde8cc; --tag-fg: #c84800; --done-bg: #eef6ee; --done-border: #5aaa5a;
  color-scheme: light;
}
:root[data-theme="forest"] {
  --bg: #f0f8f4; --fg: #0a2010; --fg2: #2a6040; --fg3: #5a9070;
  --accent: #1a6040; --accent2: #2a9060; --accent3: #40b878;
  --border: #c0e0d0; --card-bg: #f8fff8; --card-shadow: 0 2px 12px rgba(0,100,50,0.10);
  --nav-bg: #f0f8f4; --nav-border: #c0e0d0;
  --home-gradient: linear-gradient(160deg, #062010 0%, #1a6040 40%, #0a1820 100%);
  --home-gold: #80ffb0; --home-gold2: #40b878;
  --tag-bg: #d0eedc; --tag-fg: #1a6040; --done-bg: #eef6ee; --done-border: #5aaa5a;
  color-scheme: light;
}
:root[data-theme="night"] {
  --bg: #080c18; --fg: #d0e0ff; --fg2: #8090c0; --fg3: #4050a0;
  --accent: #4080ff; --accent2: #6098ff; --accent3: #80b0ff;
  --border: #1a2040; --card-bg: #0e1428; --card-shadow: 0 2px 12px rgba(0,0,80,0.50);
  --nav-bg: #060a14; --nav-border: #1a2040;
  --home-gradient: linear-gradient(160deg, #02040e 0%, #0a1640 40%, #060012 100%);
  --home-gold: #80b0ff; --home-gold2: #6098ff;
  --tag-bg: #0e1840; --tag-fg: #6098ff; --done-bg: #0a180a; --done-border: #40aa40;
  color-scheme: dark;
}

/* ── Home page ── */
#view-home {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100%;
  padding: 0;
  max-width: 100%;
  overflow-y: auto;
}
#view-home.active { display: flex; }

/* Hero */
/* ── Full-screen home ── */
#view-home, #view-library {
  padding: 0 !important;
  max-width: none !important;
  margin: 0 !important;
}
#view-home {
  width: 100vw;
  min-height: 100vh;
  min-height: 100dvh;
}
.home-screen {
  width: 100%;
  flex: 1;
  background: var(--home-gradient);
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  overflow: hidden;
}
/* Decorative light blooms */
.home-screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 28%, rgba(240,192,64,0.16) 0%, transparent 60%),
    radial-gradient(ellipse 55% 35% at 15% 85%, rgba(200,80,0,0.20) 0%, transparent 55%),
    radial-gradient(ellipse 45% 35% at 85% 75%, rgba(90,15,0,0.18) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}
.home-hero-topbar {
  width: 100%;
  padding: env(safe-area-inset-top, 16px) 20px 0;
  padding-top: max(env(safe-area-inset-top, 0px), 16px);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  position: relative; z-index: 2;
  flex-shrink: 0;
}
.home-icon-btn {
  background: rgba(255,255,255,0.12);
  border: 1.5px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.88);
  border-radius: 50%;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; cursor: pointer;
  transition: background 0.15s;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.home-icon-btn:active { background: rgba(255,255,255,0.26); transform: scale(0.95); }
/* kept for any remaining references */
.home-settings-btn { display: none; }
.home-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 28px 16px;
  position: relative; z-index: 1;
  width: 100%;
  min-height: 0;
}
.home-mandala {
  width: 155px; height: 155px;
  margin-bottom: 22px;
  filter: drop-shadow(0 0 28px rgba(240,192,64,0.55));
  animation: mandala-glow 4s ease-in-out infinite alternate;
}
@keyframes mandala-glow {
  from { filter: drop-shadow(0 0 20px rgba(240,192,64,0.40)); }
  to   { filter: drop-shadow(0 0 44px rgba(240,192,64,0.80)); }
}
.home-title {
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 2.6rem; font-weight: 700;
  color: #fff; letter-spacing: 0.02em;
  text-align: center; line-height: 1.1; margin-bottom: 8px;
  text-shadow: 0 2px 16px rgba(0,0,0,0.3);
}
.home-title span { color: var(--home-gold); }
.home-title-script {
  font-size: 1.05rem; color: rgba(240,210,140,0.85);
  text-align: center; margin-bottom: 8px; letter-spacing: 0.04em;
}
.home-subtitle {
  font-size: 0.72rem; color: rgba(240,220,180,0.55);
  text-align: center; letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 0;
}
/* Bottom panel — still inside home-screen gradient */
.home-bottom-panel {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 24px max(env(safe-area-inset-bottom, 0px), 32px);
  gap: 12px;
  position: relative; z-index: 1;
  flex-shrink: 0;
}
.home-lang-row { display: flex; gap: 8px; }
.home-lang-btn {
  padding: 9px 22px; border-radius: 22px;
  border: 1.5px solid rgba(255,255,255,0.32);
  background: rgba(255,255,255,0.10);
  color: rgba(255,255,255,0.82);
  font-size: 0.95rem; cursor: pointer; font-family: inherit;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  letter-spacing: 0.01em;
}
.home-lang-btn.active {
  background: var(--home-gold);
  border-color: var(--home-gold);
  color: #1a0800;
  font-weight: 700;
}
.home-footer-text {
  font-size: 0.68rem; color: rgba(240,220,180,0.32);
  letter-spacing: 0.06em; text-align: center;
}

/* Lang toggle + layout toggle row (library) */
.home-top-row {
  width: 100%; max-width: 480px;
  padding: 14px 20px 4px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.home-lang-row { display: flex; gap: 6px; }
.home-lang-btn {
  padding: 5px 14px; border-radius: 16px;
  border: 1.5px solid var(--accent);
  background: transparent; color: var(--accent);
  font-size: 0.82rem; cursor: pointer; font-family: inherit;
  transition: background 0.15s, color 0.15s;
}
.home-lang-btn.active { background: var(--accent); color: #fff; }
.home-layout-toggle {
  display: flex; gap: 4px;
}
.home-layout-btn {
  padding: 5px 10px; border-radius: 12px;
  border: 1.5px solid var(--border);
  background: transparent; color: var(--fg3);
  font-size: 0.88rem; cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.home-layout-btn.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}

/* Grid layout */
.home-grid {
  width: 100%; max-width: 480px;
  padding: 16px 16px 8px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  flex-shrink: 0;
}
/* iPhone Safari under-measures square (aspect-ratio) tiles in this grid, which cut off the
   last row; give library tiles an explicit height equal to their width instead */
.lib-content .home-tile { aspect-ratio: auto; height: calc((min(100vw, 480px) - 46px) / 2); }
.home-tile {
  position: relative; border-radius: 16px; overflow: hidden;
  cursor: pointer; aspect-ratio: 1/1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding: 14px 12px 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.20);
  transition: transform 0.15s, box-shadow 0.15s;
}
.home-tile:active { transform: scale(0.97); }
.home-tile.coming-soon { cursor: default; opacity: 0.7; }
.coll-head { margin: 22px 4px 8px; font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); opacity: .85; }
.home-tile-bg {
  position: absolute; inset: 0; z-index: 0;
}
/* Photo tile layers */
.home-tile-photo {
  position: absolute; inset: 0; z-index: 1;
  background-size: cover;
  background-position: center top;
  opacity: 0.60;
}
.home-tile-photo-overlay {
  position: absolute; inset: 0; z-index: 2;
  background: linear-gradient(180deg, rgba(80,10,0,0.35) 0%, rgba(30,5,0,0.65) 100%);
}
.home-tile-content { position: relative; z-index: 3; text-align: center; }
.home-tile-icon { font-size: 2.2rem; margin-bottom: 6px; display: block; }
.home-tile-name {
  font-size: 0.88rem; font-weight: 700; color: #fff;
  line-height: 1.25; text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
/* Highlighted name when photo present */
.home-tile-name.photo-name {
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 1rem; font-weight: 700;
  color: #fde98a;
  text-shadow: 0 0 12px rgba(255,200,60,0.7), 0 2px 6px rgba(0,0,0,0.8);
  letter-spacing: 0.02em;
}
.home-tile-desc {
  font-size: 0.68rem; color: rgba(255,255,255,0.75);
  margin-top: 3px; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.home-tile-badge {
  position: absolute; top: 10px; right: 10px;
  background: rgba(0,0,0,0.55);
  color: rgba(255,220,100,0.95);
  font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em;
  padding: 3px 7px; border-radius: 8px; z-index: 2;
}

/* List layout */
.home-list {
  width: 100%; max-width: 480px;
  padding: 12px 16px 8px;
  display: flex; flex-direction: column; gap: 8px;
}
.home-list-group-label {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--fg3);
  padding: 6px 4px 2px;
}
.home-list-row {
  background: var(--card-bg); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 13px 14px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; transition: background 0.12s;
}
.home-list-row:active { background: var(--border); }
.home-list-row.coming-soon { opacity: 0.55; cursor: default; }
.home-list-dot {
  width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
}
.home-list-text { flex: 1; }
.home-list-name {
  font-size: 0.95rem; font-weight: 700; color: var(--fg); line-height: 1.2;
}
.home-list-meta {
  font-size: 0.75rem; color: var(--fg3); margin-top: 2px;
}
.home-list-arrow { color: var(--accent2); font-size: 1rem; flex-shrink: 0; }
.home-list-badge {
  font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em;
  color: var(--fg3); background: var(--border);
  padding: 2px 7px; border-radius: 7px;
}

/* Begin Sādhana button */
.home-enter-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: #f0c040;
  color: #1a0800;
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 1.3rem; font-weight: 700;
  padding: 17px 46px; border-radius: 50px;
  border: none; cursor: pointer;
  box-shadow: 0 6px 28px rgba(240,192,64,0.45), 0 0 0 1px rgba(255,255,255,0.15);
  transition: transform 0.15s, box-shadow 0.15s;
  letter-spacing: 0.03em;
  margin-top: 28px;
  position: relative; z-index: 3;
  -webkit-tap-highlight-color: transparent;
}
.home-enter-btn:active {
  transform: scale(0.96);
  box-shadow: 0 2px 12px rgba(240,192,64,0.25);
}
.home-enter-arrow { font-size: 1.3rem; line-height: 1; }

/* Library view */
#view-library {
  min-height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}
#view-library:not(.active) { display: none; }
.lib-header {
  background: var(--home-gradient);
  padding: 18px 20px 22px;
  padding-top: calc(18px + env(safe-area-inset-top, 0px));   /* clear the iPhone status bar */
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 10;
}
.lib-back-btn {
  background: rgba(255,255,255,0.15);
  border: 1.5px solid rgba(255,255,255,0.3);
  color: rgba(255,255,255,0.9);
  border-radius: 50%; width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; cursor: pointer; flex-shrink: 0;
  transition: background 0.15s;
}
.lib-back-btn:active { background: rgba(255,255,255,0.28); }
.arr-done { background:#fff; color:var(--accent); border:none; border-radius:16px; padding:7px 16px; font-weight:700; font-size:.9rem; cursor:pointer; }
.arr-help { width:100%; max-width:480px; padding:14px 18px 4px; font-size:.82rem; color:var(--fg3); }
.arr-list { width:100%; max-width:480px; padding:8px 14px; display:flex; flex-direction:column; gap:8px; }
.arr-row { display:flex; align-items:center; gap:10px; background:var(--card-bg); border:1.5px solid var(--border); border-radius:14px; padding:8px 10px; user-select:none; -webkit-user-select:none; }
.arr-row.off { opacity:.5; }
.arr-row.drag { position:relative; z-index:5; box-shadow:0 8px 24px rgba(0,0,0,.25); border-color:var(--accent); }
.arr-handle { font-size:1.2rem; color:var(--fg3); padding:6px 4px; cursor:grab; touch-action:none; }
.arr-dot { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; }
.arr-name { flex:1; font-weight:600; color:var(--fg); font-size:.95rem; line-height:1.2; }
.arr-name small { display:block; font-weight:400; font-size:.72rem; color:var(--fg3); }
.arr-btn { width:34px; height:34px; border-radius:10px; border:1.5px solid var(--border); background:transparent; color:var(--fg2); font-size:.85rem; cursor:pointer; flex-shrink:0; }
.arr-btn:disabled { opacity:.3; cursor:default; }
.arr-reset { margin:14px auto 0; background:transparent; border:1.5px solid var(--border); color:var(--fg3); border-radius:16px; padding:8px 18px; font-size:.85rem; cursor:pointer; }
.lib-header-title {
  font-family: 'Crimson Text', Georgia, serif;
  font-size: 1.3rem; font-weight: 700; color: #fff;
  letter-spacing: 0.02em; flex: 1;
}
.lib-content {
  flex: 1;
  display: flex; flex-direction: column; align-items: center;
  padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
}

/* Footer */
.home-footer {
  text-align: center; font-size: 0.72rem; color: var(--fg3);
  padding: 8px 20px 24px; letter-spacing: 0.04em;
}

/* Settings modal */
.home-settings-modal {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.55);
  align-items: flex-end; justify-content: center;
}
.home-settings-modal.open { display: flex; }
.home-settings-sheet {
  background: var(--bg); border-radius: 20px 20px 0 0;
  width: 100%; max-width: 480px;
  padding: 20px 20px 32px;
  box-shadow: 0 -4px 32px rgba(0,0,0,0.25);
  animation: sheetUp 0.25s ease;
}
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.home-settings-handle {
  width: 40px; height: 4px; border-radius: 2px;
  background: var(--border); margin: 0 auto 18px;
}
.home-settings-title {
  font-size: 1rem; font-weight: 700; color: var(--fg);
  margin-bottom: 16px; text-align: center;
}
.home-settings-section {
  margin-bottom: 18px;
}
.home-settings-label {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--fg3); margin-bottom: 8px;
}
.theme-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.theme-chip {
  border-radius: 10px; border: 2px solid var(--border);
  padding: 8px 6px; cursor: pointer; text-align: center;
  transition: border-color 0.15s;
}
.theme-chip.active { border-color: var(--accent); }
.theme-chip-swatch {
  height: 24px; border-radius: 6px; margin-bottom: 4px;
}
.theme-chip-label {
  font-size: 0.72rem; font-weight: 600; color: var(--fg);
}
.font-size-row {
  display: flex; align-items: center; gap: 10px;
}
.font-size-row .sz-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--card-bg); color: var(--fg);
  font-size: 1.1rem; cursor: pointer; font-family: inherit;
}
.font-size-row .sz-val {
  flex: 1; text-align: center; font-size: 0.9rem; font-weight: 600; color: var(--fg);
}

/* ── Chapter nav bar (prev / chapter title / next) ── */
.chapter-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.chapter-nav-btn {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--card-bg);
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.chapter-nav-btn:hover { background: var(--border); }
.chapter-nav-btn:disabled { opacity: 0.3; cursor: default; }
.chapter-nav-title {
  flex: 1;
  text-align: center;
  font-size: 0.82rem;
  color: var(--fg3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Lesson continuation banner ── */
.lesson-end-banner {
  margin: 32px 0 8px;
  padding: 20px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff;
  text-align: center;
}
.lesson-end-banner .leb-title {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.lesson-end-banner .leb-sub {
  font-size: 0.8rem;
  opacity: 0.85;
  margin-bottom: 14px;
}
.lesson-end-banner .leb-next-btn {
  display: inline-block;
  padding: 9px 24px;
  border-radius: 20px;
  background: #fff;
  color: var(--accent);
  font-size: 0.9rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: opacity 0.12s;
}
.lesson-end-banner .leb-next-btn:hover { opacity: 0.88; }
.lesson-end-banner .leb-done {
  font-size: 0.8rem;
  margin-top: 10px;
  opacity: 0.75;
}

/* ── Responsive ── */
@media (max-width: 480px) {
  .verse-text, .rudram-lines { font-size: var(--practice-font, 1.4rem); }
  .idx-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .home-title { font-size: 1.9rem; }
  .home-mandala { width: 130px; height: 130px; }
  .chapter-nav-btn { padding: 6px 10px; font-size: 0.78rem; }
}
/* ── Panchāṅgam view ── */
#view-panch.view{padding:0;max-width:560px}
#view-panch{--gold:#f0c040;--bad:#c4513a;--bad-soft:rgba(196,81,58,.14);--good:#c99a1a;--good-soft:rgba(201,154,26,.18);
  --serif:'Crimson Text',Georgia,'Noto Sans Telugu',serif;--sans:-apple-system,system-ui,'Noto Sans Telugu','Segoe UI',sans-serif;font-family:var(--sans)}
#view-panch button,#view-panch select,#view-panch input{font:inherit;color:inherit}
#view-panch :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#view-panch .sky{background:var(--home-gradient);color:#f6ead2;padding:14px 16px 18px;border-radius:0 0 26px 26px}
#view-panch .sky-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#view-panch .place{position:relative;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(240,192,64,.25);font-size:.85rem;max-width:58%;min-width:0}
#view-panch .place span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view-panch .place select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
#view-panch .langs{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;flex-shrink:0}
#view-panch .langs button{border:none;background:none;color:rgba(246,234,210,.7);padding:5px 10px;border-radius:999px;font-size:.78rem;cursor:pointer}
#view-panch .langs button.on{background:var(--gold);color:#2a0e00;font-weight:700}
#view-panch .datenav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 2px;gap:8px}
#view-panch .datenav .arrow{width:40px;height:40px;flex-shrink:0;border-radius:50%;border:1px solid rgba(240,192,64,.3);background:none;color:var(--gold);font-size:1.3rem;cursor:pointer}
#view-panch .datebox{position:relative;text-align:center;flex:1;min-width:0}
#view-panch .datebox input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
#view-panch .d-main{font-family:var(--serif);font-size:1.5rem;font-weight:700;line-height:1.2;color:#fff4dc}
#view-panch .d-sub{font-size:.83rem;color:rgba(246,234,210,.72);margin-top:3px;line-height:1.4}
#view-panch .today{display:block;margin:6px auto 0;border:none;background:none;color:var(--gold);font-size:.8rem;font-weight:700;cursor:pointer;visibility:hidden}
#view-panch .today.show{visibility:visible}
#view-panch .arc{display:block;width:100%;height:auto;margin-top:2px}
#view-panch .arc-times{display:flex;justify-content:space-between;font-size:.78rem;color:rgba(246,234,210,.72);margin-top:-4px}
#view-panch .arc-times b{display:block;font-size:1rem;color:#fff4dc;font-variant-numeric:tabular-nums;font-weight:600}
#view-panch .arc-times .mid{text-align:center}
#view-panch .arc-times .r{text-align:right}
#view-panch .wrap{max-width:560px;margin:0 auto}
#view-panch .body{padding:18px 16px 32px}
#view-panch .sec-title{font-family:var(--serif);font-size:1.25rem;font-weight:700;color:var(--accent);margin:26px 0 8px}
#view-panch .sec-title:first-child{margin-top:4px}
#view-panch .sec-title small{font-family:var(--sans);font-size:.78rem;font-weight:400;color:var(--fg3);margin-left:8px}
#view-panch .limb{display:grid;grid-template-columns:40px 1fr auto;align-items:center;column-gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
#view-panch .limb:last-child{border-bottom:none}
#view-panch .limb .ico{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--accent2)}
#view-panch .limb .what{font-size:.78rem;color:var(--fg3)}
#view-panch .limb .name{font-family:var(--serif);font-size:1.3rem;font-weight:600;line-height:1.25}
#view-panch .limb .name i{font-style:normal;font-family:var(--sans);font-size:.85rem;font-weight:400;color:var(--fg2);margin-left:6px}
#view-panch .limb .until{text-align:right;font-size:.74rem;color:var(--fg3);line-height:1.3}
#view-panch .limb .until b{display:block;font-size:.98rem;color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
#view-panch .limb .bar{grid-column:2/4;height:3px;border-radius:2px;background:var(--border);overflow:hidden;margin-top:8px}
#view-panch .limb .bar span{display:block;height:100%;background:var(--accent2)}
#view-panch .rasi{display:flex;gap:10px;margin-top:10px}
#view-panch .rasi > div{flex:1;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--card-bg)}
#view-panch .rasi .what{font-size:.75rem;color:var(--fg3)}
#view-panch .rasi .name{font-family:var(--serif);font-size:1.2rem;font-weight:600}
#view-panch .strip{position:relative;height:28px;border-radius:8px;background:var(--card-bg);border:1px solid var(--border);overflow:hidden;margin:4px 0 4px}
#view-panch .strip .night{position:absolute;top:0;bottom:0;background:rgba(60,30,90,.10)}
#view-panch .strip .seg{position:absolute;top:6px;bottom:6px;border-radius:3px}
#view-panch .strip .now{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
#view-panch .strip-scale{display:flex;justify-content:space-between;font-size:.7rem;color:var(--fg3);margin-bottom:8px;font-variant-numeric:tabular-nums}
#view-panch .t-row{display:flex;align-items:center;gap:10px;padding:9px 10px;margin:0 -10px;border-radius:10px}
#view-panch .t-row .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
#view-panch .t-row .tn{flex:1;font-size:.98rem;min-width:0}
#view-panch .t-row .tn small{display:block;font-size:.74rem;color:var(--fg3)}
#view-panch .t-row .tt{font-variant-numeric:tabular-nums;font-size:.93rem;white-space:nowrap}
#view-panch .t-row.bad .dot{background:var(--bad)}
#view-panch .t-row.good .dot{background:var(--good)}
#view-panch .t-row.live{background:var(--bad-soft)}
#view-panch .t-row.good.live{background:var(--good-soft)}
#view-panch .t-row .tag{font-size:.72rem;font-weight:700;color:var(--bad);margin-left:6px}
#view-panch .t-row.good .tag{color:var(--good)}
#view-panch .sank{text-align:center;border-radius:18px;padding:24px 16px 18px;background:var(--card-bg);border:1px solid var(--border);position:relative;margin-top:18px}
#view-panch .sank:before{content:'॥ ॐ ॥';position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--bg);color:var(--accent2);padding:0 10px;font-size:1rem;white-space:nowrap}
#view-panch .sank p{margin:0;font-family:var(--serif);font-size:1.2rem;line-height:1.7}
#view-panch .sank p .en{display:block;font-size:.85rem;line-height:1.3;color:var(--fg3);font-style:italic;margin-bottom:6px}
#view-panch .share{display:block;width:100%;margin-top:22px;padding:14px;border:none;border-radius:14px;background:var(--accent);color:var(--bg);font-weight:700;font-size:1rem;cursor:pointer}
#view-panch .foot{font-size:.74rem;color:var(--fg3);text-align:center;margin-top:12px;line-height:1.5}

const DHYANA_DATA = [{"n":1,"tlines":["om pārthāya pratibodhitāṃ bhagavatā","nārāyaṇena svayaṃ","vyāsena grathitāṃ purāṇamuninā","madhye mahābhāratam |","advaitāmṛta-varṣiṇīṃ bhagavatīm","aṣṭādaśādhyāyinīṃ","amba tvām anusandadhāmi","bhagavadgīte bhavadveṣiṇīm"]},{"n":2,"tlines":["namo'stute vyāsa viśāla buddhe","phullāravindāyata patranetra |","yenatvayā bhārata taila pūrṇaḥ","prajvālito jñāna mayaḥ pradīpaḥ"]},{"n":3,"tlines":["prapanna pārijātāya","totravetraika pāṇaye |","jñānamudrāya kṛṣṇāya","gītāmṛtaduhe namaḥ"]},{"n":4,"tlines":["vasudeva sutaṃ devaṃ","kaṃsa cāṇūra mardanam |","devakī paramānandaṃ","kṛṣṇaṃ vande jagadgurum"]},{"n":5,"tlines":["bhīṣmadroṇataṭā jayadrathajalā","gāndhāra nīlotpalā","śalyagrāhavatī kṛpeṇa vahanī","karṇena velākulā |","aśvatthāma vikarṇa ghoramakarā","duryodhanāvartinī","sottīrṇā khalu pāṇḍavai raṇanadī","kaivartakaḥ keśavaḥ"]},{"n":6,"tlines":["pārāśarya vacassarojamamalaṃ","gītārtha gandhotkaṭaṃ","nānākhyānaka kesaraṃ harikathā","sambodhanā bodhitam |","loke sajjana ṣaṭpadairaharahaḥ","pepīyamānaṃ mudā","bhūyāt bhārata paṅkajaṃ kalimala","pradhvaṃsinaḥ śreyase"]},{"n":7,"tlines":["mūkaṃ karoti vācālaṃ","paṅguṃ laṅghayate girim |","yat kṛpā tamahaṃ vande","paramānanda mādhavam"]},{"n":8,"tlines":["śāntākāraṃ bhujagaśayanaṃ","padmanābhaṃ sureśaṃ","viśvādhāraṃ gaganasadṛśaṃ","meghavarṇaṃ śubhāṅgam|","lakṣmīkāntaṃ kamalanayanaṃ","yogihṛddhyānagamyaṃ","vande viṣṇuṃ bhavabhayaharaṃ","sarva lokaikanātham"]},{"n":9,"tlines":["yaṃ brahmāvaruṇendrarudramarutaḥ","stunvanti divyaiḥ stavaiḥ","vedaiḥ sāṅgapadakramopaniṣadaiḥ","gāyanti yaṃ sāmagāḥ|","dhyānāvasthita tadgatena manasā","paśyanti yaṃ yoginaḥ","yasyāntaṃ na vidussurāsuragaṇāḥ","devāya tasmai namaḥ"]},{"n":10,"tlines":["nārāyaṇaṃ namaskṛtya","narañcaiva narottamam |","devīṃ sarasvatīṃ vyāsaṃ","tato jayamudīrayet"]},{"n":11,"tlines":["saccidānandarūpāya","kṛṣṇāyākliṣṭakāriṇe |","namo vedāntavedyāya","gurave buddhisākṣiṇe"]},{"n":12,"tlines":["sarvopaniṣado gāvaḥ","dogdhā gopālananda
