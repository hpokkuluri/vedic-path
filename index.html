    { n:12, tlines:["అనాది నిధనం విష్ణుం సర్వలోక మహేశ్వరమ్ ।", "లోకాధ్యక్షం స్తువన్నిత్యం సర్వ దుఃఖాతిగో భవేత్ ॥ 12 ॥"] },
    { n:13, tlines:["బ్రహ్మణ్యం సర్వ ధర్మజ్ఞం లోకానాం కీర్తి వర్ధనమ్ ।", "లోకనాథం మహద్భూతం సర్వభూత భవోద్భవం॥ 13 ॥"] },
    { n:14, tlines:["ఏష మే సర్వ ధర్మాణాం ధర్మోఽధిక తమోమతః ।", "యద్భక్త్యా పుండరీకాక్షం స్తవైరర్చేన్నరః సదా ॥ 14 ॥"] },
    { n:15, tlines:["పరమం యో మహత్తేజః పరమం యో మహత్తపః ।", "పరమం యో మహద్బ్రహ్మ పరమం యః పరాయణమ్ ॥ 15 ॥"] },
    { n:16, tlines:["పవిత్రాణాం పవిత్రం యో మంగళానాం చ మంగళమ్ ।", "దైవతం దేవతానాం చ భూతానాం యోఽవ్యయః పితా ॥ 16 ॥"] },
    { n:17, tlines:["యతః సర్వాణి భూతాని భవంత్యాది యుగాగమే ।", "యస్మింశ్చ ప్రళయం యాంతి పునరేవ యుగక్షయే ॥ 17 ॥"] },
    { n:18, tlines:["తస్య లోక ప్రధానస్య జగన్నాథస్య భూపతే ।", "విష్ణోర్నామ సహస్రం మే శృణు పాప భయాపహమ్ ॥ 18 ॥"] },
    { n:19, tlines:["యాని నామాని గౌణాని విఖ్యాతాని మహాత్మనః ।", "ఋషిభిః పరిగీతాని తాని వక్ష్యామి భూతయే ॥ 19 ॥"] },
    { n:20, tlines:["ఋషిర్నామ్నాం సహస్రస్య వేదవ్యాసో మహామునిః ॥", "ఛందోఽనుష్టుప్ తథా దేవో భగవాన్ దేవకీసుతః ॥ 20 ॥"] },
    { n:21, tlines:["త్రిసామా హృదయం తస్య శాంత్యర్థే వినియుజ్యతే ॥ 21 ॥"] },
    { n:22, tlines:["విష్ణుం జిష్ణుం మహావిష్ణుం ప్రభవిష్ణుం మహేశ్వరమ్ ॥", "అనేకరూప దైత్యాంతం నమామి పురుషోత్తమమ్ ॥ 22 ॥"] },
  ],
  dhyanam: [
    { n:1, tlines:["క్షీరోధన్వత్ప్రదేశే శుచిమణి-విలస-త్సైకతే-మౌక్తికానాం", "మాలా-కౢప్తాసనస్థః స్ఫటిక-మణినిభై-ర్మౌక్తికై-ర్మండితాంగః ।", "శుభ్రై-రభ్రై-రదభ్రై-రుపరివిరచితై-ర్ముక్త పీయూష వర్షైః", "ఆనందీ నః పునీయా-దరినలినగదా శంఖపాణి-ర్ముకుందః ॥ 1 ॥"] },
    { n:2, tlines:["భూః పాదౌ యస్య నాభిర్వియ-దసుర నిలశ్చంద్ర సూర్యౌ చ నేత్రే", "కర్ణావాశాః శిరోద్యౌర్ముఖమపి దహనో యస్య వాస్తేయమబ్ధిః ।", "అంతఃస్థం యస్య విశ్వం సుర నరఖగగోభోగి గంధర్వదైత్యైః", "చిత్రం రం రమ్యతే తం త్రిభువన వపుశం విష్ణుమీశం నమామి ॥ 2 ॥"] },
    { n:3, tlines:["శాంతాకారం భుజగశయనం పద్మనాభం సురేశం", "విశ్వాధారం గగనసదృశం మేఘవర్ణం శుభాంగమ్ ।", "లక్ష్మీకాంతం కమలనయనం యోగిహృద్ధ్యానగమ్యం", "వందే విష్ణుం భవభయహరం సర్వలోకైకనాథమ్ ॥ 3 ॥"] },
    { n:4, tlines:["మేఘశ్యామం పీతకౌశేయవాసం", "శ్రీవత్సాంకం కౌస్తుభోద్భాసితాంగమ్ ।", "పుణ్యోపేతం పుండరీకాయతాక్షం", "విష్ణుం వందే సర్వలోకైకనాథమ్ ॥ 4 ॥"] },
    { n:5, tlines:["నమః సమస్త భూతానాం ఆది భూతాయ భూభృతే ।", "అనేకరూప రూపాయ విష్ణవే ప్రభవిష్ణవే ॥ 5॥"] },
    { n:6, tlines:["సశంఖచక్రం సకిరీటకుండలం", "సపీతవస్త్రం సరసీరుహేక్షణమ్ ।", "సహార వక్షఃస్థల శోభి కౌస్తుభం", "నమామి విష్ణుం శిరసా చతుర్భుజమ్ । 6॥"] },
    { n:7, tlines:["ఛాయాయాం పారిజాతస్య హేమసింహాసనోపరి", "ఆసీనమంబుదశ్యామమాయతాక్షమలంకృతమ్ ॥ 7 ॥"] },
    { n:8, tlines:["చంద్రాననం చతుర్బాహుం శ్రీవత్సాంకిత వక్షసం", "రుక్మిణీ సత్యభామాభ్యాం సహితం కృష్ణమాశ్రయే ॥ 8 ॥"] },
  ],
  '1': [{ n:1, tlines:["విశ్వం విష్ణుర్వషట్కారో భూతభవ్యభవత్ప్రభుః ।", "భూతకృద్భూతభృద్భావో భూతాత్మా భూతభావనః ॥ 1 ॥"] }],
  '2': [{ n:1, tlines:["పూతాత్మా పరమాత్మా చ ముక్తానాం పరమాగతిః ।", "అవ్యయః పురుషః సాక్షీ క్షేత్రజ్ఞోఽక్షర ఏవ చ ॥ 2 ॥"] }],
  '3': [{ n:1, tlines:["యోగో యోగవిదాం నేతా ప్రధాన పురుషేశ్వరః ।", "నారసింహవపుః శ్రీమాన్ కేశవః పురుషోత్తమః ॥ 3 ॥"] }],
  '4': [{ n:1, tlines:["సర్వః శర్వః శివః స్థాణుర్భూతాదిర్నిధిరవ్యయః ।", "సంభవో భావనో భర్తా ప్రభవః ప్రభురీశ్వరః ॥ 4 ॥"] }],
  '5': [{ n:1, tlines:["స్వయంభూః శంభురాదిత్యః పుష్కరాక్షో మహాస్వనః ।", "అనాదినిధనో ధాతా విధాతా ధాతురుత్తమః ॥ 5 ॥"] }],
  '6': [{ n:1, tlines:["అప్రమేయో హృషీకేశః పద్మనాభోఽమరప్రభుః ।", "విశ్వకర్మా మనుస్త్వష్టా స్థవిష్ఠః స్థవిరో ధ్రువః ॥ 6 ॥"] }],
  '7': [{ n:1, tlines:["అగ్రాహ్యః శాశ్వతో కృష్ణో లోహితాక్షః ప్రతర్దనః ।", "ప్రభూతస్త్రికకుబ్ధామ పవిత్రం మంగళం పరమ్ ॥ 7 ॥"] }],
  '8': [{ n:1, tlines:["ఈశానః ప్రాణదః ప్రాణో జ్యేష్ఠః శ్రేష్ఠః ప్రజాపతిః ।", "హిరణ్యగర్భో భూగర్భో మాధవో మధుసూదనః ॥ 8 ॥"] }],
  '9': [{ n:1, tlines:["ఈశ్వరో విక్రమీధన్వీ మేధావీ విక్రమః క్రమః ।", "అనుత్తమో దురాధర్షః కృతజ్ఞః కృతిరాత్మవాన్॥ 9 ॥"] }],
  '10': [{ n:1, tlines:["సురేశః శరణం శర్మ విశ్వరేతాః ప్రజాభవః ।", "అహస్సంవత్సరో వ్యాళః ప్రత్యయః సర్వదర్శనః ॥ 10 ॥"] }],
  '11': [{ n:1, tlines:["అజస్సర్వేశ్వరః సిద్ధః సిద్ధిః సర్వాదిరచ్యుతః ।", "వృషాకపిరమేయాత్మా సర్వయోగవినిస్సృతః ॥ 11 ॥"] }],
  '12': [{ n:1, tlines:["వసుర్వసుమనాః సత్యః సమాత్మా సమ్మితస్సమః ।", "అమోఘః పుండరీకాక్షో వృషకర్మా వృషాకృతిః ॥ 12 ॥"] }],
  '13': [{ n:1, tlines:["రుద్రో బహుశిరా బభ్రుర్విశ్వయోనిః శుచిశ్రవాః ।", "అమృతః శాశ్వతస్థాణుర్వరారోహో మహాతపాః ॥ 13 ॥"] }],
  '14': [{ n:1, tlines:["సర్వగః సర్వ విద్భానుర్విష్వక్సేనో జనార్దనః ।", "వేదో వేదవిదవ్యంగో వేదాంగో వేదవిత్కవిః ॥ 14 ॥"] }],
  '15': [{ n:1, tlines:["లోకాధ్యక్షః సురాధ్యక్షో ధర్మాధ్యక్షః కృతాకృతః ।", "చతురాత్మా చతుర్వ్యూహశ్చతుర్దంష్ట్రశ్చతుర్భుజః ॥ 15 ॥"] }],
  '16': [{ n:1, tlines:["భ్రాజిష్ణుర్భోజనం భోక్తా సహిష్ణుర్జగదాదిజః ।", "అనఘో విజయో జేతా విశ్వయోనిః పునర్వసుః ॥ 16 ॥"] }],
  '17': [{ n:1, tlines:["ఉపేంద్రో వామనః ప్రాంశురమోఘః శుచిరూర్జితః ।", "అతీంద్రః సంగ్రహః సర్గో ధృతాత్మా నియమో యమః ॥ 17 ॥"] }],
  '18': [{ n:1, tlines:["వేద్యో వైద్యః సదాయోగీ వీరహా మాధవో మధుః ।", "అతీంద్రియో మహామాయో మహోత్సాహో మహాబలః ॥ 18 ॥"] }],
  '19': [{ n:1, tlines:["మహాబుద్ధిర్మహావీర్యో మహాశక్తిర్మహాద్యుతిః ।", "అనిర్దేశ్యవపుః శ్రీమానమేయాత్మా మహాద్రిధృక్ ॥ 19 ॥"] }],
  '20': [{ n:1, tlines:["మహేశ్వాసో మహీభర్తా శ్రీనివాసః సతాంగతిః ।", "అనిరుద్ధః సురానందో గోవిందో గోవిదాం పతిః ॥ 20 ॥"] }],
  '21': [{ n:1, tlines:["మరీచిర్దమనో హంసః సుపర్ణో భుజగోత్తమః ।", "హిరణ్యనాభః సుతపాః పద్మనాభః ప్రజాపతిః ॥ 21 ॥"] }],
  '22': [{ n:1, tlines:["అమృత్యుః సర్వదృక్ సింహః సంధాతా సంధిమాన్ స్థిరః ।", "అజో దుర్మర్షణః శాస్తా విశ్రుతాత్మా సురారిహా ॥ 22 ॥"] }],
  '23': [{ n:1, tlines:["గురుర్గురుతమో ధామ సత్యః సత్యపరాక్రమః ।", "నిమిషోఽనిమిషః స్రగ్వీ వాచస్పతిరుదారధీః ॥ 23 ॥"] }],
  '24': [{ n:1, tlines:["అగ్రణీగ్రామణీః శ్రీమాన్ న్యాయో నేతా సమీరణః", "సహస్రమూర్ధా విశ్వాత్మా సహస్రాక్షః సహస్రపాత్ ॥ 24 ॥"] }],
  '25': [{ n:1, tlines:["ఆవర్తనో నివృత్తాత్మా సంవృతః సంప్రమర్దనః ।", "అహః సంవర్తకో వహ్నిరనిలో ధరణీధరః ॥ 25 ॥"] }],
  '26': [{ n:1, tlines:["సుప్రసాదః ప్రసన్నాత్మా విశ్వధృగ్విశ్వభుగ్విభుః ।", "సత్కర్తా సత్కృతః సాధుర్జహ్నుర్నారాయణో నరః ॥ 26 ॥"] }],
  '27': [{ n:1, tlines:["అసంఖ్యేయోఽప్రమేయాత్మా విశిష్టః శిష్టకృచ్ఛుచిః ।", "సిద్ధార్థః సిద్ధసంకల్పః సిద్ధిదః సిద్ధి సాధనః ॥ 27 ॥"] }],
  '28': [{ n:1, tlines:["వృషాహీ వృషభో విష్ణుర్వృషపర్వా వృషోదరః ।", "వర్ధనో వర్ధమానశ్చ వివిక్తః శ్రుతిసాగరః ॥ 28 ॥"] }],
  '29': [{ n:1, tlines:["సుభుజో దుర్ధరో వాగ్మీ మహేంద్రో వసుదో వసుః ।", "నైకరూపో బృహద్రూపః శిపివిష్టః ప్రకాశనః ॥ 29 ॥"] }],
  '30': [{ n:1, tlines:["ఓజస్తేజోద్యుతిధరః ప్రకాశాత్మా ప్రతాపనః ।", "ఋద్ధః స్పష్టాక్షరో మంత్రశ్చంద్రాంశుర్భాస్కరద్యుతిః ॥ 30 ॥"] }],
  '31': [{ n:1, tlines:["ఔషధం జగతః సేతుః సత్యధర్మపరాక్రమః ॥ 31 ॥"] }],
  '32': [{ n:1, tlines:["భూతభవ్యభవన్నాథః పవనః పావనోఽనలః ।", "కామహా కామకృత్కాంతః కామః కామప్రదః ప్రభుః ॥ 32 ॥"] }],
  '33': [{ n:1, tlines:["యుగాది కృద్యుగావర్తో నైకమాయో మహాశనః ।", "అదృశ్యో వ్యక్తరూపశ్చ సహస్రజిదనంతజిత్ ॥ 33 ॥"] }],
  '34': [{ n:1, tlines:["ఇష్టోఽవిశిష్టః శిష్టేష్టః శిఖండీ నహుషో వృషః ।", "క్రోధహా క్రోధకృత్కర్తా విశ్వబాహుర్మహీధరః ॥ 34 ॥"] }],
  '35': [{ n:1, tlines:["అచ్యుతః ప్రథితః ప్రాణః ప్రాణదో వాసవానుజః ।", "అపాంనిధిరధిష్ఠానమప్రమత్తః ప్రతిష్ఠితః ॥ 35 ॥"] }],
  '36': [{ n:1, tlines:["స్కందః స్కందధరో ధుర్యో వరదో వాయువాహనః ।", "వాసుదేవో బృహద్భానురాదిదేవః పురంధరః ॥ 36 ॥"] }],
  '37': [{ n:1, tlines:["అశోకస్తారణస్తారః శూరః శౌరిర్జనేశ్వరః ।", "అనుకూలః శతావర్తః పద్మీ పద్మనిభేక్షణః ॥ 37 ॥"] }],
  '38': [{ n:1, tlines:["పద్మనాభోఽరవిందాక్షః పద్మగర్భః శరీరభృత్ ।", "మహర్ధిరృద్ధో వృద్ధాత్మా మహాక్షో గరుడధ్వజః ॥ 38 ॥"] }],
  '39': [{ n:1, tlines:["అతులః శరభో భీమః సమయజ్ఞో హవిర్హరిః ।", "సర్వలక్షణలక్షణ్యో లక్ష్మీవాన్ సమితింజయః ॥ 39 ॥"] }],
  '40': [{ n:1, tlines:["విక్షరో రోహితో మార్గో హేతుర్దామోదరః సహః ।", "మహీధరో మహాభాగో వేగవానమితాశనః ॥ 40 ॥"] }],
  '41': [{ n:1, tlines:["కరణం కారణం కర్తా వికర్తా గహనో గుహః ॥ 41 ॥"] }],
  '42': [{ n:1, tlines:["వ్యవసాయో వ్యవస్థానః సంస్థానః స్థానదో ధ్రువః ।", "పరర్ధిః పరమస్పష్టః తుష్టః పుష్టః శుభేక్షణః ॥ 42 ॥"] }],
  '43': [{ n:1, tlines:["రామో విరామో విరజో మార్గోనేయో నయోఽనయః ।", "వీరః శక్తిమతాం శ్రేష్ఠో ధర్మోధర్మ విదుత్తమః ॥ 43 ॥"] }],
  '44': [{ n:1, tlines:["వైకుంఠః పురుషః ప్రాణః ప్రాణదః ప్రణవః పృథుః ।", "హిరణ్యగర్భః శత్రుఘ్నో వ్యాప్తో వాయురధోక్షజః ॥ 44 ॥"] }],
  '45': [{ n:1, tlines:["ఉగ్రః సంవత్సరో దక్షో విశ్రామో విశ్వదక్షిణః ॥ 45 ॥"] }],
  '46': [{ n:1, tlines:["విస్తారః స్థావర స్థాణుః ప్రమాణం బీజమవ్యయమ్ ।", "అర్థోఽనర్థో మహాకోశో మహాభోగో మహాధనః ॥ 46 ॥"] }],
  '47': [{ n:1, tlines:["అనిర్విణ్ణః స్థవిష్ఠో భూర్ధర్మయూపో మహామఖః ।", "నక్షత్రనేమిర్నక్షత్రీ క్షమః, క్షామః సమీహనః ॥ 47 ॥"] }],
  '48': [{ n:1, tlines:["యజ్ఞ ఇజ్యో మహేజ్యశ్చ క్రతుః సత్రం సతాంగతిః ।", "సర్వదర్శీ విముక్తాత్మా సర్వజ్ఞో జ్ఞానముత్తమమ్ ॥ 48 ॥"] }],
  '49': [{ n:1, tlines:["మనోహరో జితక్రోధో వీర బాహుర్విదారణః ॥ 49 ॥"] }],
  '50': [{ n:1, tlines:["స్వాపనః స్వవశో వ్యాపీ నైకాత్మా నైకకర్మకృత్। ।", "వత్సరో వత్సలో వత్సీ రత్నగర్భో ధనేశ్వరః ॥ 50 ॥"] }],
  '51': [{ n:1, tlines:["ధర్మగుబ్ధర్మకృద్ధర్మీ సదసత్క్షరమక్షరం॥", "అవిజ్ఞాతా సహస్రాంశుర్విధాతా కృతలక్షణః ॥ 51 ॥"] }],
  '52': [{ n:1, tlines:["గభస్తినేమిః సత్త్వస్థః సింహో భూత మహేశ్వరః ।", "ఆదిదేవో మహాదేవో దేవేశో దేవభృద్గురుః ॥ 52 ॥"] }],
  '53': [{ n:1, tlines:["ఉత్తరో గోపతిర్గోప్తా జ్ఞానగమ్యః పురాతనః ।", "శరీర భూతభృద్ భోక్తా కపీంద్రో భూరిదక్షిణః ॥ 53 ॥"] }],
  '54': [{ n:1, tlines:["సోమపోఽమృతపః సోమః పురుజిత్ పురుసత్తమః ।", "వినయో జయః సత్యసంధో దాశార్హః సాత్వతాం పతిః ॥ 54 ॥"] }],
  '55': [{ n:1, tlines:["జీవో వినయితా సాక్షీ ముకుందోఽమిత విక్రమః ।", "అంభోనిధిరనంతాత్మా మహోదధి శయోంతకః ॥ 55 ॥"] }],
  '56': [{ n:1, tlines:["అజో మహార్హః స్వాభావ్యో జితామిత్రః ప్రమోదనః ।", "ఆనందోఽనందనోనందః సత్యధర్మా త్రివిక్రమః ॥ 56 ॥"] }],
  '57': [{ n:1, tlines:["మహర్షిః కపిలాచార్యః కృతజ్ఞో మేదినీపతిః ।", "త్రిపదస్త్రిదశాధ్యక్షో మహాశృంగః కృతాంతకృత్ ॥ 57 ॥"] }],
  '58': [{ n:1, tlines:["మహావరాహో గోవిందః సుషేణః కనకాంగదీ ।", "గుహ్యో గభీరో గహనో గుప్తశ్చక్ర గదాధరః ॥ 58 ॥"] }],
  '59': [{ n:1, tlines:["వేధాః స్వాంగోఽజితః కృష్ణో దృఢః సంకర్షణోఽచ్యుతః ।", "వరుణో వారుణో వృక్షః పుష్కరాక్షో మహామనాః ॥ 59 ॥"] }],
  '60': [{ n:1, tlines:["భగవాన్ భగహాఽఽనందీ వనమాలీ హలాయుధః ।", "ఆదిత్యో జ్యోతిరాదిత్యః సహిష్ణుర్గతిసత్తమః ॥ 60 ॥"] }],
  '61': [{ n:1, tlines:["సుధన్వా ఖండపరశుర్దారుణో ద్రవిణప్రదః ।", "దివఃస్పృక్ సర్వదృగ్వ్యాసో వాచస్పతిరయోనిజః ॥ 61 ॥"] }],
  '62': [{ n:1, tlines:["త్రిసామా సామగః సామ నిర్వాణం భేషజం భిషక్ ।", "సంన్యాసకృచ్ఛమః శాంతో నిష్ఠా శాంతిః పరాయణం। 62 ॥"] }],
  '63': [{ n:1, tlines:["శుభాంగః శాంతిదః స్రష్టా కుముదః కువలేశయః ।", "గోహితో గోపతిర్గోప్తా వృషభాక్షో వృషప్రియః ॥ 63 ॥"] }],
  '64': [{ n:1, tlines:["అనివర్తీ నివృత్తాత్మా సంక్షేప్తా క్షేమకృచ్ఛివః ।", "శ్రీవత్సవక్షాః శ్రీవాసః శ్రీపతిః శ్రీమతాంవరః ॥ 64 ॥"] }],
  '65': [{ n:1, tlines:["శ్రీదః శ్రీశః శ్రీనివాసః శ్రీనిధిః శ్రీవిభావనః ।", "శ్రీధరః శ్రీకరః శ్రేయః శ్రీమాँల్లోకత్రయాశ్రయః ॥ 65 ॥"] }],
  '66': [{ n:1, tlines:["స్వక్షః స్వంగః శతానందో నందిర్జ్యోతిర్గణేశ్వరః ।", "విజితాత్మాఽవిధేయాత్మా సత్కీర్తిశ్చిన్నసంశయః ॥ 66 ॥"] }],
  '67': [{ n:1, tlines:["ఉదీర్ణః సర్వతశ్చక్షురనీశః శాశ్వతస్థిరః ।", "భూశయో భూషణో భూతిర్విశోకః శోకనాశనః ॥ 67 ॥"] }],
  '68': [{ n:1, tlines:["అర్చిష్మానర్చితః కుంభో విశుద్ధాత్మా విశోధనః ।", "అనిరుద్ధోఽప్రతిరథః ప్రద్యుమ్నోఽమితవిక్రమః ॥ 68 ॥"] }],
  '69': [{ n:1, tlines:["కాలనేమినిహా వీరః శౌరిః శూరజనేశ్వరః ।", "త్రిలోకాత్మా త్రిలోకేశః కేశవః కేశిహా హరిః ॥ 69 ॥"] }],
  '70': [{ n:1, tlines:["కామదేవః కామపాలః కామీ కాంతః కృతాగమః ।", "అనిర్దేశ్యవపుర్విష్ణుర్వీరోఽనంతో ధనంజయః ॥ 70 ॥"] }],
  '71': [{ n:1, tlines:["బ్రహ్మణ్యో బ్రహ్మకృద్ బ్రహ్మా బ్రహ్మ బ్రహ్మవివర్ధనః ।", "బ్రహ్మవిద్ బ్రాహ్మణో బ్రహ్మీ బ్రహ్మజ్ఞో బ్రాహ్మణప్రియః ॥ 71 ॥"] }],
  '72': [{ n:1, tlines:["మహాక్రమో మహాకర్మా మహాతేజా మహోరగః ।", "మహాక్రతుర్మహాయజ్వా మహాయజ్ఞో మహాహవిః ॥ 72 ॥"] }],
  '73': [{ n:1, tlines:["స్తవ్యః స్తవప్రియః స్తోత్రం స్తుతిః స్తోతా రణప్రియః ।", "పూర్ణః పూరయితా పుణ్యః పుణ్యకీర్తిరనామయః ॥ 73 ॥"] }],
  '74': [{ n:1, tlines:["మనోజవస్తీర్థకరో వసురేతా వసుప్రదః ।", "వసుప్రదో వాసుదేవో వసుర్వసుమనా హవిః ॥ 74 ॥"] }],
  '75': [{ n:1, tlines:["సద్గతిః సత్కృతిః సత్తా సద్భూతిః సత్పరాయణః ।", "శూరసేనో యదుశ్రేష్ఠః సన్నివాసః సుయామునః ॥ 75 ॥"] }],
  '76': [{ n:1, tlines:["భూతావాసో వాసుదేవః సర్వాసునిలయోఽనలః ।", "దర్పహా దర్పదో దృప్తో దుర్ధరోఽథాపరాజితః ॥ 76 ॥"] }],
  '77': [{ n:1, tlines:["విశ్వమూర్తిర్మహామూర్తిర్దీప్తమూర్తిరమూర్తిమాన్ ।", "అనేకమూర్తిరవ్యక్తః శతమూర్తిః శతాననః ॥ 77 ॥"] }],
  '78': [{ n:1, tlines:["ఏకో నైకః సవః కః కిం యత్తత్ పదమనుత్తమమ్ ।", "లోకబంధుర్లోకనాథో మాధవో భక్తవత్సలః ॥ 78 ॥"] }],
  '79': [{ n:1, tlines:["సువర్ణవర్ణో హేమాంగో వరాంగశ్చందనాంగదీ ।", "వీరహా విషమః శూన్యో ఘృతాశీరచలశ్చలః ॥ 79 ॥"] }],
  '80': [{ n:1, tlines:["అమానీ మానదో మాన్యో లోకస్వామీ త్రిలోకధృత్ । [త్రిలోకధృక్]", "సుమేధా మేధజో ధన్యః సత్యమేధా ధరాధరః ॥ 80 ॥"] }],
  '81': [{ n:1, tlines:["తేజోఽవృషో ద్యుతిధరః సర్వశస్త్రభృతాంవరః ।", "ప్రగ్రహో నిగ్రహో వ్యగ్రో నైకశృంగో గదాగ్రజః ॥ 81 ॥"] }],
  '82': [{ n:1, tlines:["చతుర్మూర్తి శ్చతుర్బాహు శ్చతుర్వ్యూహ శ్చతుర్గతిః ।", "చతురాత్మా చతుర్భావశ్చతుర్వేదవిదేకపాత్ ॥ 82 ॥"] }],
  '83': [{ n:1, tlines:["సమావర్తోఽనివృత్తాత్మా దుర్జయో దురతిక్రమః ।", "దుర్లభో దుర్గమో దుర్గో దురావాసో దురారిహా ॥ 83 ॥"] }],
  '84': [{ n:1, tlines:["శుభాంగో లోకసారంగః సుతంతుస్తంతువర్ధనః ।", "ఇంద్రకర్మా మహాకర్మా కృతకర్మా కృతాగమః ॥ 84 ॥"] }],
  '85': [{ n:1, tlines:["అర్కో వాజసనః శృంగీ జయంతః సర్వవిజ్జయీ ॥ 85 ॥"] }],
  '86': [{ n:1, tlines:["మహాహ్రదో మహాగర్తో మహాభూతో మహానిధిః ॥ 86 ॥"] }],
  '87': [{ n:1, tlines:["కుముదః కుందరః కుందః పర్జన్యః పావనోఽనిలః ।", "అమృతాశోఽమృతవపుః సర్వజ్ఞః సర్వతోముఖః ॥ 87 ॥"] }],
  '88': [{ n:1, tlines:["సులభః సువ్రతః సిద్ధః శత్రుజిచ్ఛత్రుతాపనః ।", "న్యగ్రోధోఽదుంబరోఽశ్వత్థశ్చాణూరాంధ్ర నిషూదనః ॥ 88 ॥"] }],
  '89': [{ n:1, tlines:["అమూర్తిరనఘోఽచింత్యో భయకృద్భయనాశనః ॥ 89 ॥"] }],
  '90': [{ n:1, tlines:["అణుర్బృహత్కృశః స్థూలో గుణభృన్నిర్గుణో మహాన్ ।", "అధృతః స్వధృతః స్వాస్యః ప్రాగ్వంశో వంశవర్ధనః ॥ 90 ॥"] }],
  '91': [{ n:1, tlines:["భారభృత్ కథితో యోగీ యోగీశః సర్వకామదః ।", "ఆశ్రమః శ్రమణః, క్షామః సుపర్ణో వాయువాహనః ॥ 91 ॥"] }],
  '92': [{ n:1, tlines:["ధనుర్ధరో ధనుర్వేదో దండో దమయితా దమః ।", "అపరాజితః సర్వసహో నియంతాఽనియమోఽయమః ॥ 92 ॥"] }],
  '93': [{ n:1, tlines:["సత్త్వవాన్ సాత్త్వికః సత్యః సత్యధర్మపరాయణః ।", "అభిప్రాయః ప్రియార్హోఽర్హః ప్రియకృత్ ప్రీతివర్ధనః ॥ 93 ॥"] }],
  '94': [{ n:1, tlines:["విహాయసగతిర్జ్యోతిః సురుచిర్హుతభుగ్విభుః ।", "రవిర్విరోచనః సూర్యః సవితా రవిలోచనః ॥ 94 ॥"] }],
  '95': [{ n:1, tlines:["అనంతో హుతభుగ్భోక్తా సుఖదో నైకజోఽగ్రజః ।", "అనిర్విణ్ణః సదామర్షీ లోకధిష్ఠానమద్భుతః ॥ 95 ॥"] }],
  '96': [{ n:1, tlines:["సనాత్సనాతనతమః కపిలః కపిరవ్యయః ।", "స్వస్తిదః స్వస్తికృత్స్వస్తిః స్వస్తిభుక్ స్వస్తిదక్షిణః ॥ 96 ॥"] }],
  '97': [{ n:1, tlines:["అరౌద్రః కుండలీ చక్రీ విక్రమ్యూర్జితశాసనః ।", "శబ్దాతిగః శబ్దసహః శిశిరః శర్వరీకరః ॥ 97 ॥"] }],
  '98': [{ n:1, tlines:["అక్రూరః పేశలో దక్షో దక్షిణః, క్షమిణాంవరః ।", "విద్వత్తమో వీతభయః పుణ్యశ్రవణకీర్తనః ॥ 98 ॥"] }],
  '99': [{ n:1, tlines:["ఉత్తారణో దుష్కృతిహా పుణ్యో దుఃస్వప్ననాశనః ।", "వీరహా రక్షణః సంతో జీవనః పర్యవస్థితః ॥ 99 ॥"] }],
  '100': [{ n:1, tlines:["అనంతరూపోఽనంత శ్రీర్జితమన్యుర్భయాపహః ।", "చతురశ్రో గభీరాత్మా విదిశో వ్యాదిశో దిశః ॥ 100 ॥"] }],
  '101': [{ n:1, tlines:["అనాదిర్భూర్భువో లక్ష్మీః సువీరో రుచిరాంగదః ।", "జననో జనజన్మాదిర్భీమో భీమపరాక్రమః ॥ 101 ॥"] }],
  '102': [{ n:1, tlines:["ఆధారనిలయోఽధాతా పుష్పహాసః ప్రజాగరః ।", "ఊర్ధ్వగః సత్పథాచారః ప్రాణదః ప్రణవః పణః ॥ 102 ॥"] }],
  '103': [{ n:1, tlines:["ప్రమాణం ప్రాణనిలయః ప్రాణభృత్ ప్రాణజీవనః ।", "తత్త్వం తత్త్వవిదేకాత్మా జన్మమృత్యుజరాతిగః ॥ 103 ॥"] }],
  '104': [{ n:1, tlines:["భూర్భువః స్వస్తరుస్తారః సవితా ప్రపితామహః ।", "యజ్ఞో యజ్ఞపతిర్యజ్వా యజ్ఞాంగో యజ్ఞవాహనః ॥ 104 ॥"] }],
  '105': [{ n:1, tlines:["యజ్ఞభృద్ యజ్ఞకృద్ యజ్ఞీ యజ్ఞభుక్ యజ్ఞసాధనః ।", "యజ్ఞాంతకృద్ యజ్ఞగుహ్యమన్నమన్నాద ఏవ చ ॥ 105 ॥"] }],
  '106': [{ n:1, tlines:["ఆత్మయోనిః స్వయంజాతో వైఖానః సామగాయనః ।", "దేవకీనందనః స్రష్టా క్షితీశః పాపనాశనః ॥ 106 ॥"] }],
  '107': [{ n:1, tlines:["శంఖభృన్నందకీ చక్రీ శార్​ఙ్గధన్వా గదాధరః ।", "రథాంగపాణి-రక్షోభ్యః సర్వప్రహరణాయుధః ॥ 107 ॥"] }],
  '108': [{ n:1, tlines:["వనమాలీ గదీ శార్​ఙ్గీ శంఖీ చక్రీ చ నందకీ ।", "శ్రీమాన్నారాయణో విష్ణుర్వాసుదేవోఽభిరక్షతు ॥ 108 ॥"] }],
  phala: [
    { n:1, tlines:["ఇతీదం కీర్తనీయస్య కేశవస్య మహాత్మనః ।", "నామ్నాం సహస్రం దివ్యానామశేషేణ ప్రకీర్తితం। ॥ 1 ॥"] },
    { n:2, tlines:["య ఇదం శృణుయాన్నిత్యం యశ్చాపి పరికీర్తయేత్॥", "నాశుభం ప్రాప్నుయాత్ కించిత్సోఽముత్రేహ చ మానవః ॥ 2 ॥"] },
    { n:3, tlines:["వేదాంతగో బ్రాహ్మణః స్యాత్ క్షత్రియో విజయీ భవేత్ ।", "వైశ్యో ధనసమృద్ధః స్యాత్ శూద్రః సుఖమవాప్నుయాత్ ॥ 3 ॥"] },
    { n:5, tlines:["ధర్మార్థీ ప్రాప్నుయాద్ధర్మమర్థార్థీ చార్థమాప్నుయాత్ ।", "కామానవాప్నుయాత్ కామీ ప్రజార్థీ చాప్నుయాత్ప్రజామ్ ॥ 4 ॥ [ప్రాప్నుయాత్ప్రజాం]", "భక్తిమాన్ యః సదోత్థాయ శుచిస్తద్గతమానసః ।", "సహస్రం వాసుదేవస్య నామ్నామేతత్ ప్రకీర్తయేత్ ॥ 5 ॥"] },
    { n:6, tlines:["యశః ప్రాప్నోతి విపులం యాతిప్రాధాన్యమేవ చ । [జ్ఞాతి]", "అచలాం శ్రియమాప్నోతి శ్రేయః ప్రాప్నోత్యనుత్తమం। ॥ 6 ॥"] },
    { n:7, tlines:["న భయం క్వచిదాప్నోతి వీర్యం తేజశ్చ విందతి ।", "భవత్యరోగో ద్యుతిమాన్ బలరూప గుణాన్వితః ॥ 7 ॥"] },
    { n:8, tlines:["రోగార్తో ముచ్యతే రోగాద్బద్ధో ముచ్యేత బంధనాత్ ।", "భయాన్ముచ్యేత భీతస్తు ముచ్యేతాపన్న ఆపదః ॥ 8 ॥"] },
    { n:9, tlines:["దుర్గాణ్యతితరత్యాశు పురుషః పురుషోత్తమమ్ ।", "స్తువన్నామసహస్రేణ నిత్యం భక్తిసమన్వితః ॥ 9 ॥"] },
    { n:10, tlines:["వాసుదేవాశ్రయో మర్త్యో వాసుదేవపరాయణః ।", "సర్వపాపవిశుద్ధాత్మా యాతి బ్రహ్మ సనాతనం। ॥ 10 ॥"] },
    { n:11, tlines:["న వాసుదేవ భక్తానామశుభం విద్యతే క్వచిత్ ।", "జన్మమృత్యుజరావ్యాధిభయం నైవోపజాయతే ॥ 11 ॥"] },
    { n:12, tlines:["ఇమం స్తవమధీయానః శ్రద్ధాభక్తిసమన్వితః ।", "యుజ్యేతాత్మ సుఖక్షాంతి శ్రీధృతి స్మృతి కీర్తిభిః ॥ 12 ॥"] },
    { n:13, tlines:["న క్రోధో న చ మాత్సర్యం న లోభో నాశుభామతిః ।", "భవంతి కృతపుణ్యానాం భక్తానాం పురుషోత్తమే ॥ 13 ॥"] },
    { n:14, tlines:["ద్యౌః స-చంద్రార్క నక్షత్రా ఖం దిశో భూర్మహోదధిః ।", "వాసుదేవస్య వీర్యేణ విధృతాని మహాత్మనః ॥ 14 ॥"] },
    { n:15, tlines:["ససురాసురగంధర్వం సయక్షోరగరాక్షసమ్ ।", "జగద్వశే వర్తతేదం కృష్ణస్య స చరాచరం। ॥ 15 ॥"] },
    { n:16, tlines:["ఇంద్రియాణి మనోబుద్ధిః సత్త్వం తేజో బలం ధృతిః ।", "వాసుదేవాత్మకాన్యాహుః, క్షేత్రం క్షేత్రజ్ఞ ఏవ చ ॥ 16 ॥"] },
    { n:17, tlines:["సర్వాగమానామాచారః ప్రథమం పరికల్పతే ।", "ఆచారప్రభవో ధర్మో ధర్మస్య ప్రభురచ్యుతః ॥ 17 ॥"] },
    { n:18, tlines:["ఋషయః పితరో దేవా మహాభూతాని ధాతవః ।", "జంగమాజంగమం చేదం జగన్నారాయణోద్భవమ్ ॥ 18 ॥"] },
    { n:19, tlines:["యోగోజ్ఞానం తథా సాంఖ్యం విద్యాః శిల్పాదికర్మ చ ।", "వేదాః శాస్త్రాణి విజ్ఞానమేతత్సర్వం జనార్దనాత్ ॥ 19 ॥"] },
    { n:20, tlines:["ఏకో విష్ణుర్మహద్భూతం పృథగ్భూతాన్యనేకశః ।", "త్రీంలోకాన్వ్యాప్య భూతాత్మా భుంక్తే విశ్వభుగవ్యయః ॥ 20 ॥"] },
    { n:21, tlines:["ఇమం స్తవం భగవతో విష్ణోర్వ్యాసేన కీర్తితమ్ ।", "పఠేద్య ఇచ్చేత్పురుషః శ్రేయః ప్రాప్తుం సుఖాని చ ॥ 21 ॥"] },

  '10': [{
    n: 10,
    tlines: [
      `ద్రాపే॒ అంధ॑సస్పతే॒ దరి॑ద్ర॒న్నీల॑లోహిత ।`,
      `ఏ॒షాం పురు॑షాణామే॒షాం ప॑శూ॒నాం మా భేర్మాఽరో॒ మో ఏ॑షాం॒ కించ॒నామ॑మత్ ।`,
      `యా తే॑ రుద్ర శి॒వా త॒నూః శి॒వా వి॒శ్వాహ॑భేషజీ ।`,
      `శి॒వా రు॒ద్రస్య॑ భేష॒జీ తయా॑ నో మృడ జీ॒వసే᳚ ॥`,
      `ఇ॒మాగ్ం రు॒ద్రాయ॑ త॒వసే॑ కప॒ర్దినే᳚ క్ష॒యద్వీ॑రాయ॒ ప్రభ॑రామహే మ॒తిమ్ ।`,
      `యథా॑ న॒శ్శమస॑ద్ద్వి॒పదే॒ చతు॑ష్పదే॒ విశ్వం॑ పు॒ష్టం గ్రామే॑ అ॒స్మిన్ననా॑తురమ్ ।`,
      `మృ॒డా నో॑ రుద్రో॒త నో॒ మయ॑స్కృధి క్ష॒యద్వీ॑రాయ॒ నమ॑సా విధేమ తే ।`,
      `యచ్ఛం చ॒ యోశ్చ॒ మను॑రాయ॒జే పి॒తా తద॑శ్యామ॒ తవ॑ రుద్ర॒ ప్రణీ॑తౌ ।`,
      `మా నో॑ మ॒హాంత॑ము॒త మా నో॑ అర్భ॒కం మా న॒ ఉక్షం॑తము॒త మా న॑ ఉక్షి॒తమ్ ।`,
      `మా నో॑ఽవధీః పి॒తరం॒ మోత మా॒తరం॑ ప్రి॒యా మా న॑స్త॒నువో॑ రుద్ర రీరిషః ।`,
      `మా న॑స్తో॒కే తన॑యే॒ మా న॒ ఆయు॑షి॒ మా నో॒ గోషు॒ మా నో॒ అశ్వే॑షు రీరిషః ।`,
      `వీ॒రాన్మా నో॑ రుద్ర భామి॒తోఽవ॑ధీర్​హ॒విష్మం॑తో॒ నమ॑సా విధేమ తే ।`,
      `ఆ॒రాత్తే॑ గో॒ఘ్న ఉ॒త పూ॑రుష॒ఘ్నే క్ష॒యద్వీ॑రాయ సు॒మ్నమ॒స్మే తే॑ అస్తు ।`,
      `రక్షా॑ చ నో॒ అధి॑ చ దేవ బ్రూ॒హ్యధా॑ చ నః॒ శర్మ॑ యచ్ఛ ద్వి॒బర్​హాః᳚ ।`,
      `స్తు॒హి శ్రు॒తం గ॑ర్త॒సదం॒-యుఀవా॑నం మృ॒గన్న భీ॒మము॑పహ॒త్నుము॒గ్రమ్ ।`,
      `మృ॒డా జ॑రి॒త్రే రు॑ద్ర॒ స్తవా॑నో అ॒న్యంతే॑ అ॒స్మన్నివ॑పంతు॒ సేనాః᳚ ।`,
      `పరి॑ణో రు॒ద్రస్య॑ హే॒తిర్వృ॑ణక్తు॒ పరి॑ త్వే॒షస్య॑ దుర్మ॒తి ర॑ఘా॒యోః ।`,
      `అవ॑ స్థి॒రా మ॒ఘవ॑ద్భ్య-స్తనుష్వ॒ మీఢ్వ॑స్తో॒కాయ॒ తన॑యాయ మృడయ ।`,
      `మీఢు॑ష్టమ॒ శివ॑తమ శి॒వో నః॑ సు॒మనా॑ భవ ।`,
      `ప॒ర॒మే వృ॒క్ష ఆయు॑ధన్ని॒ధాయ॒ కృత్తిం॒-వఀసా॑న॒ ఆచ॑ర॒ పినా॑కం॒ బిభ్ర॒దాగ॑హి ।`,
      `వికి॑రిద॒ విలో॑హిత॒ నమ॑స్తే అస్తు భగవః ।`,
      `యాస్తే॑ స॒హస్రగ్ం॑ హే॒తయో॒న్యమ॒స్మన్నివ॑పంతు॒ తాః ।`,
      `స॒హస్రా॑ణి సహస్ర॒ధా బా॑హు॒వోస్తవ॑ హే॒తయః॑ ।`,
      `తాసా॒మీశా॑నో భగవః పరా॒చీనా॒ ముఖా॑ కృధి ॥ 10 ॥`
    ]
  }],

      `తేషాగ్ం॑ సహస్రయోజ॒నేఽవ॒ధన్వా॑ని తన్మసి ।`,
      `అ॒స్మిన్మ॑హ॒త్య॑ర్ణ॒వే᳚ఽంతరి॑క్షే భ॒వా అధి॑ ।`,
      `నీల॑గ్రీవాః శితి॒కంఠాః᳚ శ॒ర్వా అ॒ధః, క్ష॑మాచ॒రాః ।`,
      `నీల॑గ్రీవాః శితి॒కంఠా॒ దివగ్ం॑ రు॒ద్రా ఉప॑శ్రితాః ।`,
      `యే వృ॒క్షేషు॑ స॒స్పింజ॑రా॒ నీల॑గ్రీవా॒ విలో॑హితాః ।`,

// ─────────────── SECTIONS ───────────────
function switchSection(sec) {
  state.section = sec;
  state.expandedVerse = null;
  if (sec === 'gita') state.chapter = state.chapter || '12';
  else if (sec === 'rudram') {
    state.chapter = '1';
    state.rudramPart = null;   // always ask: Namakam or Chamakam
    document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
    saveState();
    showView('practice');
    return;
  }
  else if (sec === 'vsn') {
    state.chapter = 'preamble';
    document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
    saveState();
    showView('practice');
    return;
  }
  else if (sec === 'hc') {
    state.chapter = 'doha1';
    document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
    saveState();
    showView('practice');
    return;
  }
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  saveState();
  showView('index');
}

// ─────────────── VIEW SWITCHING ───────────────
function showView(v) {
  state.view = v;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  const bn = document.getElementById('bnav-' + v);
  if (bn) bn.classList.add('active');
  // Show/hide chrome based on view
  const isHome = (v === 'home');
  const isLibrary = (v === 'library');
  document.getElementById('topbar').style.display = (isHome || isLibrary) ? 'none' : '';
  document.getElementById('bottomnav').style.display = (isHome || isLibrary) ? 'none' : '';
  // Lock scroll on home/library so they fill exactly the viewport
  const mainEl = document.getElementById('main');
  if (isHome || isLibrary) {
    mainEl.classList.add('no-scroll');
  } else {
    mainEl.classList.remove('no-scroll');
    mainEl.scrollTop = 0;
  }
  renderCurrentView();
}

function renderCurrentView() {
  if (state.view === 'home') renderHome();
  else if (state.view === 'library') renderLibrary();
  else if (state.view === 'practice') renderPractice();
  else if (state.view === 'index') renderIndex();
  else if (state.view === 'progress') renderProgress();
  else if (state.view === 'settings') renderSettings();
  if (state.view !== 'home' && state.view !== 'library') updateTopbar();
}

function updateTopbar() {
  const t = document.getElementById('topbar-title');
  const recBtn = document.getElementById('btn-recite');
  if (state.section === 'gita') {
    const m = GITA_META[state.chapter];
    t.textContent = m ? 'Ch.' + state.chapter + ' — ' + m.yoga : 'Bhagavad Gītā';
  } else if (state.section === 'rudram') {
    t.textContent = state.rudramPart === 'namakam' ? 'Namakam' : state.rudramPart === 'chamakam' ? 'Chamakam' : 'Śrī Rudram';
  } else if (state.section === 'hc') {
    t.textContent = 'Hanumān Chālīsā';
  } else {
    t.textContent = 'Viṣṇu Sahasranāmam';
  }
  // Show recite button only in practice view and when content available
  const hasContent = (state.section === 'gita' && GITA_DATA[state.chapter]?.length > 0) ||
                     (state.section === 'rudram' && !!state.rudramPart && RUDRAM_DATA[state.chapter]?.length > 0) ||
                     (state.section === 'vsn' && VSN_DATA[state.chapter]?.length > 0) ||
                     (state.section === 'hc' && HC_DATA[state.chapter]?.length > 0);
  recBtn.style.display = (state.view === 'practice' && hasContent) ? '' : 'none';
}

// ─────────────── HOME VIEW ───────────────
function applyTheme(t) {
  const root = document.documentElement;
  if (t === 'auto') { root.removeAttribute('data-theme'); }
  else { root.setAttribute('data-theme', t); }
}

function setHomeLayout(l) {
  settings.homeLayout = l;
  saveSettings();
  if (state.view === 'library') renderLibrary();
  else renderHome();
}

function setTheme(t) {
  settings.theme = t;
  saveSettings();
  applyTheme(t);
  renderHome();
}

function changeFontSize(which, dir) {
  if (which === 'practice') {
    settings.practiceFontSize = Math.max(0, Math.min(3, settings.practiceFontSize + dir));
  } else {
    settings.reciteFontSize = Math.max(0, Math.min(3, settings.reciteFontSize + dir));
  }
  saveSettings();
  renderHome(); // re-render to update displayed size label
}

function openHomeSettings() {
  document.getElementById('home-settings-modal').classList.add('open');
}

function closeHomeSettings(e) {
  if (e.target === document.getElementById('home-settings-modal')) {
    document.getElementById('home-settings-modal').classList.remove('open');
  }
}

function chooseRudramPart(part) {
  state.section = 'rudram';
  state.rudramPart = part;
  state.chapter = '1';
  state.expandedVerse = null;
  saveState();
  showView('practice');
}

function toggleRudramMenu(e) {
  e.stopPropagation();
  const sub = document.getElementById('rudram-submenu');
  const arrow = document.getElementById('rudram-arrow');
  const open = sub.classList.toggle('open');
  arrow.style.transform = open ? 'rotate(90deg)' : '';
  arrow.style.transition = 'transform 0.2s';
}

function openSection(sec, sub) {
  if (sec === 'gita') {
    state.section = 'gita';
    state.chapter = state.chapter && parseInt(state.chapter) <= 18 ? state.chapter : '1';
  } else if (sec === 'rudram') {
    state.section = 'rudram';
    state.chapter = state.chapter && parseInt(state.chapter) <= 11 ? state.chapter : '1';
  }
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === sec));
  saveState();
  showView('index');
}

function navChapter(dir) {
  // For Gita: dhyana=0, chapters 1-18
  if (state.section === 'gita') {
    const cur = state.chapter === 'dhyana' ? 0 : parseInt(state.chapter);
    const next = cur + dir;
    if (next < 0 || next > 18) return;
    state.chapter = next === 0 ? 'dhyana' : String(next);
  } else if (state.section === 'rudram') {
    const ch = parseInt(state.chapter);
    const max = 11;
    const next = ch + dir;
    if (next < 1 || next > max) return;
    state.chapter = String(next);
  } else if (state.section === 'vsn') {
    const idx = VSN_SECTIONS_ORDER.indexOf(state.chapter);
    const next = idx + dir;
    if (next < 0 || next >= VSN_SECTIONS_ORDER.length) return;
    state.chapter = VSN_SECTIONS_ORDER[next];
  }
  state.expandedVerse = null;
  saveState();
  showViewWithTransition('practice', dir > 0 ? 'next' : 'prev');
}

function nextChapterFromBanner() {
  navChapter(1);
}

function goVSNSection(sec) {
  const curIdx = VSN_SECTIONS_ORDER.indexOf(state.chapter);
  const newIdx = VSN_SECTIONS_ORDER.indexOf(sec);
  const dir = newIdx >= curIdx ? 1 : -1;
  state.chapter = sec;
  state.expandedVerse = null;
  saveState();
  showViewWithTransition('practice', dir);
}

function showViewWithTransition(v, dir) {
  // dir: 'next'/1 (→), 'prev'/-1 (←), or falsy = no animation
  const el = document.getElementById('view-' + v);
  if (!dir || !el) { showView(v); return; }
  const isForward = (dir === 'next' || dir > 0);
  // Perform state change + render
  state.view = v;
  document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  const bn = document.getElementById('bnav-' + v);
  if (bn) bn.classList.add('active');
  const isHome = (v === 'home');
  const isLibrary2 = (v === 'library');
  document.getElementById('topbar').style.display = (isHome || isLibrary2) ? 'none' : '';
  document.getElementById('bottomnav').style.display = (isHome || isLibrary2) ? 'none' : '';
  renderCurrentView();
  // Scroll to top, then animate
  const main = document.getElementById('main');
  main.scrollTop = 0;
  const cls = isForward ? 'chapter-enter-next' : 'chapter-enter-prev';
  el.classList.remove('chapter-enter-next', 'chapter-enter-prev');
  // Force reflow so animation restarts cleanly
  void el.offsetWidth;
  el.classList.add(cls);
  el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
}

function renderGitaPractice(el) {
  const ch = state.chapter;
  const chNum = parseInt(ch);
  const meta = GITA_META[ch];
  const verses = GITA_DATA[ch] || [];
  const hasPrev = true; // ch1 goes back to dhyana
  const hasNext = chNum < 18;
  const nextMeta = hasNext ? GITA_META[String(chNum+1)] : null;

  // Sanskrit ordinals and yoga names for chapter invocation header
  const ORDINALS = ['','prathamo','dvitīyo','tṛtīyo','caturtho','pañcamo',
    'ṣaṣṭho','saptamo','aṣṭamo','navamo','daśamo','ekādaśo','dvādaśo',
    'trayodaśo','caturdaśo','pañcadaśo','ṣoḍaśo','saptadaśo','aṣṭādaśo'];
  const ordinal = ORDINALS[chNum] || chNum;
  // Proper Sanskrit yoga compound name for each chapter
  const YOGA_NAMES = ['',
    'arjunaviṣādayōgaḥ','sāṅkhyayōgaḥ','karmayōgaḥ','jñānayōgaḥ',
    'karmasannyāsayōgaḥ','ātmasaṃyamayōgaḥ','jñānavijñānayōgaḥ','akṣaraparabrahmayōgaḥ',
    'rājavidyārājaguhyayōgaḥ','vibhūtiyōgaḥ','viśvarūpasandarśanayōgaḥ','bhaktiyōgaḥ',
    'kṣētrakṣētrajñavibhāgayōgaḥ','guṇatrayavibhāgayōgaḥ','puruṣōttamaprāptiyōgaḥ',
    'daivāsurasampadvibhāgayōgaḥ','śraddhātrayavibhāgayōgaḥ','mokṣasannyāsayōgaḥ'];
  const yogaName = YOGA_NAMES[chNum] || '';

  let html = `
  <div class="chapter-nav">
    <button class="chapter-nav-btn" onclick="navChapter(-1)" ${hasPrev ? '' : 'disabled'}>← Prev</button>
    <div class="chapter-nav-title">Ch.${chNum} of 18</div>
    <button class="chapter-nav-btn" onclick="navChapter(1)" ${hasNext ? '' : 'disabled'}>Next →</button>
  </div>
  <div class="chapter-header">
    <div class="chapter-num">Bhagavad Gītā · Chapter ${ch}</div>
    <h2>${meta?.yoga || 'Chapter ' + ch}</h2>
    <div class="subtitle">${meta?.subtitle || ''}</div>
  </div>
  <div class="chapter-invocation">
    <span class="vline">ōṃ śrī paramātmanē namaḥ</span><br>
    <span class="vline">atha ${ordinal}'dhyāyaḥ</span><br>
    <span class="vline">${yogaName}</span>
  </div>`;

  let prevSpk = null;
  for (const v of verses) {
    const key = `gita_ch${ch}_v${v.n}`;
    const isDone = done.has(key);
    const isExpanded = state.expandedVerse === key;
    // Look up provided Telugu verse text first (need speaker from it)
    const teVerseLines = (GITA_TE_DATA[chNum] && GITA_TE_DATA[chNum][v.n]) ? GITA_TE_DATA[chNum][v.n] : [];
    const teSpeakers = ["సంజయ ఉవాచ","శ్రీ భగవానువాచ","అర్జున ఉవాచ","ధృతరాష్ట్ర ఉవాచ","భగవానువాచ"];
    const teSpkLine = (teVerseLines.length > 0 && teSpeakers.includes(teVerseLines[0])) ? teVerseLines[0] : null;
    const teVLines = teSpkLine ? teVerseLines.slice(1) : teVerseLines;
    let spkHtml = '';
    if (v.spk && v.spk !== prevSpk) {
      const spkNames = { 'arjuna':'Arjuna','bhagavān':'Śrī Bhagavān','sañjaya':'Sañjaya','dhṛtarāṣṭra':'Dhṛtarāṣṭra' };
      if (settings.language === 'te') {
        // Telugu mode — show Telugu speaker label if available, else hide
        spkHtml = teSpkLine ? `<span class="spk-tag">${esc(teSpkLine)}</span>` : '';
      } else {
        // IAST or both mode — show IAST speaker
        spkHtml = `<span class="spk-tag">${spkNames[v.spk] || v.spk} uvāca</span>`;
      }
      prevSpk = v.spk;
    }
    // Render IAST lines and Telugu lines independently (they have different line counts)
    // IAST: 4 half-lines; Telugu: 2 full lines — never pair them 1:1
    let linesHtml = '';
    if (settings.language !== 'te') {
      // Show IAST lines
      linesHtml += v.tlines.map((ln, i) => {
        const br = (i < v.tlines.length - 1) ? '<br>' : '';
        return `<span class="vline">${esc(ln)}</span>${br}`;
      }).join('');
    }
    if (settings.language !== 'en' && teVLines.length > 0) {
      // Show Telugu lines as an independent block (not paired with IAST count)
      // Strip embedded ॥N॥ verse markers — render code adds its own verse-num span
      if (settings.language !== 'te' && v.tlines.length > 0) linesHtml += '<br>';
      linesHtml += teVLines.map((teLn, i) => {
        const cleanLn = teLn.replace(/[॥|]\s*\d+\s*[॥|]\s*$/, '').trimEnd();
        const br = (i < teVLines.length - 1) ? '<br>' : '';
        return `<span class="vline-te">${esc(cleanLn)}</span>${br}`;
      }).join('');
    }
    // No Telugu data → show nothing (never auto-convert)
    const meaningHtml = v.meaning_en ? `<div class="verse-meaning">${esc(v.meaning_en)}</div>` : `<div class="verse-meaning empty"></div>`;
    html += `<div class="verse-block${isDone?' done':''}${isExpanded?' expanded':''}" data-key="${key}" onclick="toggleVerse('${key}')">
      <span class="verse-done-mark">✓</span>
      <div class="verse-text">${spkHtml}${linesHtml}<span class="verse-num">॥ ${v.n} ॥</span></div>
      ${meaningHtml}
    </div>`;
  }

  // Continuation banner
  if (hasNext && nextMeta) {
  } else if (!hasNext) {
  }

  el.innerHTML = html;
}

function toggleVerse(key) {
  if (state.expandedVerse === key) {
    // Second click = mark done
    if (done.has(key)) done.delete(key);
    else done.add(key);
    saveDone();
    state.expandedVerse = null;
    renderPractice();
    if (state.view === 'progress') renderProgress();
  } else {
    state.expandedVerse = key;
    renderPractice();
  }
}

      const isCurrent = (state.chapter === cs && state.section === 'gita');

      </div>`;
    }
    html += `</div></div>`;
  }

  if (state.section === 'rudram') {
    // Rudram goes directly to practice — redirect
    showView('practice');
    return;
  }


  if (state.section === 'vsn') {
    // VSN goes directly to practice — redirect
    showView('practice');
    return;
  }

  el.innerHTML = html;
}

// ─────────────── PROGRESS VIEW ───────────────
function renderProgress() {
  const el = document.getElementById('view-progress');
  let html = '<h2>Progress</h2>';

  html += '<div class="prog-section"><h3>Bhagavad Gītā</h3>';

  for (let c = 1; c <= 18; c++) {

    gitaTotal += total; gitaDone += d;
    const pct = total ? Math.round(d/total*100) : 0;
    html += `<div class="prog-row">
      <span class="prog-label">Ch.${c} ${GITA_META[cs]?.subtitle||''}</span>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <span class="prog-pct">${pct}%</span>

  html += `<div class="prog-row" style="font-weight:600;margin-top:8px">
    <span class="prog-label">Overall</span>
    <div class="prog-bar"><div class="prog-fill" style="width:${gitaPct}%"></div></div>
    <span class="prog-pct">${gitaPct}%</span>
  </div></div>`;
  
  // VSN progress
  html += '<div class="prog-section"><h3>Viṣṇu Sahasranāmam</h3>';
  let vsnTotal = 0, vsnDoneCount = 0;
  for (const sec of VSN_SECTIONS_ORDER) {
    const slokas = VSN_DATA[sec] || [];
    const d = slokas.filter(s => done.has(`vsn_${sec}_${s.n}`)).length;
    vsnTotal += slokas.length;
    vsnDoneCount += d;
    const pct = slokas.length ? Math.round(d/slokas.length*100) : 0;
    const label = VSN_META[sec] ? VSN_META[sec] :
                  (['preamble','purva','dhyanam'].includes(sec) ? sec :

    if (sec === 'dhyana' || sec === 'phala') {
      html += `<div class="prog-row">
        <span class="prog-label">${label}</span>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
        <span class="prog-pct">${pct}%</span>
      </div>`;

  const vsnMainDone = [...done].filter(k => /^vsn_\d+_\d+$/.test(k)).length;
  const vsnMainTotal = 108;
  const vsnMainPct = Math.round(vsnMainDone/vsnMainTotal*100);
  html += `<div class="prog-row">
    <span class="prog-label">Main Slokas (108)</span>
    <div class="prog-bar"><div class="prog-fill" style="width:${vsnMainPct}%"></div></div>

// ─────────────── RECITE MODE ───────────────
function buildReciteItems() {
  // Build flat list of items for recite mode
  // Each item is an object with lines[] to show
  const items = [];
  
  if (state.section === 'gita' && state.chapter === 'dhyana') {
    for (const s of DHYANA_DATA) {
      const teLines = DHYANA_TE_DATA[s.n - 1] || [];
      items.push({
        id: `gita_dhyana_${s.n}`,
        label: `Dhyānam · ${s.n}`,
        lines: s.tlines.slice(0, 4),
        teLines,
        n: s.n,
      });
    }
  } else if (state.section === 'gita') {
    const spkNames = { 'dhṛtarāṣṭra':'Dhṛtarāṣṭra','arjuna':'Arjuna','bhagavān':'Śrī Bhagavān','sañjaya':'Sañjaya' };
    const teSpeakers = ["సంజయ ఉవాచ","శ్రీ భగవానువాచ","అర్జున ఉవాచ","ధృతరాష్ట్ర ఉవాచ","భగవానువాచ"];
    let prevSpk = null;
    const chNum = parseInt(state.chapter);
    const verses = GITA_DATA[state.chapter] || [];
    for (const v of verses) {
      const allLines = [...v.tlines];
      // Attach speaker label only when it changes
      const spkLabel = (v.spk && v.spk !== prevSpk) ? (spkNames[v.spk] || v.spk) + ' uvāca' : null;
      if (v.spk) prevSpk = v.spk;
      // Look up Telugu lines; strip speaker line if present
      const rawTeLines = (GITA_TE_DATA[chNum] && GITA_TE_DATA[chNum][v.n]) ? GITA_TE_DATA[chNum][v.n] : [];
      const teLines = (rawTeLines.length > 0 && teSpeakers.includes(rawTeLines[0])) ? rawTeLines.slice(1) : rawTeLines;
      items.push({
        id: `gita_ch${state.chapter}_v${v.n}`,
        label: `Ch.${state.chapter} · ${v.n}`,
        lines: allLines.slice(0, 4),
        teLines,
        spk: spkLabel,
        n: v.n,
      });
    };
  } else if (state.section === 'rudram') {
    const an = state.chapter;
    const isCham = (state.rudramPart === 'chamakam');
    let lines, teLines;
    if (isCham) {
      // Chamakam: the closing prayer rides along with the last anuvaka
      const ks = (an === '11') ? ['11', 'closing'] : [an];
      lines = []; teLines = [];
      for (const k of ks) {
        const b = CHAMAKAM_DATA[k], tb = CHAMAKAM_TE_DATA[k];
        const l = b ? b[0].tlines : [];
        const tl = tb ? tb[0].tlines : [];
        l.forEach((x, i) => { lines.push(x); teLines.push(tl[i] || ''); });
      }
    } else {
      const nmBlock = NAMAKAM_DATA[an];
      lines = nmBlock ? nmBlock[0].tlines : (RUDRAM_DATA[an] || []);
      const teBlock = NAMAKAM_TE_DATA[an];
      teLines = teBlock ? teBlock[0].tlines : null;
    }
    // Group every 4 lines into a card
    for (let i = 0; i < lines.length; i += 4) {
      const cardLines = lines.slice(i, i+4);
      const cardTeLines = teLines ? teLines.slice(i, i+4) : [];
      items.push({
        id: `${isCham ? 'chamakam' : 'rudram'}_an${an}_g${Math.floor(i/4)}`,
        label: isCham ? ('Chamakam · Anuvaka ' + an) : (RUDRAM_META[an] || 'Anuvaka ' + an),
        lines: cardLines,
        teLines: cardTeLines,
      });
    }
  
  } else if (state.section === 'vsn') {
    // Load ALL VSN sections in order as one continuous recite list
    for (const sec of VSN_SECTIONS_ORDER) {
      const slokas = VSN_DATA[sec] || [];
      const secLabel = VSN_META[sec] || ('Śloka ' + sec);
      const teSlokas = VSN_TE_DATA[sec] || [];
      const secNumbered = !isNaN(parseInt(sec));
      for (const s of slokas) {
        const teSloka = teSlokas.find(x => x.n === s.n) || (secNumbered ? teSlokas[slokas.indexOf(s)] : null);
        items.push({
          id: `vsn_${sec}_${s.n}`,
          label: secLabel + ' · ' + s.n,
          lines: s.tlines,
          teLines: teSloka ? teSloka.tlines : [],
          sec,
          n: s.n,
        });
      }
    }
  } else if (state.section === 'hc') {
    // Hanuman Chalisa — all sections in order
    for (const sec of HC_SECTIONS_ORDER) {
      const slokas = HC_DATA[sec] || [];
      const secLabel = HC_META[sec] || sec;
      const teSlokas = HC_TE_DATA[sec] || [];
      for (const s of slokas) {
        const teSloka = teSlokas.find(x => x.n === s.n);
        items.push({
          id: `hc_${sec}_${s.n}`,
          label: secLabel,
          lines: s.tlines,
          teLines: teSloka ? teSloka.tlines : [],
          sec,
          n: s.n,
        });
      }
    }
  }
  return items;
}

function startRecite() {
  const items = buildReciteItems();
  if (!items.length) return;
  
  state.reciting = true;
  state.reciteItems = items;
  state.reciteIdx = 0;
  
  // Start from first undone item if possible
  for (let i = 0; i < items.length; i++) {
    if (!done.has(items[i].id)) { state.reciteIdx = i; break; }
  }
  
  document.getElementById('recite-overlay').classList.add('active');
  renderRecite();
  
  // Keyboard support
  document.addEventListener('keydown', reciteKeyHandler);
}

// ── Recite auto-advance timer ──
let reciteTimerId = null;
function clearReciteTimer() {
  if (reciteTimerId) { clearTimeout(reciteTimerId); reciteTimerId = null; }
  const bar = document.getElementById('recite-timer-bar');
  if (bar) { bar.classList.remove('running'); bar.style.animationDuration = ''; }
}
function scheduleReciteTimer() {
  clearReciteTimer();
  const secs = [5, 15, 30].includes(settings.reciteTimer) ? settings.reciteTimer : 0;
  document.querySelectorAll('.recite-timer-btn').forEach(b => b.classList.toggle('active', Number(b.dataset.sec) === secs));
  if (!secs || !state.reciting) return;
  const bar = document.getElementById('recite-timer-bar');
  void bar.offsetWidth;                      // restart the fill animation
  bar.style.animationDuration = secs + 's';
  bar.classList.add('running');
  reciteTimerId = setTimeout(() => { reciteTimerId = null; if (state.reciting) reciteNext(); }, secs * 1000);
}
function setReciteTimer(secs) {
  settings.reciteTimer = secs;
  saveSettings();
  scheduleReciteTimer();
}

function stopRecite() {
  clearReciteTimer();
  state.reciting = false;
  document.getElementById('recite-overlay').classList.remove('active');
  // Reset end panel
  document.getElementById('recite-controls').style.display = '';
  document.getElementById('recite-end').style.display = 'none';
  document.removeEventListener('keydown', reciteKeyHandler);
  renderPractice();
  updateTopbar();
}

function reciteKeyHandler(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); reciteNext(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); recitePrev(); }
  else if (e.key === 'Escape') stopRecite();
}

function reciteNext() {
  if (state.reciteIdx < state.reciteItems.length - 1) {
    const item = state.reciteItems[state.reciteIdx];
    done.add(item.id);
    saveDone();
    state.reciteIdx++;
    renderRecite();
  } else {
    // Last item — show end panel
    clearReciteTimer();
    const item = state.reciteItems[state.reciteIdx];
    done.add(item.id);
    saveDone();
    // Show end panel
    document.getElementById('recite-controls').style.display = 'none';
    const endEl = document.getElementById('recite-end');
    endEl.style.display = '';
    const chNum = parseInt(state.chapter);
    const max = (state.section === 'gita') ? 18 :
               (state.section === 'rudram') ? 11 : VSN_SECTIONS_ORDER.length - 1;
    const hasNext = (state.section === 'vsn')
      ? VSN_SECTIONS_ORDER.indexOf(state.chapter) < max
      : chNum < max;
    const btn = document.getElementById('recite-next-ch-btn');
    if (hasNext) {
      const vsnNextIdx = VSN_SECTIONS_ORDER.indexOf(state.chapter) + 1;
      const nextLabel = state.section === 'gita'
        ? `Chapter ${chNum+1} · ${GITA_META[String(chNum+1)]?.yoga || ''}`
        : state.section === 'rudram'
        ? (state.rudramPart === 'chamakam' ? `Chamakam · Anuvaka ${chNum+1}` : `${RUDRAM_META[String(chNum+1)] || 'Anuvaka '+(chNum+1)}`)
        : `${VSN_META[VSN_SECTIONS_ORDER[vsnNextIdx]] || 'Śloka '+VSN_SECTIONS_ORDER[vsnNextIdx]}`;
      document.getElementById('recite-end-label').textContent = 'Up next: ' + nextLabel;
      btn.textContent = state.section === 'gita' ? 'Next Chapter →' : state.section === 'rudram' ? 'Next Anuvaka →' : 'Next Section →';
      btn.style.display = '';
    } else {
      document.getElementById('recite-end-label').textContent =
        state.section === 'gita' ? 'All 18 Chapters complete 🙏' :
        state.section === 'rudram' ? (state.rudramPart === 'chamakam' ? 'Chamakam complete 🙏' : 'Namakam complete 🙏') :
        'Viṣṇu Sahasranāmam complete 🙏';
      btn.style.display = 'none';
    }
  }
}

function reciteNextChapter() {
  stopRecite();
  navChapter(1);
  // Auto-start recite for next chapter
  setTimeout(() => startRecite(), 100);
}

function reciteGoTo(idx) {
  if (idx >= 0 && idx < state.reciteItems.length) {
    state.reciteIdx = idx;
    renderRecite();
  }
}

function recitePrev() {
  if (state.reciteIdx > 0) {
    state.reciteIdx--;
    renderRecite();
  }
}

function renderRecite() {
  const items = state.reciteItems;
  const idx = state.reciteIdx;
  const item = items[idx];
  if (!item) return;
  
  document.getElementById('recite-section-label').textContent =
    state.section === 'gita' ? 'Bhagavad Gītā' :
    state.section === 'rudram' ? 'Śrī Rudram' : 'Viṣṇu Sahasranāmam';
  document.getElementById('recite-verse-label').textContent = item.label || '';
  
  // Speaker tag (shown above lines when speaker changes)
  const linesEl = document.getElementById('recite-lines');
  const spkHtml = item.spk ? `<div class="recite-spk">${esc(item.spk)}</div>` : '';
  linesEl.innerHTML = spkHtml + item.lines.map((ln, i) => {
    const enLine = settings.language !== 'te' ? `<div class="recite-line">${esc(ln)}</div>` : '';
    const rawTeLn = item.teLines && item.teLines[i] ? item.teLines[i] : null;
    const teLn = rawTeLn ? rawTeLn.replace(/[॥|]\s*\d+\s*[॥|]\s*$/, '').trimEnd() : null;
    const teLine = (settings.language !== 'en' && teLn) ? `<div class="recite-line-te">${esc(teLn)}</div>` : '';
    return enLine + teLine;
  }).join('');
  
  // Dots
  const dotsEl = document.getElementById('recite-dots');
  dotsEl.innerHTML = items.map((it, i) => {
    const cls = i === idx ? 'cur' : (done.has(it.id) ? 'done' : '');
    return `<div class="recite-dot ${cls}" onclick="reciteGoTo(${i})" title="${esc(it.label||String(i+1))}"></div>`;
  }).join('');

  // (Re)start the auto-next countdown for this verse
  scheduleReciteTimer();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────── IAST → TELUGU CONVERTER ───────────────
(function() {
  const ACCENT_STRIPS = new Set(['̠','̍','̎','̑','̱','̌','̤','̥']);
  const VIRAMA = '్';
  const ANUSVARA = 'ం';
  const VISARGA  = 'ః';
  const SV = {a:'అ',ā:'ఆ',i:'ఇ',ī:'ఈ',u:'ఉ',ū:'ఊ',
    ṛ:'ఋ',ṝ:'ఌ',e:'ఎ',ē:'ఏ',ai:'ఐ',o:'ఒ',ō:'ఓ',au:'ఔ'};
  const VM = {a:'',ā:'ా',i:'ి',ī:'ీ',u:'ు',ū:'ూ',
    ṛ:'ృ',ṝ:'ౄ',e:'ె',ē:'ే',ai:'ై',o:'ొ',ō:'ో',au:'ౌ'};
  const CONS2 = {kh:'ఖ',gh:'ఘ',ch:'ఛ',jh:'ఝ',
    ṭh:'ఠ',ḍh:'ఢ',th:'థ',dh:'ధ',ph:'ఫ',bh:'భ'};
  const CONS1 = {k:'క',g:'గ',ṅ:'ఙ',c:'చ',j:'జ',ñ:'ఞ',
    ṭ:'ట',ḍ:'డ',ṇ:'ణ',t:'త',d:'ద',n:'న',
    p:'ప',b:'బ',m:'మ',y:'య',r:'ర',l:'ల',
    ḷ:'ళ',ḻ:'ళ',v:'వ',ś:'శ',ṣ:'ష',s:'స',h:'హ'};
  const SPECIAL = {ṃ:ANUSVARA,ṁ:ANUSVARA,ḥ:VISARGA};
  const PASSTHRU = new Set(' \t\n\r|।॥-\'"()[]{}0123456789,.!?;:/\\~`@#%^&*_+=<>\'');

  function stripAccents(t) {
    const r = [];
    for (const c of t) { if (!ACCENT_STRIPS.has(c)) r.push(c); }
    return r.join('');
  }
  function getCons(text, i) {
    const two = text.slice(i, i+2);
    if (CONS2[two]) return [CONS2[two], 2];
    const c = text[i] || '';
    if (CONS1[c]) return [CONS1[c], 1];
    return [null, 0];
  }
  function getVowel(text, i) {
    const two = text.slice(i, i+2);
    if (two === 'ai' || two === 'au') return [two, 2];
    const c = text[i] || '';
    if (c in VM) return [c, 1];
    return [null, 0];
  }

  window.iastToTelugu = function(text) {
    text = stripAccents(text);
    // NFC normalize (browser)
    if (text.normalize) text = text.normalize('NFC');
    const result = [];
    let i = 0;
    const n = text.length;
    while (i < n) {
      const ch = text[i];
      if (PASSTHRU.has(ch)) { result.push(ch); i++; continue; }
      if (SPECIAL[ch]) { result.push(SPECIAL[ch]); i++; continue; }
      const [cons_ch, clen] = getCons(text, i);
      if (cons_ch) {
        i += clen;
        const [vowel, vlen] = getVowel(text, i);
        if (vowel !== null) {
          result.push(cons_ch, VM[vowel]);
          i += vlen;
        } else {
          result.push(cons_ch, VIRAMA);
        }
        continue;
      }
      // Standalone vowel
      const two = text.slice(i, i+2);
      if (two === 'ai' || two === 'au') { result.push(SV[two]); i += 2; continue; }
      if (SV[ch]) { result.push(SV[ch]); i++; continue; }
      result.push(ch); i++;
    }
    return result.join('');
  };
})();

        </div>
        <div class="settings-control">
          <button class="sz-btn" style="width:auto;padding:0 14px;border-radius:8px;font-size:0.8rem;color:var(--accent)" onclick="resetProgress()">Reset</button>
        </div>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">About</div>
      <div class="settings-row">
        <div>
          <div class="settings-label">Vedasaram · वेदसारम्</div>
          <div class="settings-desc">Bhagavad Gītā · Śrī Rudram · Viṣṇu Sahasranāmam</div>
        </div>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">Check for Updates</div>
          <div class="settings-desc" id="update-status">Version ${BUILD_DATE} · tap to check</div>
        </div>
        <div class="settings-control">
          <button class="sz-btn" style="width:auto;padding:0 14px;border-radius:8px;font-size:0.8rem;" onclick="checkForUpdates(this)">Refresh</button>
        </div>
      </div>
    </div>
  </div>`;
}

function changeSetting(key, dir) {
  const max = 3;
  settings[key] = Math.max(0, Math.min(max, settings[key] + dir));
  saveSettings();
  applyFontSizes();
  renderSettings();
  // Re-render practice if open so change is visible immediately
  if (state.view === 'practice') renderPractice();
}

function adjustReciteFont(dir) {
  changeSetting('reciteFontSize', dir);
}

// ─────────────── AUTO-UPDATE ───────────────
function forceRefresh() {
  const btn = document.getElementById('home-refresh-btn');
  if (btn) { btn.textContent = '↻ Checking…'; btn.disabled = true; }
  // Bust the cache by appending a timestamp, then reload
  const url = location.href.split('?')[0] + '?v=' + Date.now();
  fetch(url, { cache: 'reload' })
    .then(() => { location.reload(true); })
    .catch(() => { location.reload(true); });
}

// On load: silently check if a newer version exists and reload if so
(function autoUpdate() {
  try {
    const CACHE_KEY = 'vedic_etag';
    const url = location.href.split('?')[0];
    fetch(url, { method: 'HEAD', cache: 'no-store' })
      .then(r => {
        const etag = r.headers.get('etag') || r.headers.get('last-modified') || '';
        const saved = localStorage.getItem(CACHE_KEY) || '';
        if (saved && etag && saved !== etag) {
          // New version available — reload silently
          localStorage.setItem(CACHE_KEY, etag);
          location.reload(true);
        } else if (etag) {
          localStorage.setItem(CACHE_KEY, etag);
        }
      }).catch(() => {});
  } catch(e) {}
})();

function setLanguage(lang) {
  settings.language = lang;
  saveSettings();
  renderSettings();
  if (state.view === 'practice') renderPractice();
  if (state.view === 'recite') renderRecite();
}

function checkForUpdates(btn) {
  const statusEl = document.getElementById('update-status');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
  if (statusEl) statusEl.textContent = 'Checking for updates…';
  // Fetch the page bypassing cache to detect a new version
  fetch(location.href, {cache: 'no-store'})
    .then(r => r.text())
    .then(html => {
      // Extract build date comment or just reload if fetch succeeded
      const remoteMatch = html.match(/BUILD_DATE\s*=\s*["']([^"']+)["']/);
      const localMatch = document.documentElement.innerHTML.match(/BUILD_DATE\s*=\s*["']([^"']+)["']/);
      const remoteDate = remoteMatch ? remoteMatch[1] : null;
      const localDate = localMatch ? localMatch[1] : null;
      if (remoteDate && localDate && remoteDate === localDate) {
        if (statusEl) statusEl.textContent = 'You\'re on the latest version ✓';
        if (btn) { btn.disabled = false; btn.textContent = 'Refresh'; }
      } else {
        // New version available or no version markers — reload
        if (statusEl) statusEl.textContent = 'Update found — reloading…';
        setTimeout(() => location.reload(true), 600);
      }
    })
    .catch(() => {
      // Offline or error — just do a hard reload
      if (statusEl) statusEl.textContent = 'Reloading…';
      setTimeout(() => location.reload(true), 400);
    });
}

// ─────────────── INIT ───────────────
function init() {
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.sec === state.section));
  applyFontSizes();
  applyTheme(settings.theme || 'auto');
  showView('home');
}

init();
</script>
